<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekly recap, blind 1</title>
<style>
/* Tokens. Spacing on the 4 px house step, radius 8 px (tokens.md). Colours are this designer's own, named by role. */
:root {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-8: 32px; --space-11: 44px; --space-14: 56px;
  --radius: 8px;
  --surface: #F3F5F8; --raised: #FFFFFF; --sunk: #E6EAF0; --text: #13161B; --muted: #596172;
  --line: #D3D9E1; --ink: #2B48C4; --ink-soft: #E2E7FA; --came: #1C7146; --came-soft: #DAEEE2;
  --late: #B0251D; --late-soft: #F8E0DE; --out: #5C6880; --slot: #22262E; --hinge: #1B1D22;
  --page: #E8EBEF; --annot: #7B3DB5; --on-accent: #FFFFFF;
  --sa-top: 28px; --sa-bottom: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #000000; --raised: #1B1E23; --sunk: #272A31; --text: #F1F3F7; --muted: #A4ACB9;
    --line: #353A43; --ink: #93A9FF; --ink-soft: #1D2647; --came: #5FCB91; --came-soft: #12301F;
    --late: #FF8F86; --late-soft: #3B1714; --out: #9AA5B8; --slot: #E3E7EE; --hinge: #2C2F36;
    --page: #15171B; --annot: #C79BFF; --on-accent: #0B0D10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --surface: #000000; --raised: #1B1E23; --sunk: #272A31; --text: #F1F3F7; --muted: #A4ACB9;
  --line: #353A43; --ink: #93A9FF; --ink-soft: #1D2647; --came: #5FCB91; --came-soft: #12301F;
  --late: #FF8F86; --late-soft: #3B1714; --out: #9AA5B8; --slot: #E3E7EE; --hinge: #2C2F36;
  --page: #15171B; --annot: #C79BFF; --on-accent: #0B0D10;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font-family: -apple-system, system-ui, "Helvetica Neue", sans-serif; font-size: 15px; line-height: 20px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Mockup page chrome (not the product) */
.banner { background: var(--late); color: var(--on-accent); padding: var(--space-2) var(--space-4); font-weight: 600; text-align: center; }
.chrome { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); max-width: 1600px; }
.chrome h1 { font-size: 22px; line-height: 28px; margin: 0; }
.kind { color: var(--muted); font-size: 13px; line-height: 18px; }
.controls { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-6); align-items: flex-end; }
.ctl { display: flex; flex-direction: column; gap: var(--space-1); }
.ctl-label { font-size: 13px; line-height: 18px; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.seg button, .chip { min-height: 36px; padding: 0 var(--space-3); border-radius: var(--radius); border: 1px solid var(--line); background: var(--raised); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-accent); border-color: var(--ink); }
.opt { display: flex; gap: 0; }
.opt button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.opt .hide { border-radius: 0 var(--radius) var(--radius) 0; border-left: 0; color: var(--muted); padding: 0 var(--space-2); }
.num { width: 72px; min-height: 36px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--raised); color: var(--text); padding: 0 var(--space-2); font: inherit; }
.blurb { margin: 0; max-width: 72ch; }
.stage { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: flex-start; padding: 0 var(--space-4) var(--space-8); }
.dev-fig { margin: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.dev-fig figcaption { font-size: 13px; line-height: 18px; color: var(--muted); max-width: 466px; }
.hidden-note { color: var(--muted); }

/* Device frames. 1 CSS px stands for 1 pt. */
.device {
  position: relative; width: var(--w); height: var(--h); background: var(--surface); color: var(--text);
  border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 0 0 9px var(--hinge);
  font-family: -apple-system, system-ui, sans-serif;
  --lt: 34px; --lt-l: 41px; --t1: 28px; --t1-l: 34px; --t2: 22px; --t2-l: 28px; --t3: 20px; --t3-l: 25px;
  --hl: 17px; --hl-l: 22px; --bd: 17px; --bd-l: 22px; --co: 16px; --co-l: 21px; --sh: 15px; --sh-l: 20px;
  --fn: 13px; --fn-l: 18px; --c1: 12px; --c1-l: 16px; --c2: 11px; --c2-l: 13px;
  --tile-w: 20px; --tile-h: 28px;
}
/* AX5, the largest accessibility text size (Apple typography page, AX5 table). */
.device.ax5 {
  --lt: 60px; --lt-l: 70px; --t1: 58px; --t1-l: 68px; --t2: 56px; --t2-l: 66px; --t3: 55px; --t3-l: 65px;
  --hl: 53px; --hl-l: 62px; --bd: 53px; --bd-l: 62px; --co: 51px; --co-l: 60px; --sh: 49px; --sh-l: 58px;
  --fn: 44px; --fn-l: 52px; --c1: 43px; --c1-l: 51px; --c2: 40px; --c2-l: 48px;
}
.page-l, .page-r { position: absolute; top: 0; bottom: 0; width: 455.5px; --tile-w: 28px; --tile-h: 40px; }
.page-l { left: 0; } .page-r { left: 495.5px; }
.hinge { position: absolute; top: 0; bottom: 0; left: 455.5px; width: 40px; background: var(--hinge); }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  padding-top: max(env(safe-area-inset-top), var(--sa-top));
  padding-bottom: max(env(safe-area-inset-bottom), var(--sa-bottom));
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
.sbar { position: absolute; top: 0; left: 0; right: 0; height: var(--sa-top); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); font-size: 13px; font-weight: 600; pointer-events: none; }
.sbar i { width: 22px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; }
.homeind { position: absolute; bottom: 6px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--text); opacity: .8; pointer-events: none; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: var(--space-4); padding-bottom: var(--space-4); overscroll-behavior: contain; }

/* Navigation bar */
.nav { display: flex; flex-direction: column; gap: var(--space-1); padding: var(--space-2) var(--space-4) 0; }
.nav-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: var(--space-2); }
.nav-title-inline { font-size: var(--hl); line-height: var(--hl-l); font-weight: 600; text-align: center; flex: 1; }
.large-title { font-size: var(--lt); line-height: var(--lt-l); font-weight: 700; margin: 0; letter-spacing: .2px; }
.subtitle { font-size: var(--sh); line-height: var(--sh-l); color: var(--muted); margin: 0; }
.navbtn { min-height: 44px; min-width: 44px; border: 0; background: none; color: var(--ink); font-size: var(--bd); line-height: var(--bd-l); cursor: pointer; padding: 0 var(--space-1); display: inline-flex; align-items: center; gap: var(--space-1); }
.navbtn.spacer { visibility: hidden; }

/* Shared text */
.sec { display: flex; flex-direction: column; gap: var(--space-2); padding: 0 var(--space-4); }
.sec-h { font-size: var(--fn); line-height: var(--fn-l); color: var(--muted); margin: 0 var(--space-4); }
.p { font-size: var(--bd); line-height: var(--bd-l); margin: 0; }
.fn { font-size: var(--fn); line-height: var(--fn-l); color: var(--muted); margin: 0; }
.num-t { font-variant-numeric: tabular-nums; }

/* Lists */
.list { background: var(--raised); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
.row { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: var(--space-2) var(--space-4); border: 0; background: none; text-align: left; width: 100%; }
.row + .row { box-shadow: inset 0 1px 0 var(--line); }
button.row { cursor: pointer; }
button.row[aria-current="true"] { background: var(--ink-soft); }
.row-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.row-t { font-size: var(--bd); line-height: var(--bd-l); }
.row-s { font-size: var(--sh); line-height: var(--sh-l); color: var(--muted); }
.row-v { font-size: var(--sh); line-height: var(--sh-l); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row-v.late { color: var(--late); font-weight: 600; }
.chev { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); flex: none; opacity: .7; }
.device.ax5 .row { flex-wrap: wrap; }

/* Marks: shape plus colour, so state never rests on colour alone. */
.mk { width: 12px; height: 12px; flex: none; display: inline-block; vertical-align: middle; }
.mk-late { background: var(--late); transform: rotate(45deg) scale(.85); border: 1.5px solid var(--late); }
.mk-nodue { border: 2px dashed var(--muted); border-radius: 50%; }
.mk-out { border: 2px solid var(--out); border-radius: 50%; }
.mk-came { background: var(--came); border-radius: 50%; border: 2px solid var(--came); }
.mk-ok { width: 14px; height: 8px; border-left: 2.5px solid var(--came); border-bottom: 2.5px solid var(--came); transform: rotate(-45deg) translate(1px,-2px); }
.device.ax5 .mk { width: 28px; height: 28px; }

/* Day strip */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-1); align-items: end; height: 128px; }
.day { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); justify-content: flex-end; height: 100%; }
.day b { font-size: var(--fn); line-height: var(--fn-l); font-variant-numeric: tabular-nums; }
.day i { width: 100%; max-width: 32px; background: var(--came); border-radius: 4px 4px 0 0; min-height: 2px; }
.day i.none { background: none; border: 1.5px dashed var(--line); height: 24px; border-radius: 4px; }
.day span { font-size: var(--c1); line-height: var(--c1-l); color: var(--muted); }
.day.today span { color: var(--text); font-weight: 700; }
.device.ax5 .days { grid-template-columns: 1fr; height: auto; }
.device.ax5 .day { flex-direction: row; justify-content: flex-start; height: auto; }
.device.ax5 .day i { height: 12px !important; width: auto; flex: 0 0 var(--bw); max-width: none; border-radius: 0 4px 4px 0; }

.split { display: flex; height: 16px; border-radius: 4px; overflow: hidden; gap: 2px; }
.split i { display: block; }
.big { font-size: var(--t1); line-height: var(--t1-l); font-weight: 700; font-variant-numeric: tabular-nums; }
.figline { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-2); }

/* Buttons in screens */
.btn { min-height: 44px; padding: 0 var(--space-5); border-radius: var(--radius); border: 0; background: var(--ink); color: var(--on-accent); font-size: var(--bd); line-height: var(--bd-l); font-weight: 600; cursor: pointer; align-self: flex-start; }
.answer { font-size: var(--fn); line-height: var(--fn-l); color: var(--muted); margin: 0; min-height: var(--fn-l); }
details summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--ink); font-size: var(--sh); }
details pre { margin: 0; white-space: pre-wrap; font-size: var(--fn); line-height: var(--fn-l); color: var(--muted); }

/* Skeleton keeps the loaded size */
.sk { background: var(--sunk); border-radius: 4px; }
@media (prefers-reduced-motion: no-preference) { .sk { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }

/* Concept: Letter */
.letter { font-size: var(--t1); line-height: calc(var(--t1-l) + 8px); margin: 0; padding: 0 var(--space-4); }
.nw { white-space: nowrap; }
.device.ax5 .nw { white-space: normal; }
.fig { font: inherit; border: 0; background: none; padding: 0 2px; margin: 0 -2px; cursor: pointer; color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums;
  text-decoration: underline; text-decoration-color: var(--ink); text-decoration-thickness: 2px; text-underline-offset: 5px; border-radius: 4px; }
.fig.k-late { color: var(--late); text-decoration-color: var(--late); text-decoration-style: wavy; }
.fig.k-nodue { text-decoration-style: dashed; }
.fig[aria-expanded="true"] { background: var(--ink-soft); }
.panel { background: var(--raised); border-radius: var(--radius); margin: 0 var(--space-4); padding: var(--space-3) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.panel-h h3 { margin: 0; font-size: var(--hl); line-height: var(--hl-l); }
.xbtn { width: 44px; height: 44px; border: 0; background: none; cursor: pointer; position: relative; flex: none; margin-right: calc(-1 * var(--space-3)); }
.xbtn::before, .xbtn::after { content: ""; position: absolute; left: 14px; top: 21px; width: 16px; height: 2px; background: var(--muted); }
.xbtn::before { transform: rotate(45deg); } .xbtn::after { transform: rotate(-45deg); }
.panel .list { background: var(--surface); }

/* Concept: Exceptions */
.xgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-2); padding: 0 var(--space-4); }
.device.ax5 .xgrid { grid-template-columns: 1fr; }
.tile { background: var(--raised); border: 0; border-radius: var(--radius); padding: var(--space-3); text-align: left; display: flex; flex-direction: column; gap: var(--space-1); cursor: pointer; min-height: 44px; }
.tile[aria-current="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.tile-l { font-size: var(--sh); line-height: var(--sh-l); color: var(--muted); }
.tile-s { font-size: var(--fn); line-height: var(--fn-l); color: var(--muted); }
.allwell { font-size: var(--hl); line-height: var(--hl-l); font-weight: 600; }
.toolbar { padding: var(--space-2) var(--space-4) var(--space-1); display: flex; justify-content: center; }
.segc { display: inline-flex; background: var(--sunk); border-radius: 10px; padding: 2px; gap: 2px; width: 100%; max-width: 360px; }
.segc button { flex: 1; min-height: 40px; border: 0; border-radius: var(--radius); background: none; font-size: var(--sh); line-height: var(--sh-l); font-weight: 600; cursor: pointer; padding: 0 var(--space-2); }
.segc button[aria-pressed="true"] { background: var(--raised); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.device.ax5 .segc { flex-direction: column; }

/* Concept: Mail slot */
.piles { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.pile { position: relative; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-4); border: 0; background: none; text-align: left; cursor: pointer; overflow: hidden;
  transition: flex-grow .28s ease; }
@media (prefers-reduced-motion: reduce) { .pile { transition: none; } }
.pile.open { flex-grow: 6; cursor: default; overflow-y: auto; }
.pile.strip { flex: 0 0 auto; min-height: 56px; justify-content: center; }
.pile-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 var(--space-3); }
.pile-h h3 { margin: 0; font-size: var(--t3); line-height: var(--t3-l); }
.pile-h .num-t { font-size: var(--sh); line-height: var(--sh-l); color: var(--muted); }
.pile-note { font-size: var(--sh); line-height: var(--sh-l); margin: 0; display: flex; align-items: center; gap: var(--space-2); }
.pile-note.late { color: var(--late); font-weight: 600; }
.tiles { flex: 1; display: flex; flex-wrap: wrap-reverse; align-content: flex-start; gap: 4px; min-height: 0; }
.pile-came .tiles { align-content: flex-start; }
.t { width: var(--tile-w); height: var(--tile-h); border-radius: 3px; flex: none; }
.t-out { border: 2px solid var(--out); }
.t-nodue { border: 2px dashed var(--muted); }
.t-late { background: var(--late); border: 2px solid var(--late); clip-path: polygon(0 0, 100% 0, 100% 72%, 72% 100%, 0 100%); }
.t-came { background: var(--came); border: 2px solid var(--came); }
.t + .t.pk { margin-left: 4px; }
.tiles { position: relative; }
.ghost { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--text); pointer-events: none; }
.ghost span { position: absolute; right: 0; bottom: 2px; white-space: nowrap; font-size: var(--c1); line-height: var(--c1-l); color: var(--muted); background: var(--surface); padding-left: var(--space-1); }
.slotbar { flex: none; height: 10px; margin: 0 var(--space-4); border-radius: 5px; background: var(--slot); border: 1px solid var(--slot); }
.device.ax5 .piles { flex: none; }
.device.ax5 .pile { flex: none; overflow: visible; }
.page-l .pile-out .tiles { flex-direction: row-reverse; }

/* "New:" labels. Every part is new: a blind designer saw no current screen. */
body.labels [data-new] { outline: 1.5px dashed var(--annot); outline-offset: 2px; }
body.labels [data-new]:not(.ghost) { position: relative; }
body.labels [data-new]::after { content: "New: " attr(data-new); position: absolute; top: 0; right: 0; transform: translateY(-100%);
  font: 600 10px/14px -apple-system, system-ui, sans-serif; color: var(--annot); background: var(--surface); padding: 0 4px; border: 1px dashed var(--annot); border-radius: 4px; pointer-events: none; white-space: nowrap; z-index: 2; }
body.labels .device.ax5 [data-new]::after { display: none; }

@media (forced-colors: active) {
  .t, .mk, .sk, .slotbar, .day i { border: 2px solid CanvasText; }
  .t-late, .mk-late { border-style: double; border-width: 4px; }
  .fig[aria-expanded="true"], .tile[aria-current="true"], button.row[aria-current="true"] { outline: 2px solid Highlight; }
}
</style>
</head>
<body class="labels">
<div class="banner" role="note">Sample: no figure, seller or date on this page is real.</div>
<div class="chrome">
  <div>
    <h1>Weekly recap</h1>
    <div class="kind">Designer kind: blind. Designer: weekly-recap-blind-1. Mockup only.</div>
  </div>
  <div class="controls">
    <div class="ctl"><span class="ctl-label" id="lc">Concept</span><div class="seg" id="conceptCtl" role="group" aria-labelledby="lc"></div></div>
    <div class="ctl"><span class="ctl-label" id="ls">State</span><div class="seg" id="stateCtl" role="group" aria-labelledby="ls"></div></div>
    <div class="ctl"><span class="ctl-label" id="lt">Theme</span><div class="seg" id="themeCtl" role="group" aria-labelledby="lt"></div></div>
    <div class="ctl"><span class="ctl-label" id="ld">Devices</span><div class="seg" id="devCtl" role="group" aria-labelledby="ld"></div></div>
    <div class="ctl"><span class="ctl-label">Phone size (pt), a stand-in</span>
      <div class="seg"><input class="num" id="pw" type="number" min="320" max="520" step="1" aria-label="Phone width in points"><input class="num" id="ph" type="number" min="560" max="1000" step="1" aria-label="Phone height in points"></div></div>
    <div class="ctl"><span class="ctl-label" id="ll">Labels</span><div class="seg" id="labelCtl" role="group" aria-labelledby="ll"></div></div>
  </div>
  <p class="blurb" id="blurb"></p>
</div>
<div class="stage" id="stage">
  <figure class="dev-fig" data-fig="folded"><div class="device" data-frame="folded" data-device="iphone-duo-folded" style="--w:466px;--h:678px"></div><figcaption></figcaption></figure>
  <figure class="dev-fig" data-fig="open"><div class="device" data-frame="open" data-device="iphone-duo-unfolded" style="--w:951px;--h:669px"></div><figcaption></figcaption></figure>
  <figure class="dev-fig" data-fig="phone"><div class="device" data-frame="phone" data-device="phone" style="--w:420px;--h:900px"></div><figcaption></figcaption></figure>
  <figure class="dev-fig" data-fig="ax5"><div class="device ax5" data-frame="ax5" data-device="iphone-duo-folded-ax5" style="--w:466px;--h:678px"></div><figcaption></figcaption></figure>
  <p class="hidden-note" id="allHidden" hidden>Every concept is hidden. Press "Show hidden" to bring them back.</p>
</div>

<script>
'use strict';
const CONCEPTS = [
  { key: 'letter', name: 'Letter', blurb: 'Letter: the week reads as one sentence. Each underlined figure opens what makes it up, right under the sentence. On the open Duo, the facing page shows it.' },
  { key: 'exceptions', name: 'Exceptions', blurb: 'Exceptions: first only what needs a look, or "All is well.", then four figures. A row or a figure opens its detail. A switch at the thumb compares last week.' },
  { key: 'slot', name: 'Mail slot', blurb: 'Mail slot: every card is a tile. Cards on the way wait above the slot, late ones nearest it; cards that came lie below, with a dashed line where last week stood. On the open Duo the hinge is the slot. Tap a pile to list it.' }
];
const STATES = [['loaded', 'Loaded'], ['quiet', 'Quiet week'], ['unknown', 'No due date'], ['empty', 'Empty'], ['loading', 'Loading'], ['failed', 'Failed']];
const THEMES = [['', 'Auto'], ['light', 'Light'], ['dark', 'Dark']];
const DEVS = [['all', 'All'], ['folded', 'Duo folded'], ['open', 'Duo open'], ['phone', 'Large phone'], ['ax5', 'Folded, AX5 text']];

/* Sample data. Totals are computed, never typed. */
const pk = (seller, cards, value, x) => Object.assign({ seller, cards, value }, x || {});
const THIS_WEEK = { label: 'This week', range: 'Mon Nov 16 to Sat Nov 21', short: 'Nov 16 to 21', dates: ['Nov 16', 'Nov 17', 'Nov 18', 'Nov 19', 'Nov 20', 'Nov 21', 'Nov 22'], today: 5, partial: true };
const LAST_WEEK = { label: 'Last week', range: 'Mon Nov 9 to Sun Nov 15', short: 'Nov 9 to 15', dates: ['Nov 9', 'Nov 10', 'Nov 11', 'Nov 12', 'Nov 13', 'Nov 14', 'Nov 15'], today: 6, partial: false };
const CAME = [pk('Elm Street Cards', 3, 4.12, { day: 0 }), pk('Brightwater Singles', 5, 6.40, { day: 1 }), pk('Kettle Hill Games', 4, 5.35, { day: 1 }),

const NODUE = [pk('Gullwing Cards', 3, 4.20, { nodue: true }), pk('Pebble Bay TCG', 2, 1.90, { nodue: true }), pk('Hollowell Singles', 5, 7.35, { nodue: true }), pk('Fernway Games', 2, 3.10, { nodue: true })];

function dataFor(state, week) {
  if (week === 'last') {
    return Object.assign({}, LAST_WEEK, { status: 'ok', prev: 41, prevWord: 'the week before',
      came: [pk('Wrenfield Cards', 6, 8.40, { day: 0 }), pk('Gorse Lane', 4, 5.10, { day: 1 }), pk('Pinecrest TCG', 5, 6.85, { day: 2 }), pk('Ashby Singles', 7, 9.60, { day: 3 }),
        pk('Lowmoor Games', 3, 3.95, { day: 4 }), pk('Driftwood Cards', 8, 10.30, { day: 5 }), pk('Hazel Row', 5, 6.20, { day: 6 })],
      out: [LATE[0], LATE[1], LATE[2], ONTIME[0], ONTIME[1]].map(p => pk(p.seller, p.cards, p.value, { due: p.due })) });
  }
  const base = Object.assign({}, THIS_WEEK, { prev: 36, prevFull: 38, prevWord: 'by now last week' });
  if (state === 'quiet') return Object.assign(base, { status: 'ok', came: CAME.slice(0, 8).filter(p => p.seller !== 'Redfern Cards'),
    out: [pk('Copperline Games', 4, 7.10, { due: 'Nov 22' }), pk('Bramble and Co', 3, 3.85, { due: 'Nov 23' }), pk('Lantern Hobby', 3, 4.10, { due: 'Nov 24' }), pk('Quillfeather', 2, 2.60, { due: 'Nov 25' })] });
  if (state === 'unknown') return Object.assign(base, { status: 'ok', came: CAME, out: LATE.concat(NODUE, ONTIME) });
  if (state === 'empty' || state === 'loading' || state === 'failed') return Object.assign(base, { status: state });
  return Object.assign(base, { status: 'ok', came: CAME, out: LATE.concat(ONTIME) });
}
const sum = (a, f) => a.reduce((s, p) => s + p[f], 0);
function facts(d) {
  const late = d.out.filter(p => p.late), nodue = d.out.filter(p => p.nodue);
  return { cameCards: sum(d.came, 'cards'), cameValue: sum(d.came, 'value'), outCards: sum(d.out, 'cards'), outValue: sum(d.out, 'value'),
    outPk: d.out.length, late, nodue, lateCards: sum(late, 'cards'), lateValue: sum(late, 'value'), diff: sum(d.came, 'cards') - d.prev };
}
const money = v => '$' + v.toFixed(2);
const pl = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function diffText(f, d) {
  if (f.diff > 0) return f.diff + ' more than ' + d.prevWord;
  if (f.diff < 0) return (-f.diff) + ' fewer than ' + d.prevWord;
  return 'as many as ' + d.prevWord;
}

/* Page state, read from and written to the hash. */
const S = { c: 'letter', s: 'loaded', t: '', d: 'all', x: '', h: [], n: true, pw: 420, ph: 900 };
const UI = {};
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  if (q.get('c')) S.c = q.get('c');
  if (q.get('s')) S.s = q.get('s');
  S.t = q.get('t') || '';
  S.d = q.get('d') || 'all';
  S.x = q.get('x') || '';
  S.h = (q.get('h') || '').split(',').filter(Boolean);
  S.n = q.get('n') !== '0';
  if (q.get('pw')) S.pw = +q.get('pw');
  if (q.get('ph')) S.ph = +q.get('ph');
  if (S.h.includes(S.c)) S.c = (CONCEPTS.find(c => !S.h.includes(c.key)) || CONCEPTS[0]).key;
}
function writeHash() {
  const q = new URLSearchParams();
  q.set('c', S.c); q.set('s', S.s);
  if (S.t) q.set('t', S.t);
  if (S.d !== 'all') q.set('d', S.d);
  if (S.x) q.set('x', S.x);
  if (S.h.length) q.set('h', S.h.join(','));
  if (!S.n) q.set('n', '0');
  if (S.pw !== 420) q.set('pw', S.pw);
  if (S.ph !== 900) q.set('ph', S.ph);
  history.replaceState(null, '', '#' + q.toString());
}
function frames() {
  const all = [
    { id: 'folded', pose: 'one', w: 466, h: 678, cap: 'Duo, folded: 466 x 678 pt, one screen (brief size).', dev: 'iphone-duo-folded' },
    { id: 'open', pose: 'open', w: 951, h: 669, cap: 'Duo, open: 951 x 669 pt, two pages, hinge x 455.5 to 495.5 (brief size). Nothing crosses the hinge.', dev: 'iphone-duo-unfolded' },
    { id: 'phone', pose: 'one', w: S.pw, h: S.ph, cap: 'Large phone: ' + S.pw + ' x ' + S.ph + ' pt, a stand-in: the brief writes no size. Change it above.', dev: 'phone' },
    { id: 'ax5', pose: 'one', w: 466, h: 678, ax5: true, cap: 'Duo, folded, at AX5, the largest accessibility text size. The screen scrolls.', dev: 'iphone-duo-folded-ax5' }
  ];
  return S.d === 'all' ? all : all.filter(f => f.id === S.d);
}
function ui(id) {
  if (!UI[id]) UI[id] = { sel: S.x || null, push: S.x || null, week: 'this', open: null, retry: null, added: false };
  return UI[id];
}

/* Shared parts: one home each, used by all three concepts. */
const mark = k => '<span class="mk mk-' + k + '" aria-hidden="true"></span>';
function pkRow(p, mode) {
  let v, m;
  if (p.late) { m = 'late'; v = '<span class="row-v late">' + pl(p.late, 'day', 'days') + ' past due</span>'; }
  else if (p.nodue) { m = 'nodue'; v = '<span class="row-v">No due date</span>'; }
  else if (mode === 'came') { m = 'came'; v = '<span class="row-v">' + money(p.value) + '</span>'; }
  else { m = 'out'; v = '<span class="row-v">Due ' + p.due + '</span>'; }
  const s = mode === 'came' ? pl(p.cards, 'card', 'cards') : pl(p.cards, 'card', 'cards') + ', ' + money(p.value);
  return '<div class="row">' + mark(m) + '<div class="row-main"><span class="row-t">' + esc(p.seller) + '</span><span class="row-s num-t">' + s + '</span></div>' + v + '</div>';
}
function dayStrip(d, f) {
  const per = [0, 0, 0, 0, 0, 0, 0];
  d.came.forEach(p => { per[p.day] += p.cards; });
  const max = Math.max(1, ...per);
  return '<div class="days" role="img" aria-label="Cards that came each day: ' + per.map((n, i) => ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i] + ' ' + (i > d.today ? 'not yet' : n)).join(', ') + '">' +
    per.map((n, i) => {
      const fut = i > d.today;
      return '<div class="day' + (i === d.today && d.partial ? ' today' : '') + '"><b>' + (fut ? '' : n) + '</b>' +
        (fut ? '<i class="none"></i>' : '<i style="height:' + Math.round(n / max * 88) + 'px;--bw:' + Math.max(4, Math.round(n / max * 100)) + '%"></i>') +
        '<span>' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i] + '</span></div>';
    }).join('') + '</div>';
}
const DTITLE = { came: 'Cards that came', out: 'Cards on the way', late: 'Late packages', money: 'What it cost' };
function detail(key, d) {
  const f = facts(d);
  if (key === 'came') {
    const byDay = [];
    d.came.forEach(p => { (byDay[p.day] = byDay[p.day] || []).push(p); });
    let lists = '';
    for (let i = 6; i >= 0; i--) if (byDay[i]) lists += '<p class="fn">' + ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i] + ' ' + d.dates[i] + '</p><div class="list">' + byDay[i].map(p => pkRow(p, 'came')).join('') + '</div>';
    return '<div class="figline"><span class="big">' + f.cameCards + '</span><span class="p">cards, worth ' + money(f.cameValue) + '</span></div>' +
      dayStrip(d, f) + '<p class="fn">' + (d.partial ? 'By now last week: ' + d.prev + '. All of last week: ' + d.prevFull + '.' : 'The week before: ' + d.prev + '.') + '</p>' + lists;
  }
  if (key === 'out') {
    const sorted = f.late.slice().sort((a, b) => b.late - a.late).concat(f.nodue, d.out.filter(p => !p.late && !p.nodue));
    return '<div class="figline"><span class="big">' + f.outCards + '</span><span class="p">cards in ' + pl(f.outPk, 'package', 'packages') + ', worth ' + money(f.outValue) + '</span></div>' +
      '<div class="list">' + sorted.map(p => pkRow(p, 'out')).join('') + '</div>';
  }
  if (key === 'late') {
    let h = f.late.length
      ? '<div class="figline"><span class="big">' + f.late.length + '</span><span class="p">' + (f.late.length === 1 ? 'package' : 'packages') + ', ' + pl(f.lateCards, 'card', 'cards') + ', worth ' + money(f.lateValue) + '</span></div>' +
        '<div class="list">' + f.late.map(p => pkRow(p, 'out')).join('') + '</div>'
      : '<p class="p">Nothing is past its due date.</p>';
    if (f.nodue.length) h += '<p class="fn">These ' + f.nodue.length + ' have no due date, so the recap cannot tell whether they are late.</p><div class="list">' + f.nodue.map(p => pkRow(p, 'out')).join('') + '</div>';
    return h;
  }
  const tot = f.cameValue + f.outValue;
  return '<div class="split" role="img" aria-label="Came ' + money(f.cameValue) + ', still out ' + money(f.outValue) + '"><i style="flex:' + f.cameValue + ';background:var(--came)"></i><i style="flex:' + (f.outValue - f.lateValue) + ';background:var(--out)"></i>' + (f.lateValue ? '<i style="flex:' + f.lateValue + ';background:var(--late)"></i>' : '') + '</div>' +
    '<div class="list">' +
    '<div class="row">' + mark('came') + '<div class="row-main"><span class="row-t">Came</span><span class="row-s num-t">' + pl(f.cameCards, 'card', 'cards') + '</span></div><span class="row-v num-t">' + money(f.cameValue) + '</span></div>' +
    '<div class="row">' + mark('out') + '<div class="row-main"><span class="row-t">Still out</span><span class="row-s num-t">' + pl(f.outCards, 'card', 'cards') + '</span></div><span class="row-v num-t">' + money(f.outValue) + '</span></div>' +
    (f.lateValue ? '<div class="row">' + mark('late') + '<div class="row-main"><span class="row-t">Of that, in late packages</span><span class="row-s num-t">' + pl(f.lateCards, 'card', 'cards') + '</span></div><span class="row-v num-t">' + money(f.lateValue) + '</span></div>' : '') +
    '</div><p class="fn">Both together: ' + money(tot) + '.</p>';
}

/* Loading, failed and empty: one home, shaped per concept so the loaded size holds. */
function special(status, c, frameId) {
  const u = ui(frameId);
  if (status === 'loading') {
    const bars = c === 'slot'
      ? '<div class="sec"><div class="sk" style="height:28px;width:50%"></div><div class="sk" style="height:132px"></div></div><div class="slotbar"></div><div class="sec"><div class="sk" style="height:28px;width:40%"></div><div class="sk" style="height:100px"></div></div>'
      : '<div class="sec"><div class="sk" style="height:28px"></div><div class="sk" style="height:28px"></div><div class="sk" style="height:28px;width:80%"></div><div class="sk" style="height:28px;width:60%"></div></div>' +
        (c === 'exceptions' ? '<div class="xgrid"><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div></div>' : '');
    return '<div aria-busy="true" aria-label="Reading your orders" style="display:flex;flex-direction:column;gap:16px">' + bars + '</div>';
  }
  if (status === 'failed') {
    return '<div class="sec" data-new="failed read"><p class="p">The recap could not read your orders, so it shows no figures.</p>' +
      '<button class="btn" data-act="retry">Try again</button>' +
      '<details><summary>What the app said</summary><pre>orders read failed: timed out after 30 s (sample text)</pre></details></div>';
  }
  return '<div class="sec" data-new="empty state"><p class="p">Your recap fills in once you have orders.</p>' +

}
function statusOf(frameId) { const u = ui(frameId); return u.retry || S.s; }

/* Chrome inside a screen */
function largeNav(title, sub, left) {
  return '<div class="nav">' + (left ? '<div class="nav-row">' + left + '</div>' : '<div class="nav-row"></div>') +
    '<h2 class="large-title">' + title + '</h2>' + (sub ? '<p class="subtitle">' + sub + '</p>' : '') + '</div>';
}
function inlineNav(title, left, right) {
  return '<div class="nav"><div class="nav-row">' + (left || '<span class="navbtn spacer">Back</span>') + '<span class="nav-title-inline">' + title + '</span>' + (right || '<span class="navbtn spacer">Back</span>') + '</div></div>';
}
const wrap = (inner, cls) => '<div class="screen' + (cls ? ' ' + cls : '') + '"><div class="sbar" aria-hidden="true"><span>9:41</span><i></i></div>' + inner + '<div class="homeind" aria-hidden="true"></div></div>';

/* Concept: Letter */
function letterSentence(d, sel, fid) {
  const f = facts(d);
  /* The punctuation after a figure rides in the same no-wrap span, so a line never starts with it. */
  const fig = (k, text, after) => '<span class="nw"><button class="fig k-' + k + '" data-act="sel" data-k="' + (k === 'nodue' ? 'late' : k) + '" aria-expanded="' + (sel === (k === 'nodue' ? 'late' : k)) + '">' + text + '</button>' + (after || '') + '</span>';
  let s = 'So far this week ' + fig('came', pl(f.cameCards, 'card', 'cards') + ' came', ',') + ' ' + fig('came', diffText(f, d), '.') + ' ';
  s += fig('out', f.outCards + ' are still on the way', ',') + ' and ';
  const tail = f.nodue.length ? ';' : '.';
  if (f.late.length) s += fig('late', pl(f.late.length, 'package is', 'packages are') + ' late', tail);
  else s += 'nothing is late' + tail;
  if (f.nodue.length) s += ' ' + fig('nodue', f.nodue.length + ' more have no due date', ',') + ' so they may be late too.';
  s += ' The cards that came are worth ' + fig('money', money(f.cameValue), ';') + ' the ones still out, ' + fig('money', money(f.outValue), '.');
  return '<p class="letter"' + (fid === 'folded' ? ' id="letter-sentence"' : '') + ' data-new="the week as one sentence">' + s + '</p>';
}
function letterPanel(key, d, closable) {
  return '<div class="panel" data-new="the figure\'s parts, under the sentence"><div class="panel-h"><h3>' + DTITLE[key] + '</h3>' +
    (closable ? '<button class="xbtn" data-act="close" aria-label="Close"></button>' : '') + '</div>' + detail(key, d) + '</div>';
}
function letter(fr) {
  const u = ui(fr.id), st = statusOf(fr.id), d = dataFor(st, 'this');
  const head = largeNav('Your week', d.range);
  if (d.status !== 'ok') {
    const body = wrap('<div class="scroll">' + head + special(d.status, 'letter', fr.id) + '</div>');
    return fr.pose === 'open' ? [body, wrap('<div class="scroll">' + inlineNav('') + '</div>')] : body;
  }
  if (fr.pose === 'open') {
    const f = facts(d);
    const sel = u.sel || (f.late.length || f.nodue.length ? 'late' : 'came');
    return [wrap('<div class="scroll">' + head + letterSentence(d, sel, fr.id) + '<p class="fn" style="padding:0 16px">Tap an underlined figure. Its parts show on the facing page.</p></div>'),
      wrap('<div class="scroll">' + inlineNav(DTITLE[sel]) + '<div class="sec" data-new="parts of the tapped figure">' + detail(sel, d) + '</div></div>')];
  }
  return wrap('<div class="scroll">' + head + letterSentence(d, u.sel, fr.id) +
    (u.sel ? letterPanel(u.sel, d, true) : '<p class="fn" style="padding:0 16px">Tap an underlined figure to see what makes it up.</p>') + '</div>');
}

/* Concept: Exceptions */
function verdict(d, f, sel, fid) {
  let rows = '';
  if (f.late.length) rows += '<button class="row" data-act="push" data-k="late" aria-current="' + (sel === 'late') + '">' + mark('late') + '<span class="row-main"><span class="row-t">' + pl(f.late.length, 'package is', 'packages are') + ' late</span><span class="row-s num-t">' + pl(f.lateCards, 'card', 'cards') + ', ' + money(f.lateValue) + '</span></span><span class="chev" aria-hidden="true"></span></button>';
  if (f.nodue.length) rows += '<button class="row" data-act="push" data-k="late" aria-current="false">' + mark('nodue') + '<span class="row-main"><span class="row-t">' + f.nodue.length + ' packages have no due date</span><span class="row-s">They may be late; the recap cannot tell.</span></span><span class="chev" aria-hidden="true"></span></button>';
  if (!rows) rows = '<div class="row">' + mark('ok') + '<span class="row-main"><span class="allwell">All is well.</span></span></div>';
  return '<p class="sec-h">Needs a look</p><div class="sec"' + (fid === 'folded' ? ' id="exceptions-verdict"' : '') + ' data-new="only what is not normal"><div class="list">' + rows + '</div></div>';
}
function xTiles(d, f, sel) {
  const t = (k, label, big, sub) => '<button class="tile" data-act="push" data-k="' + k + '" aria-current="' + (sel === k) + '"><span class="tile-l">' + label + '</span><span class="big">' + big + '</span><span class="tile-s">' + sub + '</span></button>';
  return '<p class="sec-h">The week</p><div class="xgrid" data-new="four figures">' +
    t('came', 'Came', f.cameCards, diffText(f, d)) + t('out', 'On the way', f.outCards, 'in ' + pl(f.outPk, 'package', 'packages')) +
    t('money', 'Worth of what came', money(f.cameValue), pl(f.cameCards, 'card', 'cards')) + t('money', 'Worth still out', money(f.outValue), pl(f.outCards, 'card', 'cards')) + '</div>';
}
function weekSwitch(u) {
  return '<div class="toolbar" data-new="week switch at the thumb"><div class="segc" role="group" aria-label="Week">' +
    '<button data-act="week" data-k="this" aria-pressed="' + (u.week === 'this') + '">This week</button>' +
    '<button data-act="week" data-k="last" aria-pressed="' + (u.week === 'last') + '">Last week</button></div></div>';
}
function exceptions(fr) {
  const u = ui(fr.id), st = statusOf(fr.id), d = dataFor(st, u.week);
  const title = u.week === 'last' ? 'Last week' : 'This week';
  if (d.status !== 'ok') {
    const body = wrap('<div class="scroll">' + largeNav(title, d.range) + special(d.status, 'exceptions', fr.id) + '</div>');
    return fr.pose === 'open' ? [body, wrap('<div class="scroll">' + inlineNav('') + '</div>')] : body;
  }
  const f = facts(d);
  if (fr.pose === 'open') {
    const sel = u.push || (f.late.length || f.nodue.length ? 'late' : 'came');
    return [wrap('<div class="scroll">' + largeNav(title, d.range) + verdict(d, f, sel, fr.id) + xTiles(d, f, sel) + '</div>' + weekSwitch(u)),
      wrap('<div class="scroll">' + inlineNav(DTITLE[sel]) + '<div class="sec">' + detail(sel, d) + '</div></div>')];
  }
  if (u.push) {
    return wrap('<div class="scroll">' + inlineNav(DTITLE[u.push], '<button class="navbtn" data-act="back"><span class="chev" style="transform:rotate(225deg);border-color:var(--ink)"></span>' + title + '</button>') +
      '<div class="sec">' + detail(u.push, d) + '</div></div>');
  }
  /* At AX5 a pinned switch would take a fifth of the screen, so it scrolls with the content. */
  return fr.ax5
    ? wrap('<div class="scroll">' + largeNav(title, d.range) + verdict(d, f, null, fr.id) + xTiles(d, f, null) + weekSwitch(u) + '</div>')
    : wrap('<div class="scroll">' + largeNav(title, d.range) + verdict(d, f, null, fr.id) + xTiles(d, f, null) + '</div>' + weekSwitch(u));
}

/* Concept: Mail slot */
function tilesHtml(list, kind) {
  let h = '';
  list.forEach(p => {
    const cls = kind === 'came' ? 't-came' : p.late ? 't-late' : p.nodue ? 't-nodue' : 't-out';
    for (let i = 0; i < p.cards; i++) h += '<i class="t ' + cls + '"></i>';
  });
  return h;
}
function pileOut(d, f, state, fid) {
  const order = f.late.slice().sort((a, b) => b.late - a.late).concat(f.nodue, d.out.filter(p => !p.late && !p.nodue));
  const notes = (f.late.length ? '<p class="pile-note late">' + mark('late') + pl(f.late.length, 'package', 'packages') + ' late</p>' : '<p class="pile-note">' + mark('ok') + 'Nothing late</p>') +
    (f.nodue.length ? '<p class="pile-note">' + mark('nodue') + f.nodue.length + ' with no due date</p>' : '');
  const head = '<div class="pile-h"><h3>On the way</h3><span class="num-t">' + pl(f.outCards, 'card', 'cards') + ', ' + money(f.outValue) + '</span></div>';
  if (state === 'strip') return '<button class="pile pile-out strip" data-act="pile" data-k="out" aria-label="Show cards on the way">' + head + '</button>';
  if (state === 'open') return '<div class="pile pile-out open"><div class="pile-h"><h3>On the way</h3><button class="navbtn" data-act="pile" data-k="">Done</button></div>' + notes + '<div class="list">' + order.map(p => pkRow(p, 'out')).join('') + '</div></div>';
  return '<button class="pile pile-out" data-act="pile" data-k="out" aria-label="On the way: ' + f.outCards + ' cards, ' + f.late.length + ' late packages. Show the list."' + (fid === 'folded' ? ' id="slot-piles"' : '') + ' data-new="cards on the way, late nearest the slot">' + head + notes +
    '<div class="tiles" aria-hidden="true">' + tilesHtml(order, 'out') + '</div></button>';
}
function pileCame(d, f, state, width) {
  const head = '<div class="pile-h"><h3>Came</h3><span class="num-t">' + pl(f.cameCards, 'card', 'cards') + ', ' + money(f.cameValue) + '</span></div>';
  if (state === 'strip') return '<button class="pile pile-came strip" data-act="pile" data-k="came" aria-label="Show cards that came">' + head + '</button>';
  if (state === 'open') {
    const list = d.came.slice().sort((a, b) => b.day - a.day);
    return '<div class="pile pile-came open"><div class="pile-h"><h3>Came</h3><button class="navbtn" data-act="pile" data-k="">Done</button></div>' + dayStrip(d, f) + '<div class="list">' + list.map(p => pkRow(p, 'came')).join('') + '</div></div>';
  }
  /* Tiles fill from the bottom, one tile plus a 4 pt gap a step; the dashed line sits where last week's count, same days, reached. */
  const onPage = width === 455.5; /* a page of the open Duo draws larger tiles (.page-l, .page-r) */
  const tw = onPage ? 28 : 20, th = onPage ? 40 : 28;
  const per = Math.max(1, Math.floor((width - 32 + 4) / (tw + 4)));
  const ghostRows = Math.ceil(d.prev / per);
  const ghost = '<div class="ghost" style="bottom:' + (ghostRows * (th + 4) - 2) + 'px" data-new="last week, same days"><span>By now last week: ' + d.prev + '</span></div>';
  return '<button class="pile pile-came" data-act="pile" data-k="came" aria-label="Came: ' + f.cameCards + ' cards, ' + diffText(f, d) + '. Show the list." data-new="cards that came">' + head +
    '<p class="pile-note">' + diffText(f, d).replace(/^./, c => c.toUpperCase()) + '</p><div class="tiles" aria-hidden="true">' + tilesHtml(d.came, 'came') + ghost + '</div></button>';
}
function slot(fr) {
  const u = ui(fr.id), st = statusOf(fr.id), d = dataFor(st, 'this');
  if (d.status !== 'ok') {
    const body = wrap(inlineNav(d.label) + '<div class="scroll">' + special(d.status, 'slot', fr.id) + '</div>');
    return fr.pose === 'open' ? [body, wrap(inlineNav('') + '<div class="scroll"></div>')] : body;
  }
  const f = facts(d);
  if (fr.pose === 'open') {
    const left = pileOut(d, f, u.open === 'out' ? 'open' : 'pile', fr.id);
    const right = pileCame(d, f, u.open === 'came' ? 'open' : 'pile', 455.5);
    return [wrap(inlineNav(d.label) + '<div class="piles">' + left + '</div>'), wrap(inlineNav(d.short) + '<div class="piles">' + right + '</div>')];
  }
  const o = u.open === 'out' ? 'open' : u.open === 'came' ? 'strip' : 'pile';
  const c = u.open === 'came' ? 'open' : u.open === 'out' ? 'strip' : 'pile';
  const inner = '<div class="piles">' + pileOut(d, f, o, fr.id) + '<div class="slotbar" aria-hidden="true"' + (u.open ? '' : ' data-new="the slot"') + '></div>' + pileCame(d, f, c, fr.w) + '</div>';
  return wrap(inlineNav(d.label) + (fr.ax5 ? '<div class="scroll">' + inner + '</div>' : inner));
}

/* Render */
const RENDER = { letter, exceptions, slot };
function renderFrame(fr) {
  const el = document.querySelector('[data-frame="' + fr.id + '"]');
  const out = RENDER[S.c](fr);
  el.innerHTML = Array.isArray(out)
    ? '<div class="page-l">' + out[0] + '</div><div class="hinge" aria-hidden="true"></div><div class="page-r">' + out[1] + '</div>'
    : out;
}
function renderAll() {
  document.documentElement.toggleAttribute('data-theme', !!S.t);
  if (S.t) document.documentElement.setAttribute('data-theme', S.t);
  document.body.classList.toggle('labels', S.n);
  const vis = CONCEPTS.filter(c => !S.h.includes(c.key));
  document.getElementById('conceptCtl').innerHTML = vis.map(c => '<span class="opt"><button data-pg="c" data-v="' + c.key + '" aria-pressed="' + (S.c === c.key) + '">' + c.name + '</button><button class="hide" data-pg="hide" data-v="' + c.key + '" aria-label="Hide ' + c.name + '" title="Hide ' + c.name + '">Hide</button></span>').join('') +
    (S.h.length ? '<button class="chip" data-pg="unhide">Show hidden (' + S.h.length + ')</button>' : '');
  const seg = (id, list, key) => { document.getElementById(id).innerHTML = list.map(([v, l]) => '<button data-pg="' + key + '" data-v="' + v + '" aria-pressed="' + (S[key] === v) + '">' + l + '</button>').join(''); };
  seg('stateCtl', STATES, 's'); seg('themeCtl', THEMES, 't'); seg('devCtl', DEVS, 'd');
  document.getElementById('labelCtl').innerHTML = '<button data-pg="n" data-v="1" aria-pressed="' + S.n + '">Show "New:" labels</button>';
  document.getElementById('pw').value = S.pw; document.getElementById('ph').value = S.ph;
  const c = CONCEPTS.find(x => x.key === S.c);
  document.getElementById('blurb').textContent = vis.length ? c.blurb : 'Every concept is hidden.';
  /* The four frames are static markup; this shows, sizes and fills them. */
  const shown = vis.length ? frames() : [];
  document.getElementById('allHidden').hidden = vis.length > 0;
  document.querySelectorAll('[data-fig]').forEach(fig => {
    const fr = shown.find(f => f.id === fig.dataset.fig);
    fig.hidden = !fr;
    if (!fr) return;
    const dev = fig.querySelector('.device');
    dev.style.setProperty('--w', fr.w + 'px'); dev.style.setProperty('--h', fr.h + 'px');
    fig.querySelector('figcaption').textContent = fr.cap;
  });
  if (!vis.length) { writeHash(); return; }
  shown.forEach(renderFrame);
  writeHash();
}
function resetUI() { for (const k in UI) delete UI[k]; }

document.addEventListener('click', e => {
  const pg = e.target.closest('[data-pg]');
  if (pg) {
    const k = pg.dataset.pg, v = pg.dataset.v;
    if (k === 'hide') { S.h.push(v); if (S.c === v) { const n = CONCEPTS.find(c => !S.h.includes(c.key)); if (n) S.c = n.key; } }
    else if (k === 'unhide') S.h = [];
    else if (k === 'n') S.n = !S.n;
    else { S[k] = v; }
    if (k === 'c' || k === 's') { S.x = ''; resetUI(); }
    renderAll(); return;
  }
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const dev = a.closest('[data-frame]'); if (!dev) return;
  const id = dev.dataset.frame, u = ui(id), k = a.dataset.k;
  switch (a.dataset.act) {
    case 'sel': u.sel = u.sel === k && id !== 'open' ? null : k; break;
    case 'close': u.sel = null; break;
    case 'push': u.push = k; break;
    case 'back': u.push = null; break;
    case 'week': u.week = k; u.push = null; break;
    case 'pile': u.open = k || null; break;
    case 'add': u.added = true; break;
    case 'retry': u.retry = 'loading'; setTimeout(() => { u.retry = 'loaded'; const fr = frames().find(f => f.id === id); if (fr) renderFrame(fr); }, 900); break;
  }
  const fr = frames().find(f => f.id === id);
  renderFrame(fr);
  const again = dev.querySelector('[data-act="' + a.dataset.act + '"][data-k="' + (k || '') + '"]') || dev.querySelector('[data-act="back"],[data-act="close"]');
  if (again && a.dataset.act !== 'close') again.focus({ preventScroll: true });
});
['pw', 'ph'].forEach(id => document.getElementById(id).addEventListener('change', e => {
  const v = Math.round(+e.target.value); if (v > 0) { S[id] = v; renderAll(); }
}));
window.addEventListener('hashchange', () => { readHash(); resetUI(); renderAll(); });
readHash(); renderAll();
</script>
</body>
</html>
