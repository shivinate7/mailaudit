name: Manifest
options:
  bundleIdPrefix: dev.shivinate
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
packages:
  ManifestKit:
    path: ManifestKit
targets:
  Manifest:
    type: application
    platform: iOS
    sources:
      - Manifest
      # rules.js is the bundled web rules. ledger.json is the fake seed for -ManifestUITestSeed; a file name after the flag picks another fixture.
      - path: ManifestKit/Sources/ManifestKit/rules.js
        buildPhase: resources
      - path: ../shared/fixtures/ledger.json
        buildPhase: resources
      - path: ../shared/fixtures/ledger-long-seller.json
        buildPhase: resources
      # tokens.json is the shared palette, decoded at launch (shared-tokens-and-fixtures).
      - path: ../shared/tokens.json
        buildPhase: resources
    dependencies:
      - package: ManifestKit
    info:
      path: Manifest/Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        CFBundleDisplayName: MANIFEST
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: dev.shivinate.manifest.key
            CFBundleURLSchemes: [manifestledger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shivinate.manifest
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
  ManifestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ManifestUITests]
    dependencies:
      - target: Manifest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shivinate.manifest.uitests
        TEST_TARGET_NAME: Manifest
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
schemes:
  Manifest:
    build:
      targets:
        Manifest: all
    test:
      targets: [ManifestUITests]
