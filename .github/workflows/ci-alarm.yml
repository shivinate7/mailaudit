# Why this exists: a red nightly run of checks.yml reaches no pull request, and the
# ci-done comment skips scheduled runs. So main could sit red with nobody told.
# This run reads the latest completed run of every other workflow on main, 2.5
# hours after the nightly cron in checks.yml. When one is red, it opens one issue in
# this repo, or comments on the issue that is already open. It writes nothing else.
# It has no push or pull_request trigger, so it cannot rebuild the site.
name: CI alarm

on:
  schedule:
    - cron: "47 7 * * *" # after the nightly run at 05:17 UTC in checks.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read # the alarm reads the workflow file at the clearing head

jobs:
  alarm:
    runs-on: ubuntu-latest
    # A job-level block replaces the top-level one, so it repeats the two reads. Only this job writes.
    permissions:
      actions: read
      contents: read
      issues: write # opens or comments on the one issue
    timeout-minutes: 5 # provisional
    steps:
      - name: Alarm on a red main
        uses: shivinate7/claude-settings/actions/ci-alarm@stable # tracks claude-settings stable
