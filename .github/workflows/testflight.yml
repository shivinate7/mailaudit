# Manual TestFlight upload from CI, run by hand: `make testflight` is the local twin.
# Calls claude-settings bin/ios-ship, pinned by sha below. Never a PR check: this repo is public,
# so only a dispatch by someone with write access may reach the App Store Connect key.
# Uploads only from main: ios-ship refuses any other HEAD. Each run bills macOS minutes.
# Secrets: ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID (the App Store Connect key).
# GitHub dispatches a workflow only when this file is on main.
name: testflight
on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps, space separated: Manifest (empty: all)"
        required: false
        default: Manifest
        type: string
      dry:
        description: "Export only, no upload"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
# One group for every run: ios-ship's build number has minute resolution, so uploads run one at a time.
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  ship:
    runs-on: xcode-27
    timeout-minutes: 60 # provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Repo-specific: reads tools/ios-ship.json. The input reaches the shell through env only.
      - name: Pick apps
        env:
          APPS: ${{ inputs.apps }}
          DRY: ${{ inputs.dry && '1' || '' }}
        run: |
          set -o pipefail
          case $APPS in *[!A-Za-z0-9\ ._-]*) echo "apps: letters, digits, spaces and ._- only" >&2; exit 1 ;; esac
          [ "$DRY" = 1 ] || [ "$GITHUB_REF" = refs/heads/main ] || { echo "an upload runs only from main" >&2; exit 1; }
          for a in $APPS; do
            jq -e --arg n "$a" '.apps[] | select(.name == $n)' tools/ios-ship.json > /dev/null || { echo "unknown app: $a" >&2; exit 1; }
          done
      - name: Write the keys
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TOKEN: ${{ github.token }}
        run: |
          umask 077
          [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] || { echo "secret ASC_KEY_P8, ASC_KEY_ID or ASC_ISSUER_ID is empty" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"; k="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$k"; chmod 600 "$k"; echo "ASC_KEY_PATH=$k" >> "$GITHUB_ENV"
          h=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n'); echo "::add-mask::$h"
          # GIT_CONFIG_GLOBAL replaces the runner's global config, so include it to keep the runner's own settings.
          if [ -f "$HOME/.gitconfig" ]; then git config --file "$RUNNER_TEMP/gitauth" include.path "$HOME/.gitconfig"; fi
          git config --file "$RUNNER_TEMP/gitauth" http.https://github.com/.extraheader "AUTHORIZATION: basic $h"
      - name: Fetch ios-ship
        timeout-minutes: 5
        env:
          URL: https://raw.githubusercontent.com/shivinate7/claude-settings/eaaf66e0d282e26ab686f76ae95e761c31bfcdab/bin/ios-ship
        run: |
          set -o pipefail
          curl -fsS --retry 3 --max-time 60 -o "$RUNNER_TEMP/ios-ship" "$URL"; chmod +x "$RUNNER_TEMP/ios-ship"
          xcodebuild -version
          security find-identity -v -p codesigning | tail -n1 > "$RUNNER_TEMP/ids-before"
      # Same call as the Makefile's testflight target. The ${args[@]+...} form keeps an empty array safe in the runner's bash 3.2.
      - name: Ship
        env:
          APPS: ${{ inputs.apps }}
          DRY: ${{ inputs.dry && '1' || '' }}
          IOS_SHIP: ${{ runner.temp }}/ios-ship
          TMPDIR: ${{ runner.temp }}
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitauth
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          args=(); for a in ${APPS:-}; do args+=(--app "$a"); done
          [ -z "${DRY:-}" ] || args+=(--export-only)
          "$IOS_SHIP" testflight tools/ios-ship.json ${args[@]+"${args[@]}"}
      - name: Certificate count
        if: ${{ !cancelled() }}
        run: |
          echo "codesigning identities before: $(cat "$RUNNER_TEMP/ids-before" 2>/dev/null || echo unknown); after: $(security find-identity -v -p codesigning | tail -n1)"
          for l in "$RUNNER_TEMP"/ios-ship-testflight.*; do
            [ -f "$l" ] || continue
            echo "note: $(grep -ciE 'creat[a-z]* .*certificate|certificate .*creat' "$l" || true) log lines mention creating a certificate (a fresh keychain may create an Apple Development certificate each run)"
          done
      - name: Failure slice
        if: ${{ failure() }}
        run: |
          found=0
          for l in "$RUNNER_TEMP"/ios-ship-testflight.*; do
            [ -f "$l" ] || continue; found=1
            grep -iE 'error|signing|certificate|provisioning' "$l" | tail -n 60 || true
          done
          [ "$found" = 1 ] || echo "no ios-ship log: it refused before the build; see the Ship step"
      - name: Upload the log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ship-log
          path: ${{ runner.temp }}/ios-ship-testflight.*
          retention-days: 7
          if-no-files-found: warn
      - name: Delete the keys
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP"/asc/AuthKey_*.p8 "$RUNNER_TEMP/gitauth"
