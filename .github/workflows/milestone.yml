# The full Swift suite in two parallel jobs, on a GitHub-hosted Mac with Xcode 27.
# part-a runs the page check, the Kit tests and the UI_TESTS_A classes. part-b runs the other UI test classes.
# Neither runs a Duo class. Both jobs must pass for the run to pass.
# Decision milestone-runs-full-suite holds the rule.
#
# This workflow runs on main by dispatch only, never on push or schedule. The merge tool refuses a
# merge when the newest completed main run of any workflow file is red, and a later green run of
# another trigger must never hide a red one. The milestone-due job in test.yml dispatches it once its
# MILESTONE_AUTO_DISPATCH is on. Until then, do not dispatch by hand before the known reds clear:
# a red run stops every merge through the merge tool (coordinator ruling 2026-11-01 23:00).
# It stays dispatch-only until its first green run (coordinator ruling 2026-11-01 22:44).
name: milestone

on:
  workflow_dispatch:

permissions:
  contents: read

# Each run has its own group, so no run is cancelled: each needs its verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  part-a:
    # xcode-27 is the runner-images xcode-27-arm64 image: Xcode 27.1 and the iOS 27.1 SDK.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: xcode-27
    timeout-minutes: 45 # provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      # tokens-check builds the page.
      - run: npm ci
      - name: select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      # Neither runner image holds xcodegen, so the job installs one pinned release. The zip is
      # checked against XCODEGEN_SHA256 before it is unpacked. A mismatch fails the step.
      - name: install xcodegen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/xcodegen-download"
          mkdir -p "$dl"
          curl -fsSL -o "$dl/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          got=$(shasum -a 256 "$dl/xcodegen.zip" | cut -d ' ' -f 1)
          if [ "$got" != "$XCODEGEN_SHA256" ]; then
            echo "xcodegen ${XCODEGEN_VERSION} zip digest is $got, expected $XCODEGEN_SHA256" >&2
            exit 1
          fi
          unzip -q "$dl/xcodegen.zip" -d "$dl/unpacked"
          # The binary reads ../share/xcodegen, so the unpacked tree stays whole.
          echo "$dl/unpacked/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen --version
      # The image holds the iPhone 18 Pro on iOS 27.0 only. The job makes its own on iOS 27.1, the
      # owner's runtime. The UDID reaches the next steps through GITHUB_ENV.
      - name: create and boot the iOS 27.1 simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl create ci-sim "iPhone 18 Pro" com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      # The Makefile is the one home of the run. UI_TEST replaces sim-test, which only the owner's Mac has.
      - name: the page check, the Kit tests and the first UI test classes
        env:
          UI_TEST: xcodebuild test -destination "platform=iOS Simulator,id=$$SIM_UDID" -collect-test-diagnostics never
        run: make tokens-check kit-test ui-a
      # The recorded result of the job. It also runs after a red check.
      - name: record the result
        if: ${{ always() }}
        env:
          HEAD_SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Full Swift suite, part-a"
            echo "- head sha: $HEAD_SHA"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  part-b:
    # The steps repeat part-a on purpose: a matrix would hide each job and its cap from test/ci-wiring.test.mjs.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: xcode-27
    timeout-minutes: 50 # provisional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      # Neither runner image holds xcodegen, so the job installs one pinned release. The zip is
      # checked against XCODEGEN_SHA256 before it is unpacked. A mismatch fails the step.
      - name: install xcodegen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          dl="$RUNNER_TEMP/xcodegen-download"
          mkdir -p "$dl"
          curl -fsSL -o "$dl/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          got=$(shasum -a 256 "$dl/xcodegen.zip" | cut -d ' ' -f 1)
          if [ "$got" != "$XCODEGEN_SHA256" ]; then
            echo "xcodegen ${XCODEGEN_VERSION} zip digest is $got, expected $XCODEGEN_SHA256" >&2
            exit 1
          fi
          unzip -q "$dl/xcodegen.zip" -d "$dl/unpacked"
          # The binary reads ../share/xcodegen, so the unpacked tree stays whole.
          echo "$dl/unpacked/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen --version
      # The image holds the iPhone 18 Pro on iOS 27.0 only. The job makes its own on iOS 27.1, the
      # owner's runtime. The UDID reaches the next steps through GITHUB_ENV.
      - name: create and boot the iOS 27.1 simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl create ci-sim "iPhone 18 Pro" com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      # The Makefile is the one home of the run. UI_TEST replaces sim-test, which only the owner's Mac has.
      - name: the other UI test classes
        env:
          UI_TEST: xcodebuild test -destination "platform=iOS Simulator,id=$$SIM_UDID" -collect-test-diagnostics never
        run: make ui-b
      # The recorded result of the job. It also runs after a red check.
      - name: record the result
        if: ${{ always() }}
        env:
          HEAD_SHA: ${{ github.sha }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Full Swift suite, part-b"
            echo "- head sha: $HEAD_SHA"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- result: $RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
