# The repo had no workflows at all, deliberately: CLAUDE.md relies on that to
# guarantee a ledger push to `data` triggers no build. That guarantee now rests
# on these filters instead of on there being nothing to filter, so read them
# before adding anything here.
#
#   - `branches: [main]` alone would already exclude `data`, but the paths
#     filter is the belt: nothing under src/ or test/ ever changes on `data`,
#     which carries exactly one file.
#   - `index.html` is deliberately NOT a trigger. It is the build output and
#     `npm run deploy` commits it separately; running the suite again on that
#     commit would double every deploy for no new information.
name: test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "worker/**"
      - "shared/**"
      - "native/**"
      - "scripts/**"
      - "package.json"
      - "build.mjs"
      - "check-records.mjs"
      - "check-docs.mjs"
      - "invariants/**"
      - "measurements/**"
      - "docs/decisions/**"
      - "docs/debts/**"
      - "package-lock.json"
      - "CLAUDE.md"
      - "README.md"
      - ".github/workflows/test.yml"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    # ready_for_review starts the native job once a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly full run: the native job runs whatever the diff says.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Cancel a superseded PR run whole, not job by job, so cancelled() is true in ci-done and it
# posts no false red comment. The draft state is in the group, so a draft run never cancels a
# ready run. Each main run gets its own group by run id: a group keeps one pending run and a newer
# one replaces it, so a shared sha group could cancel a pending nightly or dispatch run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || format('{0}-{1}', github.ref, github.event.pull_request.draft) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  suite:
    runs-on: ubuntu-latest
    # About 5x the slowest green run (229 s, 26 runs); 10 min cut run 39713600893.
    timeout-minutes: 20
    # Cancel a superseded run on a PR ref. The PR draft state is in the group, so a draft run never cancels a ready run;
    # each main run gets its own group, because a group keeps one pending run and a newer one replaces it.
    concurrency:
      group: suite-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.ref, github.event.pull_request.draft) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:rules
      - run: npm run test:rules
      - run: npm run test:check-docs
      - run: npm run test:check-records
      - run: npm run test:worker
      - run: npm run test:send-key
      - run: npm run test:view-rules
      - run: npm run test:golden
      - name: golden files are in step with src/view-rules.mjs
        run: npm run check:golden --silent
      # The one suite run. TZ is pinned non-UTC so test 38.9 runs (it skips in
      # UTC); check:docs below reads its pass count from this log.
      # pipefail makes a red suite fail the step despite the tee.
      - name: npm test (TZ=America/New_York)
        env:
          TZ: America/New_York
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/suite.log"
      # The committed index.html must match what the sources build, or the live
      # site is not the code in the repo. Cheap to check, and the one thing a
      # local `npm run deploy` can skip by accident. The page is built from
      # src/ alone, so the whole page is compared.
      - name: index.html is in step with src/
        run: npm run check:build --silent

      # The page publishes no ledger data. The Pages site is world-readable and
      # git keeps every version, so a ledger payload in index.html is the one
      # mistake here that git makes permanent.
      - name: the published page carries no ledger data
        run: npm run check:seed --silent

      # CLAUDE.md's own numbers and paths, checked against the repo itself —
      # see check-docs.mjs for what this does and does not cover.
      - name: CLAUDE.md's numbers and paths check out
        env:
          CHECK_DOCS_SUITE_LOG: ${{ runner.temp }}/suite.log
        run: npm run check:docs --silent

      # The record corpus under invariants/, measurements/, docs/decisions/ and docs/debts/ —
      # see check-records.mjs for the eight claims this proves.
      - name: the record corpus checks out
        run: npm run check:records --silent

  # Decision screens-checked-headless-in-ci: the screen check runs once, here,
  # on macOS only (Cochin exists only there), and never at deploy time.
  screens:
    runs-on: macos-latest
    # About 2.7x the slowest green run (670 s, 26 runs); it stops a hang (decision above).
    timeout-minutes: 30
    # Cancel a superseded run on a PR ref (draft state in the group); never cancel a run on main, where
    # each merge needs its own verdict (own group per sha on main).
    concurrency:
      group: screens-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.ref, github.event.pull_request.draft) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: install Chromium
        run: npx playwright install chromium
        timeout-minutes: 2
      - run: npm run build
      - run: npm run check:screens

  # Decision native-ci-on-hosted-macos: says whether the native job has work.
  # Nightly and dispatch run it; so does a diff that cannot be read (fail safe).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      native: ${{ steps.d.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          native=true
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            # NUL-separated, so a quoted path (a double quote in a name) still matches.
            # A failed or empty diff leaves files empty, and native stays true.
            files=$(git diff --no-renames --name-only -z "$BASE" HEAD | tr '\0' '\n')
            if [ -n "$files" ]; then
              grep -Eq '^(native/|shared/|src/view-rules\.mjs$|\.github/workflows/test\.yml$)' <<< "$files" || native=false
            fi
          fi
          echo "scope verdict: event=$EVENT native=$native"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  # Decision native-ci-on-hosted-macos: the Swift package tests (ST) on a
  # hosted macOS runner. Skips drafts (decision ci-skips-draft-prs). The 10 min
  # timeout is about 6x the slowest green run (95 s, 18 runs), for macOS start-up variance.
  native:
    needs: [suite, scope]
    # !cancelled() lets it run when scope itself failed (fail safe) and still
    # stops it on a cancelled run; the suite result check keeps the
    # cheap-first rule: a red suite skips native.
    if: ${{ !cancelled() && needs.suite.result == 'success' && (needs.scope.result != 'success' || needs.scope.outputs.native == 'true') && !github.event.pull_request.draft }}
    runs-on: macos-26
    timeout-minutes: 10
    concurrency:
      group: native-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.ref, github.event.pull_request.draft) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path native/ManifestKit

  # Audits the workflows and the dependabot config. Same command as local:
  # zizmor .github/workflows .github/dependabot.yml (online-audits off; the action still passes github.token).
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.30.1
          inputs: .github/workflows .github/dependabot.yml
          online-audits: false
          advanced-security: false
          annotations: true

  # Lints the markdown a change adds or edits, in Simplified Technical English. It fails only
  # on an error on a changed line. fetch-depth 0 lets the action diff against the base branch.
  ste-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # provisional
    concurrency:
      group: ste-lint-${{ github.ref == 'refs/heads/main' && github.sha || format('{0}-{1}', github.ref, github.event.pull_request.draft) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivinate7/claude-settings/actions/ste-lint@1cc47f015bdaf073d8cb0f043a988c28d09aa3e1 # main 2026-10-29

  # Rule git-ci-done-comment-wakes: a run that ends with a red job posts one PR comment, which
  # wakes the session that watches the PR. A green run posts nothing. Keep needs: on every other job.
  ci-done:
    needs: [suite, screens, scope, native, zizmor, ste-lint]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # the workflow default, kept because a job-level block replaces it
      pull-requests: write  # gh pr comment posts the one comment
    steps:
      - uses: shivinate7/claude-settings/actions/ci-done-comment@1cc47f015bdaf073d8cb0f043a988c28d09aa3e1 # main 2026-10-29
        with:
          needs: ${{ toJSON(needs) }}
