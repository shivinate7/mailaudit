# The repo had no workflows at all, deliberately: CLAUDE.md relies on that to
# guarantee a ledger push to `data` triggers no build. That guarantee now rests
# on these filters instead of on there being nothing to filter, so read them
# before adding anything here.
#
#   - `branches: [main]` alone would already exclude `data`, but the paths
#     filter is the belt: nothing under src/ or test/ ever changes on `data`,
#     which carries exactly one file.
#   - `index.html` is deliberately NOT a trigger. It is the build output and
#     `npm run deploy` commits it separately; running the suite again on that
#     commit would double every deploy for no new information.
name: test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "build.mjs"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # The committed index.html must match what the sources build, or the live
      # site is not the code in the repo. Cheap to check, and the one thing a
      # local `npm run deploy` can skip by accident.
      #
      # This used to diff the two pages whole, and it was red for four straight
      # runs because it cannot work that way. index.html carries the code AND a
      # snapshot of the ledger read off `origin/data` at build time, and
      # actions/checkout is single-branch — so the runner has no origin/data,
      # builds a seedless page, and every comparison differs. Fetching that
      # branch here would only trade an always-wrong check for a randomly-wrong
      # one: the phone rewrites `data` on a 90s idle debounce, so a rebuild
      # minutes after a deploy legitimately produces different bytes.
      #
      # `--check` compares the code and ignores the seed, which is data. The
      # logic lives in build.mjs beside the template that writes the seed tag,
      # so the two cannot drift apart — and it fails loudly rather than quietly
      # comparing nothing if the tag's shape ever changes without it.
      - name: index.html is in step with src/
        run: npm run check:build --silent
