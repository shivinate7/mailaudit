           passes under it rather than beside it. Only opacity/transform

                      font-family: ${V}; letter-spacing: .09em;

                      text-transform: uppercase; border: none;

                      cursor: pointer; white-space: nowrap; display: flex;
                      align-items: center; justify-content: center; gap: 5px;
                      transition: color 300ms ease; }

           Columns by child count \u2014 one cell on an empty ledger, three with
           a remote, four without \u2014 and the divider is each cell's own right
           rule with the last one dropped. Classes rather than inline styles
           because the row's membership is conditional, so "last" can't be a
           prop the way headCell's is. The label sizes on the view switch's
           curve: 10px at 375, where "SYNC \xB7 09-02 \u25BE" has to fit a 114px

                    grid-auto-columns: minmax(0, 1fr); }
        .mdl-act { height: 40px; min-width: 0; padding: 0 6px; border: 0;
                   border-right: 1px solid ${d.line}; background: transparent;
                   font-family: ${V}; font-size: clamp(10px, 2.7vw, 11px);
                   letter-spacing: .07em; text-transform: uppercase;
                   color: ${d.ink}; cursor: pointer; display: inline-flex;
                   align-items: center; justify-content: center; gap: 6px;
                   white-space: nowrap; }

        .mdl-act > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
        .mdl-act i { font-style: normal; font-size: 8px; color: ${d.inkSoft};
                     flex-shrink: 0; transition: transform 140ms ease; }
        /* An .ahead rule used to live here too, for the Sync cell that
           turned accent when the other device was in front. Both are gone: a
           resume merges on its own, so being behind is no longer a state the
           row has to report. (No backticks in this comment \u2014 it sits inside a
           template literal, and one would end the string.) */

        .mdl-act[aria-expanded="true"] i { transform: rotate(180deg);

        .mdl-act.danger { color: ${d.red}; }
        .mdl-act.armed { background: ${d.red}; color: ${d.card}; font-weight: 700; }

           A joy pass, under one rule: NOTHING HERE MAY REFLOW. Every keyframe
           below touches opacity, transform, colour or box-shadow and nothing
           else \u2014 no width, height, margin or padding on anything a finger is
           about to land on. That is invariant no-layout-shift-under-pointer restated as a stylesheet
           constraint, and it is why the sliding switch thumb is an absolutely
           positioned element rather than a background that moves between three
           buttons, and why the check tick is drawn with stroke-dashoffset
           inside a box whose 30px never changes.

           a seal pressed, rules drawn like a pen stroke, gold catching light
           once. Nothing springs, nothing bounces past its rest and hangs there.
           The one overshoot in here \u2014 the stamp's +1deg \u2014 is the wrist roll
           that inks a rubber stamp's edges, and it returns THROUGH rest rather
           than oscillating around it.

           so a plain animation:none leaves it drawn, not hidden. (No

           literal, and a stray one would end the string.) */

           then the rules are drawn outward from it, then the type settles.

           the owner chose knowingly, which is that the tallies arrive last.

           third of the track, translated by whole multiples of its own width \u2014

           out of step with them. The buttons keep transparent backgrounds and
           sit above it; only their colour crosses over. */

           useJustBecame gates it \u2014 because a class alone would restamp every
