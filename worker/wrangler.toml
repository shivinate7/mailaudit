name = "manifestnumberone"
main = "index.mjs"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://shivinate7.github.io,http://localhost:4173"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Ledger"]

# Cloudflare cron runs in UTC: 09:00 UTC is 04:00 CDT.
[triggers]
crons = ["0 9 * * *"]
