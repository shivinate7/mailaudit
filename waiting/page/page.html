u003c/ul>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- ================= 7 ================= -->\n\u003ctemplate id=\"pile\">\n  \u003cspan class=\"micro m11\">Today's pile · 7 envelopes · 39 cards\u003c/span>\n  \u003cdiv class=\"pile\">\n    \u003cdiv class=\"pr\">\u003cspan>Fernhill Cards\u003cspan class=\"d\">2026-10-20\u003c/span>\u003c/span>\u003cspan class=\"g ok\">8/8\u003c/span>\u003c/div>\n    \u003cdiv class=\"pr\">\u003cspan>Fernhill Cards\u003cspan class=\"d\">2026-10-22\u003c/span>\u003c/span>\u003cspan class=\"g ok\">6/6\u003c/span>\u003c/div>\n    \u003cdiv class=\"pr\">\u003cspan>Kestrel Card Co.\u003cspan class=\"d\">2026-10-21\u003c/span>\u003c/span>\u003cspan class=\"g ok\">6/6\u003c/span>\u003c/div>\n    \u003cdiv class=\"pr\">\u003cspan>Low Tide Singles\u003cspan class=\"d\">2026-10-22\u003c/span>\u003c/span>\u003cspan class=\"g ok\">5/5\u003c/span>\u003c/div>\n    \u003cdiv class=\"pr\">\u003cspan>Kestrel Card Co.\u003cspan class=\"d\">2026-10-14\u003c/span>\u003c/span>\u003cspan class=\"g short\">6/7\u003c/span>\u003c/div>\n    \u003cdiv class=\"pr\">\u003cspan>Brass Lantern TCG\u003cspan class=\"d\">2026-10-16\u003c/span>\u003c/span>\u003cspan class=\"g ok\">5/5\u003c/span>\u003c/div>\n    \u003cdiv class=\"pr\">\u003cspan>Low Tide Singles\u003cspan class=\"d\">2026-10-19\u003c/span>\u003c/span>\u003cspan class=\"g ok\">3/3\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"odd\">\n  \u003cspan class=\"micro m11\">Not normal today\u003c/span>\n  \u003cdiv class=\"odd\">\n    \u003cdiv class=\"or\">\u003cspan>\u003cb>Kestrel Card Co. came 1 short\u003c/b>\u003csmall>2026-10-14 · 1 Lightning Bolt · 1 left · $1.12\u003c/small>\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"tbox\">\u003cspan>Past 14 days: 4 envelopes\u003csmall>1 refund window closing\u003c/small>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Open\u003c/span>\u003c/span>\u003c/div>\n\u003c/template>\n\u003c!-- The masthead's still-missing figure, under its own label, outside \"Not normal today\" -->\n\u003ctemplate id=\"still\">\n  \u003cspan class=\"micro m11 tag-new tag-below\" data-tag=\"New: its own label\">Across all orders\u003c/span>\n  \u003cspan class=\"still\">19 still missing · $11.07\u003c/span>\n\u003c/template>\n\u003csection class=\"part\" id=\"s-end-of-day\" data-state=\"end-of-day\">\n\u003ch2>7 · The end of mail day \u003cspan class=\"verdict\">carried over; what opens it: option picked, the empty query\u003c/span>\u003c/h2>\n\u003cp class=\"lede\">Carried over from October pose 5 (index.html:171 to :195, :382 to :406): the left page lists today's envelopes, and the right page names only what is not normal. What opens it October does not say, since there the query was simply empty. Two options. The past-14-days box is today's \u003ccode>transitBox\u003c/code>, unchanged.\u003c/p>\n\n\u003cfigure data-opt=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-down\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">39 in · 19 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field empty\">Type the card in hand\u003c/div>\n      \u003cdiv class=\"rowx tag-today\" data-tag=\"Today: nothing under it\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cp class=\"empty-hint tag-today\" data-tag=\"Today: the start-of-day hint\">Type the card in hand. The envelope it came from shows here.\u003c/p>\n      \u003cdiv class=\"tbox\">\u003cspan>Past 14 days: 4 envelopes\u003csmall>1 refund window closing\u003c/small>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Open\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Today.\u003c/b> Pile done, keys down. The pages show the same hint they show before the first card (HandScreen.swift:249 to :251), and the box under it.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"eod-empty\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-down\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">39 in · 19 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field empty\">Type the card in hand\u003c/div>\n      \u003cdiv data-fill=\"env-none\">\u003c/div>\n      \u003cdiv class=\"tag-new tag-below\" id=\"focus-eod-empty\" data-tag=\"New: today's pile, on an empty query\" style=\"display:flex;flex-direction:column;gap:8px\" data-fill=\"pile\">\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\u003cdiv class=\"tag-new\" data-tag=\"New: only what is not normal\" style=\"display:flex;flex-direction:column;gap:8px\" data-fill=\"odd\">\u003c/div>\u003cdiv data-fill=\"still\">\u003c/div>\u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>On an empty query (pick).\u003c/b> Once one card is in today, an empty query shows the day. Before that, today's hint stays. No new control. A short envelope reads red, and its row names the missing card, so it needs no Open. The red line is the masthead's own \"still missing\" figure. \u003cbutton type=\"button\" class=\"hide\" data-hide=\"eod-empty\">Hide empty query\u003c/button>\u003c/figcaption>\n  \u003cul class=\"tags\">\u003cli>Rows are read-outs, 44 pt each. Seven rows end near y 540 on the left page, which has no bar.\u003c/li>\u003cli>With the keys up the pile runs under them. It is a read-out, so nothing tappable hides.\u003c/li>\u003c/ul>\n\u003c/figure>\n\n\u003cfigure data-opt=\"eod-control\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-down\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">39 in · 19 out\u003c/span>\u003cspan class=\"hit tag-new\" id=\"focus-eod-control\" data-tag=\"New: Day's end control\">\u003cspan class=\"pill\">Day's end\u003c/span>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field empty\">Type the card in hand\u003c/div>\n      \u003cdiv data-fill=\"env-none\">\u003c/div>\n      \u003cdiv style=\"display:flex;flex-direction:column;gap:8px\" data-fill=\"pile\">\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\" data-fill=\"odd still\">\u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Behind a Day's end control.\u003c/b> The same view, shown only after a press. The empty query keeps today's hint. One more control in the header, and the day stays out of sight until you ask. \u003cbutton type=\"button\" class=\"hide\" data-hide=\"eod-control\">Hide Day's end\u003c/button>\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"eod-new\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-down\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">39 in · 18 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field empty\">Type the card in hand\u003c/div>\n      \u003cdiv data-fill=\"env-none\">\u003c/div>\n      \u003cspan class=\"micro m11\">Today's pile · 1 envelope · 6 cards\u003c/span>\n      \u003cdiv class=\"pile\">\u003cdiv class=\"pr\">\u003cspan>Fernhill Cards\u003cspan class=\"d\">2026-10-20\u003c/span>\u003c/span>\u003cspan class=\"g ok\">6/6\u003c/span>\u003c/div>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cspan class=\"micro m11\">Not normal today\u003c/span>\n      \u003cspan class=\"well tag-new\" id=\"focus-eod-well\" data-tag=\"New: nothing to report\">All is well.\u003c/span>\n      \u003cspan class=\"micro m11 tag-new tag-below\" data-tag=\"New: its own label\">Across all orders\u003c/span>\n      \u003cspan class=\"still\">18 still missing · $10.40\u003c/span>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>All is well.\u003c/b> With nothing short and nothing past 14 days, the right page says so, and only the still-missing figure stays (\u003ccode>ux-all-is-well\u003c/code>).\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"eod-new\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-keys\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">39 in · 19 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field\">Smothering T\u003c/div>\n      \u003cdiv data-fill=\"env-none\">\u003c/div>\n      \u003cdiv class=\"notice tag-new\" id=\"focus-nomatch\" data-tag=\"New: the answer at the query\">\u003cspan class=\"micro m11\">No match\u003c/span>\u003cb>No open envelope holds Smothering T.\u003c/b>\u003cspan class=\"hit\" style=\"align-self:flex-start\">\u003cspan class=\"pill\">Hold in Suspense\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\" data-fill=\"odd still\">\u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>No match.\u003c/b> October pose 5's second frame (index.html:394 to :405): the answer shows at the query, not on the far page, and Hold in Suspense keeps the name on the line. Today the right page says \"No open envelope holds\" (HandScreen.swift:253) and offers nothing. The box sits where Matches would, below This envelope. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- ================= 8 ================= -->\n\u003ctemplate id=\"left-susp\">\n  \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n    \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">36 in · 22 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n    \u003cdiv class=\"field\">Command T\u003c/div>\n    \u003cdiv data-fill=\"env-none\">\u003c/div>\n    \u003cspan class=\"micro\">Matches\u003c/span>\n    \u003cdiv class=\"match\">Command Tower\u003c/div>\n    \u003cdiv class=\"notice\">\u003cspan class=\"micro m11\">Suspense · 3 cards\u003c/span>\u003cb>Arcane Signet ×2 · Command Tower\u003c/b>\u003csmall>Not checked in.\u003c/small>\u003c/div>\n  \u003c/div>\u003c/div>\n\u003c/template>\n\u003csection class=\"part\" id=\"s-suspense-rank\" data-state=\"suspense-rank\">\n\u003ch2>8 · Suspense ranks the accounts it fits \u003cspan class=\"verdict\">carried over\u003c/span>\u003c/h2>\n\u003cp class=\"lede\">Carried over from October pose 3 (index.html:286 to :312): an envelope with no sender, whose cards are each in two envelopes. Its cards wait on the Suspense line, and the right page ranks the accounts they fit by named copies. Post checks in the named cards only. The rank is the bundle's \u003ccode>rankCandidates\u003c/code>, the rule Orphaned already uses. When the top two rank equal, the page shows the tie of part 6 instead.\u003c/p>\n\n\u003cfigure data-opt=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-keys\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">36 in · 22 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field\">Command T\u003c/div>\n      \u003cdiv data-fill=\"env-today\">\u003c/div>\n      \u003cspan class=\"micro\">Matches\u003c/span>\n      \u003cdiv class=\"match\">Command Tower\u003c/div>\n      \u003cdiv class=\"notice tag-today\" data-tag=\"Today: one held name\">\u003cspan class=\"micro\">Suspense\u003c/span>\u003cb>Arcane Signet\u003c/b>\u003csmall>Not checked in.\u003c/small>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cspan class=\"micro\">2 envelopes hold this card\u003c/span>\n      \u003cp class=\"note\">Name the next card from this envelope to tell them apart. Nothing checks in until you post.\u003c/p>\n      \u003cdiv class=\"tcard tag-today\" data-tag=\"Today: a tie, unranked\">\u003cb>Low Tide Singles\u003c/b>\u003cspan class=\"meta\">\u003cspan>ordered 2026-10-19 · 3 cards out\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"tcard\">\u003cb>Tinpot Cards\u003c/b>\u003cspan class=\"meta\">\u003cspan>ordered 2026-10-06 · 4 cards out\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Today.\u003c/b> The held-name line holds one name with no count (\u003ccode>HandModel.held\u003c/code>, HandModel.swift:21). Command Tower fits the same two envelopes, so \u003ccode>handStep\u003c/code> keeps Arcane Signet held and Command Tower goes nowhere. The right page shows a plain tie. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"rank-new\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-susp chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cspan class=\"micro m11\">Accounts the held cards fit\u003c/span>\n      \u003cspan class=\"who\">3 cards, no sender\u003c/span>\n      \u003cspan class=\"meta\">\u003cspan>Arcane Signet ×2 · Command Tower\u003c/span>\u003c/span>\n      \u003cdiv class=\"rank tag-new\" id=\"focus-rank\" data-tag=\"New: ranked by named copies\">\n        \u003cdiv class=\"rr\">\u003cspan>\u003cb>Low Tide Singles\u003c/b>\u003csmall>ordered 2026-10-19\u003c/small>\u003csmall>explains all 3 · nothing left over\u003c/small>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 3 cards here\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"rr\">\u003cspan>\u003cb>Tinpot Cards\u003c/b>\u003csmall>ordered 2026-10-06\u003c/small>\u003csmall>2 of 3 cards · 2 more still owed\u003c/small>\u003csmall>1 Arcane Signet stays held\u003c/small>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Post 2 cards here\u003c/span>\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"note\">Post checks in only the cards an account ordered. A card that does not fit stays on the Suspense line.\u003c/p>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Ranked.\u003c/b> Low Tide ordered two Arcane Signet and one Command Tower, so its row reads OrphanedView's fit line \"explains all 3 · nothing left over\", and its Post is the filled one. Tinpot ordered one Arcane Signet and one Command Tower, so it reads \"2 of 3 cards · 2 more still owed\", and the second Arcane Signet stays held. The list ends by y 300, clear of the keys. October's \"Leave in Suspense\" button is left out: doing nothing already leaves the cards on the line. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\n// Fill each frame from its templates, so the shared parts are drawn once. Templates can hold other fills, so repeat.\nfor (let pass = 0; pass \u003c 3; pass++) {\n  document.querySelectorAll('[data-fill]').forEach(el => {\n    const ids = el.getAttribute('data-fill'); el.removeAttribute('data-fill');\n    ids.split(' ').forEach(id => el.append(document.getElementById(id).content.cloneNode(true)));\n    // A bare wrapper only carried the fill: lift its children into the parent's flex column.\n    if (el.tagName === 'DIV' && el.attributes.length === 0) el.replaceWith(...el.childNodes);\n  });\n}\n// Scale each 951 pt frame to the page width; the page never scrolls sideways.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; d.style.zoom = Math.min(1, w.clientWidth / 951); });\n}\n// Deep link: #s=\u003cpart> shows one part; no hash shows all. A Hide button removes one option.\nconst hidden = new Set();\nfunction route() {\n  const m = location.hash.match(/s=([\\w-]+)/), s = m && m[1];\n  document.querySelectorAll('section.part').forEach(p => { p.hidden = !!s && p.dataset.state !== s; });\n  document.querySelectorAll('figure[data-opt]').forEach(f => { f.hidden = hidden.has(f.dataset.opt); });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === (location.hash || '#'))));\n  fit();\n}\ndocument.querySelectorAll('[data-hide]').forEach(b => {\n  const name = b.textContent.replace(/^Hide /, '');\n  b.addEventListener('click', () => {\n    const o = b.dataset.hide; hidden.has(o) ? hidden.delete(o) : hidden.add(o);\n    b.textContent = (hidden.has(o) ? 'Show ' : 'Hide ') + name; route();\n  });\n});\ndocument.getElementById('restore').addEventListener('click', () => {\n  hidden.clear(); document.querySelectorAll('[data-hide]').forEach(b => { b.textContent = 'Hide ' + b.textContent.replace(/^(Hide|Show) /, ''); }); route();\n});\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "orphaned-meta-line-wraps": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Candidate Meta Line\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The native app is held to light (UIUserInterfaceStyle), so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832;\n  --shadow:rgba(28,43,36,0.06);\n  /* Cochin and Menlo are Apple fonts. Off a Mac, Menlo falls back to DejaVu Sans Mono, which Menlo is drawn from:\n     the same 0.602 em advance, so every mono width on this page holds. Cochin falls back to a serif of other widths. */\n  --cochin: Cochin, \"Liberation Serif\", Georgia, serif;\n  --mono: Menlo, \"DejaVu Sans Mono\", ui-monospace, monospace;\n  --new:#2E7A5E; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.4; }\nmain { margin:0 auto; padding:16px; max-width:2600px; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-weight:600; max-width:100ch; }\nh1 { font-family:var(--cochin); font-size:24px; margin:16px 0 4px; }\nh2 { font-family:var(--cochin); font-size:20px; margin:32px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:100ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }\nnav a, nav button { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nnav .sep { width:100%; height:0; }\nnav .lab { align-self:center; font-size:13px; color:var(--inkSoft); min-width:5em; }\nfigure { margin:16px 0 32px; }\nfigure[hidden], [hidden] { display:none !important; }\nfigcaption { margin-top:8px; max-width:100ch; }\n\n/* The comparison: one row per text size, one column per option. The grid scrolls inside its own box, so the page never scrolls sideways. */\n.scroller { overflow-x:auto; padding:12px 4px 8px; }\n.grid { display:grid; grid-template-columns:repeat(var(--cols), 466px); gap:16px 20px; align-items:start; width:max-content; }\n.group { font-family:var(--cochin); font-size:18px; font-weight:700; padding:8px 12px; border-radius:8px; }\n.group small { display:block; font:400 13px/1.35 -apple-system, system-ui, sans-serif; color:var(--inkSoft); }\n.group.today { border:2px dashed var(--today); } .group.new { border:2px dashed var(--new); }\n.colhead { padding:0 4px; }\n.colhead b { font-family:var(--cochin); font-size:17px; display:block; }\n.colhead .how { font-size:13px; color:var(--inkSoft); display:block; }\n.verdict { display:inline-block; margin-top:4px; font-size:12.5px; font-weight:600; padding:2px 8px; border-radius:6px; border:1px solid currentColor; }\n.verdict.fail { color:var(--red); } .verdict.pass { color:var(--green); } .verdict.unk { color:var(--inkSoft); }\n.sizehead { grid-column:1 / -1; font-family:var(--cochin); font-size:18px; font-weight:700; border-top:1px solid var(--line); padding-top:12px; margin-top:8px; }\n.sizehead small { font:400 13px -apple-system, system-ui, sans-serif; color:var(--inkSoft); margin-left:8px; }\n.cellcap { margin:0 0 6px; font-size:13px; color:var(--ink); max-width:466px; }\n.cellcap .tagname { margin-top:0; font-size:12px; }\n.cell .read { font:12px/1.45 var(--mono); color:var(--inkSoft); margin-top:6px; max-width:466px; }\n.read .bad { color:var(--red); } .read .ok { color:var(--green); }\n\n/* ---- device: iPhone Duo outer screen (folded), 466 pt wide (duo-fold-and-keyboard, 2026-11-08). 1 CSS px = 1 pt. ---- */\n.phone { width:466px; background:var(--paper); border:1px solid var(--ink); border-radius:16px; overflow:hidden; position:relative;\n  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 16px); }\n.phone.open { width:455.5px; border-radius:4px; } /* the open Duo's right page: 455.5 pt (duo-fold-and-keyboard) */\n.above { font:11px var(--mono); color:var(--inkSoft); border:1px dashed var(--line); border-radius:6px; padding:4px 8px; margin-bottom:12px; }\n\n/* ---- the envelope card, as OrphanedView.swift EnvelopeCard draws it. Sizes are set by script per text size. ---- */\n.card { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 2px var(--shadow); line-height:normal; }\n.ehead { display:flex; align-items:center; gap:8px; padding:12px 12px 8px; }\n.micro { font-family:var(--mono); text-transform:uppercase; color:var(--inkSoft); }\n.ehead .micro { flex:1 1 0; min-width:0; }\n.mini { font-family:var(--mono); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:5px; text-align:center; flex:none; }\n.mini.discard { color:var(--red); border-color:#F4E4D9; }\n.entries { display:flex; flex-direction:column; gap:4px; padding:0 12px 8px; font-family:var(--cochin); }\n.rule { height:1px; background:var(--line); }\n.cands { display:flex; flex-direction:column; gap:8px; padding:8px 12px 12px; }\n.tie { font-family:var(--cochin); background:var(--manila); color:var(--manilaInk); border-radius:6px; padding:4px 8px; }\n.cand { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--line); border-radius:8px; }\n.cand .col { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:2px; }\n.seller { font-family:var(--cochin); font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n.meta { font-family:var(--mono); color:var(--inkSoft); position:relative; }\n.fitline { font-family:var(--mono); color:var(--inkSoft); }\n/* \"This one\": MiniLabel at 11.5, 8 pt padding, in a 44 x 44 pt hit frame. Its width at accessibility sizes is unmeasured; drawn capped at half the row. */\n.cand .mini { padding:8px; min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; max-width:50%; }\n\n/* The meta line, by option */\n.meta.wrap { white-space:normal; overflow-wrap:anywhere; }\n.meta.one { white-space:nowrap; overflow:hidden; }\n.meta.ellipsis { text-overflow:ellipsis; }\n/* CutLine (ControlViews.swift): hard clip at the column, and a \"…\" drawn on the card fill over the edge. */\n.meta .dots { position:absolute; right:0; top:0; background:var(--card); padding-left:1px; }\n\n/* tags: dashed outline on what exists today, and on what an option adds. The tag's words sit in the column head,\n   so no label covers the line being judged. */\n[data-tag] { position:relative; }\n.tag-new { outline:2px dashed var(--new); outline-offset:1px; }\n.tag-today { outline:2px dashed var(--today); outline-offset:1px; }\n.tagname { display:inline-block; margin-top:4px; font-size:12.5px; font-weight:600; padding:1px 6px; border:2px dashed currentColor; border-radius:4px; }\n.tagname.tag-today { color:var(--today); outline:0; } .tagname.tag-new { color:var(--new); outline:0; }\n\n/* ---- the web row: src/app.jsx EnvelopeCard, px sizes, at 375 px ---- */\n.web { width:375px; background:var(--paper); border:1px solid var(--ink); border-radius:8px; padding:16px; }\n.web .card { line-height:1.4; }\n#summary { border-collapse:collapse; font-size:13.5px; background:var(--card); }\n#summary th, #summary td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }\n#summary th { font-weight:600; }\n#summary td.bad { color:var(--red); } #summary td.ok { color:var(--green); }\n.sources { max-width:100ch; }\n.sources li { margin:4px 0; }\ncode { font-family:var(--mono); font-size:0.9em; overflow-wrap:anywhere; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\">Sample. No seller, date, order number or count on this page is real. Widths come from the code and this drawing, not from a simulator.\u003c/div>\n\u003ch1>Orphaned candidate: the meta line wraps, or keeps one line\u003c/h1>\n\u003cp class=\"sub\">Owner page item 56 (\u003ccode>orphaned-meta-line-wraps\u003c/code>). The line under the seller holds the order date, the untracked tag and the order number. iPhone Duo folded, 466 pt wide. Four text sizes. Light theme only. One sample in every frame: an envelope of 3 cards that two packages fit equally (a tie), the first untracked. Only the meta line's rule changes between columns. Debt \u003ccode>native-candidate-lines-wrap\u003c/code>.\u003c/p>\n\n\u003cnav aria-label=\"Options\">\n  \u003cspan class=\"lab\">Option\u003c/span>\n  \u003ca href=\"#o=wrap\">Wrap (today)\u003c/a>\n  \u003ca href=\"#o=shrink\">Shrink to fit\u003c/a>\n  \u003ca href=\"#o=cut\">Cut at full size\u003c/a>\n  \u003ca href=\"#o=cutline\">Cut line\u003c/a>\n  \u003ca href=\"#o=capped\">Capped size\u003c/a>\n  \u003ca href=\"#o=web\">The web row\u003c/a>\n  \u003ca href=\"#\">All\u003c/a>\n  \u003cspan class=\"sep\">\u003c/span>\n  \u003cspan class=\"lab\">Text size\u003c/span>\n  \u003ca href=\"#size=default\" data-size>Default\u003c/a>\n  \u003ca href=\"#size=xxxl\" data-size>xxxLarge\u003c/a>\n  \u003ca href=\"#size=ax3\" data-size>AX3\u003c/a>\n  \u003ca href=\"#size=ax5\" data-size>AX5\u003c/a>\n  \u003cspan class=\"sep\">\u003c/span>\n  \u003cspan class=\"lab\">Hide\u003c/span>\n  \u003cbutton type=\"button\" data-hide=\"shrink\">Hide Shrink to fit\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"cut\">Hide Cut at full size\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"cutline\">Hide Cut line\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"capped\">Hide Capped size\u003c/button>\n\u003c/nav>\n\n\u003csection id=\"summary-box\" data-o=\"all\">\n  \u003ch2>What the drawing shows, row 1 (untracked)\u003c/h2>\n  \u003cdiv class=\"scroller\">\u003ctable id=\"summary\">\u003c/table>\u003c/div>\n  \u003cp class=\"sub\" id=\"room\">\u003c/p>\n\u003c/section>\n\n\u003c!-- Folded first (ios-apps, Mockups). The candidate rows sit in the one-page list on the folded screen. -->\n\u003cfigure id=\"compare\">\n  \u003cdiv class=\"scroller\">\u003cdiv class=\"grid\" id=\"grid\" data-device=\"iphone-duo-folded\">\u003c/div>\u003c/div>\n  \u003cfigcaption>Each column is one rule for the meta line. Each row is one text size. Under each frame, the drawing reads its own meta line: lines, size, and characters hidden. The seller line and the fit line are today's in every column.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-o=\"open\">\n  \u003ch2>The open Duo\u003c/h2>\n  \u003cdiv class=\"scroller\">\u003cdiv style=\"display:flex; gap:20px; width:max-content;\" id=\"open\" data-device=\"iphone-duo-unfolded\">\u003c/div>\u003c/div>\n  \u003cfigcaption>On the open Duo the list shows envelope cells, and the candidates sit on the right page (\u003ccode>OrphanedView.detail\u003c/code>, 16 pt padding). The page is 455.5 pt wide, 10.5 pt narrower than the folded screen, so each option breaks as in its folded column, one or two characters sooner.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-o=\"web\">\n  \u003ch2>The web row, for comparison\u003c/h2>\n  \u003cdiv class=\"scroller\">\u003cdiv class=\"web\" id=\"web\">\u003c/div>\u003c/div>\n  \u003cfigcaption>The web row at 375 px, the same sample. The web sets its text in px, so it does not grow with iOS text size. Its meta line is one line with \"…\" (\u003ccode>EnvelopeCard\u003c/code>, \u003ccode>whiteSpace: \"nowrap\"\u003c/code>, \u003ccode>textOverflow: \"ellipsis\"\u003c/code>). At 375 px the order number is cut away; it shows only in the hover title, which a phone has not got.\u003c/figcaption>\n  \u003cdiv class=\"read\" id=\"webread\" style=\"font:12px/1.45 var(--mono); color:var(--inkSoft); margin-top:6px;\">\u003c/div>\n\u003c/figure>\n\n\u003csection class=\"sources\" data-o=\"all\">\n  \u003ch2>Sizes and sources\u003c/h2>\n  \u003cul>\n    \u003cli>Screen: folded Duo, 466 pt wide (\u003ccode>duo-fold-and-keyboard\u003c/code>, outer screen, re-measured 2026-11-08). Open Duo right page: 455.5 pt (same record). \u003ccode>layout.py devices\u003c/code> gives \u003ccode>unknown\u003c/code> for this repo.\u003c/li>\n    \u003cli>Gutters: the list pads 16 pt (\u003ccode>OrphanedView.list\u003c/code>); the candidates block pads 8, 12, 12 (\u003ccode>EnvelopeCard.card\u003c/code>); a row pads 8 with an 8 pt gap to \"This one\" (\u003ccode>CandidateRow.body\u003c/code>). So the text column at the default size is 394 pt less \"This one\".\u003c/li>\n    \u003cli>Type, at the default size: seller Cochin 14 bold, relative to Body; meta Menlo 10.5, relative to Caption 1; fit line Menlo 11, Caption 1; \"This one\" Menlo 11.5, Caption 1 (\u003ccode>CandidateRow.body\u003c/code>, \u003ccode>MiniLabel\u003c/code>). Header micro Menlo 11, entries Cochin 13.5 Body, tie line Cochin 12.5 Footnote (\u003ccode>EnvelopeCard.card\u003c/code>).\u003c/li>\n    \u003cli>Scaling: \u003ccode>Font.custom(_:size:relativeTo:)\u003c/code> scales each size by its text style. Ratios from Apple's iOS Dynamic Type tables (typography page, read 2026-11-08, 200): Body 17, 23, 40, 53; Caption 1 12, 18, 32, 43; Footnote 13, 19, 33, 44, at Large (default), xxxLarge, AX3 and AX5. So the meta line draws at 10.5, 15.75, 28 and 37.6 pt.\u003c/li>\n    \u003cli>Colours: candidate meta and fit line inkSoft, seller ink, row border line, tie line manilaInk on manila (\u003ccode>OrphanedPaint.token\u003c/code>, \u003ccode>ControlPaint\u003c/code>).\u003c/li>\n    \u003cli>The audit's text size on 2026-10-27: unmeasured. \u003ccode>OrphanedUITests.launch\u003c/code> passes no \u003ccode>-UIPreferredContentSizeCategoryName\u003c/code>, so the tie audit ran at the simulator's own setting, which no record names. AX5 is drawn as the worst case; it is the size \u003ccode>DuoSpreadUITests.testFlatBarLabelsFitThePillAtAccessibilityXXXL\u003c/code> uses.\u003c/li>\n    \u003cli>Width of \"This one\" at AX3 and AX5: unmeasured. Drawn at its natural width, capped at half the row, so it wraps to two lines there.\u003c/li>\n    \u003cli>Line heights: Chromium's, not SwiftUI's. Row heights are estimates within a few points.\u003c/li>\n  \u003c/ul>\n\u003c/section>\n\u003c/main>\n\u003cscript>\n// One sample for every frame. The order numbers are invented, in the 8-6-5 shape of a TCGplayer order number.\nconst ENV = { title: 'Envelope · 2026-11-03 · 3 cards', entries: ['Lightning Bolt', 'Counterspell', 'Brainstorm'] };\nconst TIE = '2 packages fit these cards equally well — pick the right one yourself.';\nconst CANDS = [\n  { seller: 'Alpha Cards', date: '2026-07-01', untracked: true, id: '7C41B09E-3A5F12-D80C4', fit: '3 of 3 cards · 2 more still owed' },\n  { seller: 'Beta Games', date: '2026-07-29', untracked: false, id: 'E93A6D21-0B7C48-15FAE', fit: '3 of 3 cards · 2 more still owed' },\n];\nconst metaText = c => [c.date, c.untracked ? '○ untracked' : '', c.id].filter(Boolean).join(' · ');\n\n// iOS Dynamic Type sizes, Apple typography page (read 2026-11-08): Large is the default.\nconst SIZES = {\n  default: { label: 'Default text size (Large)', note: 'Body 17, Caption 1 12', body: 17, caption: 12, footnote: 13, ax: false },\n  xxxl: { label: 'xxxLarge', note: 'the largest size outside the accessibility sizes. Body 23, Caption 1 18', body: 23, caption: 18, footnote: 19, ax: false },\n  ax3: { label: 'AX3 (Accessibility Large 3)', note: 'Body 40, Caption 1 32', body: 40, caption: 32, footnote: 33, ax: true },\n  ax5: { label: 'AX5 (AccessibilityXXXL, the largest)', note: 'Body 53, Caption 1 43. Drawn as the worst case: the 2026-10-27 audit size is unrecorded', body: 53, caption: 43, footnote: 44, ax: true },\n};\nconst BASE = SIZES.default;\nconst sz = (s, base, style) => +(base * s[style] / BASE[style]).toFixed(2);\n\nconst OPTS = {\n  wrap: { name: 'Wrap (today)', how: 'Text with no line limit. It wraps at large text (CandidateRow.body).', verdict: ['pass', 'Audit: no clipped-text finding on this line (7c887ab, 2026-10-27)'], tag: ['tag-today', 'Today: wraps'] },\n  shrink: { name: 'Shrink to fit', how: 'One line; shrinks to half size, then \"…\". What the seller ships today.', verdict: ['fail', 'Audit: \"Text clipped\" (measured 2026-10-27)'], tag: ['tag-new', 'New: shrink, then …'] },\n  cut: { name: 'Cut at full size', how: 'One line with \"…\" at full size, as the web does (lineLimit 1, tail).', verdict: ['fail', 'Audit: \"Text clipped\", no element (measured 2026-10-28 on the Tally line)'], tag: ['tag-new', 'New: one line, …'] },\n  cutline: { name: 'Cut line', how: 'The Tally meta line’s CutLine: hard clip with a drawn \"…\"; wraps at accessibility sizes.', verdict: ['unk', 'Audit: passed on the Tally line (2026-10-28); this row unmeasured'], tag: ['tag-new', 'New: clip + drawn …'] },\n  capped: { name: 'Capped size', how: 'The line stops growing at xxxLarge (dynamicTypeSize(...xxxLarge)), and cuts as Cut line does.', verdict: ['unk', 'Audit: unmeasured'], tag: ['tag-new', 'New: size capped, cut'] },\n};\nconst ONE_LINE = ['shrink', 'cut', 'cutline', 'capped'];\nconst ORDER = ['wrap', ...ONE_LINE];\n\n// The meta line for one option at one text size. Returns [className, inner html, font size].\nfunction metaFor(opt, s, c) {\n  const t = metaText(c);\n  let size = sz(s, 10.5, 'caption');\n  if (opt === 'wrap' || (opt === 'cutline' && s.ax)) return ['wrap', t, size];\n  if (opt === 'capped') size = Math.min(size, sz(SIZES.xxxl, 10.5, 'caption'));\n  if (opt === 'shrink' || opt === 'cut') return ['one ellipsis', t, size];\n  return ['one cutline', `${t}\u003cspan class=\"dots\" aria-hidden=\"true\">…\u003c/span>`, size];\n}\n\nfunction card(opt, s, ids) {\n  const px = (b, st) => sz(s, b, st) + 'px';\n  const rows = CANDS.map((c, i) => {\n    const [cls, inner, msize] = metaFor(opt, s, c);\n    const tag = i === 0 && OPTS[opt].tag ? ` class=\"${OPTS[opt].tag[0]}\" data-tag=\"${OPTS[opt].tag[1]}\"` : '';\n    return `\u003cdiv class=\"cand\">\n      \u003cdiv class=\"col\">\n        \u003cdiv class=\"seller\" data-shrink style=\"font-size:${px(14, 'body')}\">${c.seller}\u003c/div>\n        \u003cdiv${tag}>\u003cdiv class=\"meta ${cls}\" data-opt=\"${opt}\" data-full=\"${metaText(c)}\" style=\"font-size:${msize}px\"${i === 0 && ids ? ` id=\"${ids}\"` : ''}>${inner}\u003c/div>\u003c/div>\n        \u003cdiv class=\"fitline\" style=\"font-size:${px(11, 'caption')}\">${c.fit}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"mini\" style=\"font-size:${px(11.5, 'caption')}\">This one\u003c/div>\n    \u003c/div>`;\n  }).join('');\n  return `\u003cdiv class=\"card\">\n    \u003cdiv class=\"ehead\">\u003cspan class=\"micro\" style=\"font-size:${px(11, 'caption')}; letter-spacing:1.32px\">${ENV.title}\u003c/span>\n      \u003cspan class=\"mini\" style=\"font-size:${px(11, 'caption')}; padding:4px 8px\">Edit\u003c/span>\u003cspan class=\"mini discard\" style=\"font-size:${px(11, 'caption')}; padding:4px 8px\">Discard\u003c/span>\u003c/div>\n    \u003cdiv class=\"entries\" style=\"font-size:${px(13.5, 'body')}\">${ENV.entries.map(e => `\u003cspan>${e}\u003c/span>`).join('')}\u003c/div>\n    \u003cdiv class=\"rule\">\u003c/div>\n    \u003cdiv class=\"cands\">\n      \u003cspan class=\"micro\" style=\"font-size:${px(10.5, 'caption')}; letter-spacing:1.26px\">Could have come from\u003c/span>\n      \u003cdiv class=\"tie\" style=\"font-size:${px(12.5, 'footnote')}\">${TIE}\u003c/div>\n      ${rows}\n    \u003c/div>\n  \u003c/div>`;\n}\n\nfunction phone(opt, size, device = 'iphone-duo-folded', cls = '') {\n  return `\u003cdiv class=\"phone ${cls}\" data-device=\"${device}\" data-shot=\"${opt}-${size}\">\n    \u003cdiv class=\"above\">Masthead and \"+ Record an envelope\" above; not drawn\u003c/div>\n    ${card(opt, SIZES[size], device === 'iphone-duo-folded' && size === 'ax3' && opt === 'wrap' ? 'focus-wrap-row' : '')}\n  \u003c/div>`;\n}\n\n// Build the grid: two group heads, one head per option, then one row of frames per text size.\nconst grid = document.getElementById('grid');\ngrid.style.setProperty('--cols', ORDER.length);\nlet html = `\u003cdiv class=\"group today\" id=\"focus-wrap\" data-col=\"wrap\">Wrap is right on the phone\u003csmall>Today. Every word stays on screen; rows grow at large text.\u003c/small>\u003c/div>\n  \u003cdiv class=\"group new\" id=\"focus-one-line\" data-col=\"one\" style=\"grid-column:span ${ONE_LINE.length}\">Keep looking for a one-line version\u003csmall>Four candidates a lane might try. Each says what the audit has measured.\u003c/small>\u003c/div>`;\nhtml += ORDER.map(o => `\u003cdiv class=\"colhead\" data-col=\"${o}\">\u003cb>${OPTS[o].name}\u003c/b>\u003cspan class=\"how\">${OPTS[o].how}\u003c/span>\u003cspan class=\"tagname ${OPTS[o].tag[0]}\">${OPTS[o].tag[1]}\u003c/span>\u003cbr>\u003cspan class=\"verdict ${OPTS[o].verdict[0]}\">${OPTS[o].verdict[1]}\u003c/span>\u003c/div>`).join('');\nfor (const [k, s] of Object.entries(SIZES)) {\n  html += `\u003cdiv class=\"sizehead\" data-size=\"${k}\">${s.label}\u003csmall>${s.note}\u003c/small>\u003c/div>`;\n  html += ORDER.map(o => `\u003cdiv class=\"cell\" data-col=\"${o}\" data-size=\"${k}\">\u003cp class=\"cellcap\">\u003cb>${OPTS[o].name}\u003c/b> · ${s.label} · \u003cspan class=\"tagname ${OPTS[o].tag[0]}\">${OPTS[o].tag[1]}\u003c/span>\u003c/p>${phone(o, k)}\u003cdiv class=\"read\" data-read>\u003c/div>\u003c/div>`).join('');\n}\ngrid.innerHTML = html;\n\n// The open Duo: the right page at the default size and AX5, Wrap only.\ndocument.getElementById('open').innerHTML = ['default', 'ax5'].map(k =>\n  `\u003cdiv>\u003cp style=\"margin:0 0 6px;font-weight:600\">${SIZES[k].label}, Wrap (today)\u003c/p>${phone('wrap', k, 'iphone-duo-unfolded', 'open')}\u003c/div>`).join('');\n\n// The web row: px sizes from src/app.jsx EnvelopeCard; 16 px page gutter (the page wrapper's padding).\ndocument.getElementById('web').innerHTML = `\u003cdiv class=\"card\">\n  \u003cdiv class=\"ehead\">\u003cspan class=\"micro\" style=\"font-size:11px; letter-spacing:1.32px\">${ENV.title}\u003c/span>\u003cspan class=\"mini\" style=\"font-size:11px;padding:4px 8px\">Edit\u003c/span>\u003cspan class=\"mini discard\" style=\"font-size:11px;padding:4px 8px\">Discard\u003c/span>\u003c/div>\n  \u003cdiv class=\"entries\" style=\"font-size:13.5px\">${ENV.entries.map(e => `\u003cspan>${e}\u003c/span>`).join('')}\u003c/div>\n  \u003cdiv class=\"rule\">\u003c/div>\n  \u003cdiv class=\"cands\">\u003cspan class=\"micro\" style=\"font-size:10.5px; letter-spacing:1.26px\">Could have come from\u003c/span>\u003cdiv class=\"tie\" style=\"font-size:12.5px\">${TIE}\u003c/div>\n  ${CANDS.map((c, i) => `\u003cdiv class=\"cand\">\u003cdiv class=\"col\">\u003cdiv class=\"seller\" style=\"font-size:14px\">${c.seller}\u003c/div>\n    \u003cdiv class=\"meta one ellipsis\" style=\"font-size:10.5px\" data-full=\"${metaText(c)}\"${i === 0 ? ' id=\"focus-web-row\"' : ''} title=\"${c.id}\">${metaText(c)}\u003c/div>\n    \u003cdiv class=\"fitline\" style=\"font-size:11px\">${c.fit}\u003c/div>\u003c/div>\u003cdiv class=\"mini\" style=\"font-size:11.5px; min-height:0; padding:8px\">This one\u003c/div>\u003c/div>`).join('')}\n  \u003c/div>\u003c/div>`;\n\n// Shrink to fit: SwiftUI's minimumScaleFactor(0.5). Scale the whole line down to fit, never under half; past that, \"…\".\nfunction shrinkAll() {\n  document.querySelectorAll('.meta[data-opt=\"shrink\"], .seller[data-shrink]').forEach(el => {\n    el.style.transform = ''; const base = parseFloat(el.dataset.base || el.style.fontSize); el.dataset.base = base;\n    el.style.fontSize = base + 'px';\n    const w = el.scrollWidth, room = el.clientWidth;\n    if (w > room + 0.5) el.style.fontSize = Math.max(base * 0.5, base * room / w) + 'px';\n  });\n}\n\n// Read each meta line from this drawing: lines, drawn size, and how many characters the line hides.\nfunction readAll() {\n  const report = (el) => {\n    const cs = getComputedStyle(el), fs = parseFloat(cs.fontSize), lh = parseFloat(cs.lineHeight) || fs * 1.164;\n    const full = el.dataset.full, cw = fs * 0.602;\n    const lines = Math.max(1, Math.round(el.getBoundingClientRect().height / lh));\n    let hidden = 0;\n    if (el.classList.contains('one')) {\n      const room = el.clientWidth;\n      if (full.length * cw > room + 0.5) hidden = full.length - Math.floor((room - cw) / cw);\n    }\n    return { fs, lines, hidden, full };\n  };\n  document.querySelectorAll('.cell').forEach(cell => {\n    const metas = [...cell.querySelectorAll('.meta')];\n    if (!metas[0] || !metas[0].getBoundingClientRect().height) return;\n    const r = metas.map(report), row = cell.querySelector('.cand').getBoundingClientRect().height;\n    const parts = r.map((x, i) => {\n      const what = x.hidden ? `\u003cspan class=\"bad\">${x.hidden} characters hidden${x.hidden >= 24 ? ': the whole order number and more' : x.hidden >= 21 ? ': the whole order number' : ': part of the order number'}\u003c/span>` : '\u003cspan class=\"ok\">nothing hidden\u003c/span>';\n      const small = x.fs \u003c 10.5 ? ' \u003cspan class=\"bad\">(smaller than at the default size)\u003c/span>' : '';\n      return `row ${i + 1}: ${x.lines} line${x.lines > 1 ? 's' : ''} at ${x.fs.toFixed(1)} pt${small}, ${what}`;\n    });\n    cell.querySelector('[data-read]').innerHTML = 'In this drawing: ' + parts.join('\u003cbr>') + `\u003cbr>row 1 height ${Math.round(row)} pt`;\n  });\n  // The summary: row 1 of each option at each size, read from the frames above. Hidden frames are skipped.\n  const keys = Object.keys(SIZES), cellOf = (o, k) => document.querySelector(`.cell[data-col=\"${o}\"][data-size=\"${k}\"]`);\n  let t = `\u003ctr>\u003cth>Option\u003c/th>${keys.map(k => `\u003cth>${SIZES[k].label.split(' (')[0]}\u003c/th>`).join('')}\u003c/tr>`;\n  for (const o of ORDER) {\n    t += `\u003ctr>\u003cth>${OPTS[o].name}\u003c/th>` + keys.map(k => {\n      const m = cellOf(o, k).querySelector('.meta'); if (!m.getBoundingClientRect().height) return '\u003ctd>not shown\u003c/td>';\n      const x = report(m), small = x.fs \u003c 10.5;\n      const txt = `${x.lines} line${x.lines > 1 ? 's' : ''}, ${x.fs.toFixed(1)} pt` + (x.hidden ? `, ${x.hidden} characters hidden` : ', all shown') + (small ? ', smaller than default' : '') + `; row ${Math.round(m.closest('.cand').getBoundingClientRect().height)} pt tall`;\n      return `\u003ctd class=\"${x.hidden || small ? 'bad' : 'ok'}\">${txt}\u003c/td>`;\n    }).join('') + '\u003c/tr>';\n  }\n  document.getElementById('summary').innerHTML = t;\n  const room = keys.map(k => { const m = cellOf('wrap', k).querySelector('.meta'); if (!m.getBoundingClientRect().height) return '';\n    const fs = parseFloat(getComputedStyle(m).fontSize); return `${SIZES[k].label.split(' (')[0]}: column ${Math.round(m.clientWidth)} pt, the order number alone needs ${Math.round(21 * 0.602 * fs)} pt`; }).filter(Boolean);\n  document.getElementById('room').textContent = 'Room for the line in this drawing. ' + room.join('; ') + '. Past the size where the order number alone is wider than the column, no one-line rule shows it whole at full size.';\n  const w = document.querySelector('#focus-web-row'); if (w) { const x = report(w);\n    document.getElementById('webread').innerHTML = `In this drawing: row 1 meta ${x.lines} line at ${x.fs} px, ${x.hidden ? x.hidden + ' characters hidden' : 'nothing hidden'}.`; }\n}\n\n// Deep links: #o=\u003coption> and #size=\u003csize>, alone or joined with &. No hash shows all. A hide button removes one option.\nconst hidden = new Set();\nconst param = k => { const m = location.hash.match(new RegExp('(?:^#|&)' + k + '=([\\\\w-]+)')); return m && m[1]; };\nfunction route() {\n  const o = param('o'), size = param('size');\n  const showCol = c => (!o || o === c || (c === 'one' && ONE_LINE.includes(o))) && !hidden.has(c);\n  const live = ORDER.filter(c => showCol(c));\n  document.querySelectorAll('#grid [data-col]').forEach(el => {\n    const c = el.dataset.col;\n    el.hidden = c === 'one' ? !ONE_LINE.some(showCol) : !showCol(c);\n    if (c === 'one') el.style.gridColumn = 'span ' + Math.max(1, ONE_LINE.filter(showCol).length);\n    if (el.dataset.size && size && el.dataset.size !== size) el.hidden = true;\n  });\n  document.querySelectorAll('#grid .sizehead').forEach(el => { el.hidden = size && el.dataset.size !== size; });\n  grid.style.setProperty('--cols', Math.max(1, live.length));\n  document.getElementById('compare').hidden = o === 'web';\n  document.querySelector('[data-o=\"open\"]').hidden = !!o && o !== 'wrap';\n  document.querySelector('[data-o=\"web\"]').hidden = !!o && o !== 'web';\n  document.querySelector('[data-o=\"all\"]').hidden = !!o || !!size;\n  document.querySelectorAll('nav a').forEach(a => {\n    const h = a.getAttribute('href');\n    const on = h === '#' ? !o && !size : h.startsWith('#o=') ? h.slice(3) === o : h.slice(6) === size;\n    a.setAttribute('aria-current', String(on));\n  });\n  shrinkAll(); readAll();\n}\ndocument.querySelectorAll('nav a').forEach(a => a.addEventListener('click', e => {\n  const h = a.getAttribute('href'); if (h === '#') return;\n  e.preventDefault();\n  const o = h.startsWith('#o=') ? h.slice(3) : param('o'), size = h.startsWith('#size=') ? h.slice(6) : param('size');\n  location.hash = [o && 'o=' + o, size && 'size=' + size].filter(Boolean).join('&');\n}));\ndocument.querySelectorAll('[data-hide]').forEach(b => b.addEventListener('click', () => {\n  const o = b.dataset.hide, name = b.textContent.replace(/^(Hide|Show) /, '');\n  hidden.has(o) ? hidden.delete(o) : hidden.add(o);\n  b.textContent = (hidden.has(o) ? 'Show ' : 'Hide ') + name; route();\n}));\naddEventListener('hashchange', route);\n(document.fonts ? document.fonts.ready : Promise.resolve()).then(route); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "panel-paper-fill": "\u003c!doctype html>\n\u003chtml lang=\"en\" data-theme=\"light\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Panel Paper Fill\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The web ships one theme, light, so this page has one. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832;\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:var(--cochin); font-size:16px; line-height:1.45; }\nmain { max-width:1600px; margin:0 auto; padding:16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-family:var(--mono); font-size:13px; }\nh1 { font-size:26px; font-weight:400; letter-spacing:.06em; margin:16px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:78ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; align-items:center; }\nnav .lab { font:12px/1.4 var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--inkSoft); min-width:64px; }\nnav a, nav button { font:13px/1.4 var(--mono); min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:700; }\nnav button[aria-pressed=\"true\"] { color:var(--inkSoft); text-decoration:line-through; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n.row { display:grid; column-gap:24px; row-gap:6px; grid-template-columns:repeat(auto-fill, minmax(min(100%, var(--col)), 1fr)); align-items:start; }\nbody[data-w=\"375\"] .row { --col:280px; } body[data-w=\"760\"] .row { --col:520px; }\nfigure { margin:0; display:grid; grid-template-rows:subgrid; grid-row:span 5; row-gap:6px; align-content:start; }\n.tags { align-self:end; }\nfigure[hidden] { display:none; }\nfigure a.shot { display:block; border-radius:8px; }\nfigure a.shot:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nfigure img { display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:var(--card); }\n.cap { font-size:19px; margin:0 0 6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }\n.cap small { font:12px/1.4 var(--mono); color:var(--inkSoft); }\n/* Tag text is ink: green and red on paper fall under 4.5:1 at this size, so the colour rides on the dashed border. */\n.tag { display:inline-block; font:12px/1.4 var(--mono); color:var(--ink); border:1px dashed var(--inkSoft); border-radius:4px; padding:2px 6px; margin:0 4px 4px 0; }\n.tag.today { border-color:var(--red); } .tag.new { border-color:var(--green); }\nfigcaption { font-size:15px; }\n.read { font:12px/1.5 var(--mono); color:var(--inkSoft); margin:0 0 28px; white-space:pre-line; }\n.read b { color:var(--ink); font-weight:700; }\n.hr { border:0; border-top:1px solid var(--line); margin:28px 0 16px; }\nsection h2 { font-size:20px; font-weight:400; margin:0 0 8px; }\nsection ul { margin:0; padding-left:20px; max-width:90ch; font-size:15px; }\ncode { font:13px/1.4 var(--mono); }\n\u003c/style>\n\u003c/head>\n\u003cbody data-w=\"375\" data-p=\"sort\">\n\u003cmain>\n\u003cdiv class=\"banner\" role=\"note\">Sample data. The ledger in every frame is the test fixture shared/fixtures/ledger.json (12 lines, 4 packages, $67.50), so its counts and dollar figures are not real. The frames are headless Chromium screenshots of the built index.html, and the px readings under them were measured on those pages.\u003c/div>\n\u003ch1>Panel paper fill\u003c/h1>\n\u003cp class=\"sub\">Waiting item 63, panel-paper-fill. Should an overlay panel on the Ledger tab paint the paper colour, so the rows under it stop showing through? Every frame but the last draws the overlay the owner ruled on 2026-10-11 (motion-disclosure-panels-arrive). The owner ruled that panels overlay the list, not where they sit. The overlay is not built yet, so a style override draws it here, and its geometry is a guess: the panel keeps its place, is as wide as its card, and runs past the card's foot over the rows below. Where a panel cuts a row below it, that cut comes from this guess. Only the panel's fill differs between the options.\u003c/p>\n\n\u003cnav aria-label=\"Panel\">\n  \u003cspan class=\"lab\">Panel\u003c/span>\n  \u003ca href=\"#p=sort\" data-k=\"p\" data-v=\"sort\">Sorted by (option grid)\u003c/a>\n  \u003ca href=\"#p=history\" data-k=\"p\" data-v=\"history\">History (text)\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Width\">\n  \u003cspan class=\"lab\">Width\u003c/span>\n  \u003ca href=\"#w=375\" data-k=\"w\" data-v=\"375\">375 px phone\u003c/a>\n  \u003ca href=\"#w=760\" data-k=\"w\" data-v=\"760\">760 px tablet\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Theme\">\n  \u003cspan class=\"lab\">Theme\u003c/span>\n  \u003ca href=\"#t=light\" data-k=\"t\" data-v=\"light\" aria-current=\"true\">Light, the only theme\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Hide an option\">\n  \u003cspan class=\"lab\">Hide\u003c/span>\n  \u003cbutton type=\"button\" data-hide=\"paper\" aria-pressed=\"false\">Paper fill\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"none\" aria-pressed=\"false\">No fill\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"rule\" aria-pressed=\"false\">Paper fill, ruled foot\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"built\" aria-pressed=\"false\">As built today\u003c/button>\n\u003c/nav>\n\n\u003cdiv class=\"row\" id=\"frames\">\n  \u003cfigure id=\"focus-paper\" data-o=\"paper\">\n    \u003cp class=\"cap\">Paper fill \u003csmall>the item's first option\u003c/small>\u003c/p>\n    \u003cdiv class=\"tags\">\u003cspan class=\"tag new\">New: paper fill on panelWrap\u003c/span>\u003cspan class=\"tag new\">New: overlay, ruled; geometry is a guess\u003c/span>\u003c/div>\n    \u003ca class=\"shot\" href=\"shots/panel-paper-fill/sort-paper-375-light.png\" title=\"Open the full-size screenshot\">\u003cimg src=\"shots/panel-paper-fill/sort-paper-375-light.png\" alt=\"Ledger tab with the panel open over the rows, filled with the paper colour\">\u003c/a>\n    \u003cfigcaption>The panel is opaque. The rows under it are hidden, and the option cells sit raised on the paper. Its bottom edge is square and has no rule. With the guessed geometry, it cuts the next row's text in half. A geometry that kept the panel inside its card would not cut a row this way.\u003c/figcaption>\n    \u003cdiv class=\"read\">\u003c/div>\n  \u003c/figure>\n  \u003cfigure id=\"focus-none\" data-o=\"none\">\n    \u003cp class=\"cap\">No fill \u003csmall>the item's second option\u003c/small>\u003c/p>\n    \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: panelWrap, padding and top rule, no background\u003c/span>\u003cspan class=\"tag new\">New: overlay, ruled; geometry is a guess\u003c/span>\u003c/div>\n    \u003ca class=\"shot\" href=\"shots/panel-paper-fill/sort-none-375-light.png\" title=\"Open the full-size screenshot\">\u003cimg src=\"shots/panel-paper-fill/sort-none-375-light.png\" alt=\"Ledger tab with the panel open over the rows, with no fill, so the rows show through\">\u003c/a>\n    \u003cfigcaption>The rows under the panel show through its gaps. The History text prints over Re-import CSV and Backup. A row you can still see sits under the panel, so a tap on it reaches the panel instead.\u003c/figcaption>\n    \u003cdiv class=\"read\">\u003c/div>\n  \u003c/figure>\n  \u003cfigure id=\"focus-rule\" data-o=\"rule\">\n    \u003cp class=\"cap\">Paper fill, ruled foot \u003csmall>designer's variant, not on the item\u003c/small>\u003c/p>\n    \u003cdiv class=\"tags\">\u003cspan class=\"tag new\">New: paper fill\u003c/span>\u003cspan class=\"tag new\">New: 1px line rule at the foot\u003c/span>\u003cspan class=\"tag new\">New: overlay, ruled; geometry is a guess\u003c/span>\u003c/div>\n    \u003ca class=\"shot\" href=\"shots/panel-paper-fill/sort-rule-375-light.png\" title=\"Open the full-size screenshot\">\u003cimg src=\"shots/panel-paper-fill/sort-rule-375-light.png\" alt=\"Ledger tab with the panel open, paper fill and a hairline under it\">\u003c/a>\n    \u003cfigcaption>The paper fill, with a 1px \u003ccode>line\u003c/code> rule under the panel. The rule closes the cut edge with the region's own hairline. With the guessed geometry, the row under it is still cut.\u003c/figcaption>\n    \u003cdiv class=\"read\">\u003c/div>\n  \u003c/figure>\n  \u003cfigure id=\"focus-built\" data-o=\"built\">\n    \u003cp class=\"cap\">As built today \u003csmall>for reference, not an option\u003c/small>\u003c/p>\n    \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: panel in flow, pushes the rows down\u003c/span>\u003c/div>\n    \u003ca class=\"shot\" href=\"shots/panel-paper-fill/sort-inflow-375-light.png\" title=\"Open the full-size screenshot\">\u003cimg src=\"shots/panel-paper-fill/sort-inflow-375-light.png\" alt=\"Ledger tab as built: the panel takes space and pushes the rows below it down\">\u003c/a>\n    \u003cfigcaption>The page on main. The panel takes layout space, so nothing shows through. The owner ruled this push out on 2026-10-11, and once the overlay is built the fill question applies.\u003c/figcaption>\n    \u003cdiv class=\"read\">\u003c/div>\n  \u003c/figure>\n\u003c/div>\n\n\u003chr class=\"hr\">\n\u003csection aria-label=\"Sizes and sources\">\n  \u003ch2>Sizes and sources\u003c/h2>\n  \u003cul>\n    \u003cli>Shots and readings come from shots/panel-paper-fill/capture.mjs; run it again to retake them.\u003c/li>\n    \u003cli>Widths 375 and 760 px, height 812: \u003ccode>WIDTHS\u003c/code> and \u003ccode>openSeeded\u003c/code> in test/screens.mjs. Device scale 2.\u003c/li>\n    \u003cli>One theme, light: shared/tokens.json holds one palette, and src/app.jsx has no dark rule.\u003c/li>\n    \u003cli>Panel style: \u003ccode>panelWrap\u003c/code> in src/app.jsx (padding 4px 8px 12px, top rule \u003ccode>line\u003c/code>, no background). Callers: the Sorted by and Orders from panels in the View card, and the Sync, Recent and History panels in the Data card.\u003c/li>\n    \u003cli>Paper: \u003ccode>paper\u003c/code> #F2E9DA. The Ledger cards are \u003ccode>card\u003c/code> #FCF6EA (\u003ccode>.mdl-lcard\u003c/code>), so a paper panel reads darker than the card it opens from.\u003c/li>\n    \u003cli>The overlay is drawn by a style override, not built: the panel is absolute at its own place in flow, as wide as its card, over the rows. The card drops \u003ccode>overflow: hidden\u003c/code> so the panel can pass its foot. That geometry is this mockup's guess; motion-disclosure-panels-arrive gives no geometry.\u003c/li>\n    \u003cli>Row tops are read from the page. They are the same in all three overlay frames at each width, so the fill and the rule move nothing (no-layout-shift-under-pointer).\u003c/li>\n    \u003cli>Unmeasured: the Sync and Recent panels (no sync key and no recent taps in the fixture), the Orders from panel, and touch-device rendering.\u003c/li>\n  \u003c/ul>\n\u003c/section>\n\u003c/main>\n\u003cscript>\n/* Figures read from the shots: document y of each row's button top, the panel's box, and the card foot. */\nconst R = {\"sort-built-375\":{\"rows\":{\"Orders from\":590,\"Sync\":691,\"History\":751},\"panel\":[459,131,341],\"foot\":653},\"sort-none-375\":{\"rows\":{\"Orders from\":459,\"Sync\":560,\"History\":620},\"panel\":[459,131,341],\"foot\":522},\"sort-paper-375\":{\"rows\":{\"Orders from\":459,\"Sync\":560,\"History\":620},\"panel\":[459,131,341],\"foot\":522},\"sort-rule-375\":{\"rows\":{\"Orders from\":459,\"Sync\":560,\"History\":620},\"panel\":[459,132,341],\"foot\":522},\n\"history-built-375\":{\"rows\":{\"Re-import CSV\":751,\"Backup\":803,\"Reset\":877},\"panel\":[672,79,341],\"foot\":856},\"history-none-375\":{\"rows\":{\"Re-import CSV\":672,\"Backup\":724,\"Reset\":798},\"panel\":[672,79,341],\"foot\":777},\"history-paper-375\":{\"rows\":{\"Re-import CSV\":672,\"Backup\":724,\"Reset\":798},\"panel\":[672,79,341],\"foot\":777},\"history-rule-375\":{\"rows\":{\"Re-import CSV\":672,\"Backup\":724,\"Reset\":798},\"panel\":[672,80,341],\"foot\":777},\n\"sort-built-760\":{\"rows\":{\"Orders from\":601,\"Sync\":702,\"History\":762},\"panel\":[470,131,726],\"foot\":664},\"sort-none-760\":{\"rows\":{\"Orders from\":470,\"Sync\":571,\"History\":631},\"panel\":[470,131,726],\"foot\":533},\"sort-paper-760\":{\"rows\":{\"Orders from\":470,\"Sync\":571,\"History\":631},\"panel\":[470,131,726],\"foot\":533},\"sort-rule-760\":{\"rows\":{\"Orders from\":470,\"Sync\":571,\"History\":631},\"panel\":[470,132,726],\"foot\":533},\n\"history-built-760\":{\"rows\":{\"Re-import CSV\":762,\"Backup\":814,\"Reset\":888},\"panel\":[683,79,726],\"foot\":867},\"history-none-760\":{\"rows\":{\"Re-import CSV\":683,\"Backup\":735,\"Reset\":809},\"panel\":[683,79,726],\"foot\":788},\"history-paper-760\":{\"rows\":{\"Re-import CSV\":683,\"Backup\":735,\"Reset\":809},\"panel\":[683,79,726],\"foot\":788},\"history-rule-760\":{\"rows\":{\"Re-import CSV\":683,\"Backup\":735,\"Reset\":809},\"panel\":[683,80,726],\"foot\":788}};\nconst FILE = { built: \"inflow\", none: \"none\", paper: \"paper\", rule: \"rule\" };\nconst hidden = new Set();\nfunction state() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  return { p: h.get(\"p\") === \"history\" ? \"history\" : \"sort\", w: h.get(\"w\") === \"760\" ? \"760\" : \"375\", t: \"light\", o: h.get(\"o\") };\n}\nfunction render() {\n  const s = state();\n  document.body.dataset.w = s.w; document.body.dataset.p = s.p;\n  for (const a of document.querySelectorAll(\"nav a[data-k]\")) {\n    a.setAttribute(\"aria-current\", String(s[a.dataset.k] === a.dataset.v));\n    const q = { p: s.p, w: s.w, t: s.t, [a.dataset.k]: a.dataset.v }; if (s.o) q.o = s.o;\n    a.href = \"#\" + new URLSearchParams(q).toString();\n  }\n  for (const f of document.querySelectorAll(\"#frames figure\")) {\n    const o = f.dataset.o;\n    f.hidden = hidden.has(o) || (s.o && s.o !== o);\n    const src = `shots/panel-paper-fill/${s.p}-${FILE[o]}-${s.w}-light.png`;\n    f.querySelector(\"img\").src = src; f.querySelector(\"a.shot\").href = src;\n    const r = R[`${s.p}-${o}-${s.w}`], base = R[`${s.p}-paper-${s.w}`];\n    const rows = Object.entries(r.rows).map(([k, v]) => `${k} ${v}`).join(\", \");\n    const same = o !== \"built\" && JSON.stringify(r.rows) === JSON.stringify(base.rows);\n    f.querySelector(\".read\").innerHTML = `${s.w} px, light. Panel top ${r.panel[0]}, height ${r.panel[1]}, width ${r.panel[2]}. Card foot ${r.foot}.\\nRow tops: ${rows}.` +\n      (same ? `\\n\u003cb>Row tops equal the other overlay frames: nothing moved.\u003c/b>` : \"\");\n  }\n}\nfor (const b of document.querySelectorAll(\"button[data-hide]\"))\n  b.addEventListener(\"click\", () => {\n    const o = b.dataset.hide; hidden.has(o) ? hidden.delete(o) : hidden.add(o);\n    b.setAttribute(\"aria-pressed\", String(hidden.has(o))); render();\n  });\naddEventListener(\"hashchange\", render);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "pr144-design-merge": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Card in Hand Reference\u003c/title>\n\u003cmeta name=\"description\" content=\"Waiting item 51: what merging the PR 144 Card in Hand design page puts on main, against archiving it, with each part a later ruling overrides marked.\">\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). Chrome follows the theme; the redrawn screens keep PR 144's light palette. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --silver:#C4C3C0;\n  --accent:#6F5CA6; --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832;\n  --amber:#846008; --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Iowan Old Style\", Georgia, serif;\n  --mono: Menlo, ui-monospace, \"SF Mono\", monospace;\n  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px;\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n    --green:#6DBB98; --red:#E3857B; --redSoft:#3A2426; --manila:#3A3122; --manilaInk:#E2CB96; --amber:#D9AE4A; color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n  --green:#6DBB98; --red:#E3857B; --redSoft:#3A2426; --manila:#3A3122; --manilaInk:#E2CB96; --amber:#D9AE4A; color-scheme: dark;\n}\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--cochin); font-size:16px; line-height:1.45; }\nmain { max-width:1040px; margin:0 auto; padding:var(--space-4); display:flex; flex-direction:column; gap:var(--space-4); }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:var(--space-2) var(--space-3); font:13px/1.45 var(--mono); }\nh1 { font-size:26px; font-weight:400; line-height:1.15; margin:0; }\n.sub { color:var(--inkSoft); margin:0; max-width:72ch; }\n.navs { display:flex; flex-direction:column; gap:var(--space-2); }\nnav { display:flex; flex-wrap:wrap; gap:var(--space-2); align-items:center; }\nnav .lab { font-size:14px; color:var(--inkSoft); min-width:56px; }\nnav a, nav button { font:14px/1.3 var(--cochin); min-height:44px; padding:0 var(--space-3); display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); }\nnav button[aria-pressed=\"true\"] { color:var(--inkSoft); text-decoration:line-through; }\nnav a:focus-visible, nav button:focus-visible, .shown button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n[data-state] { display:none; flex-direction:column; gap:var(--space-4); }\n[data-state].on { display:flex; }\n.optline { display:flex; flex-direction:column; gap:var(--space-2); }\n.optline h2 { font-size:21px; font-weight:400; margin:0; }\n.optline p { margin:0; max-width:72ch; }\n.tags { display:flex; flex-wrap:wrap; gap:var(--space-1); }\n/* Tag text is ink: the colour rides on the dashed border, as panel-paper-fill does. */\n.tag { font:12px/1.4 var(--mono); color:var(--ink); border:1px dashed var(--inkSoft); border-radius:4px; padding:2px 6px; }\n.tag.today { border-color:var(--red); } .tag.new { border-color:var(--green); }\n.shown { display:none; align-items:center; gap:var(--space-3); padding:var(--space-3); border:1px dashed var(--line); border-radius:8px; color:var(--inkSoft); }\n.shown button { font:inherit; min-height:44px; padding:0 var(--space-3); border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); cursor:pointer; }\n[data-state].gone > :not(.shown) { display:none; }\n[data-state].gone > .shown { display:flex; }\n\n/* The repo as it stands after the option: a path bar over a sheet. */\n.repo { border:1px solid var(--line); border-radius:8px; background:var(--card); display:flex; flex-direction:column; }\n.path { display:flex; flex-wrap:wrap; justify-content:space-between; gap:var(--space-1) var(--space-2); padding:var(--space-2) var(--space-3); border-bottom:1px solid var(--line); font:12px/1.5 var(--mono); color:var(--inkSoft); }\n.path b { color:var(--ink); font-weight:400; overflow-wrap:anywhere; }\n.sheet { padding:var(--space-3); display:flex; flex-direction:column; gap:var(--space-4); }\n.note { border:2px solid var(--red); background:var(--redSoft); border-radius:8px; padding:var(--space-3); display:flex; flex-direction:column; gap:var(--space-2); }\n.note h3 { font-size:18px; font-weight:400; margin:0; }\n.note ol { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:var(--space-2); font-size:15px; }\n.note p { margin:0; font-size:14px; color:var(--inkSoft); }\n.extra { border:1px dashed var(--amber); border-radius:8px; padding:var(--space-3); display:flex; flex-direction:column; gap:var(--space-2); }\n.extra h3 { font-size:17px; font-weight:400; margin:0; }\n.extra ul { margin:0; padding-left:20px; display:flex; flex-direction:column; gap:var(--space-2); font-size:15px; }\nbody.no-extra .extra, body.no-extra .xmark { display:none; }\nbody.no-extra .scr .xo { outline:none; }\n.lede { margin:0; max-width:72ch; }\n.code { display:flex; flex-direction:column; gap:var(--space-2); }\n.cite { border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.cite .f { font:12px/1.5 var(--mono); padding:var(--space-1) var(--space-2); border-bottom:1px solid var(--line); color:var(--inkSoft); }\n.cite pre { margin:0; padding:var(--space-1) var(--space-2); font:12px/1.5 var(--mono); white-space:pre-wrap; overflow-wrap:anywhere; }\n.cite pre.del { background:var(--redSoft); }\n.cite pre.add { background:color-mix(in srgb, var(--green) 14%, var(--card)); }\n.cite pre.keep { color:var(--ink); }\n.ok { color:var(--green); }\n.missing { border:1px dashed var(--red); border-radius:8px; padding:var(--space-3); display:flex; flex-direction:column; gap:var(--space-1); }\n.missing b { font-weight:400; font-size:17px; }\n\n/* Each pose of the PR 144 page. */\n.gallery { display:flex; flex-direction:column; gap:var(--space-6); }\n.gallery h3.gh { font-size:20px; font-weight:400; margin:0; }\n.pose { display:flex; flex-direction:column; gap:var(--space-2); }\n.pose h4 { font-size:17px; font-weight:400; margin:0; }\n.pose .cap { margin:0; font-size:15px; color:var(--inkSoft); max-width:72ch; }\n.frames { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap:var(--space-4); }\n.frames figure { margin:0; display:flex; flex-direction:column; gap:var(--space-1); }\n.frames figcaption { font-size:14px; color:var(--inkSoft); }\n/* A mark repeats the frame's outline: solid red for a named override, dashed amber for another record. */\n.mark { border:1px solid var(--red); padding:var(--space-2) var(--space-3); background:var(--redSoft); border-radius:8px; font-size:15px; }\n.xmark { border:1px dashed var(--amber); padding:var(--space-2) var(--space-3); border-radius:8px; font-size:15px; }\n.mark b, .xmark b { font-weight:400; font-family:var(--mono); font-size:13px; }\n.archived .mark, .archived .xmark { display:none; }\n.archived .scr .ovr, .archived .scr .xo { outline:none; }\n.archived .fit { opacity:.82; }\n.archived .cap s { text-decoration:none; }\n.gallery:not(.archived) .struck figcaption { text-decoration:line-through; text-decoration-color:var(--red); }\n\n/* Redrawn PR 144 screens: its own CSS and palette, light only, scoped under .scr. */\n.fit { position:relative; overflow:hidden; }\n.fit > .dev { position:absolute; top:0; left:0; transform-origin:0 0; }\n.scr { --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --silver:#C4C3C0; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832; --amber:#846008; --shadow:rgba(28,43,36,0.06);\n  color-scheme:light; color:var(--ink); background:var(--card); border:6px solid var(--ink); border-radius:32px; overflow:hidden; font:15px/1.3 var(--cochin); }\n.scr.inner { width:963px; height:681px; } .scr.outer { width:478px; height:690px; } .scr.tall { width:681px; height:963px; }\n.scr .ovr { outline:6px solid var(--red); outline-offset:4px; border-radius:8px; }\n.scr .xo { outline:6px dashed var(--amber); outline-offset:4px; border-radius:8px; }\n.scr .n { font-family:var(--mono); font-variant-numeric:tabular-nums; }\n.scr .ok { color:var(--green); } .scr .amb { color:var(--amber); } .scr .bad { color:var(--red); } .scr .soft { color:var(--inkSoft); }\n.scr .fold, .scr .hfold { position:absolute; z-index:3; background:repeating-linear-gradient(90deg,transparent 0 3px,rgba(110,99,121,.1) 3px 4px); }\n.scr .fold { top:0; bottom:0; left:465px; width:21px; border-left:1px dashed var(--silver); border-right:1px dashed var(--silver); }\n.scr .hfold { left:0; right:0; top:465px; height:21px; border-top:1px dashed var(--silver); border-bottom:1px dashed var(--silver); }\n.scr .pg { position:absolute; top:0; bottom:0; width:465px; padding:16px 24px; display:flex; flex-direction:column; gap:12px; }\n.scr .pg.l { left:0; } .scr .pg.r { left:486px; }\n.scr .pg.t { bottom:auto; height:465px; width:auto; left:0; right:0; } .scr .pg.b { top:486px; width:auto; left:0; right:0; }\n.scr .pg.solo { left:0; right:0; width:auto; }\n.scr .
