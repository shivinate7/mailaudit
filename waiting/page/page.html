.frow { width: 100%; min-height: 48px; padding: 4px 16px; background: none; border: 0; border-radius: 12px; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; color: var(--ink); }
.frow:hover { background: var(--acc-soft); }
.frow .ftext { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .fwhen { font-size: 14px; color: var(--muted); white-space: nowrap; }
.frow .fgo { color: var(--acc); font-weight: 600; font-size: 14.5px; white-space: nowrap; }
@media (max-width: 520px) {
  .frow { grid-template-columns: auto minmax(0, 1fr) auto; padding-block: 8px; }
  .frow .ftext { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .frow .fwhen { grid-column: 2; grid-row: 2; }
  .frow .fgo { grid-column: 3; grid-row: 1 / span 2; }
}
.older { justify-self: start; width: auto; }
/* The owner's reply sits inside the thread it follows, on the surface ground of "You asked", so his words and a session's differ by ground. */
.askc .thread .myreply { display: grid; gap: 4px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.askc .thread .myreply .lhead { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
.askc .thread .myreply .reply { font-size: 16px; }
.askc .thread .myreply + .lhead, .askc .thread .reply + .myreply { margin-top: 4px; }
/* The thread's end: the line that answers Send reply and Undo, then Reply or the reply box. */
.replyend { display: grid; gap: 8px; min-width: 0; }
.replyend > .btn.replybtn { justify-self: start; min-height: 44px; }
.replyform { padding: 12px; border-radius: var(--r); background: var(--ground); }
.replyform textarea { background: var(--surface); }
.replyform .askrow .btn.rx { grid-column: 3; min-height: 48px; }
@media (max-width: 520px) { .replyform .askrow .btn.rx { grid-column: 1; grid-row: 2; justify-self: start; } }
/* A folded thread with a reply that waits or a new answer to one: the row stays one button; the reply shows under it, outside the fold. */
.askc.folded .fwait { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 2px 12px; margin: 0; padding: 8px 16px 12px; border-top: 1px solid var(--line); }
.askc.folded .fwait > .g { margin-top: 5px; }
.askc.folded .fwait .ftext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.askc.folded .fwait .astate { grid-column: 2; }
@media (max-width: 520px) { .askc.folded .fwait .ftext { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; } }
/* Mark read: it shares the thread's end with Reply, Reply first. It is the quieter act, kept 44 px. Off while a reply waits: a dashed edge, with the reason beside it. */
.replyend .endrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.replyend .endrow > .btn { min-height: 44px; }
.btn.dismiss, .btn.restore { min-height: 44px; }
.btn.dismiss[aria-disabled="true"] { border: 1.5px dashed var(--faint); color: var(--muted); cursor: default; }
.endrow .dwhy { font-size: 14px; color: var(--muted); min-width: 0; }
/* A folded row with a side press: the row button and Mark read (or Mark unread) are siblings, never one inside the other. */
.askc.folded.withd { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 4px; padding-inline-end: 8px; }
.askc.folded.withd > .fwait { grid-column: 1 / -1; }
.askc.folded.withd > .sline, .askc.folded > .sline.dline { grid-column: 1 / -1; padding: 0 16px 8px; }
/* The Marked read line keeps the row's place until the next load, at the folded row's height. */
.askc.dropped { padding: 2px 8px 2px 16px; background: transparent; border-style: dashed; border-color: var(--faint); }
.askc.dropped:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.askc.dropped .sline { min-height: 44px; }
.askc.dropped .sline > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.askc.dropped .sline .dt { color: var(--muted); }
.asklist.dlist .askc.folded { background: transparent; border-style: dashed; border-color: var(--faint); }
@media (max-width: 520px) {
  /* With a side press, the row has no room for "Show answer" on a phone: the words stay in the row button's name, and the row is the press. */
  .askc.folded.withd .frow { grid-template-columns: auto minmax(0, 1fr); padding-inline-end: 4px; }
  .askc.folded.withd .frow .fwhen { grid-column: 2; grid-row: 2; }
  .askc.folded.withd .frow .fgo { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .askc.dropped .sline > span { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .askc.dropped .sline .btn { grid-column: 3; grid-row: 1; }
  .askc.dropped .sline { grid-template-columns: auto minmax(0, 1fr) auto; }
}
.reline { margin: 0; font-size: 14.5px; color: var(--muted); overflow-wrap: anywhere; }
.asks .empty.unk { color: var(--due); border-color: var(--due); }
/* The rail row for asks: the head of an overview tier, no chips. With no waiting ask it is grey, as an empty tier is. */
.ov-tier.zero .ov-head { color: var(--muted); }
/* The routed line extends the ask's folded row with a side press (.askc.folded.withd), so an ask and an item share one shape.
   The row button holds two text lines: what it was with its home, then the short reply. Mark read is the side press. */
.askc.folded.withd.rline .frow { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto auto; align-items: start; row-gap: 2px; padding-block: 8px; }
.askc.rline .frow > .g { margin-top: 7px; }
.frow .fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.frow .fhead .ftext { flex: 0 1 auto; }
/* From 701px the head is one row: a long text shrinks and is cut with an ellipsis, so the number, the new mark and the home keep their place. Under 701px the head wraps. With the New reply mark drawn, a one-row head leaves the title under 60 px below about 665px, so the break sits at 701px, a round figure above that width with a margin. Its other widths are 520px and 960px, so 701px is this rule's own choice. */
@media (min-width: 701px) {
  .frow .fhead { flex-wrap: nowrap; }
  .frow .fhead .ftext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frow .fhead .fno, .frow .fhead .newmark { flex: none; }
  .frow .fhead .hometag { flex: 0 0 auto; max-width: 40%; }
}
.frow .fno { font: 600 13.5px var(--mono); color: var(--acc); white-space: nowrap; }
.frow .freply { grid-column: 2; grid-row: 2; min-width: 0; font-size: 14.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.askc.folded.withd.rline .frow .fgo { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
/* The home: a neutral pill, its word "Home:" in a .sr span. A line with no home says so on a dashed edge. */
.hometag { display: inline-flex; align-items: center; min-height: 22px; max-width: 100%; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); font-size: 13px; font-weight: 600; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hometag.none { background: transparent; border-style: dashed; border-color: var(--faint); color: var(--muted); }
.frow .newmark { min-height: 22px; font-size: 13px; line-height: 19px; }
/* Mark read keeps the box of its widest label (.fixw), so "Marking…" moves nothing. */
.rline > .btn.dismiss { white-space: nowrap; }
/* The opened line: the open ask card's shape, with its home and number in the head. */
.askc.rline.ropen .ahead .fno { font: 600 13.5px var(--mono); color: var(--acc); }
.askc.rline.ropen .rtitle { margin: 0; font: 600 16px/1.4 var(--body); max-width: 70ch; }
.askc.rline.ropen .thread { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--ground); min-width: 0; }
.askc .thread .filed a { color: var(--acc); }
/* An item line sits in the Answered section's list, beside the cards that still wait to be filed. */
.tier.sunk .rlist .askc { scroll-margin-top: 64px; }
.rlist > .older { margin-top: 2px; }
.asklist.dlist.items { margin: 0; }

03cspan class=\"k\">c\u003c/span>\u003cspan class=\"k\">v\u003c/span>\u003cspan class=\"k\">b\u003c/span>\u003cspan class=\"k\">n\u003c/span>\u003cspan class=\"k\">m\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k w\">space\u003c/span>\u003cspan class=\"k\" style=\"flex-basis:90px;font-size:14px\">done\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/template>\n\n\u003c!-- Today: measured on the simulator, \"It came from\" at y -152 and the seller at y -131. -->\n\u003cfigure id=\"s-today\" data-state=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-held chrome\">\n    \u003cdiv class=\"page r\">\n      \u003cdiv class=\"content\" style=\"transform:translateY(-188px)\">\n        \u003cspan class=\"micro tag-today\" data-tag=\"Today: y -152, off the page\">It came from\u003c/span>\n        \u003cspan class=\"who\">Gamma Cards\u003c/span>\n        \u003cspan class=\"meta\">ordered 2026-07-01\u003c/span>\n        \u003cdiv data-fill=\"lines-open\">\u003c/div>\n        \u003cdiv class=\"offer tag-today\" data-tag=\"Today: scrolled to the keys frame\">\n          \u003cp>Your held card came with this envelope. Nothing is checked in until you post.\u003c/p>\n          \u003cspan class=\"hit\" style=\"align-self:flex-start\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Today.\u003c/b> \u003ccode>revealOffer\u003c/code> scrolls the offer to the foot of the space above the keys. The sender leaves the top; rows run under the clock. \"Post … here\" names no envelope.\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- Option A (pick): the offer sits under the sender, above the lines. Nothing needs the keyboard figure. -->\n\u003cfigure id=\"s-a\" data-state=\"a\" data-opt=\"a\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-held chrome\">\n    \u003cdiv class=\"page r\">\n      \u003cdiv class=\"content\">\n        \u003cspan class=\"micro tag-today\" data-tag=\"Today: It came from\">It came from\u003c/span>\n        \u003cspan class=\"who\" id=\"a-who\">Gamma Cards\u003c/span>\n        \u003cspan class=\"meta\">ordered 2026-07-01\u003c/span>\n        \u003cdiv class=\"offer tag-new\" id=\"focus-a\" data-tag=\"New: offer under the sender, y 114 to 224\">\n          \u003cp>Your held card came with this envelope. Nothing is checked in until you post.\u003c/p>\n          \u003cspan class=\"hit\" style=\"align-self:flex-start\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv data-fill=\"lines-open\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Option A, the pick: offer under the sender.\u003c/b> Sender at y 36 to 106, Post hit frame at y 168 to 212, all far above the keys at 405. Below the offer: 2 whole lines, and the third shows its top 44 pt before the keys. 0 lines above the offer. The page sits at its top, so nothing is under the status bar.\u003c/figcaption>\n  \u003cul class=\"tags\">\u003cli>Lines scroll as today. The offer is in the scroll content, not pinned.\u003c/li>\u003cli>Fits with no keyboard figure: the Post button clears the keys by 193 pt.\u003c/li>\u003c/ul>\n\u003c/figure>\n\n\u003cfigure id=\"s-a-posted\" data-state=\"a-posted\" data-opt=\"a\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-posted chrome\">\n    \u003cdiv class=\"page r\">\n      \u003cdiv class=\"content\">\n        \u003cspan class=\"micro\">It came from\u003c/span>\n        \u003cspan class=\"who\">Gamma Cards\u003c/span>\n        \u003cspan class=\"meta\">ordered 2026-07-01\u003c/span>\n        \u003cdiv class=\"offer tag-new\" id=\"focus-a-posted\" data-tag=\"New: receipt holds the slot\">\n          \u003cp>Posted with this envelope. The next card you type clears this line.\u003c/p>\n          \u003cspan class=\"receipt\">2 cards checked in · 1 was held\u003c/span>\n        \u003c/div>\n        \u003cdiv data-fill=\"lines-posted\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Option A after Post.\u003c/b> A same-height receipt takes the offer's slot, so the lines stay put and no line slides under the finger that pressed Post. A refused Post (the ledger changed since the offer) holds the slot too, with the refusal line. It goes when the next card is typed or New envelope ends the envelope.\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- Option B: sender pinned above the scroll view, offer pinned above the keys. Rests on the unmeasured 44 pt figure. -->\n\u003cfigure id=\"s-b\" data-state=\"b\" data-opt=\"b\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-held chrome\">\n    \u003cdiv class=\"page r\">\n      \u003cdiv class=\"head tag-new\" data-tag=\"New: pinned sender head\">\n        \u003cspan class=\"micro\">It came from\u003c/span>\n        \u003cspan class=\"who\">Gamma Cards\u003c/span>\n        \u003cspan class=\"meta\">ordered 2026-07-01\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"mid\">\u003cdiv data-fill=\"lines-open\">\u003c/div>\u003c/div>\n      \u003cdiv class=\"foot\">\n        \u003cdiv class=\"offer tag-new\" id=\"focus-b\" data-tag=\"New: offer pinned above the keys\">\n          \u003cp>Your held card came with this envelope. Nothing is checked in until you post.\u003c/p>\n          \u003cspan class=\"hit\" style=\"align-self:flex-start\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Option B: pinned head and foot.\u003c/b> Sender head y 20 to 114, lines scroll in y 114 to 279, offer y 287 to 397. 2 whole lines above the offer, and the top 28 pt of a third. Keeps today's order (offer under the lines).\u003c/figcaption>\n  \u003cul class=\"tags\">\u003cli>SwiftUI's keyboard inset ends at the keys frame, y 449. The foot clears the drawn panel at 405 only with a 44 pt pad, an unmeasured figure. If the panel draws higher, Post sits under the keys and cannot be scrolled to.\u003c/li>\u003cli>After Post it needs the same receipt as A, or the lines grow into the slot under the finger.\u003c/li>\u003c/ul>\n\u003c/figure>\n\u003c/main>\n\n\u003cscript>\n// Fill each frame from its templates, so the shared parts are drawn once.\ndocument.querySelectorAll('[data-fill]').forEach(el => {\n  el.getAttribute('data-fill').split(' ').forEach(id => el.append(document.getElementById(id).content.cloneNode(true)));\n});\n// Scale each 951 pt frame to the page width; the page never scrolls sideways.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; const s = Math.min(1, w.clientWidth / 951);\n    d.style.zoom = s; });\n}\n// Deep link: #s=\u003cstate> shows one state; no hash shows all. A hide button removes one option.\nconst hidden = new Set();\nfunction route() {\n  const m = location.hash.match(/s=([\\w-]+)/), s = m && m[1];\n  document.querySelectorAll('figure').forEach(f => {\n    f.hidden = (s && f.dataset.state !== s) || hidden.has(f.dataset.opt);\n  });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === (location.hash || '#'))));\n  fit();\n}\ndocument.querySelectorAll('[data-hide]').forEach(b => b.addEventListener('click', () => {\n  const o = b.dataset.hide; hidden.has(o) ? hidden.delete(o) : hidden.add(o);\n  b.textContent = (hidden.has(o) ? 'Show option ' : 'Hide option ') + o.toUpperCase(); route();\n}));\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "d47-a": "\u003c!doctype html>\n\u003chtml lang=\"en\" data-theme=\"light\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Head cells in the Ledger tab\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json. The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --accent:#6F5CA6;\n  --green:#2E7A5E; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832;\n  --wax:#A8443C; --waxLit:#C86A5F; --waxDeep:#66231D; --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  --sys: -apple-system, system-ui, sans-serif;\n  /* Status bar foot: unmeasured on the Duo outer screen. Drawn at the UI test's 20 pt floor (DuoHandUITests.statusBarFloor). */\n  --sat: max(env(safe-area-inset-top), 20px);\n  /* measurements/duo-fold-and-keyboard: outer window 466 x 678 pt, system tab bar from y 595 pt, 83 pt tall. */\n  --fold-w: 466px; --fold-h: 678px; --bar-top: 595px; --bar-h: 83px;\n  /* label colours: mockup notes, not product paint. The new green is darkened from the green token to pass 4.5:1 on paper. */\n  --new:#286E54; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sys); font-size:15px; line-height:1.4;\n  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }\nmain { max-width:1000px; margin:0 auto; padding:16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font-family:var(--cochin); font-size:24px; margin:16px 0 4px; font-weight:700; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:70ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }\nnav a, nav button { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nsection[data-state] { margin:24px 0 40px; }\nsection[hidden], .gone section[data-state] { display:none; }\n.gone-line { display:none; color:var(--inkSoft); margin:24px 0; }\n.gone .gone-line { display:block; }\n.pose { font-family:var(--cochin); font-size:18px; font-weight:700; margin:0 0 12px; }\n.row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; }\nfigure { margin:0; }\nfigcaption { margin-top:8px; max-width:466px; color:var(--inkSoft); font-size:14px; }\nfigcaption b { color:var(--ink); font-family:var(--cochin); font-size:16px; }\n\n/* ---- dashed labels ---- */\n.mark { position:relative; outline:1.5px dashed var(--today); outline-offset:2px; }\n.mark.new { outline-color:var(--new); }\n.tag { position:absolute; right:4px; top:-10px; z-index:3; font:600 11px/16px var(--sys); padding:0 6px; border-radius:4px;\n  background:var(--paper); color:var(--today); border:1px dashed var(--today); white-space:nowrap; }\n.mark.new > .tag { color:var(--new); border-color:var(--new); }\n/* in: inside the mark, on its label line; left: inside, on the empty left of a right-aligned row */\n.tag.in { top:14px; }\n.tag.left { top:14px; right:auto; left:12px; }\n\n/* ---- device: iPhone Duo, folded (outer screen), 1 CSS px = 1 pt ---- */\n.fold { position:relative; width:var(--fold-w); height:var(--fold-h); background:var(--paper); border:1px solid var(--ink); border-radius:24px; overflow:hidden; }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); padding:0 24px; display:flex; align-items:center; justify-content:space-between;\n  font:600 12px var(--sys); color:var(--ink); z-index:2; }\n.scroll { position:absolute; inset:0; padding-top:var(--sat); }\n\n/* masthead (MastheadView.swift) */\n.mh { padding:12px 24px 0; text-align:center; }\n.seal-row { display:flex; align-items:center; gap:12px; max-width:270px; margin:0 auto 12px; }\n.seal-row i { flex:1; height:1px; background:var(--gold); opacity:.75; }\n.seal { width:36px; height:36px; border-radius:50% 46% 52% 48%; background:radial-gradient(circle at 37% 30%, var(--waxLit), var(--wax) 55%, var(--waxDeep));\n  box-shadow: inset 0 0 0 4px rgba(102,35,29,.35); flex:none; }\n.title { font-family:var(--cochin); font-size:31px; line-height:1.15; letter-spacing:.22em; padding-left:.22em; text-transform:uppercase; }\n.house { font:10px var(--mono); letter-spacing:.26em; text-transform:uppercase; color:var(--inkSoft); margin-top:8px; }\n.divider { height:1px; background:var(--line); margin-top:12px; }\n.thirds { display:grid; grid-template-columns:1fr 1fr 1.7fr; margin-top:12px; }\n.third { display:flex; flex-direction:column; gap:4px; align-items:center; padding:0 4px; }\n.third + .third { border-left:1px solid var(--line); }\n.third span { font:10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--inkSoft); }\n.third b { font:700 13px var(--mono); color:var(--accent); }\n.third b em { font-style:normal; font-weight:400; color:var(--inkSoft); }\n.bar { height:8px; border-radius:4px; background:var(--line); margin-top:8px; overflow:hidden; }\n.bar i { display:block; height:100%; width:67%; background:var(--accent); border-radius:4px; }\n.count { font:10.5px var(--mono); color:var(--inkSoft); margin-top:8px; text-align:left; }\n.foot { display:flex; justify-content:space-between; margin-top:4px; font:700 10.5px var(--mono); color:var(--red); }\n.slot47 { height:47px; }\n\n/* stamped row (StampViews.swift StampedRow) */\n.stamped { paddi -spacing:3.6px; text-transform:uppercase; color:var(--inkSoft); text-align:center; }\n.lg { font:11px var(--mono); letter-spacing:2.2px; text-transform:uppercase; color:var(--inkSoft); padding:16px 0 8px 4px; }\n.lcard { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.lrow { min-height:52px; padding:8px 16px; display:flex; align-items:center; gap:12px; }\n.lrow + .lrow { border-top:1px solid var(--line); }\n.lrow .t { flex:1; min-width:0; }\n.lrow .t b { display:block; font:400 20px/1.15 var(--cochin); }\n.lrow .t span { font:13.5px var(--cochin); color:var(--inkSoft); }\n.lrow .v { font:14px var(--mono); color:var(--ink); white-space:nowrap; }\n.lrow .v i { font-style:normal; color:var(--accent); }\n.lrow .chev { font:22px var(--cochin); color:var(--inkSoft); width:10px; }\n.reset { margin-top:20px; }\n.reset .lrow b { color:var(--red); }\n\n/* floating system tab bar, order Ledger, Orphaned, Tally, Packages (RootView.swift) */\n.tabbar { position:absolute; left:0; right:0; top:var(--bar-top); height:var(--bar-h); z-index:2; }\n.pillbar { margin:4px 20px 0; height:56px; border-radius:28px; background:rgba(252,246,234,.9); border:1px solid var(--line);\n  box-shadow:0 4px 16px rgba(51,46,63,.12); display:grid; grid-template-columns:repeat(4,1fr); padding:4px; }\n.tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:24px; color:var(--ink); font:600 10px var(--sys); }\n.tab .g { font-size:17px; line-height:1; }\n.tab.on { color:var(--accent); background:var(--card); box-shadow:inset 0 0 0 1px var(--line); }\n.home { position:absolute; left:50%; bottom:8px; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:var(--ink); }\n\n/* ---- device: iPhone Duo, open (inner screen), 951 x 669 pt; fold strip 455.5 to 495.5 pt (duo-fold-and-keyboard) ---- */\n.open { position:relative; width:951px; height:669px; background:var(--paper); border:1px solid var( 03chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Head cells on the working lists\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json. The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --accent:#6F5CA6;\n  --green:#2E7A5E; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832;\n  --wax:#A8443C; --waxLit:#C86A5F; --waxDeep:#66231D; --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  --sys: -apple-system, system-ui, sans-serif;\n  /* Status bar foot: unmeasured on the Duo outer screen. Drawn at the UI test's 20 pt floor (DuoHandUITests.statusBarFloor). */\n  --sat: max(env(safe-area-inset-top), 20px);\n  /* measurements/duo-fold-and-keyboard: outer window 466 x 678 pt, system tab bar from y 595 pt, 83 pt tall. */\n  --fold-w: 466px; --fold-h: 678px; --bar-top: 595px; --bar-h: 83px;\n  /* label colours: mockup notes, not product paint. The new green is darkened from the green token to pass 4.5:1 on paper. */\n  --new:#286E54; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sys); font-size:15px; line-height:1.4;\n  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }\nmain { max-width:1000px; margin:0 auto; padding:16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font-family:var(--cochin); font-size:24px; margin:16px 0 4px; font-weight:700; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:70ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }\nnav a, nav button { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nsection[data-state] { margin:24px 0 40px; }\nsection[hidden], .gone section[data-state] { display:none; }\n.gone-line { display:none; color:var(--inkSoft); margin:24px 0; }\n.gone .gone-line { display:block; }\n.pose { font-family:var(--cochin); font-size:18px; font-weight:700; margin:0 0 12px; }\n.row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start; }\nfigure { margin:0; }\nfigcaption { margin-top:8px; max-width:466px; color:var(--inkSoft); font-size:14px; }\nfigcaption b { color:var(--ink); font-family:var(--cochin); font-size:16px; }\n\n/* ---- dashed labels ---- */\n.mark { position:relative; outline:1.5px dashed var(--today); outline-offset:2px; }\n.mark.new { outline-color:var(--new); }\n.tag { position:absolute; right:4px; top:-10px; z-index:3; font:600 11px/16px var(--sys); padding:0 6px; border-radius:4px;\n  background:var(--paper); color:var(--today); border:1px dashed var(--today); white-space:nowrap; }\n.mark.new > .tag { color:var(--new); border-color:var(--new); }\n/* in: inside the mark, on its label line; left: inside, on the empty left of a right-aligned row */\n.tag.in { top:14px; }\n.tag.left { top:14px; right:auto; left:12px; }\n\n/* ---- device: iPhone Duo, folded (outer screen), 1 CSS px = 1 pt ---- */\n.fold { position:relative; width:var(--fold-w); height:var(--fold-h); background:var(--paper); border:1px solid var(--ink); border-radius:24px; overflow:hidden; }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); padding:0 24px; display:flex; align-items:center; justify-content:space-between;\n  font:600 12px var(--sys); color:var(--ink); z-index:2; }\n.scroll { position:absolute; inset:0; padding-top:var(--sat); }\n\n/* masthead (MastheadView.swift) */\n.mh { padding:12px 24px 0; text-align:center; }\n.seal-row { display:flex; align-items:center; gap:12px; max-width:270px; margin:0 auto 12px; }\n.seal-row i { flex:1; height:1px; background:var(--gold); opacity:.75; }\n.seal { width:36px; height:36px; border-radius:50% 46% 52% 48%; background:radial-gradient(circle at 37% 30%, var(--waxLit), var(--wax) 55%, var(--waxDeep));\n  box-shadow: inset 0 0 0 4px rgba(102,35,29,.35); flex:none; }\n.title { font-family:var(--cochin); font-size:31px; line-height:1.15; letter-spacing:.22em; padding-left:.22em; text-transform:uppercase; }\n.house { font:10px var(--mono); letter-spacing:.26em; text-transform:uppercase; color:var(--inkSoft); margin-top:8px; }\n.divider { height:1px; background:var(--line); margin-top:12px; }\n.thirds { display:grid; grid-template-columns:1fr 1fr 1.7fr; margin-top:12px; }\n.third { display:flex; flex-direction:column; gap:4px; align-items:center; padding:0 4px; }\n.third + .third { border-left:1px solid var(--line); }\n.third span { font:10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--inkSoft); }\n.third b { font:700 13px var(--mono); color:var(--accent); }\n.third b em { font-style:normal; font-weight:400; color:var(--inkSoft); }\n.bar { height:8px; border-radius:4px; background:var(--line); margin-top:8px; overflow:hidden; }\n.bar i { display:block; height:100%; width:67%; background:var(--accent); border-radius:4px; }\n.count { font:10.5px var(--mono); color:var(--inkSoft); margin-top:8px; text-align:left; }\n.foot { display:flex; justify-content:space-between; margin-top:4px; font:700 10.5px var(--mono); color:var(--red); }\n.slot47 { height:47px; }\n\n/* stamped row (StampViews.swift StampedRow) */\n.stamped { padding:0 16px 16px; }\n.rule { height:1px; background:var(--line); }\n.rule.thin { opacity:.55; }\n.stamped .cells { display:flex; justify-content:flex-end; height:44px; }\n.stamped button { font:10px var(--mono); color:var(--inkSoft); background:none; border:0; border-left:1px solid var(--line); padding:0 12px; min-width:44px; min-height:44px; }\n\n/* package card (PackagesView.swift PackageRow) */\n.cards { padding:0 16px; display:flex; flex-direction:column; gap:8px; }\n.pkg { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px var(--shadow); overflow:hidden; }\n.pkg-head { display:flex; align-items:center; gap:8px; padding:12px 12px 0; }\n.pkg-head .who { flex:1; min-width:0; }\n.seller { font:700 15px var(--cochin); }\n.date, .oid { font:11px var(--mono); color:var(--inkSoft); }\n.oid { text-decoration:underline; min-height:45px; display:flex; align-items:center; padding:0 12px; }\n.pill { font:700 12.5px var(--cochin); color:var(--manilaInk); background:var(--manila); border-radius:999px; padding:4px 8px; }\n.stamp-slot { height:48px; display:flex; align-items:center; padding:0 12px; }\n.mini { font:13px var(--cochin); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:4px 10px; background:var(--paper); }\n.line { display:flex; align-items:flex-start; gap:8px; border-top:1px solid var(--line); padding:12px 12px 12px 4px; }\n.box { width:45px; height:21px; display:flex; justify-content:center; flex:none; }\n.box i { width:30px; height:30px; margin-top:-5px; border:1.5px solid var(--inkSoft); border-radius:6px; display:block; }\n.line .nm { flex:1; min-width:0; }\n.line .nm b { display:block; font:400 15px var(--cochin); }\n.line .nm span { font:11px var(--mono); color:var(--inkSoft); }\n.line .pr { font:12px var(--mono); color:var(--inkSoft); }\n\n/* Ledger tab (LedgerTab.swift; src/app.jsx mdl-lh, mdl-lg, mdl-lcard, LedgerRow) */\n.ledger { padding:0 16px 16px; }\n.lh { font:12px var(--mono); letter-spacing:3.6px; text-transform:uppercase; color:var(--inkSoft); text-align:center; }\n.lg { font:11px var(--mono); letter-spacing:2.2px; text-transform:uppercase; color:var(--inkSoft); padding:16px 0 8px 4px; }\n.lcard { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.lrow { min-height:52px; padding:8px 16px; display:flex; align-items:center; gap:12px; }\n.lrow + .lrow { border-top:1px solid var(--line); }\n.lrow .t { flex:1; min-width:0; }\n.lrow .t b { display:block; font:400 20px/1.15 var(--cochin); }\n.lrow .t span { font:13.5px var(--cochin); color:var(--inkSoft); }\n.lrow .v { font:14px var(--mono); color:var(--ink); white-space:nowrap; }\n.lrow .v i { font-style:normal; color:var(--accent); }\n.lrow .chev { font:22px var(--cochin); color:var(--inkSoft); width:10px; }\n.reset { margin-top:20px; }\n.reset .lrow b { color:var(--red); }\n\n/* head cells, from src/app.jsx before L11b (12e8721^): headCell, cellLab, cellVal, valUnder, cellFig */\n.heads { padding:0 16px; }\n.hgrid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); }\n.hcell { min-height:46px; padding:7px 9px 8px; display:flex; flex-direction:column; gap:3px; border-right:1px solid var(--line); min-width:0; }\n.hcell:last-child { border-right:0; }\n/* 11, not the old web 10: the Apple minimum text size is 11 pt (HIG accessibility, read 2026-11-08) */\n.hlab { font:11px var(--cochin); letter-spacing:.16em; text-transform:uppercase; color:var(--inkSoft); }\n.hval { font:15px/1.15 var(--cochin); color:var(--ink); display:flex; align-items:baseline; gap:4px; min-width:0; }\n.hval u { text-decoration:none; border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }\n.hval i { font-style:normal; font-size:10px; color:var(--inkSoft); flex:none; }\n.hval i.on { color:var(--accent); }\n.hfig { font:11px var(--cochin); color:var(--inkSoft); white-space:nowrap; }\n\n/* floating system tab bar, order Ledger, Orphaned, Tally, Packages (RootView.swift) */\n.tabbar { position:absolute; left:0; right:0; top:var(--bar-top); height:var(--bar-h); z-index:2; }\n.pillbar { margin:4px 20px 0; height:56px; border-radius:28px; background:rgba(252,246,234,.9); border:1px solid var(--line);\n  box-shadow:0 4px 16px rgba(51,46,63,.12); display:grid; grid-template-columns:repeat(4,1fr); padding:4px; }\n.tab { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:24px; color:var(--ink); font:600 10px var(--sys); }\n.tab .g { font-size:17px; line-height:1; }\n.tab.on { color:var(--accent); background:var(--card); box-shadow:inset 0 0 0 1px var(--line); }\n.home { position:absolute; left:50%; bottom:8px; width:134px; height:5px; margin-left:-67px; border-radius:3px; background:var(--ink); }\n\n/* ---- device: iPhone Duo, open (inner screen), 951 x 669 pt; fold strip 455.5 to 495.5 pt (duo-fold-and-keyboard) ---- */\n.open { position:relative; width:951px; height:669px; background:var(--paper); border:1px solid var(--ink); border-radius:16px; overflow:hidden; }\n.open .scroll { padding-top:var(--sat); }\n.foldstrip { position:absolute; top:0; bottom:0; left:455.5px; width:40px; z-index:1; pointer-events:none;\n  background:repeating-linear-gradient(135deg, rgba(51,46,63,.05) 0 6px, transparent 6px 12px); border-left:1px dashed var(--line); border-right:1px dashed var(--line); }\n.open .tabbar { left:495.5px; top:auto; bottom:0; height:80px; }\n.fit { width:100%; overflow-x:auto; }\n@media (prefers-reduced-motion: no-preference) { nav a, nav button { transition:border-color .15s; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cdiv class=\"banner\" role=\"note\">Sample. No figure, seller, card or date on this page is real.\u003c/div>\n  \u003ch1>Head cells on the working lists\u003c/h1>\n  \u003cp class=\"sub\">Orders from, Showing and Sorted by sit in a ruled row under the masthead on Packages and on Tally, as the record\n    ruled-head-masthead-vocabulary describes them. The Ledger tab keeps Data and Reset. On iPhone this row is new: no native list draws it today.\u003c/p>\n  \u003cnav aria-label=\"States\">\n    \u003ca href=\"#\" data-link=\"\">Both poses\u003c/a>\n    \u003ca href=\"#s=folded\" data-link=\"folded\">Folded\u003c/a>\n    \u003ca href=\"#s=unfolded\" data-link=\"unfolded\">Unfolded\u003c/a>\n    \u003cbutton type=\"button\" id=\"hide\" aria-pressed=\"false\">Hide this option\u003c/button>\n  \u003c/nav>\n  \u003cp class=\"gone-line\">This option is hidden. Press \"Hide this option\" again to show it.\u003c/p>\n\n  \u003csection data-state=\"folded\" aria-label=\"Folded\">\n    \u003cp class=\"pose\">Folded, outer screen, 466 pt wide\u003c/p>\n    \u003cdiv class=\"row\">\n      \u003cfigure>\n        \u003cdiv class=\"fold\" data-device=\"iphone-duo-folded\" aria-label=\"Packages tab, folded\">\n          \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n          \u003cdiv class=\"scroll\">\n            \u003cdiv class=\"mh\">\n              \u003cdiv class=\"seal-row\">\u003ci>\u003c/i>\u003cspan class=\"seal\">\u003c/span>\u003ci>\u003c/i>\u003c/div>\n              \u003cdiv class=\"title\">Manifest\u003c/div>\n              \u003cdiv class=\"house\">C.H Postal Company\u003c/div>\n              \u003cdiv class=\"divider\">\u003c/div>\n              \u003cdiv class=\"thirds\">\n                \u003cdiv class=\"third\">\u003cspan>cards\u003c/span>\u003cb>212\u003cem>/318\u003c/em>\u003c/b>\u003c/div>\n                \u003cdiv class=\"third\">\u003cspan>packages\u003c/span>\u003cb>19\u003cem>/42\u003c/em>\u003c/b>\u003c/div>\n                \u003cdiv class=\"third\">\u003cspan>value\u003c/span>\u003cb>$148\u003cem>/$231\u003c/em>\u003c/b>\u003c/div>\n              \u003c/div>\n              \u003cdiv class=\"bar\">\u003ci>\u003c/i>\u003c/div>\n              \u003cdiv class=\"count\">42 packages · autosaves\u003c/div>\n              \u003cdiv class=\"foot\">\u003cspan>106 still missing · $83.40\u003c/span>\u003               \u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"tabbar\">\u003cdiv class=\"pillbar\">\n            \u003cspan class=\"tab on\">\u003cspan class=\"g\">⚙\u003c/span>Ledger\u003c/span>\u003cspan class=\"tab\">\u003cspan class=\"g\">✉\u003c/span>Orphaned\u003c/span>\n            \u003cspan class=\"tab\">\u003cspan class=\"g\">#\u003c/span>Tally\u003c/span>\u003cspan class=\"tab\">\u003cspan class=\"g\">▣\u003c/span>Packages\u003c/span>\n          \u003c/div>\u003cspan class=\"home\">\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cfigcaption>\u003cb>Ledger.\u003c/b> No View group. The tab holds Data and Reset, as the native app draws it now.\u003c/figcaption>\n      \u003c/figure>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection data-state=\"unfolded\" aria-label=\"Unfolded\">\n    \u003cp class=\"pose\">Unfolded, inner screen, 951 pt wide\u003c/p>\n    \u003cfigure>\n      \u003cdiv class=\"fit\">\n      \u003cdiv class=\"open\" data-device=\"iphone-duo-unfolded\" aria-label=\"Packages tab, unfolded\">\n        \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n        \u003cdiv class=\"foldstrip\" aria-hidden=\"true\">\u003c/div>\n        \u003cdiv class=\"scroll\">\n          \u003cdiv class=\"mh\">\n            \u003cdiv class=\"seal-row\">\u003ci>\u003c/i>\u003cspan class=\"seal\">\u003c/span>\u003ci>\u003c/i>\u003c/div>\n            \u003cdiv class=\"title\">Manifest\u003c/div>\n            \u003cdiv class=\"house\">C.H Postal Company\u003c/div>\n            \u003cdiv class=\"divider\">\u003c/div>\n            \u003cdiv class=\"thirds\">\n              \u003cdiv class=\"third\">\u003cspan>cards\u003c/span>\u003cb>212\u003cem>/318\u003c/em>\u003c/b>\u003c/div>\n              \u003cdiv class=\"third\">\u003cspan>packages\u003c/span>\u003cb>19\u003cem>/42\u003c/em>\u003c/b>\u003c/div>\n              \u003cdiv class=\"third\">\u003cspan>value\u003c/span>\u003cb>$148\u003cem>/$231\u003c/em>\u003c/b>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"bar\">\u003ci>\u003c/i>\u003c/div>\n            \u003cdiv class=\"count\">42 packages · autosaves\u003c/div>\n            \u003cdiv class=\"foot\">\u003cspan>106 still missing · $83.40\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"slot47\">\u003c/div>\n          \u003cdiv class=\"heads mark new\">\u003cspan class=\"tag\" style=\"top:-12px\">New: head cells\u003c/span>\n            \u003cdiv class=\"rule\">\u003c/div>\n            \u003cdiv class=\"hgrid\">\n              \u003cdiv class=\"hcell\">\u003cspan class=\"hlab\">Orders from\u003c/span>\u003cspan class=\"hval\">\u003cu>All time\u003c/u>\u003ci>▾\u003c/i>\u003c/span>\u003cspan class=\"hfig\">214 lines\u003c/span>\u003c/div>\n              \u003cdiv class=\"hcell\">\u003cspan class=\"hlab\">Showing\u003c/span>\u003cspan class=\"hval\">\u003ci class=\"on\">●\u003c/i>\u003cu style=\"border:0\">Unreceived\u003c/u>\u003c/span>\u003c/div>\n              \u003cdiv class=\"hcell\">\u003cspan class=\"hlab\">Sorted by\u003c/span>\u003cspan class=\"hval\">\u003cu>Newest\u003c/u>\u003ci>▾\u003c/i>\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"stamped\">\n            \u003cdiv class=\"rule\">\u003c/div>\n            \u003cdiv class=\"cells\">\u003cbutton type=\"button\">2 stamped ○\u003c/button>\u003c/div>\n            \u003cdiv class=\"rule thin\">\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"cards\">\n            \u003cdiv class=\"pkg\">\n              \u003cdiv class=\"pkg-head\">\u003cdiv class=\"who\">\u003cdiv class=\"seller\">Pinewood Games\u003c/div>\u003cdiv class=\"date\">2026-10-29\u003c/div>\u003c/div>\u003cspan class=\"pill\">3 left\u003c/span>\u003c/div>\n              \u003cdiv class=\"oid\">5A1C0E-7D2B-4F\u003c/div>\n              \u003cdiv class=\"stamp-slot\">\u003cspan class=\"mini\">Stamp\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"tabbar\">\u003cdiv class=\"pillbar\">\n          \u003cspan class=\"tab\">\u003cspan class=\"g\">⚙\u003c/span>Ledger\u003c/span>\u003cspan class=\"tab\">\u003cspan class=\"g\">✉\u003c/span>Orphaned\u003c/span>\n          \u003cspan class=\"tab\">\u003cspan class=\"g\">#\u003c/span>Tally\u003c/span>\u003cspan class=\"tab on\">\u003cspan class=\"g\">▣\u003c/span>Packages\u003c/span>\n        \u003c/div>\u003c/div>\n      \u003c/div>\n      \u003c/div>\n      \u003cfigcaption>\u003cb>Packages, open.\u003c/b> The Packages tab does not spread over two pages (DuoSpread.spreads), so one page runs across the fold. The bar sits under the right page (DuoSpine.swift).\u003c/figcaption>\n    \u003c/figure>\n  \u003c/section>\n\u003c/main>\n\u003cscript>\n(function () {\n  function state() { var m = /(?:^|[#&])s=([\\w-]+)/.exec(location.hash); return m ? m[1] : \"\"; }\n  function draw() {\n    var s = state();\n    document.querySelectorAll(\"section[data-state]\").forEach(function (el) { el.hidden = !!s && el.dataset.state !== s; });\n    document.querySelectorAll(\"nav a[data-link]\").forEach(function (a) { a.setAttribute(\"aria-current\", String(a.dataset.link === s)); });\n  }\n  window.addEventListener(\"hashchange\", draw);\n  draw();\n  var hide = document.getElementById(\"hide\");\n  hide.addEventListener(\"click\", function () {\n    var on = document.body.classList.toggle(\"gone\");\n    hide.setAttribute(\"aria-pressed\", String(on));\n  });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "d39-a": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=466, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Stamp editor: keep both\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json. The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832; --green:#2E7A5E;\n  --cochin: Cochin, Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Top inset: unmeasured on the Duo outer screen. Drawn at the 20 pt floor the Duo mockups use. */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --sab: env(safe-area-inset-bottom, 0px);\n  --today:#A8443C; --new:#2E7A5E;\n  color-scheme: light;\n}\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); }\nbody { width:466px; color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:13px; line-height:1.35; }\n.banner { background:var(--manila); color:var(--manilaInk); padding:8px 12px; font-weight:600; font-size:13px; }\n.banner small { display:block; font-weight:400; }\n\n/* Device: iPhone Duo, folded (outer screen), 466 x 678 pt, 1 CSS px = 1 pt (measurement duo-fold-and-keyboard). */\n.frame { position:relative; width:466px; height:678px; overflow:hidden; background:var(--paper);\n  border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.frame[hidden] { display:none; }\n.status { height:var(--sat); display:flex; justify-content:space-between; align-items:center; padding:0 24px;\n  font-size:12px; font-weight:600; }\n\n/* Masthead: simplified, not under decision. */\n.mast { padding:12px 24px 10px; display:flex; align-items:center; gap:10px; }\n.seal { width:30px; height:30px; border-radius:50%; background:var(--red); flex:none; }\n.mast .name { font-family:var(--cochin); font-size:26px; font-weight:700; letter-spacing:0.5px; }\n.mast .fig { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--inkSoft); }\n.slot { height:47px; } /* the running-head slot: 46 pt head and its 1 pt rule, empty until pinned */\n\n/* The ruled row: StampedRow (native/Manifest/StampViews.swift). */\n.ruled { padding:0 16px 16px; }\n.ruled .rule { height:1px; background:var(--line); }\n.ruled .rule.thin { opacity:0.55; }\n.ruled .row { display:flex; justify-content:flex-end; height:44px; }\n.cell { position:relative; display:flex; align-items:center; gap:4px; min-width:44px; min-height:44px; padding:0 12px;\n  font-family:var(--mono); font-size:10px; color:var(--inkSoft); border-left:1px solid var(--line); white-space:nowrap; }\n.cell.on { color:var(--ink); }\n.cell.on .g { color:var(--accent); }\n\n/* The package card: PackageRow (native/Manifest/PackagesView.swift). */\n.list { padding:0 16px; display:flex; flex-direction:column; gap:8px; }\n.card { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px rgba(28,43,36,0.06); }\n.head { display:flex; align-items:center; gap:8px; padding:12px 12px 8px; }\n.head .who { flex:1; min-width:0; }\n.seller { font-family:var(--cochin); font-size:15px; font-weight:700; }\n.date { font-family:var(--mono); font-size:11px; color:var(--inkSoft); }\n.pill { font-family:var(--cochin); font-size:12.5px; font-weight:700; padding:4px 8px; min-height:28px; display:flex; align-items:center;\n  border:1px solid var(--line); border-radius:14px; color:var(--ink); }\n\n/* The stamp editor: StampSection.editor. */\n.editor { padding:0 12px 12px; }\n.ehead { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-family:var(--mono); font-size:10px; letter-spacing:1.6px; color:var(--inkSoft); }\n.ehead i { flex:1; height:1px; background:var(--line); }\n.chips { display:flex; flex-wrap:wrap; column-gap:4px; row-gap:12px; }\n.chip { font-family:var(--mono); font-size:11.5px; height:34px; padding:0 8px; display:flex; align-items:center; white-space:nowrap;\n  background:var(--card); color:var(--ink); border:1px solid var(--line); }\n.chip.on { background:var(--accent); color:var(--card); border-color:var(--accent); }\n.notebox { position:relative; margin-top:12px; min-height:44px; padding:0 12px; display:flex; align-items:cen  flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#8A8590; }\n.tab b { width:24px; height:22px; border-radius:6px; background:#B9B4BD; }\n.tab.cur { color:var(--accent); } .tab.cur b { background:var(--accent); }\n\n/* Labels: dashed, out of layout, so a label moves nothing it marks. */\n.tag { position:absolute; inset:-3px; border:1.5px dashed var(--today); border-radius:6px; pointer-events:none; }\n.tag.new { border-color:var(--new); }\n.tag span { position:absolute; left:6px; top:-9px; background:var(--paper); color:var(--today); font:600 10px/14px var(--mono); padding:0 4px; white-space:nowrap; }\n.tag.new span { color:var(--new); }\n.tag.right span { left:auto; right:6px; }\n.tag.below span { top:auto; bottom:-9px; background:var(--card); }\n.empty { position:relative; height:120px; margin-top:12px; }\n#stamp-choice, #stamp-choice-tap, #stamp-choice-open { position:relative; padding-top:8px; }\n\n/* Device: iPhone Duo, open (inner screen), 951 x 669 pt; fold strip 455.5 to 495.5 pt (duo-fold-and-keyboard). */\n.open { position:relative; width:951px; height:669px; overflow:hidden; background:var(--paper); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.open[hidden] { display:none; }\n.open .pg { position:absolute; top:0; bottom:0; width:455.5px; overflow:hidden; }\n.open .pg.l { left:0; } .open .pg.r { left:495.5px; }\n.open .strip { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); }\n.open .tabs { top:586px; }\n.open .rnote { margin:120px 24px 0; padding:12px; border:1.5px dashed var(--line); border-radius:6px; font:11px/1.4 var(--mono); color:var(--inkSoft); }\n\n.cap { padding:12px; }\n.cap b { font-family:var(--cochin); font-size:17px; display:block; margin-bottom:4px; }\n.cap p { margin:0 0 6px; max-width:60ch; }\n.cap nav { display:flex; gap:8px; margin-top:8px; }\n.cap nav a { min-height:44px; display:inline-flex; align-items:center; padding:0 12px; border:1px solid var(--line); border-radius:8px;\n  background:var(--card); color:var(--ink); text-decoration:none; font-size:13px; }\n.cap nav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\n.cap nav a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"banner\">Sample\u003csmall>No figure, seller or note on this page is real. Seller and cards come from the test fixture.\u003c/small>\u003c/div>\n\n\u003c!-- State: the editor open on a first stamp, with nothing stamped yet. -->\n\u003csection class=\"frame\" data-device=\"iphone-duo-folded\" data-state=\"editor\" aria-label=\"Packages, stamp editor open\">\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n  \u003cheader class=\"mast\">\u003cspan class=\"seal\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"name\">Manifest\u003c/span>\u003cspan class=\"fig\">4 left · $4.00\u003c/span>\u003c/header>\n  \u003cdiv class=\"slot\">\u003c/div>\n\n  \u003cdiv id=\"stamp-choice\">\n    \u003cdiv class=\"ruled\">\n      \u003cdiv class=\"rule\">\u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"cell\" aria-disabled=\"true\">0 stamped \u003cspan class=\"g\">○\u003c/span>\n          \u003cspan class=\"tag right\">\u003cspan>Today: 0 stamped, disabled\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"rule thin\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"list\">\n      \u003carticle class=\"card\">\n        \u003cdiv class=\"head\">\n          \u003cdiv class=\"who\">\u003cdiv class=\"seller\">Beta Games\u003c/div>\u003cdiv class=\"date\">2026-07-29\u003c/div>\u003c/div>\n          \u003cdiv class=\"pill\">4 left · $4.00\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"editor\">\n          \u003cdiv class=\"ehead\">STAMP\u003ci>\u003c/i>\u003c/div>\n 2 · Test Set · Near Mint\u003c/div>\u003c/div>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cdiv class=\"txt\">\u003cdiv class=\"top\">\u003cspan class=\"nm\">Counterspell\u003c/span>\u003cspan class=\"pr\">$2.00\u003c/span>\u003c/div>\u003cdiv class=\"dt\">Test Set · Near Mint\u003c/div>\u003c/div>\u003c/div>\n      \u003c/article>\n    \u003c/div>\n  \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"strip\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv class=\"pg r\">\u003cdiv class=\"status\">\u003cspan>\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\u003cp class=\"rnote\">Right page: not drawn. The open Duo's Packages page belongs to item 35.\u003c/p>\u003c/div>\n  \u003cnav class=\"tabs\" aria-label=\"Tabs\">\n    \u003cspan class=\"tab cur\">\u003cb>\u003c/b>Packages\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Tally\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Orphaned\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Ledger\u003c/span>\n  \u003c/nav>\n\u003c/section>\n\n\u003cdiv class=\"cap\">\n  \u003cb>Keep both\u003c/b>\n  \u003cp>The note field reserves two lines, so a long note wraps in view. Its box is 44 pt tall, and a tap anywhere in it starts typing.\u003c/p>\n  \u003cp>With nothing stamped, \"0 stamped\" stays in place but does not respond. It is drawn in the same colours as an active cell. VoiceOver reads it as dimmed, with \"No package carries a stamp yet.\"\u003c/p>\n  \u003cnav aria-label=\"States\">\n    \u003ca href=\"#s=editor\" data-s=\"editor\">Editor open\u003c/a>\n    \u003ca href=\"#s=tap-cell\" data-s=\"tap-cell\">After a tap on 0 stamped\u003c/a>\n    \u003ca href=\"#s=unfolded\" data-s=\"unfolded\">Unfolded\u003c/a>\n  \u003c/nav>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  function show() {\n    var m = /(?:^|[#&])s=([\\w-]+)/.exec(location.hash);\n    var s = m ? m[1] : \"editor\";\n    var frames = document.querySelectorAll(\"[data-state]\");\n    var found = false;\n    frames.forEach(function (f) { if (f.dataset.state === s) found = true; });\n    if (!found) s = \"editor\";\n    frames.forEach(function (f) { f.hidden = f.dataset.state !== s; });\n    document.querySelectorAll(\".cap nav a\").forEach(function (a) { a.setAttribute(\"aria-current\", String(a.dataset.s === s)); });\n  }\n  window.addEventListener(\"hashchange\", show);\n  show();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "d39-b": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=466, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Stamp editor: match the mockup\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json. The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832; --green:#2E7A5E;\n  --cochin: Cochin, Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Top inset: unmeasured on the Duo outer screen. Drawn at the 20 pt floor the Duo mockups use. */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --sab: env(safe-area-inset-bottom, 0px);\n  --today:#A8443C; --new:#2E7A5E;\n  color-scheme: light;\n}\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); }\nbody { width:466px; color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:13px; line-height:1.35; }\n.banner { background:var(--manila); color:var(--manilaInk); padding:8px 12px; font-weight:600; font-size:13px; }\n.banner small { display:block; font-weight:400; }\n\n/* Device: iPhone Duo, folded (outer screen), 466 x 678 pt, 1 CSS px = 1 pt (measurement duo-fold-and-keyboard). */\n.frame { position:relative; width:466px; height:678px; overflow:hidden; background:var(--paper);\n  border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.frame[hidden] { display:none; }\n.status { height:var(--sat); display:flex; justify-content:space-between; align-items:center; padding:0 24px;\n  font-size:12px; font-weight:600; }\n\n/* Masthead: simplified, not under decision. */\n.mast { padding:12px 24px 10px; display:flex; align-items:center; gap:10px; }\n.seal { width:30px; height:30px; border-radius:50%; background:var(--red); flex:none; }\n.mast .name { font-family:var(--cochin); font-size:26px; font-weight:700; letter-spacing:0.5px; }\n.mast .fig { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--inkSoft); }\n.slot { height:47px; } /* the running-head slot: 46 pt head and its 1 pt rule, empty until pinned */\n\n/* The ruled row: StampedRow (native/Manifest/StampViews.swift). */\n.ruled { padding:0 16px 16px; }\n.ruled .rule { height:1px; background:var(--line); }\n.ruled .rule.thin { opacity:0.55; }\n.ruled .row { display:flex; justify-content:flex-end; height:44px; }\n.cell { position:relative; display:flex; align-items:center; gap:4px; min-width:44px; min-height:44px; padding:0 12px;\n  font-family:var(--mono); font-size:10px; color:var(--inkSoft); border-left:1px solid var(--line); white-space:nowrap; }\n.cell.on { color:var(--ink); }\n.cell.on .g { color:var(--accent); }\n\n/* The package card: PackageRow (native/Manifest/PackagesView.swift). */\n.list { padding:0 16px; display:flex; flex-direction:column; gap:8px; }\n.card { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px rgba(28,43,36,0.06); }\n.head { display:flex; align-items:center; gap:8px; padding:12px 12px 8px; }\n.head .who { flex:1; min-width:0; }\n.seller { font-family:var(--cochin); font-size:15px; font-weight:700; }\n.date { font-family:var(--mono); font-size:11px; color:var(--inkSoft); }\n.pill { font-family:var(--cochin); font-size:12.5px; font-weight:700; padding:4px 8px; min-height:28px; display:flex; align-items:center;\n  border:1px solid var(--line); border-radius:14px; color:var(--ink); }\n\n/* The stamp editor: StampSection.editor. */\n.editor { padding:0 12px 12px; }\n.ehead { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-family:var(--mono); font-size:10px; letter-spacing:1.6px; color:var(--inkSoft); }\n.ehead i { flex:1; height:1px; background:var(--line); }\n.chips { display:flex; flex-wrap:wrap; column-gap:4px; row-gap:12px; }\n.chip { font-family:var(--mono); font-size:11.5px; height:34px; padding:0 8px; display:flex; align-items:center; white-space:nowrap;\n  background:var(--card); color:var(--ink); border:1px solid var(--line); }\n.chip.on { background:var(--accent); color:var(--card); border-color:var(--accent); }\n.notebox { position:relative; margin-top:12px; min-height:44px; padding:0 12px; display:flex; align-items:center;\n  background:var(--card); border:1px solid var(--line); border-radius:8px; }\n.note { font-family:var(--cochin); font-size:16px; line-height:18.35px; color:var(--ink); width:100%; }\n/* Two-line field (lineLimit(2...6)): it reserves two 18.35 pt lines, 36.7 pt, and wraps. */\n.note.two { min-height:36.7px; }\n/* One-line field: one 18.35 pt line; text past the edge is cut, as a UITextField scrolls. */\n.note.one { height:18.35px; white-space:nowrap; overflow:hidden; }\n.btns { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }\n.btn { min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; }\n.mini { font-family:var(--mono); font-size:11.5px; padding:8px 12px; border:1px solid var(--line); border-radius:5px; background:var(--card); color:var(--ink); }\n.mini.save { font-weight:700; background:var(--ink); border-color:var(--ink); color:var(--card); }\n\n/* Item lines: ItemLine (native/Manifest/ItemLine.swift). */\n.line { display:flex; gap:8px; padding:12px 12px 12px 4px; border-top:1px solid var(--line); }\n.box { width:45px; height:45px; flex:none; display:grid; place-items:center; margin-top:-6px; }\n.box i { width:34px; height:34px; border:1px solid var(--line); background:var(--card); border-radius:4px; }\n.txt { flex:1; }\n.txt .top { display:flex; justify-content:space-between; gap:8px; }\n.nm { font-family:var(--cochin); font-size:14px; font-weight:600; }\n.pr { font-family:var(--mono); font-size:12px; color:var(--inkSoft); }\n.dt { font-family:var(--cochin); font-size:11.5px; color:var(--inkSoft); }\n\n/* The system tab bar: starts at y 595 pt, 83 pt tall with the bottom inset (duo-fold-and-keyboard). iOS chrome greys. */\n.tabs { position:absolute; left:0; right:0; top:595px; height:83px; padding-bottom:var(--sab);\n  background:rgba(242,233,218,0.96); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding-top:6px; }\n.tab { min-width:64px; min-height:44px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10px; color:#8A8590; }\n.tab b { width:24px; height:22px; border-radius:6px; background:#B9B4BD; }\n.tab.cur { color:var(--accent); } .tab.cur b { background:var(--accent); }\n\n/* Labels: dashed, out of layout, so a label moves nothing it marks. */\n.tag { position:absolute; inset:-3px; border:1.5px dashed var(--today); border-radius:6px; pointer-events:none; }\n.tag.new { border-color:var(--new); }\n.tag span { position:absolute; left:6px; top:-9px; background:var(--paper); color:var(--today); font:600 10px/14px var(--mono); padding:0 4px; white-space:nowrap; }\n.tag.new span { color:var(--new); }\n.tag.right span { left:auto; right:6px; }\n.tag.below span { top:auto; bottom:-9px; background:var(--card); }\n.empty { position:relative; height:120px; margin-top:12px; }\n#stamp-choice, #stamp-choice-tap, #stamp-choice-open { position:relative; padding-top:8px; }\n\n/* Device: iPhone Duo, open (inner screen), 951 x 669 pt; fold strip 455.5 to 495.5 pt (duo-fold-and-keyboard). */\n.open { position:relative; width:951px; height:669px; overflow:hidden; background:var(--paper); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.open[hidden] { display:none; }\n.open .pg { position:absolute; top:0; bottom:0; width:455.5px; overflow:hidden; }\n.open .pg.l { left:0; } .open .pg.r { left:495.5px; }\n.open .strip { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); }\n.open .tabs { top:586px; }\n.open .rnote { margin:120px 24px 0; padding:12px; border:1.5px dashed var(--line); border-radius:6px; font:11px/1.4 var(--mono); color:var(--inkSoft); }\n\n.cap { padding:12px; }\n.cap b { font-family:var(--cochin); font-size:17px; display:block; margin-bottom:4px; }\n.cap p { margin:0 0 6px; max-width:60ch; }\n.cap nav { display:flex; gap:8px; margin-top:8px; }\n.cap nav a { min-height:44px; display:inline-flex; align-items:center; padding:0 12px; border:1px solid var(--line); border-radius:8px;\n  background:var(--card); color:var(--ink); text-decoration:none; font-size:13px; }\n.cap nav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\n.cap nav a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"banner\">Sample\u003csmall>No figure, seller or note on this page is real. Seller and cards come from the test fixture.\u003c/small>\u003c/div>\n\n\u003c!-- State: the editor open on a first stamp, with nothing stamped yet. -->\n\u003csection class=\"frame\" data-device=\"iphone-duo-folded\" data-state=\"editor\" aria-label=\"Packages, stamp editor open\">\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n  \u003cheader class=\"mast\">\u003cspan class=\"seal\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"name\">Manifest\u003c/span>\u003cspan class=\"fig\">4 left · $4.00\u003c/span>\u003c/header>\n  \u003cdiv class=\"slot\">\u003c/div>\n\n  \u003cdiv id=\"stamp-choice\">\n    \u003cdiv class=\"ruled\">\n      \u003cdiv class=
