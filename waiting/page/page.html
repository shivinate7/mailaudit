cr .line.held { background:#F2E7CF; border-radius:8px; padding:0 8px; margin:0 -8px; }\n.scr .step { display:inline-flex; align-items:center; gap:4px; } .scr .step .n { min-width:44px; text-align:center; font-size:18px; }\n.scr .owed { margin:0; font-size:16px; }\n.scr .box { border:1px solid var(--line); border-radius:8px; padding:12px; background:var(--paper); display:flex; flex-direction:column; gap:8px; }\n.scr .box.link { flex-direction:row; align-items:center; justify-content:space-between; gap:12px; }\n.scr .tie { display:grid; grid-template-columns:1fr 1fr; gap:12px; }\n.scr .tie > div { border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; }\n.scr .mini { display:flex; justify-content:space-between; gap:8px; font-size:14px; border-bottom:1px solid var(--line); min-height:28px; align-items:center; }\n.scr .nt { font-size:14px; color:var(--inkSoft); margin:0; }\n.scr .big { font:96px/1 var(--mono); }\n.scr .pt { display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:8px 0; border-bottom:1px solid var(--line); align-items:center; }\n.scr .pt > div:first-child { display:flex; flex-direction:column; gap:4px; min-width:0; }\n.scr .pt .nm { display:flex; justify-content:space-between; gap:8px; font-size:17px; }\n.scr .stamp { grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:44px; padding-left:12px; border-left:3px solid var(--inkSoft); }\n.scr .cell { display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:52px; border-bottom:1px solid var(--line); }\n.scr .cell.sel { background:rgba(111,92,166,.08); border-radius:8px; padding:0 8px; margin:0 -8px; }\n.scr .wide-col { position:absolute; top:0; bottom:0; left:235px; width:480px; padding:16px 24px; display:flex; flex-direction:column; gap:12px; border-inline:1px solid var(--line); }\n\n.sources h2 { font-size:20px; font-weight:400; margin:0 0 var(--space-2); }\n.sources ul { margin:0; padding-left:20px; max-width:90ch; font-size:15px; display:flex; flex-direction:column; gap:var(--space-1); }\ncode { font:13px/1.4 var(--mono); overflow-wrap:anywhere; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\" role=\"note\">Sample. No figure on this page is real. The screens redraw PR 144's own sample mail day (Tue 27 Oct, 8 invented sellers), and its card names, counts and dollar figures are invented.\u003c/div>\n\u003ch1>The Card in Hand design page, on main or archived\u003c/h1>\n\u003cp class=\"sub\">Waiting item 51. Draft PR 144 holds the iPhone Duo round 2 design page for Card in Hand. Code, tests and debts on main cite it, but it never merged. Each state below shows the repo after one option. The red marks show where a later ruling overrides the page.\u003c/p>\n\n\u003cdiv class=\"navs\">\n\u003cnav aria-label=\"Option\">\n  \u003cspan class=\"lab\">Option\u003c/span>\n  \u003ca href=\"#s=merge\" data-k=\"s\" data-v=\"merge\">Merge it as a reference page\u003c/a>\n  \u003ca href=\"#s=archive\" data-k=\"s\" data-v=\"archive\">Archive it, re-point the citations\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Theme\">\n  \u003cspan class=\"lab\">Theme\u003c/span>\n  \u003ca href=\"#t=light\" data-k=\"t\" data-v=\"light\">Light\u003c/a>\n  \u003ca href=\"#t=dark\" data-k=\"t\" data-v=\"dark\">Dark\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Hide\">\n  \u003cspan class=\"lab\">Hide\u003c/span>\n  \u003cbutton type=\"button\" data-hide=\"merge\" aria-pressed=\"false\">Merge it\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"archive\" aria-pressed=\"false\">Archive it\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"extra\" aria-pressed=\"false\">Other differences\u003c/button>\n\u003c/nav>\n\u003c/div>\n\n\u003c!-- ============ merge ============ -->\n\u003csection data-state=\"merge\" id=\"opt-merge\">\n  \u003cdiv class=\"shown\">This option is hidden. \u003cbutton type=\"button\" data-show=\"merge\">Show it\u003c/button>\u003c/div>\n  \u003cdiv class=\"optline\">\n    \u003ch2>Merge it as a reference page\u003c/h2>\n    \u003cp>PR 144 merges as it is, docs only, with one note added at the top of the page. The citations on main then open a real file.\u003c/p>\n    \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: no duo-card-in-hand folder on main\u003c/span>\u003cspan class=\"tag new\">New: the page on main\u003c/span>\u003cspan class=\"tag new\">New: an override note at its top\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"repo\" id=\"merge-main\">\n    \u003cdiv class=\"path\">\u003cb>docs/design/duo-card-in-hand/index.html\u003c/b>\u003cspan>main, after the merge\u003c/span>\u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cdiv class=\"note\" id=\"merge-note\">\n        \u003ch3>Later rulings override five parts of this page\u003c/h3>\n        \u003col>\n          \u003cli>\u003cb>Screens 1, 2, 3, 10 and 11, the match list's place.\u003c/b> Invariant \u003ccode>no-layout-shift-under-pointer\u003c/code> (not the owner): the list sits below This envelope and New envelope.\u003c/li>\n          \u003cli>\u003cb>The same screens, a tapped match.\u003c/b> Item 48 (owner, 2026-11-07 18:35 CST): after a tap every row holds its place. The tapped row is bold with an accent bar, not an outlined box, and the others stay in soft ink.\u003c/li>\n          \u003cli>\u003cb>Screen 3, Suspense at the end of the day.\u003c/b> Item 27 (default, not owner, 2026-10-27 15:34 CDT): held cards stay on the Suspense line. They do not move to Orphaned.\u003c/li>\n          \u003cli>\u003cb>Screen 4, the Lost stamp.\u003c/b> Item 25 (deferred, 2026-10-27 15:34 CDT): no Lost kind. The built row offers Claim filed, Refunded and More.\u003c/li>\n          \u003cli>\u003cb>Screen 9, Ledger.\u003c/b> Item 24 (owner, 2026-10-27 14:26 CDT): Ledger stays full width. Tally and Orphaned spread as drawn.\u003c/li>\n        \u003c/ol>\n        \u003cp>The ruling's home is decision \u003ccode>duo-card-in-hand\u003c/code>. Where this page and that record differ, the record wins.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"extra\">\n        \u003ch3>Not in the note yet: other records that also differ\u003c/h3>\n        \u003cul>\n          \u003cli>Screen 10, keys: item 22 (owner, provisional, 2026-10-27 14:26 CDT) builds the system keys across both pages, with no in-app key pad.\u003c/li>\n          \u003cli>Screens 2 and 3, the Suspense box: it sits below the matches, not above This envelope (default, not owner).\u003c/li>\n          \u003cli>Screen 2, the Post offer: built under the sender and date, above the lines. Item 42 asks about it and is open.\u003c/li>\n          \u003cli>Screen 1, the entry: Card in Hand opens from a control on Packages, not as the Packages tab. Item 35 asks about it and is open.\u003c/li>\n        \u003c/ul>\n        \u003cp class=\"lede\">\u003cspan class=\"tag new\">New: designer's addition, not in item 51\u003c/span>\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"code\">\n        \u003cdiv class=\"cite\">\u003cdiv class=\"f\">native/Manifest/HandScreen.swift:4-5, unchanged\u003c/div>\n          \u003cpre class=\"keep\">// Card in Hand on the open iPhone Duo (duo-card-in-hand, new-envelope-ends-an-envelope; mockup poses 1, 2 and 4 of\n// docs/design/duo-card-in-hand on origin/design/duo-round2). The query and the held cards sit on the left page, the\u003c/pre>\u003c/div>\n        \u003cp class=\"lede ok\">This path now opens on main. DuoHandUITests.swift:2 and debt \u003ccode>duo-hand-mockup-gaps\u003c/code> resolve the same way.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"gallery\" id=\"merge-gallery\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- ============ archive ============ -->\n\u003csection data-state=\"archive\" id=\"opt-archive\">\n  \u003cdiv class=\"shown\">This option is hidden. \u003cbutton type=\"button\" data-show=\"archive\">Show it\u003c/button>\u003c/div>\n  \u003cdiv class=\"optline\">\n    \u003ch2>Archive it and re-point the citations\u003c/h2>\n    \u003cp>The branch moves to an archive name and PR 144 closes. Main never holds the page. Each citation names the archive branch instead.\u003c/p>\n    \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: the page lives on design/duo-round2, draft PR 144\u003c/span>\u003cspan class=\"tag new\">New: branch archive/design/duo-round2, PR closed\u003c/span>\u003cspan class=\"tag new\">New: re-pointed citations\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"repo\" id=\"archive-main\">\n    \u003cdiv class=\"path\">\u003cb>docs/design/duo-card-in-hand/\u003c/b>\u003cspan>main, after the archive\u003c/span>\u003c/div>\n    \u003cdiv class=\"sheet\">\n      \u003cdiv class=\"missing\">\u003cb>Not on main\u003c/b>\u003cspan>The folder stays absent. The page is kept only on archive/design/duo-round2, with no override note.\u003c/span>\u003c/div>\n      \u003cdiv class=\"code\">\n        \u003cdiv class=\"cite\">\u003cdiv class=\"f\">native/Manifest/HandScreen.swift:5\u003c/div>\n          \u003cpre class=\"del\">// docs/design/duo-card-in-hand on origin/design/duo-round2). The query and the held cards sit on the left page, the\u003c/pre>\n          \u003cpre class=\"add\">// docs/design/duo-card-in-hand on origin/archive/design/duo-round2). The query and the held cards sit on the left page, the\u003c/pre>\u003c/div>\n        \u003cdiv class=\"cite\">\u003cdiv class=\"f\">native/ManifestUITests/DuoHandUITests.swift:2\u003c/div>\n          \u003cpre class=\"del\">// poses 1, 2, 4 and 6 of docs/design/duo-card-in-hand on origin/design/duo-round2). The model is HandModel and\u003c/pre>\n          \u003cpre class=\"add\">// poses 1, 2, 4 and 6 of docs/design/duo-card-in-hand on origin/archive/design/duo-round2). The model is HandModel and\u003c/pre>\u003c/div>\n        \u003cdiv class=\"cite\">\u003cdiv class=\"f\">debt duo-hand-mockup-gaps, line 3; decision duo-card-in-hand, status line\u003c/div>\n          \u003cpre class=\"del\">PR 144, the Duo round 2 design pull request\u003c/pre>\n          \u003cpre class=\"add\">the Duo round 2 design, kept on branch archive/design/duo-round2 (PR 144, closed)\u003c/pre>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"gallery archived\" id=\"archive-gallery\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003chr style=\"border:0;border-top:1px solid var(--line);width:100%;margin:0\">\n\u003csection class=\"sources\" aria-label=\"Sizes and sources\">\n  \u003ch2>Sizes and sources\u003c/h2>\n  \u003cul>\n    \u003cli>Drawn at 390 px wide, the waiting page's default width: \u003ccode>layout.py devices\u003c/code> prints \u003ccode>unknown\u003c/code> for this repo. The page reflows up to 1040 px.\u003c/li>\n    \u003cli>Themes: the chrome follows light and dark from \u003ccode>shared/tokens.json\u003c/code>. The redrawn screens stay light, because PR 144 drew light only.\u003c/li>\n    \u003cli>Screens: redrawn from \u003ccode>docs/design/duo-card-in-hand/index.html\u003c/code> on design/duo-round2 at 441b4e4, read 2026-11-18. Its CSS and sample data are kept. Its option captions are renamed, so no letter names an option here.\u003c/li>\n    \u003cli>Overrides: decision \u003ccode>duo-card-in-hand\u003c/code> (sections Ruled, Deferred and default answers, Defaults). The built stamp row: \u003ccode>PastTransitRowView\u003c/code> in native/Manifest/HandScreen.swift shows the first two of \u003ccode>STAMP_KINDS\u003c/code> (src/view-rules.mjs) and a More menu.\u003c/li>\n    \u003cli>Deep links: \u003ccode>#s=merge\u003c/code>, \u003ccode>#s=archive\u003c/code>, \u003ccode>#s=merge&amp;t=dark\u003c/code>, \u003ccode>#s=archive&amp;t=dark\u003c/code>, \u003ccode>#hide=extra\u003c/code>.\u003c/li>\n  \u003c/ul>\n\u003c/section>\n\u003c/main>\n\n\u003ctemplate id=\"mailL\">\n  \u003cdiv class=\"hd\">\u003cspan>Mail da ">\u003c/div>\u003c/section>\n      \u003cdiv class=\"fold\">\u003c/div>\n      \u003csection class=\"pg r baron\">\u003cdiv data-use=\"kestrelR\">\u003c/div>\u003cdiv data-bar=\"Packages\">\u003c/div>\u003c/section>\n    \u003c/div>\u003c/div>\u003cfigcaption>Inner screen 951×669 pt. On the open Duo the page makes this the Packages tab.\u003c/figcaption>\u003c/figure>\u003c/div>\n    \u003cdiv class=\"mark\">\u003cb>Invariant\u003c/b> The match list moves below This envelope and New envelope. \u003cb>Item 48\u003c/b> A tapped match turns bold with an accent bar, and the list holds still.\u003c/div>\n    \u003cdiv class=\"xmark\">\u003cb>Item 35, open\u003c/b> The build opens Card in Hand from a control on Packages instead of making it the tab.\u003c/div>\n  \u003c/article>\n\n  \u003carticle class=\"pose\">\n    \u003ch4>2. A stray\u003c/h4>\n    \u003cp class=\"cap\">A name in two open envelopes waits on the Suspense line, not checked in. The two envelopes show as a tie. The next card from the same envelope decides it, and the app offers to post the held cards. It never posts by itself.\u003c/p>\n    \u003cdiv class=\"frames\">\n      \u003cfigure>\u003cdiv class=\"fit\">\u003cdiv class=\"dev scr inner\">\n        \u003csection class=\"pg l kbon\">\n          \u003cdiv class=\"hd\">\u003cspan>Mail day · Tue 27 Oct\u003c/span>\u003cspan class=\"n\">31 in · 27 out\u003c/span>\u003c/div>\n          \u003cdiv class=\"q\">\u003cb>FELLW\u003c/b>\u003cspan class=\"x\">×\u003c/span>\u003c/div>\n          \u003cdiv class=\"hits ovr\">\u003cdiv class=\"hitrow on\">\u003cdiv>Fellwar Stone\u003csmall>Dominaria · NM · in 2 open envelopes\u003c/small>\u003c/div>\u003cspan class=\"btn\">Hold\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"susp xo\">\u003cspan class=\"k\">Suspense\u003c/span>\u003cspan>Beast Within\u003c/span>\u003csmall>Fits 2 envelopes. Not checked in.\u003c/small>\u003c/div>\n          \u003cdiv class=\"hand\">\u003cdiv>\u003cspan class=\"k\">This envelope\u003c/span>\u003cspan class=\"soft\">Nothing checked in yet\u003c/span>\u003c/div>\u003cspan class=\"btn\">New envelope\u003c/span>\u003c/div>\n          \u003cdiv data-keys=\"sys\" data-sg=\"Fellwar|Fellow|Fell\">\u003c/div>\n        \u003c/section>\n        \u003cdiv class=\"fold\">\u003c/div>\n        \u003csection class=\"pg r baron\">\n          \u003cdiv class=\"k\">Two envelopes hold Fellwar Stone\u003c/div>\n          \u003cp class=\"nt\">Name the next card from this envelope. It tells them apart.\u003c/p>\n          \u003cdiv class=\"tie\">\n            \u003cdiv>\u003cdiv>Brass Lantern TCG\u003csmall class=\"n\">16 Oct · 11 d\u003c/small>\u003c/div>\n              \u003cdiv class=\"mini\">\u003cspan>Beast Within\u003c/span>\u003cspan class=\"n\">held\u003c/span>\u003c/div>\u003cdiv class=\"mini\">\u003cspan>Fellwar Stone\u003c/span>\u003cspan class=\"n\">in hand\u003c/span>\u003c/div>\n              \u003cdiv class=\"mini\">\u003cspan>Mind Stone\u003c/span>\u003cspan class=\"n\">0/2\u003c/span>\u003c/div>\u003cdiv class=\"mini\">\u003cspan>Chaos Warp\u003c/span>\u003cspan class=\"n\">0/1\u003c/span>\u003c/div>\n              \u003cspan class=\"btn push\">Post here\u003c/span>\u003c/div>\n            \u003cdiv>\u003cdiv>Quillon Hobby\u003csmall class=\"n\">10 Oct · 17 d\u003c/small>\u003c/div>\n              \u003cdiv class=\"mini\">\u003cspan>Beast Within\u003c/span>\u003cspan class=\"n\">held\u003c/span>\u003c/div>\u003cdiv class=\"mini\">\u003cspan>Fellwar Stone\u003c/span>\u003cspan class=\"n\">in hand\u003c/span>\u003c/div>\n              \u003cdiv class=\"mini\">\u003cspan>Swiftfoot Boots\u003c/span>\u003cspan class=\"n\">0/1\u003c/span>\u003c/div>\n              \u003cspan class=\"btn push\">Post here\u003c/span>\u003c/div>\n          \u003c/div>\n          \u003cp class=\"nt\">A tie has no first choice. Nothing checks in until you post.\u003c/p>\n          \u003cdiv data-bar=\"Packages\">\u003c/div>\n        \u003c/section>\n      \u003c/div>\u003c/div>\u003cfigcaption>Held: Beast Within waits on the Suspense line.\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cdiv class=\"fit\">\u003cdiv class=\"dev scr inner\">\n        \u003csection class=\"pg l kbon\">\n          \u003cdiv class=\"hd\">\u003cspan>Mail day · Tue 27 Oct\u003c/span>\u003cspan class=\"n\">33 in · 25 out\u003c/span>\u003c/div>\n          \u003cdiv class=\"q\">\u003cb>MIND ST\u003c/b>\u003cspan class=\"x\">×\u003c/span>\u003c/div>\n          \u003cdiv class=\"hits ovr\">\u003cdiv class=\"hitrow on\">\u003cdiv>Mind Stone\u003csmall>Commander Masters · NM\u003c/small>\u003c/div>\u003cspan class=\"n\">Brass Lantern\u003cbr>only\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv class=\"susp xo\">\u003cspan class=\"k\">Suspense\u003c/span>\u003cspan>Beast Within · Fellwar Stone\u003c/span>\u003csmall>Not checked in.\u003c/small>\u003c/div>\n          \u003cdiv class=\"hand\">\u003cdiv>\u003cspan class=\"k\">This envelope\u003c/span>\u003cspan>Mind Stone ×2\u003c/span>\u003c/div>\u003cspan class=\"btn\">New envelope\u003c/span>\u003c/div>\n          \u003cdiv data-keys=\"sys\" data-sg=\"Mind|Minds|Mindful\">\u003c/div>\n        \u003c/section>\n        \u003cdiv class=\"fold\">\u003c/div>\n        \u003csection class=\"pg r baron\">\n          \u003cdiv class=\"k\">It came from\u003c/div>\u003cdiv class=\"who\">Brass Lantern TCG\u003c/div>\u003cdiv class=\"meta\">ordered 16 Oct · 11 d · order …2B7C4\u003c/div>\n          \u003chr class=\"rule\">\n          \u003cdiv class=\"lines\">\n            \u003cdiv class=\"line now\">\u003cdiv>Mind Stone\u003csmall>Commander Masters · NM · \u003cspan class=\"n\">$0.29\u003c/span> each\u003c/small>\u003c/div>\u003cspan class=\"n ok\">2/2 ✓\u003c/span>\u003c/div>\n            \u003cdiv class=\"line held\">\u003cdiv>Beast Within\u003csmall>on the Suspense line\u003c/small>\u003c/div>\u003cspan class=\"n\">0/1\u003c/span>\u003c/div>\n            \u003cdiv class=\"line held\">\u003cdiv>Fellwar Stone\u003csmall>on the Suspense line\u003c/small>\u003c/div>\u003cspan class=\"n\">0/1\u003c/span>\u003c/div>\n            \u003cdiv class=\"line\">\u003cdiv>Chaos Warp\u003csmall>Commander 2011 · NM · \u003cspan class=\"n\">$0.42\u003c/span>\u003c/small>\u003c/div>\u003cdiv class=\"step\">\u003cspan class=\"btn\">−\u003c/span>\u003cspan class=\"n\">0/1\u003c/span>\u003cspan class=\"btn\">+\u003c/span>\u003c/div>\u003c/div>\n          \u003c/div>\n          \u003cdiv class=\"box xo\">\u003cdiv>Mind Stone is only in this envelope. Your 2 held cards came with it.\u003c/div>\n            \u003cdiv class=\"btns\">\u003cspan class=\"btn p\">Post 2 held cards here\u003c/span>\u003cspan class=\"btn\">Keep held\u003c/span>\u003c/div>\u003c/div>\n          \u003cdiv data-bar=\"Packages\">\u003c/div>\n        \u003c/section>\n      \u003c/div>\u003c/div>\u003cfigcaption>Decided: the next card names one envelope, and one tap posts the held cards.\u003c/figcaption>\u003c/figure>\n    \u003c/div>\n    \u003cdiv class=\"mark\">\u003cb>Invariant\u003c/b> The matches go under This envelope. \u003cb>Item 48\u003c/b> The tapped row is marked by weight and a bar, not this outlined box.\u003c/div>\n    \u003cdiv class=\"xmark\">\u003cb>Built default\u003c/b> The Suspense box sits below the matches. \u003cb>Item 42, open\u003c/b> The Post offer sits under the sender, above the lines.\u003c/div>\n  \u003c/article>\n\n  \u003carticle class=\"pose\">\n    \u003ch4>3. Suspense\u003c/h4>\n    \u003cp class=\"cap\">An envelope with no sender, every card in two envelopes. The right page ranks the accounts it fits by named copies. Post checks in the named cards only. \u003cs>A line left at the end of the day becomes an envelope on the Orphaned tab.\u003c/s>\u003c/p>\n    \u003cdiv class=\"frames\">\u003cfigure>\u003cdiv class=\"fit\">\u003cdiv class=\"dev scr inner\">\n      \u003csection class=\"pg l kbon\">\n        \u003cdiv class=\"hd\">\u003cspan>Mail day · Tue 27 Oct\u003c/span>\u0 003cu>Up to date\u003c/u>\u003c/div>\u003cdiv class=\"cell\">\u003cspan>History\u003c/span>\u003cu>\u003cspan class=\"n\">14\u003c/span> saved\u003c/u>\u003c/div>\n            \u003cdiv class=\"cell\">\u003cspan>Backup\u003c/span>\u003cu>Save a file\u003c/u>\u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"fold\">\u003c/div>\n        \u003cdiv data-bar=\"Ledger\" style=\"left:259px;right:259px\">\u003c/div>\n      \u003c/div>\u003c/div>\u003cfigcaption>Also drawn: Ledger full width, every row across the fold.\u003c/figcaption>\u003c/figure>\n    \u003c/div>\n    \u003cdiv class=\"mark\">\u003cb>Item 24\u003c/b> keeps Ledger full width, the fourth frame. Tally and Orphaned spread as drawn.\u003c/div>\n  \u003c/article>\n\n  \u003carticle class=\"pose\">\n    \u003ch4>10. Two keyboard cases\u003c/h4>\n    \u003cp class=\"cap\">Which case is real was unmeasured. The page picks the system keys inside the left page, with an in-app key pad if the keys span the fold.\u003c/p>\n    \u003cdiv class=\"frames\">\n      \u003cfigure>\u003cdiv class=\"fit\">\u003cdiv class=\"dev scr inner\">\n        \u003csection class=\"pg l kbon\">\u003cdiv data-use=\"mailL\">\u003c/div>\u003cdiv data-keys=\"sys\">\u003c/div>\u003c/section>\n        \u003cdiv class=\"fold\">\u003c/div>\n        \u003csection class=\"pg r baron\">\u003cdiv data-use=\"kestrelR\">\u003c/div>\u003cdiv data-bar=\"Packages\">\u003c/div>\u003c/section>\n      \u003c/div>\u003c/div>\u003cfigcaption>System keys inside the left page.\u003c/figcaption>\u003c/figure>\n      \u003cfigure>\u003cdiv class=\"fit\">\u003cdiv class=\"dev scr inner\">\n        \u003csection class=\"pg l kbon\">\u003cdiv data-use=\"mailL\">\u003c/div>\u003cdiv class=\"xo\" data-keys=\"pad\" data-sg=\"Lightning Bolt|Lightning Greaves\">\u003c/div>\u003c/section>\n        \u003cdiv class=\"fold\">\u003c/div>\n        \u003csection class=\"pg r baron\">\u003cdiv data-use=\"kestrelR\">\u003c/div>\u003cdiv data-bar=\"Packages\">\u003c/div>\u003c/section>\n      \u003c/div>\u003c/div>\u003cfigcaption>In-app key pad on the left page, the page's fallback.\u003c/figcaption>\u003c/figure>\n    \u003c/div>\n    \u003cdiv class=\"mark\">\u003cb>Invariant\u003c/b> applies here too: the list goes under New envelope.\u003c/div>\n    \u003cdiv class=\"xmark\">\u003cb>Item 22, provisional\u003c/b> The build lets the system keys span both pages, with no key pad.\u003c/div>\n  \u003c/article>\n\n  \u003carticle class=\"pose\">\n    \u003ch4>11. The tab bar on two pages\u003c/h4>\n    \u003cp class=\"cap\">Under the right page, always (item 23 ruled this). The page also draws two left-page places, which the ruling dropped.\u003c/p>\n    \u003cdiv class=\"frames\">\u003cfigure>\u003cdiv class=\"fit\">\u003cdiv class=\"dev scr inner\">\n      \u003csection class=\"pg l kbon\">\u003cdiv data-use=\"mailL\">\u003c/div>\u003cdiv data-keys=\"sys\">\u003c/div>\u003c/section>\n      \u003cdiv class=\"fold\">\u003c/div>\n      \u003csection class=\"pg r baron\">\u003cdiv data-use=\"kestrelR\">\u003c/div>\u003cdiv data-bar=\"Packages\">\u003c/div>\u003c/section>\n    \u003c/div>\u003c/div>\u003cfigcaption>Under the right page, while typing.\u003c/figcaption>\u003c/figure>\u003c/div>\n    \u003cdiv class=\"mark\">\u003cb>Invariant\u003c/b> The left page here repeats screen 1, so its list moves down as well.\u003c/div>\n  \u003c/article>\n\u003c/template>\n\n\u003cscript>\nconst $$ = (s, r = document) => [...r.querySelectorAll(s)];\n// Build the gallery once per state from one template, then fill its repeated parts.\nfor (const id of [\"merge-gallery\", \"archive-gallery\"]) document.getElementById(id).append(document.getElementById(\"gallery\").content.cloneNode(true));\n$$(\"[data-use]\").forEach((el) => el.replaceWith(document.getElementById(el.dataset.use).content.cloneNode(true)));\nconst ROWS = [\"QWERTYUIOP\", \"ASDFGHJKL'\", \"⇧ZXCVBNM-⌫\"];\n$$(\"[data-keys]\").forEach((el) => {\n  const pad = el.dataset.keys === \"pad\", sg = (el.dataset.sg || (pad ? \"\" : \"Light|Lightning|Lights\")).split(\"|\").filter(Boolean);\n  el.classList.add(\"kb\"); if (pad) el.classList.add(\"pad\");\n  el.innerHTML = '\u003cdiv class=\"sg\">' + sg.map((s) => \"\u003cspan>\" + s + \"\u003c/span>\").join(\"\") + '\u003c/div>\u003cdiv class=\"ks\">'\n    + ROWS.map((r) => [...r].map((c) => \"\u003cspan>\" + c + \"\u003c/span>\").join(\"\")).join(\"\")\n    + (pad ? '\u003cspan class=\"w3\">System keys\u003c/span>\u003cspan class=\"w4\">space\u003c/span>\u003cspan class=\"go w3\">Next card\u003c/span>'\n           : '\u003cspan class=\"w2\">123\u003c/span>\u003cspan class=\"w5\">space\u003c/span>\u003cspan class=\"w3\">next\u003c/span>') + \"\u003c/div>\";\n});\n$$(\"[data-bar]\").forEach((el) => {\n  el.classList.add(\"bar\");\n  el.innerHTML = [\"Packages\", \"Tally\", \"Orphaned\", \"Ledger\"].map((t) => '\u003cspan class=\"' + (t === el.dataset.bar ? \"on\" : \"\") + '\">' + t + \"\u003c/span>\").join(\"\");\n});\nfunction fit() {\n  $$(\".fit\").forEach((f) => { const d = f.firstElementChild; if (!f.clientWidth) return; const s = Math.min(1, f.clientWidth / d.offsetWidth);\n    d.style.transform = \"scale(\" + s + \")\"; f.style.height = d.offsetHeight * s + \"px\"; });\n}\nconst hidden = new Set();\nfunction read() {\n  const p = new URLSearchParams(location.hash.slice(1));\n  (p.get(\"hide\") || \"\").split(\",\").filter(Boolean).forEach((h) => hidden.add(h));\n  return { s: p.get(\"s\") === \"archive\" ? \"archive\" : \"merge\", t: p.get(\"t\") };\n}\nfunction render() {\n  const st = read();\n  if (st.t === \"light\" || st.t === \"dark\") document.documentElement.dataset.theme = st.t; else delete document.documentElement.dataset.theme;\n  $$(\"[data-state]\").forEach((el) => { el.classList.toggle(\"on\", el.dataset.state === st.s); el.classList.toggle(\"gone\", hidden.has(el.dataset.state)); });\n  document.body.classList.toggle(\"no-extra\", hidden.has(\"extra\"));\n  $$(\"nav a[data-k]\").forEach((a) => {\n    const cur = a.dataset.k === \"s\" ? st.s : (st.t || \"\");\n    a.setAttribute(\"aria-current\", String(cur === a.dataset.v));\n    const q = new URLSearchParams({ s: st.s }); if (st.t) q.set(\"t\", st.t); q.set(a.dataset.k, a.dataset.v);\n    a.href = \"#\" + q.toString();\n  });\n  $$(\"button[data-hide]\").forEach((b) => b.setAttribute(\"aria-pressed\", String(hidden.has(b.dataset.hide))));\n  fit();\n}\n$$(\"button[data-hide]\").forEach((b) => b.addEventListener(\"click\", () => { const h = b.dataset.hide; hidden.has(h) ? hidden.delete(h) : hidden.add(h); render(); }));\n$$(\"button[data-show]\").forEach((b) => b.addEventListener(\"click\", () => { hidden.delete(b.dataset.show); render(); }));\naddEventListener(\"hashchange\", render);\naddEventListener(\"resize\", fit);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "hand-held-words": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Held card words\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --manila:#EADBBA; --manilaInk:#695832; --red:#A8443C;\n  --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Status bar foot: unmeasured on the Duo inner screen. Drawn at the UI test's 20 pt floor (DuoHandUITests.statusBarFloor). */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --keys-top: 405px;  /* measurements duo-fold-and-keyboard: the panel draws from about y 405 pt; its frame starts at 449 */\n  --new:#2E7A5E; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.4; }\nmain { max-width:1040px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); }\n.banner { background:var(--manila); color:var(--manilaInk); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font-family:var(--cochin); font-size:26px; margin:16px 0 4px; }\nh2 { font-family:var(--cochin); font-size:22px; margin:0 0 4px; }\n.sub, .lede { margin:0 0 12px; max-width:80ch; }\n.sub { color:var(--inkSoft); }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }\nnav a, button.hide { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\na:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nsection.part { margin:32px 0; }\nsection.part[hidden], section.part.gone { display:none; }\nfigure { margin:12px 0 0; }\nfigcaption { margin-top:8px; max-width:80ch; }\nfigcaption b { font-family:var(--cochin); font-size:18px; }\n.fit { width:100%; overflow:hidden; }\n.words { margin:8px 0 0; padding-left:20px; font-size:14px; max-width:80ch; }\n.words li { margin:2px 0; }\n.words q { font-family:var(--cochin); font-weight:700; }\n\n/* ---- device: iPhone Duo inner screen, open, 951 x 669 pt, 1 CSS px = 1 pt ---- */\n.duo { position:relative; width:951px; height:669px; background:var(--paper); border:1px solid var(--ink); border-radius:12px; overflow:hidden;\n  font-family:-apple-system, system-ui, sans-serif; }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 16px; font-size:12px; font-weight:600; z-index:5; }\n.page { position:absolute; top:0; bottom:0; width:455.5px; overflow:hidden; }\n.page.l { left:0; } .page.r { left:495.5px; }\n.fold { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); }\n.fold span { position:absolute; top:200px; left:50%; transform:translateX(-50%) rotate(-90deg); font:11px var(--mono); color:var(--inkSoft); letter-spacing:1.2px; }\n/* The system keyboard: iOS chrome, not an app colour, so these greys sit outside the tokens. */\n.keys { position:absolute; left:0; right:0; top:var(--keys-top); bottom:0; background:#D2D0D6; z-index:6; padding:8px 6px; }\n.keys .row { display:flex; gap:6px; margin-bottom:8px; justify-content:center; }\n.keys .k { height:42px; flex:0 0 42px; background:#FFFFFF; border-radius:6px; display:grid; place-items:center; font-size:18px; color:#111; }\n.keys .k.w { flex-basis:300px; font-size:14px; }\n/* The right page's keys: the same panel, clipped to the page, so a focus on the page shows the keys it sits under. */\n.page .keys { z-index:6; }\n\n/* ---- app content: Cochin sets words, Menlo sets numbers (typography-cochin-and-mono) ---- */\n.content { position:absolute; left:16px; right:16px; top:calc(var(--sat) + 16px); display:flex; flex-direction:column; gap:12px; font-family:var(--cochin); }\n.r .content { gap:8px; }\n.micro { font:10.5px/13px var(--mono); letter-spacing:1.2px; text-transform:uppercase; color:var(--inkSoft); min-height:13px; }\n.who { font-size:22px; line-height:27px; font-weight:700; }\n.meta { font:11px/14px var(--mono); color:var(--inkSoft); min-height:14px; }\n.pill { font:11.5px var(--mono); border:1px solid var(--line); background:var(--card); border-radius:5px; padding:8px 12px; color:var(--ink); white-space:nowrap; }\n.pill.post { font-weight:700; background:var(--accent); border-color:var(--accent); color:var(--card); }\n.hit { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }\n.rowx { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; }\n.rowx .soft { color:var(--inkSoft); font-size:14px; }\n.count { font:12px var(--mono); color:var(--inkSoft); }\n.field { height:48px; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:0 12px; display:flex; align-items:center; gap:8px; font-size:16px; flex:none; }\n.field .typed::after { content:\"\"; display:inline-block; vertical-align:middle; width:2px; height:20px; background:var(--accent); margin-left:1px; }\n.field .typed { flex:1; }\n/* hand-held-chip: manilaInk on manila, mono 12, not a control */\n.chip { font:12px var(--mono); color:var(--manilaInk); background:var(--manila); border-radius:5px; padding:4px 8px; white-space:nowrap; }\n.match { min-height:44px; display:flex; align-items:center; font-size:14px; padding-left:10px; position:relative; }\n.match.on { font-weight:700; } .match.on::after { content:\"\"; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }\n.notice { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:2px; }\n.notice .micro { color:var(--manilaInk); }\n.notice b { font-size:15px; } .notice small { font-size:12.5px; }\n.offer { min-height:110px; background:color-mix(in srgb, var(--manila) 50%, transparent); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; }\n.offer p { margin:0; font-size:13px; line-height:17px; min-height:34px; }\n.lines { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.line { position:relative; display:flex; gap:8px; min-height:64px; padding-left:4px; border-top:1px solid var(--line); background:var(--card); }\n.line:first-child { border-top:0; }\n.line .box { flex:0 0 45px; height:45px; display:grid; place-items:center; }\n.line .box i { width:30px; height:30px; border:2px solid var(--inkSoft); border-radius:8px; display:block; }\n.line .t { flex:1; padding:12px 12px 12px 0; }\n.line .t b { font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }\n.line .t b span { font:12px var(--mono); color:var(--inkSoft); font-weight:400; }\n.line .t small { font-size:11.5px; color:var(--inkSoft); display:block; margin-top:4px; }\n.line .t small .hold { color:var(--manilaInk); font-weight:700; }\n/* Part 5 of duo-hand-gaps: a line whose card waits on the Suspense line, manila 55% over card */\n.line.held { background:color-mix(in srgb, var(--manila) 55%, var(--card)); }\n\n/* tags: dashed outline on what exists today, and on what an option adds */\n[data-tag] { position:relative; }\n[data-tag]::before { content:attr(data-tag); position:absolute; right:4px; top:-9px; font:600 11px/14px -apple-system, system-ui, sans-serif; padding:0 4px;\n  background:var(--paper); z-index:4; white-space:nowrap; letter-spacing:0; text-transform:none; }\n.tag-new { outline:2px dashed var(--new); outline-offset:2px; } .tag-new::before { color:var(--new); }\n.tag-today { outline:2px dashed var(--today); outline-offset:2px; } .tag-today::before { color:var(--today); }\n.line[data-tag]::before { top:auto; bottom:2px; }\n.line.tag-new, .line.tag-today { outline-offset:-2px; }\n.tag-left[data-tag]::before { right:auto; left:4px; }\n.tag-below[data-tag]::before { top:auto; bottom:-17px; }\n\n/* folded frame: the outer screen, 466 x 678 pt (duo-fold-and-keyboard, re-measured 2026-11-08), drawn at half size */\n.folded { position:relative; width:233px; height:339px; border:1px solid var(--ink); border-radius:12px; background:var(--paper);\n  padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); font-size:12px; color:var(--inkSoft); }\n.folded b { font-family:var(--cochin); color:var(--ink); font-size:14px; display:block; margin-bottom:4px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\">Sample. No seller, card, date, count or price on this page is real.\u003c/div>\n\u003ch1>Held card words\u003c/h1>\n\u003cp class=\"sub\">Waiting page item 80, \u003ccode>hand-held-words\u003c/code>. Card in Hand on the iPhone Duo, open pose, 951 x 669 pt, fold 40 pt at 455.5 pt, keys panel from y 405 pt. Light theme only. Beast Within is held: it was typed, two envelopes share its name, and Mind Stone, typed next, names this envelope. Each option is drawn in its own frame. Decision \u003ccode>duo-card-in-hand\u003c/code>; the held line is part 5 of \u003ccode>docs/design/duo-hand-gaps.html\u003c/code>.\u003c/p>\n\n\u003cnav aria-label=\"Options\">\n  \u003ca href=\"#s=keep-both\">Keep both words\u003c/a>\n  \u003ca href=\"#s=one-word\">One word only: line without words\u003c/a>\n  \u003ca href=\"#s=one-word-no-title\">One word only: box without a name\u003c/a>\n  \u003ca href=\"#s=folded\">Folded\u003c/a>\n  \u003ca href=\"#\">All\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Hide options\">\n  \u003cbutton class=\"hide\" type=\"button\" data-hide=\"keep-both\">Hide Keep both words\u003c/button>\n  \u003cbutton class=\"hide\" type=\"button\" data-hide=\"one-word\">Hide One word only: line without words\u003c/button>\n  \u003cbutton class=\"hide\" type=\"button\" data-hide=\"one-word-no-title\">Hide One word only: box without a name\u003c/button>\n  \u003cbutton class=\"hide\" type=\"button\" id=\"restore\">Show hidden options\u003c/button>\n\u003c/nav>\n\n\u003csection class=\"part\" data-state=\"folded\" data-opt=\"folded\">\n\u003ch2>Folded\u003c/h2>\n\u003cfigure>\n  \u003cdiv class=\"folded\" data-device=\"iphone-duo-folded\">\u003cb>Folded: unchanged\u003c/b>Card in Hand opens only on two pages side by side.\u003c/div>\n  \u003cfigcaption>\u003cb>Folded.\u003c/b> No change. Outer screen 466 x 678 pt, drawn at half size. Card in Hand opens only on two pages (\u003ccode>PackagesTab.twoPages\u003c/code>), so neither option draws here.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- Left page and chrome, drawn once and cloned into each frame. No id lives in a template. -->\n\u003ctemplate id=\"chrome-keys\">\n  \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n  \u003cdiv class=\"keys\">\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">q\u003c/span>\u003cspan class=\"k\">w\u003c/span>\u003cspan class=\"k\">e\u003c/span>\u003cspan class=\"k\">r\u003c/span>\u003cspan class=\"k\">t\u003c/span>\u003cspan class=\"k\">y\u003c/span>\u003cspan class=\"k\">u\u003c/span>\u003cspan class=\"k\">i\u003c/span>\u003cspan class=\"k\">o\u003c/span>\u003cspan class=\"k\">p\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">a\u003c/span>\u003cspan class=\"k\">s\u003c/span>\u003cspan class=\"k\">d\u003c/span>\u003cspan class=\"k\">f\u003c/span>\u003cspan class=\"k\">g\u003c/span>\u003cspan class=\"k\">h\u003c/span>\u003cspan class=\"k\">j\u003c/span>\u003cspan class=\"k\">k\u003c/span>\u003cspan class=\"k\">l\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">z\u003c/span>\u003cspan class=\"k\">x\u003c/span>\u003cspan class=\"k\">c\u003c/span>\u003cspan class=\"k\">v\u003c/span>\u003cspan class=\"k\">b\u003c/span>\u003cspan class=\"k\">n\u003c/span>\u003cspan class=\"k\">m\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k w\">space\u003c/span>\u003cspan class=\"k\" style=\"flex-basis:90px;font-size:14px\">done\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"left-top\">\n  \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">31 in · 27 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n  \u003cdiv class=\"field\">\u003cspan class=\"typed\">Mind St\u003c/span>\u003cspan class=\"chip tag-today tag-below\" data-tag=\"Today: chip\">1 held\u003c/span>\u003c/div>\n  \u003cdiv class=\"rowx\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n  \u003cspan class=\"micro\">Matches\u003c/span>\n  \u003cdiv class=\"match on\">Mind Stone\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"right-head\">\n  \u003cspan class=\"micro\">It came from\u003c/span>\n  \u003cspan class=\"who\">Brass Lantern TCG\u003c/span>\n  \u003cspan class=\"meta\">ordered 2026-10-16\u003c/span>\n  \u003cdiv class=\"offer tag-today\" data-tag=\"Today: offer and Post\">\n    \u003cp>Your held card came with this envelope. Nothing is checked in until you post.\u003c/p>\n    \u003cspan class=\"hit\" style=\"align-self:flex-start\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"other-lines\">\n  \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Chaos Warp\u003cspan>$0.42\u003c/span>\u003c/b>\u003csmall>Commander 2011 · NM\u003c/small>\u003c/span>\u003c/div>\n  \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Mind Stone\u003cspan>$0.29\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM\u003c/small>\u003c/span>\u003c/div>\n\u003c/template>\n\n\u003c!-- ================= Keep both words ================= -->\n\u003csection class=\"part\" data-state=\"keep-both\" data-opt=\"keep-both\">\n\u003ch2>Keep both words, fix their roles in the glossary\u003c/h2>\n\u003cp class=\"lede\">\"Held\" names the card's state. \"Suspense line\" names the place it waits. Both stay on screen. The line says where the card waits, so the tint is never the only sign, and the line still says it when the box sits under the keys.\u003c/p>\n\u003cfigure>\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-keep-both\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\" data-fill=\"left-top\">\n      \u003cdiv class=\"notice tag-today\" data-tag=\"Today: box named Suspense\">\u003cspan class=\"micro\">Suspense\u003c/span>\u003cb>Beast Within\u003c/b>\u003csmall>Not checked in.\u003c/small>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\" id=\"focus-keep-both\">\u003cdiv class=\"content\" data-fill=\"right-head\">\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line held tag-new\" data-tag=\"New: tint and place words\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Beast Within\u003cspan>$0.35\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM · \u003cspan class=\"hold\">on the Suspense line\u003c/span>\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv data-fill=\"other-lines\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv data-fill=\"chrome-keys\">\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Keep both words.\u003c/b> Words on screen for one held card:\n    \u003cul class=\"words\">\n      \u003cli>State, \"held\": the chip \u003cq>1 held\u003c/q>, the offer \u003cq>Your held card\u003c/q>, the button \u003cq>Post 2 cards here, 1 held\u003c/q>. All built today.\u003c/li>\n      \u003cli>Place, \"Suspense\": the box \u003cq>Suspense\u003c/q> (built) and the line \u003cq>on the Suspense line\u003c/q> (part 5 of the gaps mockup, not built).\u003c/li>\n    \u003c/ul>\n    The box keeps its built title. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- ================= One word only: the line loses its words ================= -->\n\u003csection class=\"part\" data-state=\"one-word\" data-opt=\"one-word\">\n\u003ch2>One word only: the line loses its words\u003c/h2>\n\u003cp class=\"lede\">The place word leaves the line. The held line keeps its manila tint and nothing else. The box keeps its name, so \"Suspense\" shows once, in the box, and \"held\" stays on the chip, the offer and Post.\u003c/p>\n\u003cfigure>\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-one-word\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\" data-fill=\"left-top\">\n      \u003cdiv class=\"notice tag-today\" data-tag=\"Today: box named Suspense\">\u003cspan class=\"micro\">Suspense\u003c/span>\u003cb>Beast Within\u003c/b>\u003csmall>Not checked in.\u003c/small>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\" id=\"focus-one-word\">\u003cdiv class=\"content\" data-fill=\"right-head\">\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line held tag-new\" data-tag=\"New: tint only, no words\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Beast Within\u003cspan>$0.35\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv data-fill=\"other-lines\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv data-fill=\"chrome-keys\">\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Line without words.\u003c/b> The tint alone marks the held line. With the box under the keys (large text, two or more matches), the right page says nothing about Beast Within but the offer above it. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- ================= One word only: the box loses its name ================= -->\n\u003csection class=\"part\" data-state=\"one-word-no-title\" data-opt=\"one-word-no-title\">\n\u003ch2>One word only: the box loses its name\u003c/h2>\n\u003cp class=\"lede\">The other reading of the same option. The line keeps \"on the Suspense line\". The box drops its \"Suspense\" title and shows the card and its foot only.\u003c/p>\n\u003cfigure>\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-one-word-no-title\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\" data-fill=\"left-top\">\n      \u003cdiv class=\"notice tag-new\" id=\"focus-one-word-no-title\" data-tag=\"New: no title\">\u003cb>Beast Within\u003c/b>\u003csmall>Not checked in.\u003c/small>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\" data-fill=\"right-head\">\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line held tag-new\" data-tag=\"New: tint and place words\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Beast Within\u003cspan>$0.35\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM · \u003cspan class=\"hold\">on the Suspense line\u003c/span>\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv data-fill=\"other-lines\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv data-fill=\"chrome-keys\">\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Box without a name.\u003c/b> The manila box keeps the held card's name and \"Not checked in.\" with no title above them. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\u003c/main>\n\n\u003cscript>\n// Fill each frame from its templates, so the shared parts are drawn once.\ndocument.querySelectorAll('[data-fill]').forEach(el => {\n  const t = document.getElementById(el.getAttribute('data-fill')).content.cloneNode(true);\n  el.removeAttribute('data-fill');\n  // A bare wrapper only carried the fill: lift its children into the parent. A content column keeps them at its top.\n  if (el.tagName === 'DIV' && el.attributes.length === 0) el.replaceWith(...t.childNodes); else el.prepend(t);\n});\n// Scale each 951 pt frame to the page width; the page never scrolls sideways.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; d.style.zoom = Math.min(1, w.clientWidth / 951); });\n}\n// Deep link: #s=\u003cstate> shows one state; no hash shows all. A Hide button removes one option.\nconst hidden = new Set();\nfunction route() {\n  const m = location.hash.match(/s=([\\w-]+)/), s = m && m[1];\n  document.querySelectorAll('section.part').forEach(p => {\n    p.hidden = !!s && p.dataset.state !== s;\n    p.classList.toggle('gone', hidden.has(p.dataset.opt));\n  });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === (location.hash || '#'))));\n  fit();\n}\ndocument.querySelectorAll('[data-hide]').forEach(b => {\n  const name = b.textContent.replace(/^Hide /, '');\n  b.addEventListener('click', () => {\n    const o = b.dataset.hide; hidden.has(o) ? hidden.delete(o) : hidden.add(o);\n    b.textContent = (hidden.has(o) ? 'Show ' : 'Hide ') + name; route();\n  });\n});\ndocument.getElementById('restore').addEventListener('click', () => {\n  hidden.clear(); document.querySelectorAll('[data-hide]').forEach(b => { b.textContent = 'Hide ' + b.textContent.replace(/^(Hide|Show) /, ''); }); route();\n});\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "orphaned-composer-skip": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Composer Audit Skips\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json. The native app is held to light (native/project.yml UIUserInterfaceStyle: Light),\n   so this page draws one theme; t=dark is not drawn. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832;\n  --shadow:rgba(28,43,36,0.06);\n  /* Cochin and Menlo are Apple fonts. Off a Mac, Menlo falls back to DejaVu Sans Mono, which Menlo is drawn from. */\n  --cochin: Cochin, \"Liberation Serif\", Georgia, serif;\n  --mono: Menlo, \"DejaVu Sans Mono\", ui-monospace, monospace;\n  --sys: -apple-system, system-ui, sans-serif;\n}\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); color:var(--ink); }\nbody { font:15px/1.4 var(--sys); }\n[hidden] { display:none !important; }\ncode, .id { font-family:var(--mono); font-size:0.88em; overflow-wrap:anywhere; }\n\n/* Page chrome, outside the pictures. */\n.top { padding:12px 16px 0; padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); padding-top:max(12px, env(safe-area-inset-top)); max-width:880px; margin:0 auto; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font:600 22px/1.25 var(--sys); margin:16px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:68ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }\nnav a, nav button { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"], nav button[aria-pressed=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nnav .lab { align-self:center; font-size:13px; color:var(--ink); width:100%; }\n.states { display:flex; flex-wrap:wrap; justify-content:center; gap:24px; padding:0 0 32px; padding-bottom:max(32px, env(safe-area-inset-bottom)); }\n\n/* ---- One picture per state: 390 pt wide (the page's FIT_W; the repo's device list names no size). Fixed height,\n   so the card's reserved size holds whatever font the viewer has. 1 CSS px = 1 pt. ---- */\n.pic { width:390px; max-width:100%; height:840px; overflow:hidden; background:var(--paper); display:flex; flex-direction:column; gap:12px;\n  padding:12px 16px 16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.pic-sample { font-size:12.5px; font-weight:600; color:var(--manilaInk); background:var(--manila); border-radius:6px; padding:4px 8px; }\n.pic h2 { font:600 17px/1.25 var(--sys); margin:0; }\n.pic .say { font-size:13.5px; margin:-4px 0 0; color:var(--ink); }\n.tags { display:flex; flex-wrap:wrap; gap:8px; }\n.tag { font-size:12.5px; font-weight:600; padding:2px 8px; border:2px dashed currentColor; border-radius:6px; background:var(--card); }\n.tag.today { color:var(--red); } .tag.new { color:var(--green); }\n\n/* The composer, as native/Manifest/OrphanedView.swift ComposerView draws it. */\n.crop { padding:0 0 30px; }\n.crop.tall { padding-bottom:54px; }\n.composer { background:var(--card); border:1px solid var(--ink); border-radius:8px; box-shadow:0 1px 2px var(--shadow); padding:12px;\n  display:flex; flex-direction:column; gap:8px; line-height:normal; }\n.micro { font:11px var(--mono); text-transform:uppercase; letter-spacing:0.14em; color:var(--inkSoft); }\n.field { font:16px/18px var(--cochin); color:var(--inkSoft); min-height:48px; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); display:flex; align-items:center; }\n.entries { padding-top:8px; }\n.rule { height:1px; background:var(--line); }\n.entry { display:flex; align-items:center; padding-left:12px; }\n.entry .name { flex:1; font:14px var(--cochin); color:var(--ink); }\n.entry .step { width:44px; height:44px; display:flex; align-items:center; justify-content:center; font:15px var(--mono); color:var(--ink); }\n.entry .qty { min-width:20px; text-align:center; font:13px var(--mono); color:var(--ink); }\n.foot { display:flex; align-items:center; gap:8px; padding-top:4px; }\n.count { font:11px/1.164 var(--mono); color:var(--inkSoft); white-space:nowrap; position:relative; }\n.spacer { flex:1; }\n/* MiniLabel (ControlViews.swift): Menlo 11.5, padding 8 x 12, radius 5, 1 pt border, in a 44 pt hit frame. */\n.hit { min-width:44px; min-height:44px; display:flex; align-items:center; justify-content:center; position:relative; flex:none; }\n.pill { font:11.5px/1.164 var(--mono); padding:7px 11px; border-radius:5px; border:1px solid var(--line); background:var(--card); color:var(--ink); white-space:nowrap; }\n.pill.save { font-weight:700; background:var(--ink); border-color:var(--ink); color:var(--card); }\n\n/* What the audit does with each flagged element: a frame drawn round it, and a flag under it. */\n.mark { position:relative; }\n.mark::after { content:\"\"; position:absolute; inset:-3px; border:2px dashed var(--red); border-radius:4px; pointer-events:none; }\n.mark.skipped::after { border-color:var(--accent); }\n.flag { position:absolute; top:calc(100% + 6px); white-space:nowrap; font:600 12px/1 var(--sys); padding:4px 6px; border-radius:4px; background:var(--red); color:var(--card); }\n/* The count is 13 pt tall in a 44 pt row: drop its flag 15.5 pt more, so both flags sit on one line. */\n.count .flag { left:-3px; top:calc(100% + 21.5px); } .hit .flag { right:-3px; }\n.skipped .flag { background:var(--accent); }\n.idnote { position:absolute; top:calc(100% + 45px); left:-3px; white-space:nowrap; font:600 12px/1 var(--mono); color:var(--green); background:var(--card); border:1.5px dashed var(--green); border-radius:4px; padding:2px 4px; }\n\n/* Ratios, printed on each picture. */\n.ratios { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; font-size:13px; }\n.ratios .sw { width:28px; height:20px; border-radius:4px; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font:700 12px var(--mono); }\n.ratios .r { font:700 15px var(--mono); color:var(--green); text-align:right; }\n.ratios .floor { grid-column:1 / -1; color:var(--inkSoft); font-size:12.5px; border-top:1px solid var(--line); padding-top:6px; }\n\n/* The audit's verdict for this state. */\n.verdict { border-radius:8px; padding:10px 12px; font-size:13.5px; border:1px solid; }\n.verdict b { display:block; font-size:15px; margin-bottom:2px; }\n.verdict.red { background:var(--redSoft); border-color:var(--red); color:var(--ink); }\n.verdict.red b { color:var(--red); }\n.verdict.green { background:var(--card); border-color:var(--green); color:var(--ink); }\n.verdict.green b { color:var(--green); }\n.skips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }\n.chip { font:12px var(--mono); padding:3px 6px; border-radius:4px; border:1px solid var(--line); background:var(--card); color:var(--ink); }\n.chip.added { border:1.5px dashed var(--green); color:var(--green); font-weight:700; }\n.trade { font-size:13px; margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 8px; }\n.trade dt { font-weight:700; } .trade dd { margin:0; }\n\n@media (min-width:860px) { .pic { border:1px solid var(--line); border-radius:12px; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"top\">\n  \u003cdiv class=\"banner\">Sample. No card name, count or figure here is real data. Colours are the app's tokens; ratios are computed from them.\u003c/div>\n  \u003ch1>Orphaned composer: two contrast flags that measure clear\u003c/h1>\n  \u003cp class=\"sub\">Apple's accessibility audit flags \"Contrast failed\" on the ready composer's Save envelope button and its \"1 card\" count. Both colour pairs clear the 4.5:1 floor by the tokens. Neither choice below changes a pixel; each changes what the audit does with these two elements.\u003c/p>\n  \u003cnav aria-label=\"State\">\n    \u003cspan class=\"lab\">Show one state\u003c/span>\n    \u003ca href=\"#s=today\" data-s=\"today\">Today\u003c/a>\n    \u003ca href=\"#s=named-skips\" data-s=\"named-skips\">Named skips\u003c/a>\n    \u003ca href=\"#s=skip-nothing\" data-s=\"skip-nothing\">Skip nothing\u003c/a>\n    \u003ca href=\"#\" data-s=\"\">All\u003c/a>\n  \u003c/nav>\n  \u003cnav aria-label=\"Hide an option\">\n    \u003cspan class=\"lab\">Hide one option\u003c/span>\n    \u003cbutton type=\"button\" data-hide=\"named-skips\" aria-pressed=\"false\">Hide Named skips\u003c/button>\n    \u003cbutton type=\"button\" data-hide=\"skip-nothing\" aria-pressed=\"false\">Hide Skip nothing\u003c/button>\n  \u003c/nav>\n\u003c/div>\n\n\u003cdiv class=\"states\">\n\n\u003c!-- ======================= Today ======================= -->\n\u003csection data-state=\"today\">\n\u003cdiv class=\"pic\" id=\"pic-today\">\n  \u003cdiv class=\"pic-sample\">Sample. Today, on main.\u003c/div>\n  \u003ch2>Today: the ready audit is red\u003c/h2>\n  \u003cp class=\"say\">Both flags fire, though both pairs clear the floor.\u003c/p>\n  \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: Save and the \"1 card\" count\u003c/span>\u003c/div>\n  \u003cdiv class=\"crop\">\u003cdiv class=\"composer\">\n    \u003cdiv class=\"micro\">New envelope\u003c/div>\n    \u003cdiv class=\"field\">Type a card name…\u003c/div>\n    \u003cdiv class=\"entries\">\u003cdiv class=\"rule\">\u003c/div>\u003cdiv class=\"entry\">\u003cspan class=\"name\">Urza's Saga\u003c/span>\u003cspan class=\"step\" aria-hidden=\"true\">–\u003c/span>\u003cspan class=\"qty\">1\u003c/span>\u003cspan class=\"step\" aria-hidden=\"true\">+\u003c/span>\u003c/div>\u003cdiv class=\"rule\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"field\">Note (optional) — tracking #, sender, mailer…\u003c/div>\n    \u003cdiv class=\"foot\">\n      \u003cspan class=\"count mark\">1 card\u003cspan class=\"flag\">Contrast failed\u003c/span>\u003c/span>\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cspan class=\"hit\">\u003cspan class=\"pill\">Cancel\u003c/span>\u003c/span>\n      \u003cspan class=\"hit mark\">\u003cspan class=\"pill save\">Save envelope\u003c/span>\u003cspan class=\"flag\">Contrast failed\u003c/span>\u003c/span>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cdiv class=\"ratios\">\n    \u003cspan class=\"sw\" style=\"background:#FCF6EA;color:#6E6379\">Aa\u003c/span>\u003cspan>\"1 card\": inkSoft #6E6379 on card #FCF6EA, Menlo 11\u003c/span>\u003cspan class=\"r\">5.24:1\u003c/span>\n    \u003cspan class=\"sw\" style=\"background:#332E3F;color:#FCF6EA;border-color:#332E3F\">Aa\u003c/span>\u003cspan>Save text: card #FCF6EA on ink #332E3F, Menlo 11.5 bold\u003c/span>\u003cspan class=\"r\">12.17:1\u003c/span>\n    \u003cspan class=\"floor\">Floor 4.5:1 for text. Save's fill on card: 12.17:1, floor 3:1.\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"verdict red\">\u003cb>Audit: red, 2 findings\u003c/b>On \u003cspan class=\"id\">orphaned-save\u003c/span> and on the count, which has no id. 2 of 2 tries. Contrast skips today:\n    \u003cdiv class=\"skips\">\u003cspan class=\"chip\">orphaned-cancel\u003c/span>\u003cspan class=\"chip\">orphaned-edit:…\u003c/span>\u003cspan class=\"chip\">discard:…\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- ======================= Named skips ======================= -->\n\u003csection data-state=\"named-skips\" data-opt=\"named-skips\">\n\u003cdiv class=\"pic\" id=\"pic-named-skips\">\n  \u003cdiv class=\"pic-sample\">Sample. Named skips: what this option leaves.\u003c/div>\n  \u003ch2>Add named contrast skips for Save and the card count\u003c/h2>\n  \u003cp class=\"say\">Same pixels. Contrast skipped on these two only.\u003c/p>\n  \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: colours and sizes kept\u003c/span>\u003cspan class=\"tag new\">New: 2 named skips\u003c/span>\u003c/div>\n  \u003cdiv class=\"crop tall\">\u003cdiv class=\"composer\">\n    \u003cdiv class=\"micro\">New envelope\u003c/div>\n    \u003cdiv class=\"field\">Type a card name…\u003c/div>\n    \u003cdiv class=\"entries\">\u003cdiv class=\"rule\">\u003c/div>\u003cdiv class=\"entry\">\u003cspan class=\"name\">Urza's Saga\u003c/span>\u003cspan class=\"step\" aria-hidden=\"true\">–\u003c/span>\u003cspan class=\"qty\">1\u003c/span>\u003cspan class=\"step\" aria-hidden=\"true\">+\u003c/span>\u003c/div>\u003cdiv class=\"rule\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"field\">Note (optional) — tracking #, sender, mailer…\u003c/div>\n    \u003cdiv class=\"foot\">\n      \u003cspan class=\"count mark skipped\">\u003cspan class=\"idnote\">New: id orphaned-count\u003c/span>1 card\u003cspan class=\"flag\">Contrast skipped\u003c/span>\u003c/span>\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cspan class=\"hit\">\u003cspan class=\"pill\">Cancel\u003c/span>\u003c/span>\n      \u003cspan class=\"hit mark skipped\">\u003cspan class=\"pill save\">Save envelope\u003c/span>\u003cspan class=\"flag\">Contrast skipped\u003c/span>\u003c/span>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cdiv class=\"ratios\">\n    \u003cspan class=\"sw\" style=\"background:#FCF6EA;color:#6E6379\">Aa\u003c/span>\u003cspan>\"1 card\": inkSoft #6E6379 on card #FCF6EA, Menlo 11\u003c/span>\u003cspan class=\"r\">5.24:1\u003c/span>\n    \u003cspan class=\"sw\" style=\"background:#332E3F;color:#FCF6EA;border-color:#332E3F\">Aa\u003c/span>\u003cspan>Save text: card #FCF6EA on ink #332E3F, Menlo 11.5 bold\u003c/span>\u003cspan class=\"r\">12.17:1\u003c/span>\n    \u003cspan class=\"floor\">Unchanged. Floor 4.5:1 for text. Save's fill on card: 12.17:1, floor 3:1.\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"verdict green\">\u003cb>Audit: green\u003c/b>Every other check stays on. Contrast skips:\n    \u003cdiv class=\"skips\">\u003cspan class=\"chip\">orphaned-cancel\u003c/span>\u003cspan class=\"chip\">orphaned-edit:…\u003c/span>\u003cspan class=\"chip\">discard:…\u003c/span>\u003cspan class=\"chip added\">New: orphaned-save\u003c/span>\u003cspan class=\"chip added\">New: orphaned-count\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003c!-- ======================= Skip nothing ======================= -->\n\u003csection data-state=\"skip-nothing\" data-opt=\"skip-nothing\">\n\u003cdiv class=\"pic\" id=\"pic-skip-nothing\">\n  \u003cdiv class=\"pic-sample\">Sample. Skip nothing: what this option leaves.\u003c/div>\n  \u003ch2>Skip nothing: both stay red until a measured fix exists\u003c/h2>\n  \u003cp class=\"say\">Same pixels, same audit. No new blind spot.\u003c/p>\n  \u003cdiv class=\"tags\">\u003cspan class=\"tag today\">Today: screen, audit and skips kept\u003c/span>\u003c/div>\n  \u003cdiv class=\"crop\">\u003cdiv class=\"composer\">\n    \u003cdiv class=\"micro\">New envelope\u003c/div>\n    \u003cdiv class=\"field\">Type a card name…\u003c/div>\n    \u003cdiv class=\"entries\">\u003cdiv class=\"rule\">\u003c/div>\u003cdiv class=\"entry\">\u003cspan class=\"name\">Urza's Saga\u003c/span>\u003cspan class=\"step\" aria-hidden=\"true\">–\u003c/span>\u003cspan class=\"qty\">1\u003c/span>\u003cspan class=\"step\" aria-hidden=\"true\">+\u003c/span>\u003c/div>\u003cdiv class=\"rule\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"field\">Note (optional) — tracking #, sender, mailer…\u003c/div>\n    \u003cdiv class=\"foot\">\n      \u003cspan class=\"count mark\">1 card\u003cspan class=\"flag\">Contrast failed\u003c/span>\u003c/span>\n      \u003cspan class=\"spacer\">\u003c/span>\n      \u003cspan class=\"hit\">\u003cspan class=\"pill\">Cancel\u003c/span>\u003c/span>\n      \u003cspan class=\"hit mark\">\u003cspan class=\"pill save\">Save envelope\u003c/span>\u003cspan class=\"flag\">Contrast failed\u003c/span>\u003c/span>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cdiv class=\"ratios\">\n    \u003cspan class=\"sw\" style=\"background:#FCF6EA;color:#6E6379\">Aa\u003c/span>\u003cspan>\"1 card\": inkSoft #6E6379 on card #FCF6EA, Menlo 11\u003c/span>\u003cspan class=\"r\">5.24:1\u003c/span>\n    \u003cspan class=\"sw\" style=\"background:#332E3F;color:#FCF6EA;border-color:#332E3F\">Aa\u003c/span>\u003cspan>Save text: card #FCF6EA on ink #332E3F, Menlo 11.5 bold\u003c/span>\u003cspan class=\"r\">12.17:1\u003c/span>\n    \u003cspan class=\"floor\">Unchanged. Both clear, so no colour change is known to pass.\u003c/span>\n  \u003c/div>\n  \u003cdiv class=\"verdict red\">\u003cb>Audit: stays red, 2 findings\u003c/b>Main's iPhone UI audit stays red here. The known gap stays open until a measured change passes. Contrast skips kept:\n    \u003cdiv class=\"skips\">\u003cspan class=\"chip\">orphaned-cancel\u003c/span>\u003cspan class=\"chip\">orphaned-edit:…\u003c/span>\u003cspan class=\"chip\">discard:…\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003c/section>\n\n\u003c/div>\n\n\u003cscript>\nconst hidden = new Set();\nfunction apply() {\n  const s = new URLSearchParams(location.hash.slice(1)).get(\"s\") || \"\";\n  const sections = document.querySelectorAll(\"[data-state]\");\n  const known = [...sections].some(el => el.dataset.state === s);\n  sections.forEach(el => { el.hidden = (known && el.dataset.state !== s) || hidden.has(el.dataset.opt); });\n  document.querySelectorAll(\"[data-s]\").forEach(a => a.setAttribute(\"aria-current\", a.dataset.s === (known ? s : \"\") ? \"true\" : \"false\"));\n  document.querySelectorAll(\"[data-hide]\").forEach(b => b.setAttribute(\"aria-pressed\", hidden.has(b.dataset.hide) ? \"true\" : \"false\"));\n}\ndocument.querySelectorAll(\"[data-hide]\").forEach(b => b.addEventListener(\"click\", () => {\n  const k = b.dataset.hide; hidden.has(k) ? hidden.delete(k) : hidden.add(k); apply();\n}));\nwindow.addEventListener(\"hashchange\", apply);\napply();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "duo-card-in-hand-entry": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Keep Packages\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger), as the other Duo mockups in docs/design use them. The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832; --gold:#C9A961;\n  --shadow:rgba(51,46,63,.14);\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Status bar foot: unmeasured on the Duo inner screen. Drawn at the UI test's 20 pt floor, as the house mockups do. */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --sab: env(safe-area-inset-bottom);\n  --new:#2E7A5E; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.4; }\nmain { max-width:1040px; margin:0 auto; padding:16px 0; }\n.txt { padding:0 16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-weight:600; margin:0 16px; }\nh1 { font-family:var(--cochin); font-size:24px; margin:16px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:80ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }\nnav a { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nfigure { margin:24px 0; }\nfigure[hidden] { display:none; }\nfigcaption { margin:8px 16px 0; max-width:80ch; }\nfigcaption b { font-family:var(--cochin); font-size:18px; }\nul.tags { margin:8px 16px 0; padding-left:20px; color:var(--inkSoft); font-size:14px; max-width:80ch; }\n.fit { width:100%; overflow:hidden; }\n\n/* ---- device: iPhone Duo inner screen, open, 951 x 669 pt, 1 CSS px = 1 pt ----\n   951 wide and the 40 pt fold at 455.5: measured (duo-fold-and-keyboard). 669 high: the house frame, the measured bar foot (y 657) plus its 12 pt lift. */\n.duo { position:relative; width:951px; height:669px; background:var(--paper); border:1px solid var(--ink); border-radius:12px; overflow:hidden;\n  font-family:-apple-system, system-ui, sans-serif; padding-bottom:var(--sab); }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 16px; font-size:12px; font-weight:600; z-index:5; background:var(--paper); }\n.page { position:absolute; top:0; bottom:0; width:455.5px; overflow:hidden; }\n.page.l { left:0; } .page.r { left:495.5px; }\n.fold { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); z-index:3; pointer-events:none; }\n.fold span { position:absolute; top:520px; left:50%; transform:translateX(-50%) rotate(-90deg); font:11px var(--mono); color:var(--inkSoft); letter-spacing:1.2px; }\n/* The Duo tab bar under the right page (DuoSpine.swift, DuoBarMetrics: 64 pt pill, 12 pt lift). Measured at x 520 to 927, y 593 to 657 (debt hand-open-under-bar-at-l). */\n.bar { position:absolute; left:519.5px; width:407.5px; top:593px; height:64px; border:1px solid var(--line); border-radius:32px; z-index:6;\n  background:color-mix(in srgb, var(--paper) 62%, transparent); box-shadow:0 4px 16px var(--shadow); display:grid; grid-template-columns:repeat(4,1fr); padding:4px; gap:4px;\n  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }\n.bar span { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:28px; font:12px var(--cochin); color:var(--inkSoft); }\n.bar span::before { content:\"\"; width:20px; height:20px; border:1.5px solid currentColor; border-radius:5px; margin-bottom:4px; }\n.bar span.on { background:color-mix(in srgb, var(--card) 90%, transparent); color:var(--accent); font-weight:700; }\n\n/* ---- Packages, one page across the whole window (DuoSpread.spreads(tab:) is false for .packages) ---- */\n.abs { position:absolute; }\n.mast { left:16px; right:16px; top:calc(var(--sat) + 12px); height:278px; display:flex; flex-direction:column; align-items:center; gap:0; font-family:var(--cochin); }\n.seal-row { display:flex; align-items:center; gap:12px; width:270px; height:36px; margin-bottom:12px; }\n.seal-row i { flex:1; height:1px; background:var(--gold); opacity:.75; }\n.seal { width:36px; height:36px; border-radius:50%; background:var(--red); box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--red) 70%, #000); }\n.mast .title { font-size:31px; line-height:38px; letter-spacing:.5px; }\n.mast .house { font-size:10px; letter-spacing:2px; color:var(--inkSoft); margin-top:8px; }\n.cells { display:grid; grid-template-columns:repeat(3, 140px); margin-top:24px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.cells div { padding:16px 8px; text-align:center; border-left:1px solid var(--line); }\n.cells div:first-child { border-left:0; }\n.cells b { display:block; font:700 20px var(--mono); }\n.cells small { font-size:12px; color:var(--inkSoft); }\n.slot { left:0; right:0; top:330px; height:47px; border-bottom:1px solid var(--line); }\n.stamped { left:16px; top:378px; height:30px; display:flex; align-items:center; gap:8px; font:13px var(--cochin); color:var(--inkSoft); }\n.mini { font:11.5px var(--mono); border:1px solid var(--line); background:var(--card); border-radius:5px; padding:8px 12px; color:var(--ink); white-space:nowrap; }\n.hit { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }\n.handopen { right:16px; top:416px; height:44px; }\n.cards { left:16px; right:16px; top:468px; display:flex; flex-direction:column; gap:8px; font-family:var(--cochin); }\n.pkg { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px var(--shadow); overflow:hidden; position:relative; }\n.pkg .hd { display:flex; align-items:center; gap:8px; padding:12px 12px 0; }\n.pkg .hd .who { flex:1; }\n.pkg .hd .who b { display:block; font-size:15px; }\n.pkg .hd .who span { font:11px var(--mono); color:var(--inkSoft); }\n.pkg .pillx { font:700 12.5px var(--cochin); background:color-mix(in srgb, var(--red) 14%, var(--card)); color:var(--red); border-radius:14px; padding:4px 8px; }\n.pkg .oid { font:11px var(--mono); color:var(--inkSoft); text-decoration:underline; padding:0 12px; height:45px; display:flex; align-items:center; }\n.pkg .bulk { display:flex; gap:8px; padding:0 12px 8px; }\n.line { display:flex; gap:8px; height:64px; padding-left:4px; border-top:1px solid var(--line); }\n.line .box { flex:0 0 45px; height:45px; display:grid; place-items:center; margin-top:10px; }\n.line .box i { width:30px; height:30px; border:2px solid var(--inkSoft); border-radius:8px; display:block; }\n.line .t { flex:1; padding:12px 12px 12px 0; }\n.line .t b { font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }\n.line .t b span { font:12px var(--mono); color:var(--inkSoft); font-weight:400; }\n.line .t small { font-size:11.5px; color:var(--inkSoft); display:block; margin-top:4px; }\n\n/* ---- Card in Hand, two pages (HandScreen.swift) ---- */\n.content { position:absolute; left:16px; right:16px; top:calc(var(--sat) + 16px); display:flex; flex-direction:column; gap:12px; font-family:var(--cochin); }\n.rowx { display:flex; align-items:center; justify-content:space-between; gap:8px; }\n.rowx .soft { color:var(--inkSoft); font-size:14px; }\n.count { font:12px var(--mono); color:var(--inkSoft); margin-left:auto; }\n.field { height:48px; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:0 12px; display:flex; align-items:center; font-size:16px; color:var(--inkSoft); }\n.empty { font-size:14px; color:var(--inkSoft); margin:0; }\n.transit { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; align-items:center; gap:8px; }\n.transit div { flex:1; } .transit b { display:block; font-size:14px; font-weight:400; } .transit small { font-size:12.5px; color:var(--red); }\n\n/* tags: dashed outline on what exists today, and on what an option adds */\n:where([data-tag]) { position:relative; }\n[data-tag]::after { content:attr(data-tag); position:absolute; right:4px; top:-9px; font:600 11px/14px -apple-system, system-ui, sans-serif; padding:0 4px;\n  background:var(--paper); z-index:8; white-space:nowrap; }\n.tag-low[data-tag]::after { top:auto; bottom:-8px; }\n.tag-left[data-tag]::after { right:auto; left:4px; }\n.tag-new { outline:2px dashed var(--new); outline-offset:2px; } .tag-new::after { color:var(--new); }\n.tag-today { outline:2px dashed var(--today); outline-offset:2px; } .tag-today::after { color:var(--today); }\n\n/* folded frame: the outer screen, 466 x 678 pt (duo-fold-and-keyboard, re-measured 2026-11-08), drawn at half size */\n.folded { position:relative; width:233px; height:339px; border:1px solid var(--ink); border-radius:12px; background:var(--paper); overflow:hidden;\n  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); font-family:var(--cochin); margin-left:16px; }\n.folded .ft { text-align:center; font-size:16px; margin:4px 0 8px; }\n.folded .fc { background:var(--card); border:1px solid var(--line); border-radius:6px; height:58px; margin-bottom:6px; padding:6px 8px; font-size:10px; }\n.folded .fc b { display:block; font-size:11px; }\n.folded .sysbar { position:absolute; left:0; right:0; bottom:0; height:41.5px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr);\n  font:9px var(--cochin); color:var(--inkSoft); text-align:center; align-items:center; background:var(--paper); }\n.folded .sysbar .on { color:var(--accent); font-weight:700; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\">Sample. No seller, card, count or price on this page is real. The masthead's heights are drawn, not measured.\u003c/div>\n\u003cdiv class=\"txt\">\n\u003ch1>Keep Packages; add a Card in Hand control\u003c/h1>\n\u003cp class=\"sub\">Item 35, \u003ccode>duo-card-in-hand-entry\u003c/code>. iPhone Duo, open pose, 951 x 669 pt, fold 40 pt at 455.5 pt. Keys down, so the tab bar shows. Light theme only: the native app is held to light. This option keeps the native build as it is today: the control is already built (\u003ccode>PackagesView.swift\u003c/code>, \u003ccode>hand-open\u003c/code>).\u003c/p>\n\n\u003cnav aria-label=\"States\">\n  \u003ca href=\"#s=keep-packages\">The Packages tab\u003c/a>\n  \u003ca href=\"#s=after-tap\">One tap in: Card in Hand\u003c/a>\n  \u003ca href=\"#s=folded\">Folded\u003c/a>\n  \u003ca href=\"#\">All\u003c/a>\n\u003c/nav>\n\u003c/div>\n\n\u003c!-- Folded first, in the ios-apps order. -->\n\u003cfigure id=\"s-folded\" data-state=\"folded\">\n  \u003cdiv class=\"folded\" data-device=\"iphone-duo-folded\">\n    \u003cdiv class=\"ft\">Manifest\u003c/div>\n    \u003cdiv class=\"fc\">\u003cb>Sample Seller One\u003c/b>3 left &#183; $1.10\u003c/div>\n    \u003cdiv class=\"fc\">\u003cb>Sample Seller Two\u003c/b>1 left &#183; $0.25\u003c/div>\n    \u003cdiv class=\"fc\">\u003cb>Sample Seller Three\u003c/b>2 left &#183; $0.60\u003c/div>\n    \u003cdiv class=\"sysbar\">\u003cspan>Ledger\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan class=\"on\">Packages\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cfigcaption>\u003cb>Folded: unchanged.\u003c/b> Outer screen 466 x 678 pt, drawn at half size. Card in Hand opens only on two pages side by side (\u003ccode>PackagesTab.twoPages\u003c/code>), so the
