nt-weight:600; }\n.tablewrap { overflow-x:auto; }\nfigure { margin:24px 0; }\nfigure[hidden] { display:none; }\nfigcaption { margin-top:8px; max-width:80ch; }\nfigcaption b { font-size:17px; }\nfigcaption .m { display:block; font-family:var(--mono); font-size:12px; color:var(--inkSoft); margin-top:4px; }\n.fit { width:100%; overflow:hidden; }\nul.tags { margin:8px 0 0; padding-left:20px; color:var(--inkSoft); font-size:14px; max-width:80ch; }\n\n/* ---- text size: each style scales by its iOS Dynamic Type ratio (Apple Typography page, read 2026-11-18).\n   kb Body 17, kf Footnote 13, kc Caption 1 12, kt Title 2 22, at the default Large. 44 pt floors and pads do not scale. ---- */\n.duo, .folded { --kb:1; --kf:1; --kc:1; --kt:1; }\n[data-size=\"s\"]   { --kb:calc(15/17); --kf:calc(12/13); --kc:calc(11/12); --kt:calc(20/22); }\n[data-size=\"m\"]   { --kb:calc(16/17); --kf:calc(12/13); --kc:calc(11/12); --kt:calc(21/22); }\n[data-size=\"l\"]   { --kb:1; --kf:1; --kc:1; --kt:1; }\n[data-size=\"ax3\"] { --kb:calc(40/17); --kf:calc(33/13); --kc:calc(32/12); --kt:calc(44/22); }\n[data-size=\"ax5\"] { --kb:calc(53/17); --kf:calc(44/13); --kc:calc(43/12); --kt:calc(56/22); }\n/* the cap at xxxLarge: Footnote 19, Caption 1 18 (same page) */\n.capped { --kf:min(var(--kf0), calc(19/13)); --kc:min(var(--kc0), calc(18/12)); }\n.duo { --kf0:var(--kf); --kc0:var(--kc); }\n\n/* ---- device: iPhone Duo inner screen, open, 951 x 669 pt, 1 CSS px = 1 pt ---- */\n.duo { position:relative; width:951px; height:669px; background:var(--paper); outline:1px solid var(--ink); border-radius:12px; overflow:hidden; margin:1px;\n  font-family:-apple-system, system-ui, sans-serif; color:var(--ink); }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 16px; font-size:12px; font-weight:600; z-index:5; }\n.page { position:absolute; top:0; width:455.5px; overflow:hidden; }\n.page.l { left:0; bottom:0; } .page.r { left:495.5px; }\n.fold { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); }\n.fold span { position:absolute; top:200px; left:50%; transform:translateX(-50%) rotate(-90deg); font:11px var(--mono); color:var(--inkSoft); letter-spacing:1.2px; }\n.keys { position:absolute; left:0; right:0; top:var(--keys-top); bottom:0; background:var(--kbBg); z-index:6; padding:8px 6px; }\n.keys .row { display:flex; gap:6px; margin-bottom:8px; justify-content:center; }\n.keys .k { height:42px; flex:0 0 42px; background:var(--kbKey); border-radius:6px; display:grid; place-items:center; font-size:18px; color:var(--kbInk); }\n.keys .k.w { flex-basis:300px; font-size:14px; }\n.keys .note { position:absolute; left:12px; top:-1px; transform:translateY(-100%); font:10.5px var(--mono); color:var(--inkSoft); background:var(--paper); padding:2px 4px; }\n\n/* ---- app content: Cochin sets words, Menlo sets numbers (typography-cochin-and-mono). Line heights from Apple's leading column. ---- */\n.micro { font-family:var(--mono); font-size:calc(10.5px * var(--kc)); line-height:1.333; letter-spacing:1.2px; text-transform:uppercase; color:var(--inkSoft); }\n.who { font-family:var(--cochin); font-size:calc(22px * var(--kt)); line-height:1.27; font-weight:700; }\n.meta { font-family:var(--mono); font-size:calc(11px * var(--kc)); line-height:1.333; color:var(--inkSoft); }\n.hit { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }\n.pill { font-family:var(--mono); font-size:calc(11.5px * var(--kc)); line-height:1.333; border:1px solid var(--line); background:var(--card); border-radius:5px;\n  padding:8px 12px; color:var(--ink); text-align:center; }\n.post { font-weight:700; background:var(--accent); border-color:var(--accent); color:var(--card); }\n.lines { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.line { display:flex; gap:8px; min-height:45px; padding-left:4px; border-top:1px solid var(--line); background:var(--card); }\n.line:first-child { border-top:0; }\n.line .box { flex:0 0 45px; height:45px; display:grid; place-items:center; }\n.line .box i { width:30px; height:30px; border:1.5px solid var(--inkSoft); border-radius:6px; display:block; position:relative; }\n.line .t { flex:1; min-width:0; padding:12px 12px 12px 0; display:flex; flex-direction:column; gap:4px; }\n.line .t b { font-family:var(--cochin); font-size:calc(14px * var(--kb)); line-height:1.294; font-weight:600; display:flex; flex-wrap:wrap; justify-content:space-between; column-gap:8px; }\n.line .t b span { font-family:var(--mono); font-size:calc(12px * var(--kb)); line-height:1.294; color:var(--inkSoft); font-weight:400; }\n.line .t small { font-family:var(--cochin); font-size:calc(11.5px * var(--kb)); line-height:1.294; color:var(--inkSoft); }\n.line.done { background:var(--greenSoft); }\n.line.done .box i { background:var(--green); border-color:var(--green); }\n.line.done .box i::after { content:\"\"; position:absolute; left:9px; top:4px; width:8px; height:14px; border:solid var(--card); border-width:0 3px 3px 0; transform:rotate(45deg); }\n\n/* left page: the held state, drawn only for context. It is not part of this change. */\n.lp { position:absolute; left:16px; right:16px; top:calc(var(--sat) + 16px); display:flex; flex-direction:column; gap:12px; font-family:var(--cochin); }\n.rowx { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; }\n.rowx .ttl { font-weight:700; font-size:calc(17px * var(--kb)); line-height:1.294; }\n.count { font-family:var(--mono); font-size:calc(12px * var(--kc)); color:var(--inkSoft); }\n.field { min-height:48px; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:0 12px; display:flex; align-items:center; gap:8px;\n  font-size:calc(16px * var(--kb)); }\n.field .caret { width:2px; height:20px; background:var(--accent); }\n.chip { margin-left:auto; font-family:var(--mono); font-size:calc(11px * min(var(--kc), 1.5)); background:var(--manila); color:var(--manilaInk); border-radius:5px; padding:2px 6px; white-space:nowrap; }\n.soft { color:var(--inkSoft); font-size:calc(14px * var(--kb)); }\n.match { min-height:44px; display:flex; align-items:center; font-size:calc(14px * var(--kb)); }\n\n/* right page, the owner's pick of item 42: head pinned at the top, lines scroll, the Post bar pinned on the keys */\n/* The pin sits on the keys whatever its height (safeAreaInset); the lines get what is left. --pinh is set from the pin's own height. */\n.page.r { bottom:calc(669px - var(--keys-top)); display:flex; flex-direction:column; padding-top:var(--sat); padding-bottom:var(--pinh, 0px); }\n.head { flex:none; padding:16px 16px 8px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); background:var(--paper); z-index:2; }\n.mid { flex:1 1 auto; min-height:0; overflow:hidden; padding:8px 16px 0; }\n.page.r > .pin { position:absolute; left:0; right:0; bottom:0; z-index:3; }\n\n/* Stacked pin, as drawn in duo-hand-post-sender.html (B): a card inset 16, sentence over the button */\n.pin.stacked { padding:8px 16px; }\n.pin.stacked .offer { background:color-mix(in srgb, var(--manila) 50%, var(--paper)); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; align-items:flex-start; }\n.offer p, .bar p { margin:0; font-family:var(--cochin); font-size:calc(13px * var(--kf)); line-height:1.385; color:var(--ink); }\n\n/* Bar pins: full width of the page, a hairline on top, the tint of the offer */\n.bar { border-top:1px solid var(--line); background:color-mix(in srgb, var(--manila) 50%, var(--paper)); }\n.pin.onerow .bar { padding:8px 16px; display:flex; flex-wrap:wrap; align-items:center; column-gap:12px; }\n.pin.onerow .bar p { flex:1 1 160px; }\n.pin.onerow .bar .hit { flex:none; }\n.pin.button .bar { padding:4px 16px; }\n.pin.button .bar .hit { display:flex; width:100%; }\n.pin.button .bar .pill { width:100%; }\n\n/* After Post: the offer's own layout, hidden, holds the height; the receipt sits over it */\n.ghost { visibility:hidden; }\n.receipt { position:absolute; inset:0; display:flex; align-items:center; gap:12px; padding:0 16px; font-family:var(--mono); font-size:calc(12px * var(--kc)); line-height:1.333; color:var(--manilaInk); }\n.receipt span { font-family:var(--cochin); font-size:calc(13px * var(--kf)); line-height:1.385; color:var(--ink); }\n.receipt.refused .why { color:var(--red); }\n\n/* head scrolls with the lines: the pinned head collapses to the seller alone */\n.head.slim { padding:8px 16px; gap:0; }\n.head.slim .micro, .head.slim .meta { display:none; }\n\n/* tags: dashed outline on what exists today, and on what an option adds */\n[data-tag] { position:relative; }\n[data-tag]::before { content:attr(data-tag); position:absolute; right:4px; top:-9px; font:600 10.5px/14px -apple-system, system-ui, sans-serif; padding:0 4px;\n  background:var(--paper); z-index:4; white-space:nowrap; }\n.tag-new { outline:2px dashed var(--new); outline-offset:-2px; } .tag-new::before { color:var(--new); }\n.tag-today { outline:2px dashed var(--today); outline-offset:-2px; } .tag-today::before { color:var(--today); }\n.head[data-tag]::before { top:auto; bottom:2px; }\n.lines[data-tag]::before { top:2px; right:64px; }\n\n.folded { position:relative; width:191px; height:322px; border:1px solid var(--ink); border-radius:12px; background:var(--paper);\n  padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); font-size:12px; color:var(--inkSoft); }\n.folded b { font-family:var(--cochin); color:var(--ink); font-size:14px; display:block; margin-bottom:4px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\">Sample. No seller, card, price or count on this page is real. Fonts: Cochin and Menlo where the browser has them; heights below are what this page lays out, not a device reading.\u003c/div>\n\u003ch1>Card in Hand: a thinner pinned Post bar\u003c/h1>\n\u003cp class=\"sub\">Item 42, picked: the lines go back under the sender and the Post offer is pinned on the keys. The owner asked for a thinner pin. iPhone Duo, open pose, 951 x 669 pt, fold 40 pt at 455.5 pt; keys up, panel drawn from y 405 pt. Status bar foot drawn at 20 pt (unmeasured). The native app ships light only; dark is a preview from the dark token set.\u003c/p>\n\n\u003cnav aria-label=\"Text size\">\n  \u003cspan class=\"lab\">Text size\u003c/span>\n  \u003ca data-z=\"s\" href=\"#z=s\">S\u003c/a>\u003ca data-z=\"m\" href=\"#z=m\">M\u003c/a>\u003ca data-z=\"l\" href=\"#z=l\">L (default)\u003c/a>\u003ca data-z=\"ax3\" href=\"#z=ax3\">AX3\u003c/a>\u003ca data-z=\"ax5\" href=\"#z=ax5\">AX5\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Theme\">\n  \u003cspan class=\"lab\">Theme\u003c/span>\n  \u003ca data-t=\"light\" href=\"#t=light\">Light\u003c/a>\u003ca data-t=\"dark\" href=\"#t=dark\">Dark (preview)\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"States\">\n  \u003cspan class=\"lab\">Show\u003c/span>\n  \u003ca data-s=\"\" href=\"#\">All\u003c/a>\n  \u003ca data-s=\"stacked\" href=\"#s=stacked\">Stacked pin, as drawn\u003c/a>\n  \u003ca data-s=\"onerow\" href=\"#s=onerow\">One-row pin\u003c/a>\n  \u003ca data-s=\"button\" href=\"#s=button\">Button-only pin\u003c/a>\n  \u003ca data-s=\"capped\" href=\"#s=capped\">One-row pin, capped text\u003c/a>\n  \u003ca data-s=\"slimhead\" href=\"#s=slimhead\">Capped, slim head\u003c/a>\n  \u003ca data-s=\"posted\" href=\"#s=posted\">After Post\u003c/a>\n  \u003ca data-s=\"refused\" href=\"#s=refused\">Refused Post\u003c/a>\n  \u003ca data-s=\"folded\" href=\"#s=folded\">Folded\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Hide an option\">\n  \u003cspan class=\"lab\">Hide\u003c/span>\n  \u003cbutton type=\"button\" data-hide=\"stacked\">Hide stacked pin\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"onerow\">Hide one-row pin\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"button\">Hide button-only pin\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"capped\">Hide capped text\u003c/button>\n  \u003cbutton type=\"button\" data-hide=\"slimhead\">Hide slim head\u003c/button>\n\u003c/nav>\n\n\u003cdiv class=\"tablewrap\">\n\u003ctable class=\"sum\" id=\"sum\" aria-label=\"Measured pin heights\">\n  \u003cthead>\u003ctr>\u003cth>Pin height, pt (from the pin's top edge to y 405)\u003c/th>\u003cth>S\u003c/th>\u003cth>M\u003c/th>\u003cth>L\u003c/th>\u003cth>AX3\u003c/th>\u003cth>AX5\u003c/th>\u003c/tr>\u003c/thead>\n  \u003ctbody>\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cp class=\"sub\" id=\"sumnote\">Each figure is read from this page's own layout when it loads: the pin's height in pt, and the lines it leaves above itself. \u003cspan class=\"pick\">Recommended: the one-row pin, 61 pt at S, M and L\u003c/span>, less than half the drawn 128 pt. At AX3 and AX5 its text stops at xxxLarge (87 pt) and the head keeps the seller only, so a whole line still shows above the bar at AX5.\u003c/p>\n\n\u003c!-- Folded first (ios-apps, Mockups). Card in Hand does not open folded. -->\n\u003cfigure id=\"s-folded\" data-state=\"folded\">\n  \u003cdiv class=\"folded\" data-device=\"iphone-duo-folded\">\n    \u003cb>Folded: unchanged\u003c/b>\n    Card in Hand opens only on two pages side by side (\u003ccode>PackagesTab.twoPages\u003c/code>). The folded screen keeps today's one-page Packages. Nothing to draw.\n  \u003c/div>\n  \u003cfigcaption>\u003cb>Folded.\u003c/b> No change in this lane.\u003c/figcaption>\n\u003c/figure>\n\n\u003ctemplate id=\"left\">\n  \u003cdiv class=\"page l\">\u003cdiv class=\"lp\">\n    \u003cdiv class=\"rowx\">\u003cspan class=\"ttl\">Mail day\u003c/span>\u003cspan class=\"count\">41 in · 23 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n    \u003cdiv class=\"field\">Path to Exile\u003cspan class=\"caret\">\u003c/span>\u003cspan class=\"chip\">1 held\u003c/span>\u003c/div>\n    \u003cdiv class=\"rowx\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n    \u003cspan class=\"micro\">Matches\u003c/span>\n    \u003cdiv class=\"match\">Path to Exile\u003c/div>\n  \u003c/div>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"head\">\n  \u003cdiv class=\"head tag-today\" data-tag=\"Today: sender\">\n    \u003cspan class=\"micro\">It came from\u003c/span>\n    \u003cspan class=\"who\">Gamma Cards\u003c/span>\n    \u003cspan class=\"meta\">ordered 2026-07-01\u003c/span>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"lines-open\">\n  \u003cdiv class=\"mid\">\u003cdiv class=\"lines tag-today\" data-tag=\"Today: lines\">\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$0.42\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Path to Exile\u003cspan>$0.31\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Swords to Plowshares\u003cspan>$0.55\u003c/span>\u003c/b>\u003csmall>Sample Set · LP\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Ponder\u003cspan>$0.18\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Preordain\u003cspan>$0.20\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"lines-posted\">\n  \u003cdiv class=\"mid\">\u003cdiv class=\"lines\">\n    \u003cdiv class=\"line done\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$0.42\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line done\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Path to Exile\u003cspan>$0.31\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Swords to Plowshares\u003cspan>$0.55\u003c/span>\u003c/b>\u003csmall>Sample Set · LP\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Ponder\u003cspan>$0.18\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n    \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Preordain\u003cspan>$0.20\u003c/span>\u003c/b>\u003csmall>Sample Set · NM\u003c/small>\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"chrome\">\n  \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>●●● 100%\u003c/span>\u003c/div>\n  \u003cdiv class=\"keys\">\n    \u003cspan class=\"note\">keys panel from y 405 · frame from y 449\u003c/span>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">q\u003c/span>\u003cspan class=\"k\">w\u003c/span>\u003cspan class=\"k\">e\u003c/span>\u003cspan class=\"k\">r\u003c/span>\u003cspan class=\"k\">t\u003c/span>\u003cspan class=\"k\">y\u003c/span>\u003cspan class=\"k\">u\u003c/span>\u003cspan class=\"k\">i\u003c/span>\u003cspan class=\"k\">o\u003c/span>\u003cspan class=\"k\">p\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">a\u003c/span>\u003cspan class=\"k\">s\u003c/span>\u003cspan class=\"k\">d\u003c/span>\u003cspan class=\"k\">f\u003c/span>\u003cspan class=\"k\">g\u003c/span>\u003cspan class=\"k\">h\u003c/span>\u003cspan class=\"k\">j\u003c/span>\u003cspan class=\"k\">k\u003c/span>\u003cspan class=\"k\">l\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">z\u003c/span>\u003cspan class=\"k\">x\u003c/span>\u003cspan class=\"k\">c\u003c/span>\u003cspan class=\"k\">v\u003c/span>\u003cspan class=\"k\">b\u003c/span>\u003cspan class=\"k\">n\u003c/span>\u003cspan class=\"k\">m\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k w\">space\u003c/span>\u003cspan class=\"k\" style=\"flex-basis:90px;font-size:14px\">done\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/template>\n\n\u003c!-- Stacked pin: the height drawn in duo-hand-post-sender.html, option B. -->\n\u003cfigure id=\"s-stacked\" data-state=\"stacked\" data-opt=\"stacked\" data-focus=\"pin-stacked\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\" data-fill=\"head lines-open\">\n      \u003cdiv class=\"pin stacked tag-new\" id=\"pin-stacked\" data-tag=\"New: pin, as drawn\">\n        \u003cdiv class=\"offer\">\n          \u003cp>Your held card came with this envelope. Nothing is checked in until you post.\u003c/p>\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Stacked pin, as drawn.\u003c/b> The card from the drawn option: sentence over the button, inset 16 pt, 8 pt clear above and below. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- One-row pin: the recommended step. -->\n\u003cfigure id=\"s-onerow\" data-state=\"onerow\" data-opt=\"onerow\" data-focus=\"pin-onerow\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\" data-fill=\"head lines-open\">\n      \u003cdiv class=\"pin onerow tag-new\" id=\"pin-onerow\" data-tag=\"New: one-row pin\">\n        \u003cdiv class=\"bar\">\n          \u003cp>Your held card came with this envelope.\u003c/p>\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>One-row pin.\u003c/b> A full-width bar on the keys: the sentence beside the button, hairline on top. \"Nothing is checked in until you post\" moves to the button's VoiceOver hint. When the two do not fit on one row, the button drops under the sentence. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- Button-only pin: the thinnest that keeps a 44 pt hit frame. -->\n\u003cfigure id=\"s-button\" data-state=\"button\" data-opt=\"button\" data-focus=\"pin-button\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\" data-fill=\"head lines-open\">\n      \u003cdiv class=\"pin button tag-new\" id=\"pin-button\" data-tag=\"New: button-only pin\">\n        \u003cdiv class=\"bar\">\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Button-only pin.\u003c/b> The button alone, full width, in a 44 pt hit frame with 4 pt above and below. Both sentences move to VoiceOver; the left page's \"1 held\" chip and the button's \"1 held\" carry the reason. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- Large text: the one-row pin with its text capped at xxxLarge. -->\n\u003cfigure id=\"s-capped\" data-state=\"capped\" data-opt=\"capped\" data-focus=\"pin-capped\" data-ax>\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\" data-fill=\"head lines-open\">\n      \u003cdiv class=\"pin onerow capped tag-new\" id=\"pin-capped\" data-tag=\"New: text capped at xxxLarge\">\n        \u003cdiv class=\"bar\">\n          \u003cp>Your held card came with this envelope.\u003c/p>\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>One-row pin, capped text.\u003c/b> The bar's text stops growing at xxxLarge (Footnote 19, Caption 1 18), as the held chip does; a long press shows the label large. The lines and the sender scale in full. Below xxxLarge it matches the one-row pin, so this figure draws at AX5 unless AX3 or AX5 is picked. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- Large text: capped bar plus a head that keeps only the seller. -->\n\u003cfigure id=\"s-slimhead\" data-state=\"slimhead\" data-opt=\"slimhead\" data-focus=\"head-slim\" data-ax>\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\">\n      \u003cdiv class=\"head slim tag-new\" id=\"head-slim\" data-tag=\"New: head keeps the seller only\">\n        \u003cspan class=\"micro\">It came from\u003c/span>\n        \u003cspan class=\"who\">Gamma Cards\u003c/span>\n        \u003cspan class=\"meta\">ordered 2026-07-01\u003c/span>\n      \u003c/div>\n      \u003cdiv data-fill=\"lines-open\" style=\"display:contents\">\u003c/div>\n      \u003cdiv class=\"pin onerow capped tag-new\" data-tag=\"New: text capped at xxxLarge\">\n        \u003cdiv class=\"bar\">\n          \u003cp>Your held card came with this envelope.\u003c/p>\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Capped, slim head.\u003c/b> At accessibility sizes only, the pinned head drops \"It came from\" and the date and keeps the seller; the two move to the head's VoiceOver label. This figure draws at AX5 unless AX3 or AX5 is picked. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- After Post, on the recommended pin. -->\n\u003cfigure id=\"s-posted\" data-state=\"posted\" data-focus=\"pin-posted\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\" data-fill=\"head lines-posted\">\n      \u003cdiv class=\"pin onerow capped tag-new\" id=\"pin-posted\" data-tag=\"New: receipt holds the bar's height\">\n        \u003cdiv class=\"bar ghost\" aria-hidden=\"true\">\n          \u003cp>Your held card came with this envelope.\u003c/p>\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"receipt\">\u003cspan>Posted.\u003c/span>2 cards checked in · 1 was held\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>After Post.\u003c/b> The receipt takes the bar's place at the bar's height, as today's receipt does: the hidden offer sizes it, so the lines above do not grow into the bar. It is one row, like the bar, and capped like it. It holds until the next card or New envelope. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- After a refused Post: the same slot, the refusal in red Cochin as HandScreen.receiptBox sets it. -->\n\u003cfigure id=\"s-refused\" data-state=\"refused\" data-focus=\"pin-refused\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left chrome\">\n    \u003cdiv class=\"page r\" data-fill=\"head lines-open\">\n      \u003cdiv class=\"pin onerow capped tag-new\" id=\"pin-refused\" data-tag=\"New: refusal holds the bar's height\">\n        \u003cdiv class=\"bar ghost\" aria-hidden=\"true\">\n          \u003cp>Your held card came with this envelope.\u003c/p>\n          \u003cspan class=\"hit\">\u003cspan class=\"pill post\">Post 2 cards here, 1 held\u003c/span>\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"receipt refused\">\u003cspan>Not posted.\u003c/span>\u003cspan class=\"why\">Type the card again to post.\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Refused Post.\u003c/b> The ledger changed since the offer, so Post saved nothing. The left page's error says why; the slot keeps its height, so no line moves. \u003cspan class=\"m\" data-m>\u003c/span>\u003c/figcaption>\n\u003c/figure>\n\u003c/main>\n\n\u003cscript>\n// Fill each frame from its templates, so the shared parts are drawn once. A fill goes in before the element's own children.\ndocument.querySelectorAll('[data-fill]').forEach(el => {\n  const frag = document.createDocumentFragment();\n  el.getAttribute('data-fill').split(' ').forEach(id => frag.append(document.getElementById(id).content.cloneNode(true)));\n  if (el.style.display === 'contents') { el.replaceWith(frag); } else { el.prepend(frag); }\n});\n\nconst SIZES = ['s', 'm', 'l', 'ax3', 'ax5'];\nconst KEYS_TOP = 405;\nconst state = { s: '', z: 'l', t: '' };\nconst hidden = new Set();\n\n// Measure one frame at its own size, in pt (1 CSS px = 1 pt, zoom off).\nfunction measure(duo) {\n  const r = duo.querySelector('.page.r'), pin = r.querySelector('.pin'), mid = r.querySelector('.mid');\n  r.style.setProperty('--pinh', pin.getBoundingClientRect().height + 'px');\n  const top = duo.getBoundingClientRect().top;\n  const pinTop = pin.getBoundingClientRect().top - top, midTop = mid.getBoundingClientRect().top - top;\n  const win = Math.max(0, pinTop - midTop);\n  let y = 8 + 1, whole = 0, partial = 0;  // mid's 8 pt pad and the list's 1 pt border\n  for (const line of mid.querySelectorAll('.line')) {\n    const h = line.getBoundingClientRect().height;\n    if (y + h \u003c= win) { whole++; y += h; } else { partial = Math.max(0, win - y); break; }\n  }\n  const headFoot = r.querySelector('.head').getBoundingClientRect().bottom - top;\n  return { pin: Math.round(KEYS_TOP - pinTop), pinTop: Math.round(pinTop), win: Math.round(win), whole, partial: Math.round(partial),\n    over: Math.max(0, Math.round(headFoot - pinTop)) };\n}\nfunction sizeFor(fig, z) { return fig.hasAttribute('data-ax') && !z.startsWith('ax') ? 'ax5' : z; }\nfunction say(m, z) {\n  const lines = m.whole === 0 && m.partial === 0 ? 'no line shows' :\n    `${m.whole} whole ${m.whole === 1 ? 'line' : 'lines'}` + (m.partial ? ` and the top ${m.partial} pt of the next` : '');\n  return `${z.toUpperCase()}: pin ${m.pin} pt, y ${m.pinTop} to ${KEYS_TOP}. Lines window ${m.win} pt above it: ${lines}.` +\n    (m.over ? ` The pin covers the foot of the sender head by ${m.over} pt.` : '');\n}\n// The table: every pin at every size, read from the layout, then the frames go back to the chosen size.\nfunction table() {\n  const rows = [['stacked', 'Stacked pin, as drawn'], ['onerow', 'One-row pin (recommended at S, M, L)'], ['button', 'Button-only pin'],\n    ['capped', 'One-row pin, capped text'], ['slimhead', 'Capped, slim head (recommended at AX3, AX5)']];\n  const body = document.querySelector('#sum tbody'); body.textContent = '';\n  for (const [id, name] of rows) {\n    const duo = document.querySelector(`#s-${id} .duo`), fig = duo.closest('figure'), was = fig.hidden;\n    fig.hidden = false; duo.style.zoom = 1;\n    const tr = document.createElement('tr'); if (id === 'onerow' || id === 'slimhead') tr.className = 'rec';\n    tr.innerHTML = `\u003ctd>${name}\u003c/td>` + SIZES.map(z => {\n      duo.dataset.size = z; const m = measure(duo);\n      const ln = `${m.whole} ${m.whole === 1 ? 'line' : 'lines'}${m.partial ? ' + part' : ''}`;\n      return `\u003ctd title=\"lines window ${m.win} pt\">${m.pin} \u003csmall>(${ln})\u003c/small>\u003c/td>`;\n    }).join('');\n    body.append(tr); fig.hidden = was;\n  }\n}\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; d.style.zoom = Math.min(1, w.clientWidth / 951); });\n}\nfunction parse() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  state.s = h.get('s') || ''; state.z = SIZES.includes(h.get('z')) ? h.get('z') : 'l'; state.t = ['light', 'dark'].includes(h.get('t')) ? h.get('t') : '';\n}\nfunction link(k, v) {\n  const h = new URLSearchParams(location.hash.slice(1)); v ? h.set(k, v) : h.delete(k); return '#' + h.toString();\n}\nfunction route() {\n  parse();\n  if (state.t) document.documentElement.dataset.theme = state.t; else delete document.documentElement.dataset.theme;\n  document.querySelectorAll('figure').forEach(f => { f.hidden = false; const d = f.querySelector('.duo'); if (d) { d.dataset.size = sizeFor(f, state.z); d.style.zoom = 1; } });\n  table();\n  document.querySelectorAll('figure').forEach(f => {\n    const d = f.querySelector('.duo'); if (d) { d.dataset.size = sizeFor(f, state.z); f.querySelector('[data-m]').textContent = say(measure(d), d.dataset.size); }\n    f.hidden = (state.s && f.dataset.state !== state.s) || hidden.has(f.dataset.opt);\n  });\n  document.querySelectorAll('nav a[data-z]').forEach(a => { a.href = link('z', a.dataset.z); a.setAttribute('aria-current', String(a.dataset.z === state.z)); });\n  document.querySelectorAll('nav a[data-t]').forEach(a => { a.href = link('t', a.dataset.t);\n    const dark = state.t ? state.t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; a.setAttribute('aria-current', String((a.dataset.t === 'dark') === dark)); });\n  document.querySelectorAll('nav a[data-s]').forEach(a => { a.href = link('s', a.dataset.s); a.setAttribute('aria-current', String(a.dataset.s === state.s)); });\n  fit();\n}\ndocument.querySelectorAll('[data-hide]').forEach(b => {\n  const label = b.textContent.replace(/^Hide /, '');\n  b.addEventListener('click', () => {\n    const o = b.dataset.hide; hidden.has(o) ? hidden.delete(o) : hidden.add(o);\n    b.textContent = (hidden.has(o) ? 'Show ' : 'Hide ') + label; route();\n  });\n});\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}</script>

<script>

/* ---------- the stalled read: window.ROADMAP_BUILD.stalled, written by the build; the page only draws it ---------- */
const DECIDES = { owner: "Owner", coordinator: "Coordinator", triage: "Triage" };
const stall = (() => {

  if (!Array.isArray(r.steps)) return { steps: null, why: typeof r.why === "string" && r.why ? r.why : "unknown (the build gave no reason)", plain: "the build could not read the steps" };

/* ---------- read-at stamps and live work ---------- */
function readAt() {

/* Open pull requests with each next act (step status-tab-lists-coord-prs). The build bakes `act`, `owner`, `ageHours` and `red` on each pull from the
   live file's ledger (build.py live_ledger); this only draws them. A pull with no act reads "act unknown", never blank. `span` turns milliseconds into
   "3 hours". The same code is in skills/roadmap/page/index.html: each page is one file with its own script, so the two cannot share it. */
const PR_RED_GLY = '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6.5" fill="currentColor"/><path d="M7 3.4v4.4" stroke="var(--surface)" stroke-width="1.9" stroke-linecap="round"/><circle cx="7" cy="10.3" r="1.1" fill="var(--surface)"/></svg>';

  const known = !w.ledgerWhy, ring = '<span class="rg unk" aria-hidden="true"></span>';
  const unwrap = (r) => String(r).replace(/^unknown \(([\s\S]*)\)$/, "$1");
  const missing = (p) => !known || typeof p.act !== "string" || !p.act || p.act === "act unknown";
  const red = (p) => known && !missing(p) && p.red === true;
  const rows = [...pulls.filter(red), ...pulls.filter((p) => !red(p))];
  const owner = (p) => (typeof p.owner === "string" && p.owner ? p.owner : "unknown");
  const laneWhy = unwrap(w.laneWhy || "the build gave no reason");
  const line = (p) => {
    if (missing(p)) return `<span class="act"><span class="unk">${ring} act unknown${known ? ": " + esc(p.actWhy || "no ledger row for this pull request") : ""}</span></span>`;
    const lane = p.act === "lane unknown", mark = red(p) ? `<span class="tag ic redm" role="img" aria-label="Red" title="Red">${PR_RED_GLY}</span>` : "";
    const parts = [lane ? `<span class="unk" title="${esc(laneWhy)}">${ring} lane unknown</span>` : `<b>${esc(p.act)}</b>`, "owner " + esc(owner(p))];
    if (typeof p.ageHours === "number" && Number.isFinite(p.ageHours) && p.ageHours >= 0) parts.push("waited " + span(p.ageHours * 36e5));
    return `<span class="act">${mark}${parts.join(", ")}</span>`;
  };
  let cts = "";
  if (rows.length && !known) cts = '<span class="cts unk">owners unknown</span>';
  else if (rows.length) {
    const by = {};

    const nred = rows.filter(red).length;
    const list = Object.entries(by).sort((a, b) => (a[0] === "unknown") - (b[0] === "unknown") || b[1] - a[1] || a[0].localeCompare(b[0])).map(([o, n]) => `${esc(o)} ${n}`).join(", ");

    head: `<h4 class="prh"><span>Open pull requests</span>${cts}</h4>${why}`,

function liveWork() {

    return `<div class="livenone"><p><span class="lh">Live work</span> <span class="unk"><span class="rg unk" aria-hidden="true"></span> not read: ${plain}</span></p>`
      + (w.read ? `<details><summary>What the build said</summary><pre>${esc(reason(w.read))}</pre></details>` : "") + "</div>";
  }
  const day = (iso) => { const d = when(iso); return d ? fmt(d.toISOString()) : ""; };
  const link = (url, text) => (/^https?:\/\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>` : text);
  const threads = Array.isArray(w.threads) ? w.threads : null;

    // A .tag pill would read as a thread state (failed and stopped share --due), so an unknown count takes the panel's not-read ring.

/* The stalled band: a step marked in progress with no live lane and no open pull request, or a waiting item routed to a lane

function stalledBand() {
  if (!stall.steps) {
    return `<div class="livenone" id="stBand"><p><span class="lh">Stalled steps</span> <span class="unk"><span class="rg unk" aria-hidden="true"></span> not read: ${esc(stall.plain)}</span></p>`
      + `<details><summary>What the build said</summary><pre>${esc(reason(stall.why))}</pre></details></div>`;

  const stl = stall.steps.filter((x) => holds(x.id, "stalled")), pzd = stall.paused.filter((id) => holds(id, "paused"));
  const items = stall.items, n = stl.length + (items ? items.length : 0);
  const title = (id) => { const s = steps.find((x) => x.id === id); return s && s.title ? s.title : "Untitled step"; };
  const head = n
    ? `<div class="sth"><h3>${rg("stalled")}Stalled: <span class="num">${n}</span></h3><span class="lead">No live lane and no open pull request. Triage resumes, pauses or closes each.</span></div>`
    : items ? `<div class="sth calm"><h3>${rg("done")}No stalled step</h3></div>`
    : `<div class="sth calm"><h3>No step is stalled</h3></div>`;

      const p = (steps.find((x) => x.id === id) || {}).paused || {}, at = when(p.at), who = DECIDES[p.decides];

      return `<li><span class="k"><span class="id">${esc(id)}</span></span><span><button type="button" class="tx" data-go="${esc(id)}">${esc(title(id))}</button>${p.why ? `<span class="fx why">${esc(p.why)}</span>` : ""}${line ? `<span class="fx">${line}</span>` : ""}</span></li>`;

/* ---------- where you are ---------- */

}

/* ---------- steps ---------- */
// A step is new when its updatedAt is later than the owner's last visit (VISIT, read once at load). The words show on the first marked row of a drawing; each later one is the dot.

// A step updated since the last visit draws open, and the done fold of its phase opens with it (the done list sorts the newest first, so it is at the top).

  const d = when(s.updatedAt), open = ui.open.has(s.id), noteOpen = ui.notes.has(s.id), lbl = stl ? LBL.stalled : pzd ? LBL.paused : LBL[s.status] || LBL.todo;
  return `<li class="${s.status}${stl ? " stl-row" : ""}${pzd ? " pzd-row" : ""}${open ? " open" : ""}" id="s-${esc(s.id)}">
    <button type="button" class="rrow" data-row="${esc(s.id)}" aria-expanded="${open}" aria-label="${esc(s.id)}, ${lbl}: ${esc(s.title || "Untitled step")}${tags.filter(Boolean).length ? ". " + esc(tags.filter(Boolean).join(". ")) : ""}">${rg(stl ? "stalled" : pzd ? "paused" : s.status)}<span class="id">${esc(s.id)}</span><span class="ttl">${esc(s.title || "Untitled step")}</span>
      <span class="meta">${tags[0] ? `<span class="tag next">${tags[0]}</span>` : ""}${tags[1] ? '<span class="tag blk">Blocked</span>' : ""}${lw ? `<span class="tag landed" title="Merged; waiting for triage to close the step">${esc(tags[2])}</span>` : ""}${stl ? `<span class="tag stl ic" role="img" aria-label="Stalled" title="Stalled: no live lane and no open pull request">${GLY.stalled}</span>` : ""}${pzd ? `<span class="tag pzd ic" role="img" aria-label="Paused" title="Paused: ${esc((s.paused || {}).why || "")}">${GLY.paused}</span>` : ""}${isNew ? stepMark(s) : ""}</span><span class="chev" aria-hidden="true">▶</span></button>
    <div class="rbody"><dl>

      ${s.ask ? `<dt>Ask</dt><dd><div class="ask"><span>${esc(s.ask)}</span><button type="button" class="copy" data-copy="${esc(s.ask)}">Copy</button></div></dd>` : ""}
      ${d ? `<dt>When</dt><dd><span class="num" style="font-size:13px">${esc(fmt(d.toISOString()))}</span></dd>` : ""}

function pager(scope, page, pages, total, noun) {

const clampPage = (p, pages) => Math.max(0, Math.min(p, pages - 1));

/* ---------- side cards ---------- */
function trendCard() {
  const ci = cullInfo(); if (!ci || ci.pts.length < 2) return "";
  return `<section class="box"><header><h3>Clean-up numbers over time</h3><span class="lbl">${ci.pts.length} readings</span></header>
    <div class="trend">${CULL_KEYS.map((m) => { const sr = series(ci, m.k); if (sr.length < 2) return ""; const v = sr.map((x) => x.v), cur = v[v.length - 1];
      const markIx = ci.closeIx > 0 ? sr.findIndex((x) => x.i === ci.closeIx) : -1;
      return `<div class="trow"><span class="k">${m.n}</span>${spark(v, { w: 160, labels: sr.map((x) => x.label), markIx })}<span class="r"><span class="num">${num(cur)}</span>${delta(cur, ci.base[m.k], { pctMode: true })}</span></div>`; }).join("")}</div>
    <div class="legend">${ci.closeIx > 0 && ci.closeIx < ci.pts.length - 1 ? "<span><i></i>cull ended</span>" : ""}<span>% against the start · down is good</span></div></section>`;
}
function burnCard() {
  if (!steps.length) return "";
  const today = new Date(), days = [];
  for (let i = 4; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push(d); }
  const keys = days.map(dayKey);
  const doneK = steps.filter((s) => s.status === "done").map((s) => { const d = when(s.updatedAt); return d ? dayKey(d) : ""; });
  const touched = keys.map((k) => steps.filter((s) => { const d = when(s.updatedAt); return d && dayKey(d) === k; }).length);
  const cum = keys.map((k) => doneK.filter((x) => x <= k).length);

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Steps done by day">`;
  [0, .5, 1].forEach((f) => { const y = H - 16 - (H - 26) * f; s += `<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/>`; });
  days.forEach((d, i) => {

    s += `<rect x="${x + 2}" y="${H - 16 - hT}" width="12" height="${Math.max(hT, 1)}" rx="2" fill="var(--faint)"/>`;
    s += `<text x="${x - 8}" y="${H - 19 - hC}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${cum[i]}</text>`;
    s += `<text x="${x}" y="${H - 3}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${d.toLocaleDateString("en-US", { timeZone: CT, weekday: "short" })}</text>`;
    s += `<rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-tip="${esc(dayLabel(d))}: ${cum[i]} done in total · ${touched[i]} steps changed that day"/>`;
  });

    <div class="burn">${s}</div><div class="legend"><span><span class="dot"></span> done so far</span><span><span class="dot" style="background:var(--faint)"></span> steps changed that day</span></div></section>`;
}

}

/* ---------- changes view ---------- */

}
function goStep(id) {

  if (PH.some((p) => p.k === k)) ui.phase = k;
  const size = pageSize();
  if (s.status === "done") { ui.folds.add(k); ui.donePage[k] = Math.floor(doneList(k).findIndex((x) => x.id === id) / size); }
  else ui.page[k] = Math.floor(openList(k).findIndex((x) => x.id === id) / size);
  ui.open.add(id);
  setView("plan"); renderPlan();
  const li = document.getElementById("s-" + id);
  if (li) { li.scrollIntoView({ behavior: "smooth", block: "center" }); const b = li.querySelector(".rrow"); if (b) b.focus({ preventScroll: true }); }
}
root.addEventListener("click", (e) => {
  const hit = (sel) => e.target.closest(sel);
  let n;
  if ((n = hit("[data-ask]"))) { const ask = askText(); copyText(ask, n, () => { const box = $("svAsk"); box.value = ask; box.hidden = false; box.select(); toast("Select the text in the box and copy it."); }); return; }
  if ((n = hit("[data-copy]"))) { copyText(n.dataset.copy, n, () => { const sp = n.previousElementSibling; if (sp) { const r = document.createRange(); r.selectNodeContents(sp); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Selected. Copy it with your keyboard."); }); return; }
  if ((n = hit("[data-more]"))) { const id = n.dataset.more, c = n.previousElementSibling, shut = c.classList.toggle("clamp"); shut ? ui.notes.delete(id) : ui.notes.add(id); n.textContent = shut ? "Show all" : "Show less"; return; }
  if ((n = hit("[data-go]"))) { goStep(n.dataset.go); return; }
  if ((n = hit("[data-view-go]"))) { setView(n.dataset.viewGo); window.scrollTo({ top: 0 }); return; }
  if ((n = hit("[data-view]"))) { setView(n.dataset.view); return; }
  if ((n = hit("[data-phase]"))) { ui.phase = n.dataset.phase; setView("plan"); renderPlan(); const f = [...root.querySelectorAll("[data-phase]")].find((b) => b.dataset.phase === ui.phase); if (f) f.focus(); return; }
  if ((n = hit("[data-pg]"))) {
    const sc = n.dataset.scope, dir = n.dataset.pg === "next" ? 1 : -1, k = shownPhase();
    if (sc === "log") ui.logPage += dir; else if (sc === "done") ui.donePage[k] = (ui.donePage[k] || 0) + dir; else ui.page[k] = (ui.page[k] || 0) + dir;
    if (sc === "log") renderLog(); else renderPhase();
    const btn = root.querySelector(`[data-scope="${sc}"][data-pg="${n.dataset.pg}"]:not(:disabled)`) || root.querySelector(`[data-scope="${sc}"][data-pg]:not(:disabled)`);
    if (btn) btn.focus({ preventScroll: true });
    const top = sc === "log" ? $("svDays") : root.querySelector("#svPhases .rsteps");
    if (top && top.getBoundingClientRect().top < 60) top.scrollIntoView({ block: "start" });
    return;
  }
  if ((n = hit("[data-how]"))) { ui.how = !ui.how; renderPhase(); const x = root.querySelector("[data-how]"); if (x) x.focus(); return; }

});
// The view switch takes the arrow keys, as a tab row does.
root.addEventListener("keydown", (e) => {
  const t = e.target.closest && e.target.closest("[data-view]"); if (!t || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  e.preventDefault();

const tip = $("svTip");
root.addEventListener("pointerover", (e) => { const el = e.target.closest && e.target.closest("[data-tip]"); if (!el) { tip.classList.remove("on"); return; } tip.textContent = el.dataset.tip; tip.classList.add("on"); });

// Rows are measured once they show, so the first draw may change the page size: draw again then.
let built = false;
function shown() {
  if (!built) { built = true; build(); if (hasData && measureRows()) { ui.page = phaseMap(); renderPlan(); } return; }
  if (hasData && measureRows()) { ui.page = phaseMap(); renderPlan(); }
}
document.addEventListener("statusshown", shown);
let lastSize = pageSize(), sizeT = null;

  }, 150);

})();
