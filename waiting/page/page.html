s=\"dt\">×2 · Test Set · Near Mint\u003c/div>\u003c/div>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cdiv class=\"txt\">\u003cdiv class=\"top\">\u003cspan class=\"nm\">Counterspell\u003c/span>\u003cspan class=\"pr\">$2.00\u003c/span>\u003c/div>\u003cdiv class=\"dt\">Test Set · Near Mint\u003c/div>\u003c/div>\u003c/div>\n      \u003c/article>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cnav class=\"tabs\" aria-label=\"Tabs\">\n    \u003cspan class=\"tab cur\">\u003cb>\u003c/b>Packages\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Tally\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Orphaned\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Ledger\u003c/span>\n  \u003c/nav>\n\u003c/section>\n\n\u003c!-- State: after a tap on \"0 stamped\". -->\n\u003csection class=\"frame\" data-device=\"iphone-duo-folded\" data-state=\"tap-cell\" aria-label=\"Packages, after a tap on 0 stamped\" hidden>\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n  \u003cheader class=\"mast\">\u003cspan class=\"seal\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"name\">Manifest\u003c/span>\u003cspan class=\"fig\">4 left · $4.00\u003c/span>\u003c/header>\n  \u003cdiv class=\"slot\">\u003c/div>\n\n  \u003cdiv id=\"stamp-choice-tap\">\n    \u003cdiv class=\"ruled\">\n      \u003cdiv class=\"rule\">\u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"cell on\" aria-pressed=\"true\">0 stamped \u003cspan class=\"g\">●\u003c/span>\n          \u003cspan class=\"tag new right\">\u003cspan>New: a tap filters to stamped\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"rule thin\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"list\">\n      \u003cdiv class=\"empty\" aria-label=\"No packages shown\">\n        \u003cspan class=\"tag new\">\u003cspan>New: an empty list, no line says why\u003c/span>\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cnav class=\"tabs\" aria-label=\"Tabs\">\n    \u003cspan class=\"tab cur\">\u003cb>\u003c/b>Packages\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Tally\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Orphaned\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Ledger\u003c/span>\n  \u003c/nav>\n\u003c/section>\n\n\u003c!-- State: the same editor on the open Duo, left page. The right page is not under decision (item 35). -->\n\u003csection class=\"open\" data-device=\"iphone-duo-unfolded\" data-state=\"unfolded\" aria-label=\"Packages, open Duo, stamp editor open\" hidden>\n  \u003cdiv class=\"pg l\">\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>\u003c/span>\u003c/div>\n  \u003cheader class=\"mast\">\u003cspan class=\"seal\" aria-hidden=\"true\">\u003c/span>\u003cspan class=\"name\">Manifest\u003c/span>\u003cspan class=\"fig\">4 left · $4.00\u003c/span>\u003c/header>\n  \u003cdiv class=\"slot\">\u003c/div>\n\n  \u003cdiv id=\"stamp-choice-open\">\n    \u003cdiv class=\"ruled\">\n      \u003cdiv class=\"rule\">\u003c/div>\n      \u003cdiv class=\"row\">\n        \u003cdiv class=\"cell\">0 stamped \u003cspan class=\"g\">○\u003c/span>\n          \u003cspan class=\"tag new right\">\u003cspan>New: 0 stamped, always active\u003c/span>\u003c/span>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"rule thin\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"list\">\n      \u003carticle class=\"card\">\n        \u003cdiv class=\"head\">\n          \u003cdiv class=\"who\">\u003cdiv class=\"seller\">Beta Games\u003c/div>\u003cdiv class=\"date\">2026-07-29\u003c/div>\u003c/div>\n          \u003cdiv class=\"pill\">4 left · $4.00\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"editor\">\n          \u003cdiv class=\"ehead\">STAMP\u003ci>\u003c/i>\u003c/div>\n          \u003cdiv class=\"chips\">\n            \u003cspan class=\"chip\">Claim filed\u003c/span>\u003cspan class=\"chip\">Refunded\u003c/span>\u003cspan class=\"chip on\">Seller contacted\u003c/span>\u003cspan class=\"chip\">Reshipped\u003c/span>\n            \u003cspan class=\"chip\">Partial refund\u003c/span>\u003cspan class=\"chip\">Other\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"notebox\">\n            \u003cdiv class=\"note one\">Messaged them on Nov 3. They said it shipped late, so wait one more week.\u003c/div>\n            \u003cspan class=\"tag new\">\u003cspan>New: one-line note field, 44 pt tap box\u003c/span>\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"btns\">\n            \u003cspan class=\"btn\">\u003cspan class=\"mini\">Cancel\u003c/span>\u003c/span>\n            \u003cspan class=\"btn\">\u003cspan class=\"mini save\">Save\u003c/span>\u003c/span>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cdiv class=\"txt\">\u003cdiv class=\"top\">\u003cspan class=\"nm\">Brainstorm\u003c/span>\u003cspan class=\"pr\">$0.50\u003c/span>\u003c/div>\u003cdiv class=\"dt\">×2 · Test Set · Near Mint\u003c/div>\u003c/div>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cdiv class=\"txt\">\u003cdiv class=\"top\">\u003cspan class=\"nm\">Counterspell\u003c/span>\u003cspan class=\"pr\">$2.00\u003c/span>\u003c/div>\u003cdiv class=\"dt\">Test Set · Near Mint\u003c/div>\u003c/div>\u003c/div>\n      \u003c/article>\n    \u003c/div>\n  \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"strip\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv class=\"pg r\">\u003cdiv class=\"status\">\u003cspan>\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\u003cp class=\"rnote\">Right page: not drawn. The open Duo's Packages page belongs to item 35.\u003c/p>\u003c/div>\n  \u003cnav class=\"tabs\" aria-label=\"Tabs\">\n    \u003cspan class=\"tab cur\">\u003cb>\u003c/b>Packages\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Tally\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Orphaned\u003c/span>\u003cspan class=\"tab\">\u003cb>\u003c/b>Ledger\u003c/span>\n  \u003c/nav>\n\u003c/section>\n\n\u003cdiv class=\"cap\">\n  \u003cb>Match the mockup\u003c/b>\n  \u003cp>The note field is one line, as the web's note input is. Its box stays 44 pt tall, and a tap anywhere in it starts typing. A note longer than the field is cut at the edge until you tap in.\u003c/p>\n  \u003cp>\"0 stamped\" always responds. With nothing stamped, a tap turns the filter on and the list goes empty. A second tap turns it off.\u003c/p>\n  \u003cnav aria-label=\"States\">\n    \u003ca href=\"#s=editor\" data-s=\"editor\">Editor open\u003c/a>\n    \u003ca href=\"#s=tap-cell\" data-s=\"tap-cell\">After a tap on 0 stamped\u003c/a>\n    \u003ca href=\"#s=unfolded\" data-s=\"unfolded\">Unfolded\u003c/a>\n  \u003c/nav>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  function show() {\n    var m = /(?:^|[#&])s=([\\w-]+)/.exec(location.hash);\n    var s = m ? m[1] : \"editor\";\n    var frames = document.querySelectorAll(\"[data-state]\");\n    var found = false;\n    frames.forEach(function (f) { if (f.dataset.state === s) found = true; });\n    if (!found) s = \"editor\";\n    frames.forEach(function (f) { f.hidden = f.dataset.state !== s; });\n    document.querySelectorAll(\".cap nav a\").forEach(function (a) { a.setAttribute(\"aria-current\", String(a.dataset.s === s)); });\n  }\n  window.addEventListener(\"hashchange\", show);\n  show();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "duo-hand-gaps": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Card in Hand: the eight unbuilt parts\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6; --silver:#C4C3C0;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832; --amber:#846008;\n  --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Status bar foot: unmeasured on the Duo inner screen. Drawn at the UI test's 20 pt floor (DuoHandUITests.statusBarFloor). */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --keys-top: 405px;  /* measurements duo-fold-and-keyboard: the panel draws from about y 405 pt; its frame starts at 449 */\n  --new:#2E7A5E; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.4; }\nmain { max-width:1040px; margin:0 auto; padding:16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font-family:var(--cochin); font-size:26px; margin:16px 0 4px; }\nh2 { font-family:var(--cochin); font-size:22px; margin:0 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:80ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }\nnav a, button.hide { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\na:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nsection.part { margin:40px 0; }\nsection.part[hidden], figure[hidden] { display:none; }\n.verdict { display:inline-block; font-size:13px; font-weight:600; padding:2px 8px; border-radius:8px; background:var(--card); border:1px solid var(--line); margin-left:8px; vertical-align:middle; }\n.lede { margin:0 0 8px; max-width:80ch; }\nfigure { margin:16px 0 24px; }\nfigcaption { margin-top:8px; max-width:80ch; }\nfigcaption b { font-family:var(--cochin); font-size:18px; }\n.fit { width:100%; overflow:hidden; }\nul.tags { margin:8px 0 0; padding-left:20px; color:var(--inkSoft); font-size:14px; max-width:80ch; }\n\n/* ---- device: iPhone Duo inner screen, open, 951 x 669 pt, 1 CSS px = 1 pt ---- */\n.duo { position:relative; width:951px; height:669px; background:var(--paper); border:1px solid var(--ink); border-radius:12px; overflow:hidden;\n  font-family:-apple-system, system-ui, sans-serif; }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 16px; font-size:12px; font-weight:600; z-index:5; }\n.page { position:absolute; top:0; bottom:0; width:455.5px; overflow:hidden; }\n.page.l { left:0; } .page.r { left:495.5px; }\n.fold { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); }\n.fold span { position:absolute; top:200px; left:50%; transform:translateX(-50%) rotate(-90deg); font:11px var(--mono); color:var(--inkSoft); letter-spacing:1.2px; }\n/* The system keyboard: iOS chrome, not an app colour, so these greys sit outside the tokens. */\n.keys { position:absolute; left:0; right:0; top:var(--keys-top); bottom:0; background:#D2D0D6; z-index:6; padding:8px 6px; }\n.keys .row { display:flex; gap:6px; margin-bottom:8px; justify-content:center; }\n.keys .k { height:42px; flex:0 0 42px; background:#FFFFFF; border-radius:6px; display:grid; place-items:center; font-size:18px; color:#111; }\n.keys .k.w { flex-basis:300px; font-size:14px; }\n/* The Duo tab bar under the right page (DuoSpine.DuoBar): 64 pt pill, 24 pt in, 12 pt up. Shown only with the keys down. */\n.bar { position:absolute; left:519.5px; width:407.5px; top:593px; height:64px; border:1px solid var(--line); border-radius:32px; z-index:4;\n  background:color-mix(in srgb, var(--paper) 62%, transparent); box-shadow:0 4px 16px var(--shadow); display:grid; grid-template-columns:repeat(4,1fr); padding:4px; gap:4px; }\n.bar span { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:28px; font:12px var(--cochin); color:var(--inkSoft); }\n.bar span::before { content:\"\"; width:20px; height:20px; border:1.5px solid currentColor; border-radius:5px; margin-bottom:4px; }\n.bar span.on { background:color-mix(in srgb, var(--card) 90%, transparent); color:var(--accent); }\n\n/* ---- app content: Cochin sets words, Menlo sets numbers (typography-cochin-and-mono) ---- */\n.content { position:absolute; left:16px; right:16px; top:calc(var(--sat) + 16px); display:flex; flex-direction:column; gap:12px; font-family:var(--cochin); }\n.r .content { gap:8px; }\n.micro { font:10.5px/13px var(--mono); letter-spacing:1.2px; text-transform:uppercase; color:var(--inkSoft); min-height:13px; }\n/* A new label is drawn at 11 pt, the iOS minimum (HIG typography). Today's labels stay at the built 10.5 pt. */\n.micro.m11 { font-size:11px; line-height:14px; }\n.who { font-size:22px; line-height:27px; font-weight:700; }\n.meta { font:11px/14px var(--mono); color:var(--inkSoft); min-height:14px; display:flex; justify-content:space-between; gap:8px; }\n.meta .owe { color:var(--red); font-weight:700; }\n.meta .owe em { font:12px var(--cochin); font-style:normal; color:var(--inkSoft); font-weight:400; margin-right:4px; }\n.meta .whole { color:var(--ink); font-weight:700; }\n.pill { font:11.5px var(--mono); border:1px solid var(--line); background:var(--card); border-radius:5px; padding:8px 12px; color:var(--ink); white-space:nowrap; }\n.pill.post { font-weight:700; background:var(--accent); border-color:var(--accent); color:var(--card); }\n.hit { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }\n.lines { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.line { position:relative; display:flex; gap:8px; min-height:64px; padding-left:4px; border-top:1px solid var(--line); background:var(--card); }\n.line:first-child { border-top:0; }\n.line .box { flex:0 0 45px; height:45px; display:grid; place-items:center; }\n.line .box i { width:30px; height:30px; border:2px solid var(--inkSoft); border-radius:8px; display:block; position:relative; }\n.line .t { flex:1; padding:12px 12px 12px 0; }\n.line .t b { font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }\n.line .t b span { font:12px var(--mono); color:var(--inkSoft); font-weight:400; }\n.line .t small { font-size:11.5px; color:var(--inkSoft); display:block; margin-top:4px; }\n.line .t small .hold { color:var(--manilaInk); font-weight:700; }\n.step { display:flex; align-items:center; gap:4px; margin-top:8px; }\n.step .sb { width:44px; height:44px; display:grid; place-items:center; }\n.step .sb i { width:34px; height:34px; border:1px solid var(--line); border-radius:8px; background:var(--card); display:grid; place-items:center; font-style:normal; }\n.step .c { font:700 13px var(--mono); color:var(--manilaInk); min-width:44px; text-align:center; }\n.line.done { background:var(--greenSoft); }\n.line.done .t b { color:var(--inkSoft); }\n.line.done .box i { background:var(--green); border-color:var(--green); }\n.line.done .box i::after { content:\"\"; position:absolute; left:8px; top:3px; width:8px; height:14px; border:solid var(--card); border-width:0 3px 3px 0; transform:rotate(45deg); }\n.line.partial .box i { background:var(--manila); border-color:var(--manilaInk); }\n.line.partial .box i::after { content:\"\\2013\"; position:absolute; inset:0; display:grid; place-items:center; color:var(--manilaInk); font-size:16px; line-height:26px; text-align:center; }\n/* Part 1 options: the typed card's line */\n/* ::after, because the tag label holds ::before */\n.line.now-bar::after { content:\"\"; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); z-index:5; }\n.line.now-fill { background:var(--greenSoft); }\n/* Part 5: a line whose card waits on the Suspense line */\n.line.held { background:color-mix(in srgb, var(--manila) 55%, var(--card)); }\n.offer { min-height:110px; background:color-mix(in srgb, var(--manila) 50%, transparent); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:8px; }\n.offer p { margin:0; font-size:13px; line-height:17px; min-height:34px; }\n.offer .btns { display:flex; gap:8px; }\n.offer .receipt { min-height:44px; display:flex; align-items:center; font:12px var(--mono); color:var(--manilaInk); }\n.notice { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:12px; display:flex; flex-direction:column; gap:2px; }\n.notice .micro { color:var(--manilaInk); }\n.notice b { font-size:15px; } .notice small { font-size:12.5px; }\n.field { height:48px; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:0 12px; display:flex; align-items:center; font-size:16px; flex:none; }\n.field::after { content:\"\"; width:2px; height:20px; background:var(--accent); margin-left:1px; }\n.field.empty { color:var(--inkSoft); }\n.field.empty::after { display:none; }\n.rowx { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:44px; }\n.rowx .soft { color:var(--inkSoft); font-size:14px; }\n/* Part 2: This envelope with its cards so far. Two text lines inside the 44 pt row the button already sets. */\n.env { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; min-height:44px; }\n.env .what { display:flex; flex-direction:column; min-width:0; padding-top:2px; }\n.env .what > span:first-child { color:var(--inkSoft); font-size:14px; line-height:18px; }\n.env .what > span:last-child { font-size:15px; line-height:20px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n.env .what span.none { color:var(--inkSoft); font-style:italic; }\n/* A long list: the names clip, \"+N more\" stays whole */\n.env .what .val { display:flex; align-items:baseline; gap:4px; }\n.env .what .val .names { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.env .what span .more { font:12px var(--mono); color:var(--inkSoft); flex:none; }\n.match { min-height:44px; display:flex; align-items:center; font-size:14px; padding-left:10px; position:relative; }\n.match.on { font-weight:700; } .match.on::before { content:\"\"; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent); }\n.count { font:12px var(--mono); color:var(--inkSoft); }\n.note { font-size:13px; color:var(--inkSoft); margin:0; line-height:17px; }\n.err { font-size:13px; color:var(--red); }\n/* Part 6: tie cards side by side */\n.tie { display:grid; grid-template-columns:1fr 1fr; gap:8px; }\n.tie > div, .tcard { padding:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; gap:4px; }\n.tcard b, .tie b { font-size:15px; }\n.mini { display:flex; justify-content:space-between; gap:8px; font-size:13px; border-bottom:1px solid var(--line); min-height:28px; align-items:center; }\n.mini:last-of-type { border-bottom:0; }\n.mini span:last-child { font:12px var(--mono); color:var(--inkSoft); }\n.mini.heldm span:last-child { color:var(--manilaInk); font-weight:700; }\n/* Part 8: ranked accounts */\n.rank { background:var(--card); border:1px solid var(--line); border-radius:8px; }\n.rank .rr { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; min-height:64px; border-top:1px solid var(--line); }\n.rank .rr:first-child { border-top:0; }\n.rank .rr b { font-size:15px; display:block; } .rank .rr small { font:11px var(--mono); color:var(--inkSoft); display:block; }\n/* Part 7: the end of mail day */\n.pile { background:var(--card); border:1px solid var(--line); border-radius:8px; }\n.pile .pr { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:0 12px; min-height:44px; border-top:1px solid var(--line); font-size:14px; }\n.pile .pr:first-child { border-top:0; }\n.pile .pr .d { font:11px var(--mono); color:var(--inkSoft); margin-left:8px; }\n.pile .pr .g { font:12px var(--mono); }\n.pile .pr .g.ok { color:var(--green); } .pile .pr .g.short { color:var(--red); font-weight:700; }\n.odd { background:var(--card); border:1px solid var(--line); border-radius:8px; }\n.odd .or { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 12px; min-height:60px; border-top:1px solid var(--line); }\n.odd .or:first-child { border-top:0; }\n.odd .or b { font-size:14px; display:block; } .odd .or small { font:11px var(--mono); color:var(--inkSoft); }\n.odd .or small.r { color:var(--red); }\n.well { font-size:20px; font-weight:700; color:var(--green); }\n.still { font:12px var(--mono); color:var(--red); font-weight:700; }\n.tbox { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px; background:var(--card); border:1px solid var(--line); border-radius:8px; }\n.tbox span { font-size:14px; } .tbox small { display:block; color:var(--red); font-size:12.5px; }\n.empty-hint { font-size:14px; color:var(--inkSoft); }\n\n/* tags: dashed outline on what exists today, and on what an option adds */\n[data-tag] { position:relative; }\n[data-tag]::before { content:attr(data-tag); position:absolute; right:4px; top:-9px; font:600 11px/14px -apple-system, system-ui, sans-serif; padding:0 4px;\n  background:var(--paper); z-index:4; white-space:nowrap; }\n.tag-new { outline:2px dashed var(--new); outline-offset:2px; } .tag-new::before { color:var(--new); }\n.tag-today { outline:2px dashed var(--today); outline-offset:2px; } .tag-today::before { color:var(--today); }\n.line[data-tag]::before { top:auto; bottom:2px; }\n.line.tag-new, .line.tag-today { outline-offset:-2px; }\n.tag-below[data-tag]::before { top:auto; bottom:-17px; }\n.micro[data-tag]::before { text-transform:none; letter-spacing:0; }\n.meta[data-tag]::before { top:auto; bottom:-17px; right:auto; left:0; }\n\n/* folded frame: the outer screen, 466 x 678 pt (duo-fold-and-keyboard, re-measured 2026-11-08), drawn at half size */\n.folded { position:relative; width:233px; height:339px; border:1px solid var(--ink); border-radius:12px; background:var(--paper);\n  padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); font-size:12px; color:var(--inkSoft); }\n.folded b { font-family:var(--cochin); color:var(--ink); font-size:14px; display:block; margin-bottom:4px; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\">Sample. No seller, card, date, count or price on this page is real. Row heights are estimates from the code, not measurements.\u003c/div>\n\u003ch1>Card in Hand: the eight parts the build does not draw\u003c/h1>\n\u003cp class=\"sub\">iPhone Duo, open pose, 951 x 669 pt, fold 40 pt at 455.5 pt. The keys panel draws from y 405 pt. Status bar foot drawn at 20 pt (unmeasured). Light theme only. Each part shows today's build, then the part as it should be built, inside today's layout. Debt \u003ccode>duo-hand-mockup-gaps\u003c/code>; decision \u003ccode>duo-card-in-hand\u003c/code>; the October mockup is \u003ccode>docs/design/duo-card-in-hand/index.html\u003c/code> at commit b8d11e7 (Duo round 2 draws Lost and degen's stack order as options).\u003c/p>\n\n\u003cnav aria-label=\"Parts\">\n  \u003ca href=\"#s=folded\">Folded\u003c/a>\n  \u003ca href=\"#s=line-now\">1 Typed line mark\u003c/a>\n  \u003ca href=\"#s=this-envelope\">2 This envelope\u003c/a>\n  \u003ca href=\"#s=still-owed\">3 Still owed here\u003c/a>\n  \u003ca href=\"#s=keep-held\">4 Keep held\u003c/a>\n  \u003ca href=\"#s=held-lines\">5 Held lines\u003c/a>\n  \u003ca href=\"#s=tie-post\">6 Post at a tie\u003c/a>\n  \u003ca href=\"#s=end-of-day\">7 End of mail day\u003c/a>\n  \u003ca href=\"#s=suspense-rank\">8 Suspense ranking\u003c/a>\n  \u003ca href=\"#\">All\u003c/a>\n  \u003cbutton type=\"button\" class=\"hide\" id=\"restore\">Show hidden options\u003c/button>\n\u003c/nav>\n\n\u003c!-- Folded first (ios-apps, Mockups). Card in Hand does not open folded. -->\n\u003csection class=\"part\" id=\"s-folded\" data-state=\"folded\">\n\u003cfigure>\n  \u003cdiv class=\"folded\" data-device=\"iphone-duo-folded\">\n    \u003cb>Folded: unchanged\u003c/b>\n  \u003c/div>\n  \u003cfigcaption>\u003cb>Folded.\u003c/b> No change. Outer screen 466 x 678 pt, drawn at half size. Card in Hand opens only on two pages side by side (\u003ccode>PackagesTab.twoPages\u003c/code>, HandScreen.swift:32). The outer screen keeps today's one-page Packages. None of the eight parts draws here.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003ctemplate id=\"chrome-keys\">\n  \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n  \u003cdiv class=\"keys\">\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">q\u003c/span>\u003cspan class=\"k\">w\u003c/span>\u003cspan class=\"k\">e\u003c/span>\u003cspan class=\"k\">r\u003c/span>\u003cspan class=\"k\">t\u003c/span>\u003cspan class=\"k\">y\u003c/span>\u003cspan class=\"k\">u\u003c/span>\u003cspan class=\"k\">i\u003c/span>\u003cspan class=\"k\">o\u003c/span>\u003cspan class=\"k\">p\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">a\u003c/span>\u003cspan class=\"k\">s\u003c/span>\u003cspan class=\"k\">d\u003c/span>\u003cspan class=\"k\">f\u003c/span>\u003cspan class=\"k\">g\u003c/span>\u003cspan class=\"k\">h\u003c/span>\u003cspan class=\"k\">j\u003c/span>\u003cspan class=\"k\">k\u003c/span>\u003cspan class=\"k\">l\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k\">z\u003c/span>\u003cspan class=\"k\">x\u003c/span>\u003cspan class=\"k\">c\u003c/span>\u003cspan class=\"k\">v\u003c/span>\u003cspan class=\"k\">b\u003c/span>\u003cspan class=\"k\">n\u003c/span>\u003cspan class=\"k\">m\u003c/span>\u003c/div>\n    \u003cdiv class=\"row\">\u003cspan class=\"k w\">space\u003c/span>\u003cspan class=\"k\" style=\"flex-basis:90px;font-size:14px\">done\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/template>\n\u003ctemplate id=\"chrome-down\">\n  \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n  \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n  \u003cdiv class=\"bar\">\u003cspan class=\"on\">Packages\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Ledger\u003c/span>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"head\">\n  \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">31 in · 27 out\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">Close\u003c/span>\u003c/span>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"env-today\">\n  \u003cdiv class=\"rowx\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"env-none\">\n  \u003cdiv class=\"env\">\u003cspan class=\"what\">\u003cspan>This envelope\u003c/span>\u003cspan class=\"none\">Nothing checked in yet\u003c/span>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"left-bolt\">\n  \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n    \u003cdiv data-fill=\"head\">\u003c/div>\n    \u003cdiv class=\"field\">Lightning B\u003c/div>\n    \u003cdiv data-fill=\"env-today\">\u003c/div>\n    \u003cspan class=\"micro\">Matches\u003c/span>\n    \u003cdiv class=\"match\">Lightning Bolt\u003c/div>\n  \u003c/div>\u003c/div>\n\u003c/template>\n\u003ctemplate id=\"kestrel-head\">\n  \u003cspan class=\"micro\">It came from\u003c/span>\n  \u003cspan class=\"who\">Kestrel Card Co.\u003c/span>\n\u003c/template>\n\n\u003c!-- ================= 1 ================= -->\n\u003csection class=\"part\" id=\"s-line-now\" data-state=\"line-now\">\n\u003ch2>1 · The typed card's line \u003cspan class=\"verdict\">option picked: accent bar\u003c/span>\u003c/h2>\n\u003cp class=\"lede\">The October mockup marks the typed card's line with a green fill (its \u003ccode>.line.now\u003c/code>, index.html:101 and :163). In the build, that fill is already the done fill (\u003ccode>PackageCard.token(.rowFill)\u003c/code> gives greenSoft for a done line). So the October mark does not carry over as drawn. Two options.\u003c/p>\n\n\u003cfigure data-opt=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-bolt chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"kestrel-head\">\u003c/div>\n      \u003cspan class=\"meta\">\u003cspan>ordered 2026-10-14\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line partial tag-today\" data-tag=\"Today: no mark on the typed card's line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$1.12\u003c/span>\u003c/b>\u003csmall>×4 · Magic 2011 · NM\u003c/small>\u003cspan class=\"step\">\u003cspan class=\"sb\">\u003ci>–\u003c/i>\u003c/span>\u003cspan class=\"c\">3/4\u003c/span>\u003cspan class=\"sb\">\u003ci>+\u003c/i>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line done\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Counterspell\u003cspan>$0.48\u003c/span>\u003c/b>\u003csmall>×2 · Dominaria Remastered · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Brainstorm\u003cspan>$0.62\u003c/span>\u003c/b>\u003csmall>Commander Masters · LP\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Today.\u003c/b> The right page shows the envelope, and nothing says which line is the card in your hand. HandScreen.swift:303 draws each line with \u003ccode>ItemLine\u003c/code>, the same in every state. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"line-bar\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-bolt chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"kestrel-head\">\u003c/div>\n      \u003cspan class=\"meta\">\u003cspan>ordered 2026-10-14\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line partial now-bar tag-new\" id=\"focus-line-bar\" data-tag=\"New: 3 pt accent bar\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$1.12\u003c/span>\u003c/b>\u003csmall>×4 · Magic 2011 · NM\u003c/small>\u003cspan class=\"step\">\u003cspan class=\"sb\">\u003ci>–\u003c/i>\u003c/span>\u003cspan class=\"c\">3/4\u003c/span>\u003cspan class=\"sb\">\u003ci>+\u003c/i>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line done\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Counterspell\u003cspan>$0.48\u003c/span>\u003c/b>\u003csmall>×2 · Dominaria Remastered · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Brainstorm\u003cspan>$0.62\u003c/span>\u003c/b>\u003csmall>Commander Masters · LP\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Accent bar (pick).\u003c/b> A 3 pt accent bar on the leading edge of the typed card's line. It is the mark the chosen match already has on the left page (item 48), so one mark means \"this card\" on both pages. It sits in ItemLine's 4 pt leading pad, so no text moves. It stays on a done line, where a fill would not show. Keys panel from y 405, frame from y 449. \u003cbutton type=\"button\" class=\"hide\" data-hide=\"line-bar\">Hide accent bar\u003c/button>\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"line-fill\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-bolt chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"kestrel-head\">\u003c/div>\n      \u003cspan class=\"meta\">\u003cspan>ordered 2026-10-14\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line partial now-fill tag-new\" id=\"focus-line-fill\" data-tag=\"New: October green fill\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$1.12\u003c/span>\u003c/b>\u003csmall>×4 · Magic 2011 · NM\u003c/small>\u003cspan class=\"step\">\u003cspan class=\"sb\">\u003ci>–\u003c/i>\u003c/span>\u003cspan class=\"c\">3/4\u003c/span>\u003cspan class=\"sb\">\u003ci>+\u003c/i>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line done\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Counterspell\u003cspan>$0.48\u003c/span>\u003c/b>\u003csmall>×2 · Dominaria Remastered · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Brainstorm\u003cspan>$0.62\u003c/span>\u003c/b>\u003csmall>Commander Masters · LP\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Green fill, as drawn in October.\u003c/b> The typed line and the done Counterspell line now share one fill. When the typed card's line is done too, the mark vanishes. Keys panel from y 405, frame from y 449. \u003cbutton type=\"button\" class=\"hide\" data-hide=\"line-fill\">Hide green fill\u003c/button>\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- ================= 2 ================= -->\n\u003csection class=\"part\" id=\"s-this-envelope\" data-state=\"this-envelope\">\n\u003ch2>2 · This envelope, with its cards so far \u003cspan class=\"verdict\">carried over\u003c/span>\u003c/h2>\n\u003cp class=\"lede\">Carried over from October poses 1 to 3 (index.html:153, :223, :256): under \"This envelope\", the cards checked in since the last New envelope, or \"Nothing checked in yet\". Kept to one line, so the row stays the 44 pt that New envelope's hit frame already sets, and the button never moves.\u003c/p>\n\n\u003cfigure data-opt=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-keys\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"head\">\u003c/div>\n      \u003cdiv class=\"field\">Brainst\u003c/div>\n      \u003cdiv class=\"rowx tag-today\" data-tag=\"Today: a label with no value\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n      \u003cspan class=\"micro\">Matches\u003c/span>\n      \u003cdiv class=\"match\">Brainstorm\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"kestrel-head\">\u003c/div>\n      \u003cspan class=\"meta\">\u003cspan>ordered 2026-10-14\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line done\">\u003c 003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cspan class=\"micro\">It came from\u003c/span>\n      \u003cspan class=\"who\">Quillon Hobby\u003c/span>\n      \u003cspan class=\"meta\">\u003cspan>ordered 2026-10-10\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Ponder\u003cspan>$0.18\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Long list.\u003c/b> As many names as fit, then \"+N more\" in mono, never a second line. VoiceOver reads every name. A Post adds its cards here too. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"env-new\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"chrome-keys\">\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"head\">\u003c/div>\n      \u003cdiv class=\"field empty\">Type the card in hand\u003c/div>\n      \u003cdiv class=\"env tag-new\" data-tag=\"New: after New envelope\">\u003cspan class=\"what\">\u003cspan>This envelope\u003c/span>\u003cspan class=\"none\">Nothing checked in yet\u003c/span>\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"pill\">New envelope\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cp class=\"empty-hint\">Type the card in hand. The envelope it came from shows here.\u003c/p>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Empty.\u003c/b> New envelope clears the list. The empty line holds the row's second line, so the first check-in grows nothing. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\u003c/section>\n\n\u003c!-- ================= 3 ================= -->\n\u003csection class=\"part\" id=\"s-still-owed\" data-state=\"still-owed\">\n\u003ch2>3 · Still owed here \u003cspan class=\"verdict\">option picked: on the order line\u003c/span>\u003c/h2>\n\u003cp class=\"lede\">The figure is the package's own \"N left · $Y\" (decision \u003ccode>outstanding-value-per-level\u003c/code>; the bundle's \u003ccode>packagePill\u003c/code>, which \u003ccode>PackagesModel.pills\u003c/code> already holds). October drew it under the lines with card names (index.html:167). With the build's keys spanning both pages from y 405, a line under three or more lines sits under the keys. So the place is drawn as two options.\u003c/p>\n\n\u003cfigure data-opt=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-bolt chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"kestrel-head\">\u003c/div>\n      \u003cspan class=\"meta tag-today\" data-tag=\"Today: no figure\">\u003cspan>ordered 2026-10-14\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line partial\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$1.12\u003c/span>\u003c/b>\u003csmall>×4 · Magic 2011 · NM\u003c/small>\u003cspan class=\"step\">\u003cspan class=\"sb\">\u003ci>–\u003c/i>\u003c/span>\u003cspan class=\"c\">3/4\u003c/span>\u003cspan class=\"sb\">\u003ci>+\u003c/i>\u003c/span>\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line done\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Counterspell\u003cspan>$0.48\u003c/span>\u003c/b>\u003csmall>×2 · Dominaria Remastered · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Brainstorm\u003cspan>$0.62\u003c/span>\u /span>\u003c/b>\u003csmall>×2 · Dominaria Remastered · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Brainstorm\u003cspan>$0.62\u003c/span>\u003c/b>\u003csmall>Commander Masters · LP\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Ponder\u003cspan>$0.18\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Preordain\u003cspan>$0.20\u003c/span>\u003c/b>\u003csmall>Commander Masters · NM\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>On the order line (pick).\u003c/b> \"Still owed here\" in soft Cochin, the figure in red mono, at the trailing end of the \"ordered\" line. It adds no row, so the Post offer and the lines keep their place, and it shows at every length of envelope. When nothing is owed it reads \"complete\" in ink. At large text, where both halves do not fit one line, the figure wraps under the date. Keys panel from y 405, frame from y 449. \u003cbutton type=\"button\" class=\"hide\" data-hide=\"owed-meta\">Hide on the order line\u003c/button>\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"owed-under\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-bolt chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cdiv data-fill=\"kestrel-head\">\u003c/div>\n      \u003cspan class=\"meta\">\u003cspan>ordered 2026-10-14\u003c/span>\u003c/span>\n      \u003cdiv class=\"lines\">\n        \u003cdiv class=\"line partial\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lig u003ch2>6 · Post here at a tie \u003cspan class=\"verdict\">carried over\u003c/span>\u003c/h2>\n\u003cp class=\"lede\">Carried over from October pose 2 (index.html:228 to :243): each envelope of a tie lists its lines and has its own Post button. A tie still has no first choice: the buttons weigh the same, and nothing posts until you press one (\u003ccode>orphaned-mail-never-decides\u003c/code>). The button reads \"Post N cards here\", the act's name on the offer, not October's bare \"Post here\".\u003c/p>\n\n\u003cfigure data-opt=\"today\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-tie chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cspan class=\"micro\">2 envelopes hold this card\u003c/span>\n      \u003cp class=\"note\">Name the next card from this envelope to tell them apart. Nothing checks in until you post.\u003c/p>\n      \u003cdiv class=\"tcard tag-today\" data-tag=\"Today: seller and count, no lines, no Post\">\u003cb>Brass Lantern TCG\u003c/b>\u003cspan class=\"meta\">\u003cspan>ordered 2026-10-16 · 3 cards out\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"tcard\">\u003cb>Quillon Hobby\u003c/b>\u003cspan class=\"meta\">\u003cspan>ordered 2026-10-10 · 2 cards out\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>Today.\u003c/b> The tie names each envelope (HandScreen.swift:258 to :275). You cannot see which one is the envelope in your hand, and you cannot post to one. Keys panel from y 405, frame from y 449.\u003c/figcaption>\n\u003c/figure>\n\n\u003cfigure data-opt=\"tie-new\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" data-device=\"iphone-duo-unfolded\" data-fill=\"left-tie chrome-keys\">\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cspan class=\"micro\">2 envelopes hold this card\u003c/span>\n      \u003cp class=\"note\">Name the next card
