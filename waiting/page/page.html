 folded phone shows the Packages list, with no Card in Hand control.\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- The picture the owner rules on: the Packages tab on the open Duo. Focus: #duo-keep-packages. -->\n\u003cfigure id=\"s-keep-packages\" data-state=\"keep-packages\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-keep-packages\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n    \u003cdiv class=\"abs mast tag-today tag-low tag-left\" data-tag=\"Today: masthead, across both pages (heights drawn)\">\n      \u003cdiv class=\"seal-row\">\u003ci>\u003c/i>\u003cspan class=\"seal\">\u003c/span>\u003ci>\u003c/i>\u003c/div>\n      \u003cdiv class=\"title\">Manifest\u003c/div>\n      \u003cdiv class=\"house\">C.H Postal Company\u003c/div>\n      \u003cdiv class=\"cells\">\u003cdiv>\u003cb>41\u003c/b>\u003csmall>in\u003c/small>\u003c/div>\u003cdiv>\u003cb>23\u003c/b>\u003csmall>out\u003c/small>\u003c/div>\u003cdiv>\u003cb>$9.80\u003c/b>\u003csmall>outstanding\u003c/small>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"abs slot\">\u003c/div>\n    \u003cdiv class=\"abs stamped\">2 stamped \u003cspan>&#9675;\u003c/span>\u003c/div>\n    \u003cdiv class=\"abs handopen hit tag-today\" data-tag=\"Today: Card in Hand control, y 416 to 460 (measured)\">\u003cspan class=\"mini\">Card in Hand\u003c/span>\u003c/div>\n    \u003cdiv class=\"abs cards tag-today tag-left\" data-tag=\"Today: the Packages list, one page across the fold\">\n      \u003cdiv class=\"pkg\">\n        \u003cdiv class=\"hd\">\u003cdiv class=\"who\">\u003cb>Sample Seller One\u003c/b>\u003cspan>2026-10-02\u003c/span>\u003c/div>\u003cspan class=\"pillx\">3 left &#183; $1.10\u003c/span>\u003c/div>\n        \u003cdiv class=\"oid\">SAMPLE-0001\u003c/div>\n        \u003cdiv class=\"bulk\">\u003cspan class=\"hit\">\u003cspan class=\"mini\">Mark all received\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$0.42\u003c/span>\u003c/b>\u003csmall>Sample Set &#183; NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Ponder\u003cspan>$0.18\u003c/span>\u003c/b>\u003csmall>Sample Set &#183; NM\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n    \u003cdiv class=\"bar tag-today tag-low\" data-tag=\"Today: tab bar under the right page\">\u003cspan>Ledger\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan class=\"on\">Packages\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>The Packages tab stays the list.\u003c/b> Tap Packages and you get the list you know, as on the folded phone. The Card in Hand control sits at the top of the list, on the right page. One more tap opens the two-page screen.\u003c/figcaption>\n  \u003cul class=\"tags\">\n    \u003cli>Measured: control top y 416 and 44 pt tall at the default text size; tab bar x 520 to 927, y 593 to 657 (debt \u003ccode>hand-open-under-bar-at-l\u003c/code>, 2026-11-08). Fold and width: \u003ccode>duo-fold-and-keyboard\u003c/code>.\u003c/li>\n    \u003cli>From the code, not measured: the list runs across the fold (\u003ccode>DuoSpread.spreads(tab:)\u003c/code> is false for Packages); the control sits trailing (\u003ccode>PackagesView\u003c/code>, a Spacer before it); bar order Ledger, Orphaned, Tally, Packages (\u003ccode>RootView.swift\u003c/code> bar items).\u003c/li>\n    \u003cli>Unmeasured: the control's x, and every masthead height above it. At AccessibilityL the control falls under the tab bar (same debt).\u003c/li>\n  \u003c/ul>\n\u003c/figure>\n\n\u003c!-- What the extra tap reaches: today's Card in Hand, opened by hand-open, with Close back to the list. -->\n\u003cfigure id=\"s-after-tap\" data-state=\"after-tap\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-after-tap\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">41 in &#183; 23 out\u003c/span>\u003cspan class=\"hit tag-today\" data-tag=\"Today: Close, back to the list\">\u003cspan class=\"mini\">Close\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field\">Type the card in hand\u003c/div>\n      \u003cdiv class=\"rowx\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"mini\">New envelope\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cp class=\"empty\">Type the card in hand. The envelope it came from shows here.\u003c/p>\n      \u003cdiv class=\"transit\">\u003cdiv>\u003cb>Past 14 days: 3 envelopes\u003c/b>\u003csmall>1 refund window closing\u003c/small>\u003c/div>\u003cspan class=\"hit\">\u003cspan class=\"mini\">Open\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n    \u003cdiv class=\"bar tag-today tag-low\" data-tag=\"Today: Packages stays the tab\">\u003cspan>Ledger\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan class=\"on\">Packages\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>One tap in: Card in Hand.\u003c/b> The control opens Card in Hand over both pages. Close goes back to the list. This is the extra tap each mail day. Card in Hand opens with the keys down: nothing focuses the field on open (\u003ccode>HandScreen.swift\u003c/code>, \u003ccode>fieldFocused\u003c/code> is set only by a tap).\u003c/figcaption>\n\u003c/figure>\n\n\u003c/main>\n\n\u003cscript>\n// Scale each 951 pt frame down only when the window is narrower; at 951 or wider it draws 1:1.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; d.style.zoom = Math.min(1, w.clientWidth / 951); });\n}\n// Deep link: #s=\u003cstate> shows one state; no hash shows all.\nfunction route() {\n  const m = location.hash.match(/s=([\\w-]+)/), s = m && m[1];\n  document.querySelectorAll('figure').forEach(f => { f.hidden = !!s && f.dataset.state !== s; });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === (location.hash || '#'))));\n  fit();\n}\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "duo-card-in-hand-entry-b": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Packages Is Hand\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger), as the other Duo mockups in docs/design use them. The native app is held to light, so this page has one theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832; --gold:#C9A961;\n  --shadow:rgba(51,46,63,.14);\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Status bar foot: unmeasured on the Duo inner screen. Drawn at the UI test's 20 pt floor, as the house mockups do. */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --sab: env(safe-area-inset-bottom);\n  --new:#2E7A5E; --today:#A8443C;\n}\n* { box-sizing:border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.4; }\nmain { max-width:1040px; margin:0 auto; padding:16px 0; }\n.txt { padding:0 16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-weight:600; margin:0 16px; }\nh1 { font-family:var(--cochin); font-size:24px; margin:16px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; max-width:80ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }\nnav a { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nfigure { margin:24px 0; }\nfigure[hidden] { display:none; }\nfigcaption { margin:8px 16px 0; max-width:80ch; }\nfigcaption b { font-family:var(--cochin); font-size:18px; }\nul.tags { margin:8px 16px 0; padding-left:20px; color:var(--inkSoft); font-size:14px; max-width:80ch; }\n.fit { width:100%; overflow:hidden; }\n\n/* ---- device: iPhone Duo inner screen, open, 951 x 669 pt, 1 CSS px = 1 pt ----\n   951 wide and the 40 pt fold at 455.5: measured (duo-fold-and-keyboard). 669 high: the house frame, the measured bar foot (y 657) plus its 12 pt lift. */\n.duo { position:relative; width:951px; height:669px; background:var(--paper); border:1px solid var(--ink); border-radius:12px; overflow:hidden;\n  font-family:-apple-system, system-ui, sans-serif; padding-bottom:var(--sab); }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 16px; font-size:12px; font-weight:600; z-index:5; background:var(--paper); }\n.page { position:absolute; top:0; bottom:0; width:455.5px; overflow:hidden; }\n.page.l { left:0; } .page.r { left:495.5px; }\n.fold { position:absolute; top:0; bottom:0; left:455.5px; width:40px; background:color-mix(in srgb, var(--line) 45%, transparent); z-index:3; pointer-events:none; }\n.fold span { position:absolute; top:520px; left:50%; transform:translateX(-50%) rotate(-90deg); font:11px var(--mono); color:var(--inkSoft); letter-spacing:1.2px; }\n/* The Duo tab bar under the right page (DuoSpine.swift, DuoBarMetrics: 64 pt pill, 12 pt lift). Measured at x 520 to 927, y 593 to 657 (debt hand-open-under-bar-at-l). */\n.bar { position:absolute; left:519.5px; width:407.5px; top:593px; height:64px; border:1px solid var(--line); border-radius:32px; z-index:6;\n  background:color-mix(in srgb, var(--paper) 62%, transparent); box-shadow:0 4px 16px var(--shadow); display:grid; grid-template-columns:repeat(4,1fr); padding:4px; gap:4px;\n  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }\n.bar span { display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:28px; font:12px var(--cochin); color:var(--inkSoft); }\n.bar span::before { content:\"\"; width:20px; height:20px; border:1.5px solid currentColor; border-radius:5px; margin-bottom:4px; }\n.bar span.on { background:color-mix(in srgb, var(--card) 90%, transparent); color:var(--accent); font-weight:700; }\n\n/* ---- Packages, one page across the whole window (DuoSpread.spreads(tab:) is false for .packages) ---- */\n.abs { position:absolute; }\n.mast { left:16px; right:16px; top:calc(var(--sat) + 12px); height:278px; display:flex; flex-direction:column; align-items:center; gap:0; font-family:var(--cochin); }\n.seal-row { display:flex; align-items:center; gap:12px; width:270px; height:36px; margin-bottom:12px; }\n.seal-row i { flex:1; height:1px; background:var(--gold); opacity:.75; }\n.seal { width:36px; height:36px; border-radius:50%; background:var(--red); box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--red) 70%, #000); }\n.mast .title { font-size:31px; line-height:38px; letter-spacing:.5px; }\n.mast .house { font-size:10px; letter-spacing:2px; color:var(--inkSoft); margin-top:8px; }\n.cells { display:grid; grid-template-columns:repeat(3, 140px); margin-top:24px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }\n.cells div { padding:16px 8px; text-align:center; border-left:1px solid var(--line); }\n.cells div:first-child { border-left:0; }\n.cells b { display:block; font:700 20px var(--mono); }\n.cells small { font-size:12px; color:var(--inkSoft); }\n.slot { left:0; right:0; top:330px; height:47px; border-bottom:1px solid var(--line); }\n.stamped { left:16px; top:378px; height:30px; display:flex; align-items:center; gap:8px; font:13px var(--cochin); color:var(--inkSoft); }\n.mini { font:11.5px var(--mono); border:1px solid var(--line); background:var(--card); border-radius:5px; padding:8px 12px; color:var(--ink); white-space:nowrap; }\n.hit { min-height:44px; min-width:44px; display:inline-flex; align-items:center; justify-content:center; }\n.handopen { right:16px; top:416px; height:44px; }\n.cards { left:16px; right:16px; top:468px; display:flex; flex-direction:column; gap:8px; font-family:var(--cochin); }\n.pkg { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px var(--shadow); overflow:hidden; position:relative; }\n.pkg .hd { display:flex; align-items:center; gap:8px; padding:12px 12px 0; }\n.pkg .hd .who { flex:1; }\n.pkg .hd .who b { display:block; font-size:15px; }\n.pkg .hd .who span { font:11px var(--mono); color:var(--inkSoft); }\n.pkg .pillx { font:700 12.5px var(--cochin); background:color-mix(in srgb, var(--red) 14%, var(--card)); color:var(--red); border-radius:14px; padding:4px 8px; }\n.pkg .oid { font:11px var(--mono); color:var(--inkSoft); text-decoration:underline; padding:0 12px; height:45px; display:flex; align-items:center; }\n.pkg .bulk { display:flex; gap:8px; padding:0 12px 8px; }\n.line { display:flex; gap:8px; height:64px; padding-left:4px; border-top:1px solid var(--line); }\n.line .box { flex:0 0 45px; height:45px; display:grid; place-items:center; margin-top:10px; }\n.line .box i { width:30px; height:30px; border:2px solid var(--inkSoft); border-radius:8px; display:block; }\n.line .t { flex:1; padding:12px 12px 12px 0; }\n.line .t b { font-size:14px; font-weight:600; display:flex; justify-content:space-between; gap:8px; }\n.line .t b span { font:12px var(--mono); color:var(--inkSoft); font-weight:400; }\n.line .t small { font-size:11.5px; color:var(--inkSoft); display:block; margin-top:4px; }\n\n/* ---- Card in Hand, two pages (HandScreen.swift) ---- */\n.content { position:absolute; left:16px; right:16px; top:calc(var(--sat) + 16px); display:flex; flex-direction:column; gap:12px; font-family:var(--cochin); }\n.rowx { display:flex; align-items:center; justify-content:space-between; gap:8px; }\n.rowx .soft { color:var(--inkSoft); font-size:14px; }\n.count { font:12px var(--mono); color:var(--inkSoft); margin-left:auto; }\n.field { height:48px; border:1px solid var(--line); background:var(--card); border-radius:8px; padding:0 12px; display:flex; align-items:center; font-size:16px; color:var(--inkSoft); }\n.empty { font-size:14px; color:var(--inkSoft); margin:0; }\n.transit { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; display:flex; align-items:center; gap:8px; }\n.transit div { flex:1; } .transit b { display:block; font-size:14px; font-weight:400; } .transit small { font-size:12.5px; color:var(--red); }\n\n/* tags: dashed outline on what exists today, and on what an option adds */\n:where([data-tag]) { position:relative; }\n[data-tag]::after { content:attr(data-tag); position:absolute; right:4px; top:-9px; font:600 11px/14px -apple-system, system-ui, sans-serif; padding:0 4px;\n  background:var(--paper); z-index:8; white-space:nowrap; }\n.tag-low[data-tag]::after { top:auto; bottom:-8px; }\n.tag-left[data-tag]::after { right:auto; left:4px; }\n.tag-new { outline:2px dashed var(--new); outline-offset:2px; } .tag-new::after { color:var(--new); }\n.tag-today { outline:2px dashed var(--today); outline-offset:2px; } .tag-today::after { color:var(--today); }\n\n/* folded frame: the outer screen, 466 x 678 pt (duo-fold-and-keyboard, re-measured 2026-11-08), drawn at half size */\n.folded { position:relative; width:233px; height:339px; border:1px solid var(--ink); border-radius:12px; background:var(--paper); overflow:hidden;\n  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px); font-family:var(--cochin); margin-left:16px; }\n.folded .ft { text-align:center; font-size:16px; margin:4px 0 8px; }\n.folded .fc { background:var(--card); border:1px solid var(--line); border-radius:6px; height:58px; margin-bottom:6px; padding:6px 8px; font-size:10px; }\n.folded .fc b { display:block; font-size:11px; }\n.folded .sysbar { position:absolute; left:0; right:0; bottom:0; height:41.5px; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr);\n  font:9px var(--cochin); color:var(--inkSoft); text-align:center; align-items:center; background:var(--paper); }\n.folded .sysbar .on { color:var(--accent); font-weight:700; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\">Sample. No seller, card, count or price on this page is real. The masthead's heights are drawn, not measured.\u003c/div>\n\u003cdiv class=\"txt\">\n\u003ch1>Packages becomes Card in Hand\u003c/h1>\n\u003cp class=\"sub\">Item 35, \u003ccode>duo-card-in-hand-entry\u003c/code>. iPhone Duo, open pose, 951 x 669 pt, fold 40 pt at 455.5 pt. Keys down, so the tab bar shows. Light theme only: the native app is held to light. This option follows the PR 144 mockup (its README, line 5): on the open Duo the Packages tab is Card in Hand. Only the open Duo changes.\u003c/p>\n\n\u003cnav aria-label=\"States\">\n  \u003ca href=\"#s=packages-is-hand\">The Packages tab\u003c/a>\n  \u003ca href=\"#s=list\">One tap in: the list\u003c/a>\n  \u003ca href=\"#s=folded\">Folded\u003c/a>\n  \u003ca href=\"#\">All\u003c/a>\n\u003c/nav>\n\u003c/div>\n\n\u003c!-- Folded first, in the ios-apps order. -->\n\u003cfigure id=\"s-folded\" data-state=\"folded\">\n  \u003cdiv class=\"folded\" data-device=\"iphone-duo-folded\">\n    \u003cdiv class=\"ft\">Manifest\u003c/div>\n    \u003cdiv class=\"fc\">\u003cb>Sample Seller One\u003c/b>3 left &#183; $1.10\u003c/div>\n    \u003cdiv class=\"fc\">\u003cb>Sample Seller Two\u003c/b>1 left &#183; $0.25\u003c/div>\n    \u003cdiv class=\"fc\">\u003cb>Sample Seller Three\u003c/b>2 left &#183; $0.60\u003c/div>\n    \u003cdiv class=\"sysbar\">\u003cspan>Ledger\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan class=\"on\">Packages\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cfigcaption>\u003cb>Folded: the list stays.\u003c/b> Outer screen 466 x 678 pt, drawn at half size. Card in Hand opens only on two pages side by side (\u003ccode>PackagesTab.twoPages\u003c/code>), so folded, the Packages tab still opens the list. One tab then opens two screens, by pose: that is this option's loss.\u003c/figcaption>\n\u003c/figure>\n\n\u003c!-- The picture the owner rules on: the Packages tab on the open Duo opens Card in Hand. Focus: #duo-packages-is-hand. -->\n\u003cfigure id=\"s-packages-is-hand\" data-state=\"packages-is-hand\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-packages-is-hand\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n    \u003cdiv class=\"page l\">\u003cdiv class=\"content\">\n      \u003cdiv class=\"rowx\">\u003cspan style=\"font-weight:700;font-size:17px\">Mail day\u003c/span>\u003cspan class=\"count\">41 in &#183; 23 out\u003c/span>\u003cspan class=\"hit tag-new\" data-tag=\"New: Packages list, where Close sits today\">\u003cspan class=\"mini\">Packages list\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"field tag-today tag-low tag-left\" data-tag=\"Today: Card in Hand, as built\">Type the card in hand\u003c/div>\n      \u003cdiv class=\"rowx\">\u003cspan class=\"soft\">This envelope\u003c/span>\u003cspan class=\"hit\">\u003cspan class=\"mini\">New envelope\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"page r\">\u003cdiv class=\"content\">\n      \u003cp class=\"empty\">Type the card in hand. The envelope it came from shows here.\u003c/p>\n      \u003cdiv class=\"transit\">\u003cdiv>\u003cb>Past 14 days: 3 envelopes\u003c/b>\u003csmall>1 refund window closing\u003c/small>\u003c/div>\u003cspan class=\"hit\">\u003cspan class=\"mini\">Open\u003c/span>\u003c/span>\u003c/div>\n    \u003c/div>\u003c/div>\n    \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n    \u003cdiv class=\"bar tag-new tag-low\" data-tag=\"New: the Packages tab opens Card in Hand\">\u003cspan>Ledger\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan class=\"on\">Packages\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>The Packages tab opens Card in Hand.\u003c/b> Tap Packages on the open Duo and the two-page screen is there, with no extra tap. The list is one tap in, from a Packages list control where Close sits today.\u003c/figcaption>\n  \u003cul class=\"tags\">\n    \u003cli>Built today, drawn as built: the two pages of Card in Hand, opened with the keys down, since nothing focuses the field on open (\u003ccode>HandScreen.swift\u003c/code>). Tab bar x 520 to 927, y 593 to 657, measured (debt \u003ccode>hand-open-under-bar-at-l\u003c/code>).\u003c/li>\n    \u003cli>Proposed, not built: the tab opening Card in Hand, and the Packages list control. Its name and place are this mockup's guess.\u003c/li>\n    \u003cli>Departs from: main's Packages tab, which opens the list (\u003ccode>PackagesTab\u003c/code> in \u003ccode>HandScreen.swift\u003c/code>; \u003ccode>DuoSpread.spreads(tab:)\u003c/code>).\u003c/li>\n  \u003c/ul>\n\u003c/figure>\n\n\u003c!-- What the list costs here: one tap in, from the Packages list control. The way back is drawn where hand-open sits today. -->\n\u003cfigure id=\"s-list\" data-state=\"list\">\n  \u003cdiv class=\"fit\">\u003cdiv class=\"duo\" id=\"duo-list\" data-device=\"iphone-duo-unfolded\">\n    \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n    \u003cdiv class=\"abs mast tag-today tag-low tag-left\" data-tag=\"Today: masthead, across both pages (heights drawn)\">\n      \u003cdiv class=\"seal-row\">\u003ci>\u003c/i>\u003cspan class=\"seal\">\u003c/span>\u003ci>\u003c/i>\u003c/div>\n      \u003cdiv class=\"title\">Manifest\u003c/div>\n      \u003cdiv class=\"house\">C.H Postal Company\u003c/div>\n      \u003cdiv class=\"cells\">\u003cdiv>\u003cb>41\u003c/b>\u003csmall>in\u003c/small>\u003c/div>\u003cdiv>\u003cb>23\u003c/b>\u003csmall>out\u003c/small>\u003c/div>\u003cdiv>\u003cb>$9.80\u003c/b>\u003csmall>outstanding\u003c/small>\u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"abs slot\">\u003c/div>\n    \u003cdiv class=\"abs stamped\">2 stamped \u003cspan>&#9675;\u003c/span>\u003c/div>\n    \u003cdiv class=\"abs handopen hit tag-new\" data-tag=\"New: back to Card in Hand (drawn where the control sits today)\">\u003cspan class=\"mini\">Card in Hand\u003c/span>\u003c/div>\n    \u003cdiv class=\"abs cards tag-today tag-left\" data-tag=\"Today: the Packages list, one page across the fold\">\n      \u003cdiv class=\"pkg\">\n        \u003cdiv class=\"hd\">\u003cdiv class=\"who\">\u003cb>Sample Seller One\u003c/b>\u003cspan>2026-10-02\u003c/span>\u003c/div>\u003cspan class=\"pillx\">3 left &#183; $1.10\u003c/span>\u003c/div>\n        \u003cdiv class=\"oid\">SAMPLE-0001\u003c/div>\n        \u003cdiv class=\"bulk\">\u003cspan class=\"hit\">\u003cspan class=\"mini\">Mark all received\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$0.42\u003c/span>\u003c/b>\u003csmall>Sample Set &#183; NM\u003c/small>\u003c/span>\u003c/div>\n        \u003cdiv class=\"line\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Ponder\u003cspan>$0.18\u003c/span>\u003c/b>\u003csmall>Sample Set &#183; NM\u003c/small>\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"fold\">\u003cspan>FOLD\u003c/span>\u003c/div>\n    \u003cdiv class=\"bar\">\u003cspan>Ledger\u003c/span>\u003cspan>Orphaned\u003c/span>\u003cspan>Tally\u003c/span>\u003cspan class=\"on\">Packages\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n  \u003cfigcaption>\u003cb>One tap in: the list.\u003c/b> The Packages list control shows the list you know, with a way back to Card in Hand. On the open Duo the list is no longer what the tab opens; the folded phone still opens on it.\u003c/figcaption>\n\u003c/figure>\n\n\u003c/main>\n\n\u003cscript>\n// Scale each 951 pt frame down only when the window is narrower; at 951 or wider it draws 1:1.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; d.style.zoom = Math.min(1, w.clientWidth / 951); });\n}\n// Deep link: #s=\u003cstate> shows one state; no hash shows all.\nfunction route() {\n  const m = location.hash.match(/s=([\\w-]+)/), s = m && m[1];\n  document.querySelectorAll('figure').forEach(f => { f.hidden = !!s && f.dataset.state !== s; });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === (location.hash || '#'))));\n  fit();\n}\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "tally-320-move": "\u003c!doctype html>\n\u003chtml lang=\"en\" data-theme=\"light\" data-option=\"keep\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Tally Card, Keep Both\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The web ships one theme, light, so this page has one. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --silver:#C4C3C0; --manila:#EADBBA; --manilaInk:#695832;\n  --shadow:rgba(28,43,36,0.06);\n  /* the font stacks of src/app.jsx: mono and cochin */\n  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  --cochin: Cochin, 'Hoefler Text', Palatino, Georgia, serif;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { color-scheme: light; } }\n:root[data-theme=\"dark\"] { color-scheme: light; }\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); color:var(--ink); }\nbody { font-family:var(--cochin); font-size:16px; line-height:1.45; }\nbutton, input { font-family:inherit; }\nmain { padding:16px; max-width:760px; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font:12px/1.5 var(--mono); }\nh1 { font-size:24px; font-weight:400; line-height:1.2; margin:16px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; font-size:15px; max-width:62ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; align-items:center; }\nnav .lab { font:12px/1.4 var(--mono); color:var(--inkSoft); min-width:48px; }\nnav a, nav button { font:12px/1.4 var(--mono); min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:700; }\nnav button[aria-pressed=\"true\"] { color:var(--inkSoft); text-decoration:line-through; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n.tags { margin:12px 0 4px; }\n/* Tag text is ink: green and red on paper fall under 4.5:1 at this size, so the colour rides on the dashed border. */\n.tag { display:inline-block; font:12px/1.4 var(--mono); color:var(--ink); border:1px dashed var(--inkSoft); border-radius:4px; padding:2px 6px; margin:0 4px 4px 0; }\n.tag.today { border-color:var(--red); } .tag.new { border-color:var(--green); }\n.cap { font-size:17px; margin:20px 0 8px; }\n.cap small { font:12px/1.4 var(--mono); color:var(--inkSoft); display:block; }\n.scroll { overflow-x:auto; margin:0 -16px; padding:0 16px; }\n/* the app sets no line height, so its card lays out at normal */\n.frame { position:relative; line-height:normal; font-size:16px; }\n.verdict { font:12px/1.5 var(--mono); margin:8px 0 0; padding:8px 12px; border-radius:8px; border:1px dashed var(--inkSoft); }\n.verdict.bad { border-color:var(--red); } .verdict.good { border-color:var(--green); }\n.verdict b { font-weight:700; }\n/* overlays: absolutely placed, so they add no height to what they mark */\n.thumb { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:2px solid var(--ink);\n  background:rgba(111,92,166,.22); pointer-events:none; z-index:3; }\n.ghost { position:absolute; left:-8px; right:-8px; border-top:2px dashed var(--red); pointer-events:none; z-index:3; }\n.ghost.zero { border-top-color:var(--green); }\n.bracket { position:absolute; left:-12px; width:8px; border:2px solid var(--red); border-right:0; pointer-events:none; z-index:3; }\nhtml[data-guides=\"off\"] .thumb, html[data-guides=\"off\"] .ghost, html[data-guides=\"off\"] .bracket { display:none; }\n/* the hidden slot of the kept button: drawn only as a guide, it is invisible in the build */\n/* a hidden box draws no outline, so the guide is a child set visible again */\n.slot { position:relative; }\nhtml[data-guides=\"on\"] .slot::after { content:\"hidden\"; visibility:visible; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\n  border:1px dashed var(--green); border-radius:5px; font:10.5px/1 var(--mono); color:var(--inkSoft); }\n.read { font:12px/1.55 var(--mono); color:var(--inkSoft); margin:12px 0 0; }\n.read b { color:var(--ink); }\nsection { margin-top:28px; border-top:1px solid var(--line); padding-top:16px; }\nsection h2 { font-size:19px; font-weight:400; margin:0 0 8px; }\nsection ul { margin:0; padding-left:20px; font-size:15px; max-width:62ch; }\nsection li { margin-bottom:4px; }\ntable { border-collapse:collapse; font:12px/1.4 var(--mono); margin:8px 0; }\nth, td { text-align:left; padding:4px 8px 4px 0; border-bottom:1px solid var(--line); vertical-align:top; }\nth { font-weight:700; }\ncode { font:12px/1.4 var(--mono); }\n[hidden] { display:none !important; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\" role=\"note\">Sample. No order, seller, date or dollar figure on this page is real: the card is the test fixture's Lightning Bolt, six copies at $1.00 from six made-up sellers. The px figures are measured.\u003c/div>\n\u003ch1 id=\"title\">Keep both buttons\u003c/h1>\n\u003cp class=\"sub\" id=\"sub\">\u003c/p>\n\n\u003cnav aria-label=\"Check-in\">\n  \u003cspan class=\"lab\">Tap\u003c/span>\n  \u003ca href=\"#s=1\" data-k=\"s\" data-v=\"1\">Check-in 1\u003c/a>\n  \u003ca href=\"#s=6\" data-k=\"s\" data-v=\"6\">Check-in 6\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Width\">\n  \u003cspan class=\"lab\">Width\u003c/span>\n  \u003ca href=\"#w=320\" data-k=\"w\" data-v=\"320\">320 px\u003c/a>\n  \u003ca href=\"#w=375\" data-k=\"w\" data-v=\"375\">375 px\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Theme and marks\">\n  \u003cspan class=\"lab\">Show\u003c/span>\n  \u003ca href=\"#t=light\" data-k=\"t\" data-v=\"light\">Light, the only theme\u003c/a>\n  \u003ca href=\"#g=on\" data-k=\"g\" data-v=\"on\">Marks on\u003c/a>\n  \u003ca href=\"#g=off\" data-k=\"g\" data-v=\"off\">Marks off\u003c/a>\n  \u003cbutton type=\"button\" id=\"hide\" aria-pressed=\"false\">Hide this option\u003c/button>\n\u003c/nav>\n\n\u003cdiv id=\"option\">\n  \u003cdiv class=\"tags\" id=\"tags\">\u003c/div>\n  \u003cp class=\"verdict\" id=\"verdict\">\u003c/p>\n  \u003cdiv id=\"choice\">\n  \u003cp class=\"cap\" id=\"cap-before\">\u003c/p>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"frame\" id=\"before\">\u003c/div>\u003c/div>\n  \u003cp class=\"cap\" id=\"cap-after\">\u003c/p>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"frame\" id=\"after\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"read\" id=\"read\">\u003c/p>\n\u003c/div>\n\n\u003csection aria-label=\"Measured on the real card\">\n  \u003ch2>Measured on the real card\u003c/h2>\n  \u003cp class=\"read\" style=\"margin-top:0\">Built page \u003ccode>index.html\u003c/code> at main \u003ccode>b825fd27\u003c/code>, headless Chromium (Playwright 1.63.0), Tally view, Everything, card open, six copies. Script: \u003ccode>docs/design/shots/item-62-tally-320/measure.mjs\u003c/code>. \"Keep both buttons\" is measured on the same page with a hidden copy of the missing button put in its slot. It is not built.\u003c/p>\n  \u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Width, option\u003c/th>\u003cth>Card height: rest, 1 to 5, 6\u003c/th>\u003cth>Rows move: tap 1, tap 6\u003c/th>\u003cth>Button row\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>\n      \u003ctr>\u003ctd>320, accept the move\u003c/td>\u003ctd>674.34, 688.34, 674.34\u003c/td>\u003ctd>\u003cb>+14, −14\u003c/b>\u003c/td>\u003ctd>40, 54, 40\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>320, keep both buttons\u003c/td>\u003ctd>688.34 at every step\u003c/td>\u003ctd>\u003cb>0, 0\u003c/b>\u003c/td>\u003ctd>54 at every step\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>375, accept the move\u003c/td>\u003ctd>674.34 at every step\u003c/td>\u003ctd>0, 0\u003c/td>\u003ctd>40 at every step\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>375, keep both buttons\u003c/td>\u003ctd>674.34 at every step\u003c/td>\u003ctd>0, 0\u003c/td>\u003ctd>40 at every step\u003c/td>\u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cul>\n    \u003cli>The move is 14 px here, as the record \u003ccode>card-reserved-geometry\u003c/code> says (taken at \u003ccode>1607933\u003c/code>). Its card heights are 1 px lower (673.34 and 687.34). The serif face differs: this machine has no Cochin or Menlo, so the mono stack falls to DejaVu Sans Mono, which has Menlo's widths.\u003c/li>\n    \u003cli>The cards on this page are drawn from \u003ccode>ItemTotalRow\u003c/code> and \u003ccode>ItemRow\u003c/code> in \u003ccode>src/app.jsx\u003c/code>, with their inline styles. The line under the cards reads the drawn page live.\u003c/li>\n    \u003cli>The Tally card has two bulk buttons, Mark all received and Clear check-ins. It has no Stamp button.\u003c/li>\n    \u003cli>Not measured: a real phone, WebKit, and widths other than 320 and 375.\u003c/li>\n  \u003c/ul>\n\u003c/section>\n\u003c/main>\n\u003cscript>\nconst OPTION = document.documentElement.dataset.option; // \"keep\" or \"accept\"\nconst C = { card:\"#FCF6EA\", ink:\"#332E3F\", inkSoft:\"#6E6379\", line:\"#DCCDB6\", accent:\"#6F5CA6\", green:\"#2E7A5E\", greenSoft:\"#E6E7D7\", red:\"#A8443C\", silver:\"#C4C3C0\", manilaInk:\"#695832\", shadow:\"rgba(28,43,36,0.06)\" };\nconst mono = \"ui-monospace, SFMono-Regular, Menlo, Consolas, monospace\";\nconst cochin = \"Cochin, 'Hoefler Text', Palatino, Georgia, serif\";\n/* The six source rows in the order the real card lists them; warn is the lost-mail age. */\nconst ROWS = [\n  { o:\"G1\", seller:\"Eta Cards\", date:\"2026-07-05\" },\n  { o:\"B1\", seller:\"Beta Games\", date:\"2026-07-02\", warn:\"140d\" },\n  { o:\"A1\", seller:\"Alpha Cards\", date:\"2026-07-01\", warn:\"141d\" },\n  { o:\"F1\", seller:\"Zeta Games\", date:\"2026-06-20\", warn:\"152d\" },\n  { o:\"E1\", seller:\"Epsilon Cards\", date:\"2026-06-15\" },\n  { o:\"C1\", seller:\"Gamma Cards\", date:\"2026-06-01\" },\n];\nconst TOTAL = ROWS.length;\nconst css = (o) => Object.entries(o).map(([k, v]) => `${k}:${v}`).join(\";\");\nconst esc = (s) => s.replace(/[&\u003c>\"]/g, (c) => ({ \"&\":\"&amp;\", \"\u003c\":\"&lt;\", \">\":\"&gt;\", '\"':\"&quot;\" }[c]));\n\n/* miniBtn in src/app.jsx */\nconst miniBtn = css({ \"font-family\":mono, \"font-size\":\"11.5px\", padding:\"8px 12px\", \"border-radius\":\"5px\", border:`1px solid ${C.line}`, background:C.card, color:C.ink, cursor:\"pointer\" });\n\nfunction bulkButton(label, shown, isNew) {\n  if (shown) return `\u003cbutton type=\"button\" style=\"${miniBtn}\">${label}\u003c/button>`;\n  /* only \"keep both buttons\" keeps the inapplicable one, mounted and hidden */\n  return isNew ? `\u003cbutton type=\"button\" class=\"slot\" aria-hidden=\"true\" tabindex=\"-1\" style=\"${miniBtn};visibility:hidden\">${label}\u003c/button>` : \"\";\n}\n\nfunction itemRow(r, got, idx) {\n  const done = idx \u003c got;\n  const box = done\n    ? `\u003cbutton type=\"button\" aria-label=\"Mark as not received\" data-box style=\"${css({ width:\"30px\", height:\"30px\", \"flex-shrink\":0, \"border-radius\":\"8px\", border:`2px solid ${C.green}`, background:C.green, color:C.card, display:\"flex\", \"align-items\":\"center\", \"justify-content\":\"center\", \"font-size\":\"16px\", \"line-height\":1, padding:0 })}\">\u003csvg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 12.5 L9.5 18 L20 6\" fill=\"none\" stroke=\"#FCF6EA\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003c/svg>\u003c/button>`\n    : `\u003cbutton type=\"button\" aria-label=\"Mark as received\" data-box style=\"${css({ width:\"30px\", height:\"30px\", \"flex-shrink\":0, \"border-radius\":\"8px\", border:`2px solid ${C.inkSoft}`, background:C.card, color:C.manilaInk, padding:0 })}\">\u003c/button>`;\n  const warn = !done && r.warn ? `\u003cspan style=\"color:${C.red};font-weight:700\">⚠ ${r.warn} · \u003c/span>` : \"\";\n  return `\u003cdiv data-row=\"${idx}\" style=\"${css({ display:\"flex\", \"align-items\":\"flex-start\", gap:\"12px\", padding:\"12px\", \"border-top\":`1px solid ${C.line}`, background: done ? C.greenSoft : \"transparent\" })}\">\n    ${box}\n    \u003cdiv style=\"flex:1 1 0%;min-width:0\">\n      \u003cdiv style=\"display:flex;gap:8px;align-items:baseline\">\n        \u003cdiv style=\"${css({ flex:\"1 1 0%\", \"min-width\":0, \"font-weight\":600, \"font-size\":\"14px\", \"line-height\":1.35, color: done ? C.inkSoft : C.ink })}\">${esc(r.seller)}\u003c/div>\n        \u003cspan style=\"font-family:${mono};font-size:12px;color:${C.inkSoft};flex-shrink:0\">$1.00\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"${css({ \"margin-top\":\"4px\", \"font-size\":\"11.5px\", \"line-height\":\"13px\", color:C.inkSoft, overflow:\"hidden\", \"text-overflow\":\"ellipsis\", \"white-space\":\"nowrap\" })}\">${warn}${r.date} · Test Set · Near Mint\u003c/div>\n      \u003cbutton type=\"button\" aria-label=\"Show the whole order ${r.o}\" style=\"${css({ \"min-height\":\"30px\", width:\"100%\", display:\"flex\", \"align-items\":\"center\", gap:\"4px\", padding:\"4px 0\", border:0, background:\"transparent\", \"font-family\":mono, \"font-size\":\"10.5px\", color:C.inkSoft, \"text-align\":\"left\" })}\">\u003cspan style=\"text-decoration:underline;text-underline-offset:2px\">${r.o}\u003c/span>\u003cspan>›\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/div>`;\n}\n\n/* ItemTotalRow in src/app.jsx, open */\nfunction tallyCard(got, rowId) {\n  const done = got >= TOTAL;\n  const keep = OPTION === \"keep\";\n  const bar = got > 0 && !done\n    ? `\u003cdiv style=\"position:absolute;top:0;left:0;right:0;pointer-events:none\">\u003cdiv style=\"height:3px;background:${C.silver};overflow:hidden;position:relative\">\u003cdiv style=\"width:${(got / TOTAL) * 100}%;height:100%;background:${C.accent}\">\u003c/div>\u003c/div>\u003c/div>`\n    : \"\";\n  return `\u003cdiv data-card style=\"${css({ position:\"relative\", background:C.card, border:`1px solid ${done ? C.green : C.line}`, \"border-radius\":\"8px\", overflow:\"clip\", \"box-shadow\":`0 1px 2px ${C.shadow}` })}\">\n    \u003cbutton type=\"button\" style=\"${css({ width:\"100%\", \"text-align\":\"left\", background:\"transparent\", border:\"none\", padding:\"12px\", display:\"flex\", \"align-items\":\"center\", gap:\"8px\", color:C.ink })}\">\n      \u003cspan style=\"font-family:${mono};font-size:10px;color:${C.inkSoft};transform:rotate(90deg);display:inline-block;flex-shrink:0\">▶\u003c/span>\n      \u003cdiv style=\"flex:1 1 0%;min-width:0\">\n        \u003cdiv style=\"font-weight:700;font-size:15px;line-height:1.3;color:${C.ink}\">Lightning Bolt\u003c/div>\n        \u003cdiv style=\"font-family:${mono};font-size:11px;color:${C.inkSoft};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">6 sellers · 6 orders · Test Set\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex-shrink:0;text-align:right\">\n        \u003cdiv style=\"font-family:${mono};font-size:15px;font-weight:700;color:${done ? C.green : C.ink};white-space:nowrap\">${got}/${TOTAL}${done ? \" ✓\" : \"\"}\u003c/div>\n        \u003cdiv style=\"font-family:${mono};font-size:11.5px;color:${C.inkSoft};white-space:nowrap\">$1.00 / copy\u003c/div>\n        \u003cdiv style=\"font-family:${cochin};font-size:12px;font-weight:700;color:${C.red};white-space:nowrap;${done ? \"visibility:hidden\" : \"\"}\">${TOTAL - got} left · $${(TOTAL - got).toFixed(2)}\u003c/div>\n      \u003c/div>\n    \u003c/button>\n    ${bar}\n    \u003cdiv style=\"padding:0 12px 4px;font-family:${mono};font-size:10.5px;color:${C.inkSoft}\">$6.00 across 6 copies · $1.00 avg\u003c/div>\n    \u003cdiv ${rowId ? `id=\"${rowId}\"` : \"\"} data-actions style=\"display:flex;gap:8px;padding:0 12px 8px;justify-content:flex-end\">\n      ${bulkButton(\"Mark all received\", !done, keep)}\n      ${bulkButton(\"Clear check-ins\", got > 0, keep)}\n    \u003c/div>\n    ${ROWS.map((r, i) => itemRow(r, got, i)).join(\"\")}\n  \u003c/div>`;\n}\n\nconst TEXT = {\n  keep: {\n    title: \"Keep both buttons\",\n    sub: \"Waiting item 62, tally-320-move. The Tally card always holds the room of both bulk buttons, and hides the one that does not apply. On a 320 px phone nothing moves when you check in. The cost is a blank slot beside the visible button, and at 320 px a button row 14 px taller at rest.\",\n    tags: {\n      1: [[\"today\", \"Today: Mark all received\"], [\"today\", \"Today: Clear check-ins appears on check-in 1\"], [\"new\", \"New: Clear check-ins kept in its slot, hidden, from the start\"]],\n      6: [[\"today\", \"Today: Clear check-ins\"], [\"today\", \"Today: Mark all received leaves on check-in 6\"], [\"new\", \"New: Mark all received kept in its slot, hidden, after check-in 6\"]],\n    },\n  },\n  accept: {\n    title: \"Accept the move\",\n    sub: \"Waiting item 62, tally-320-move. No change: the card stays as built. On a 320 px phone the bulk buttons wrap to two lines when both show, so the card grows 14 px on check-in 1 and shrinks 14 px on check-in 6. Every row below moves under the thumb.\",\n    tags: {\n      1: [[\"today\", \"Today: Mark all received, alone, one line\"], [\"today\", \"Today: Clear check-ins appears on check-in 1, both labels wrap\"]],\n      6: [[\"today\", \"Today: both buttons, labels wrapped\"], [\"today\", \"Today: Mark all received leaves on check-in 6, Clear check-ins goes back to one line\"]],\n    },\n  },\n}[OPTION];\n\nlet hidden = false;\nfunction state() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  return { s: h.get(\"s\") === \"6\" ? \"6\" : \"1\", w: h.get(\"w\") === \"375\" ? \"375\" : \"320\", t: \"light\", g: h.get(\"g\") === \"off\" ? \"off\" : \"on\" };\n}\n\nfunction render() {\n  const s = state();\n  document.documentElement.dataset.guides = s.g;\n  for (const a of document.querySelectorAll(\"nav a[data-k]\")) {\n    a.setAttribute(\"aria-current\", String(s[a.dataset.k] === a.dataset.v));\n    a.href = \"#\" + new URLSearchParams({ ...s, [a.dataset.k]: a.dataset.v }).toString();\n  }\n  document.getElementById(\"title\").textContent = TEXT.title;\n  document.getElementById(\"sub\").textContent = TEXT.sub;\n  document.getElementById(\"option\").hidden = hidden;\n  document.getElementById(\"tags\").innerHTML = TEXT.tags[s.s].map(([k, t]) => `\u003cspan class=\"tag ${k}\">${esc(t)}\u003c/span>`).join(\"\");\n  const step = Number(s.s), from = step - 1, tapped = step - 1;\n  const width = Number(s.w) - 32; // the card's box: the viewport less the 16 px page padding each side\n  const before = document.getElementById(\"before\"), after = document.getElementById(\"after\");\n  for (const f of [before, after]) f.style.width = width + \"px\";\n  before.innerHTML = tallyCard(from);\n  after.innerHTML = tallyCard(step);\n  document.getElementById(\"cap-before\").innerHTML = `Before check-in ${step} \u003csmall>${from} of 6 received. The ring marks the tap, on ${esc(ROWS[tapped].seller)}'s box.\u003c/small>`;\n  document.getElementById(\"cap-after\").innerHTML = `After check-in ${step} \u003csmall>${step} of 6 received. The ring stays where the finger was. The dashed line is where the tapped row's top edge was before the tap.\u003c/small>`;\n\n  /* read the drawn boxes, then lay the marks over the after frame */\n  const rel = (frame, el) => { const a = frame.getBoundingClientRect(), b = el.getBoundingClientRect(); return { top: b.top - a.top, left: b.left - a.left, w: b.width, h: b.height }; };\n  const bRow = rel(before, before.querySelector(`[data-row=\"${tapped}\"]`));\n  const bBox = rel(before, before.querySelector(`[data-row=\"${tapped}\"] [data-box]`));\n  const aRow = rel(after, after.querySelector(`[data-row=\"${tapped}\"]`));\n  const aBox = rel(after, after.querySelector(`[data-row=\"${tapped}\"] [data-box]`));\n  const move = +(aRow.top - bRow.top).toFixed(2);\n  const ring = (f) => `\u003cdiv class=\"thumb\" style=\"top:${bBox.top + bBox.h / 2}px;left:${bBox.left + bBox.w / 2}px\">\u003c/div>`;\n  before.insertAdjacentHTML(\"beforeend\", ring(before));\n  const sign = move > 0 ? \"+\" : move \u003c 0 ? \"−\" : \"\";\n  after.insertAdjacentHTML(\"beforeend\",\n    ring(after) +\n    `\u003cdiv class=\"ghost${move === 0 ? \" zero\" : \"\"}\" style=\"top:${bRow.top}px\">\u003c/div>` +\n    (move !== 0 ? `\u003cdiv class=\"bracket\" style=\"top:${Math.min(bRow.top, aRow.top)}px;height:${Math.abs(move)}px\">\u003c/div>` : \"\"));\n  const off = +((bBox.top + bBox.h / 2) - (aBox.top + aBox.h / 2)).toFixed(2);\n  const v = document.getElementById(\"verdict\");\n  v.className = \"verdict \" + (move === 0 ? \"good\" : \"bad\");\n  v.innerHTML = move === 0\n    ? `\u003cb>Nothing moves.\u003c/b> The rows stay put on check-in ${step}. The finger is still in the middle of the box.`\n    : `\u003cb>The rows move ${sign}${Math.abs(move)} px\u003c/b> on check-in ${step}, ${move > 0 ? \"down\" : \"up\"}. The finger is now ${Math.abs(off)} px off the middle of a 30 px box. A quick next tap can miss the box or land on the row beside it.`;\n  const ch = (f) => +f.querySelector(\"[data-card]\").getBoundingClientRect().height.toFixed(2);\n  const rh = (f) => +f.querySelector(\"[data-actions]\").getBoundingClientRect().height.toFixed(2);\n  document.getElementById(\"read\").innerHTML = `Drawn here, read live at ${s.w} px: card ${ch(before)} then ${ch(after)} px; button row ${rh(before)} then ${rh(after)} px; tapped row moves \u003cb>${move} px\u003c/b>.`;\n  document.body.dataset.read = JSON.stringify({ w: Number(s.w), s: step, cardBefore: ch(before), cardAfter: ch(after), rowBefore: rh(before), rowAfter: rh(after), move });\n}\n\ndocument.getElementById(\"hide\").addEventListener(\"click\", (e) => {\n  hidden = !hidden;\n  e.currentTarget.setAttribute(\"aria-pressed\", String(hidden));\n  render();\n});\naddEventListener(\"hashchange\", render);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "tally-320-move-b": "\u003c!doctype html>\n\u003chtml lang=\"en\" data-theme=\"light\" data-option=\"accept\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Tally Card, Accept Move\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The web ships one theme, light, so this page has one. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --silver:#C4C3C0; --manila:#EADBBA; --manilaInk:#695832;\n  --shadow:rgba(28,43,36,0.06);\n  /* the font stacks of src/app.jsx: mono and cochin */\n  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n  --cochin: Cochin, 'Hoefler Text', Palatino, Georgia, serif;\n}\n@media (prefers-color-scheme: dark) { :root:not([data-theme=\"light\"]) { color-scheme: light; } }\n:root[data-theme=\"dark\"] { color-scheme: light; }\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); color:var(--ink); }\nbody { font-family:var(--cochin); font-size:16px; line-height:1.45; }\nbutton, input { font-family:inherit; }\nmain { padding:16px; max-width:760px; }\n.banner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font:12px/1.5 var(--mono); }\nh1 { font-size:24px; font-weight:400; line-height:1.2; margin:16px 0 4px; }\n.sub { color:var(--inkSoft); margin:0 0 12px; font-size:15px; max-width:62ch; }\nnav { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; align-items:center; }\nnav .lab { font:12px/1.4 var(--mono); color:var(--inkSoft); min-width:48px; }\nnav a, nav button { font:12px/1.4 var(--mono); min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:700; }\nnav button[aria-pressed=\"true\"] { color:var(--inkSoft); text-decoration:line-through; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\n.tags { margin:12px 0 4px; }\n/* Tag text is ink: green and red on paper fall under 4.5:1 at this size, so the colour rides on the dashed border. */\n.tag { display:inline-block; font:12px/1.4 var(--mono); color:var(--ink); border:1px dashed var(--inkSoft); border-radius:4px; padding:2px 6px; margin:0 4px 4px 0; }\n.tag.today { border-color:var(--red); } .tag.new { border-color:var(--green); }\n.cap { font-size:17px; margin:20px 0 8px; }\n.cap small { font:12px/1.4 var(--mono); color:var(--inkSoft); display:block; }\n.scroll { overflow-x:auto; margin:0 -16px; padding:0 16px; }\n/* the app sets no line height, so its card lays out at normal */\n.frame { position:relative; line-height:normal; font-size:16px; }\n.verdict { font:12px/1.5 var(--mono); margin:8px 0 0; padding:8px 12px; border-radius:8px; border:1px dashed var(--inkSoft); }\n.verdict.bad { border-color:var(--red); } .verdict.good { border-color:var(--green); }\n.verdict b { font-weight:700; }\n/* overlays: absolutely placed, so they add no height to what they mark */\n.thumb { position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:2px solid var(--ink);\n  background:rgba(111,92,166,.22); pointer-events:none; z-index:3; }\n.ghost { position:absolute; left:-8px; right:-8px; border-top:2px dashed var(--red); pointer-events:none; z-index:3; }\n.ghost.zero { border-top-color:var(--green); }\n.bracket { position:absolute; left:-12px; width:8px; border:2px solid var(--red); border-right:0; pointer-events:none; z-index:3; }\nhtml[data-guides=\"off\"] .thumb, html[data-guides=\"off\"] .ghost, html[data-guides=\"off\"] .bracket { display:none; }\n/* the hidden slot of the kept button: drawn only as a guide, it is invisible in the build */\n/* a hidden box draws no outline, so the guide is a child set visible again */\n.slot { position:relative; }\nhtml[data-guides=\"on\"] .slot::after { content:\"hidden\"; visibility:visible; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;\n  border:1px dashed var(--green); border-radius:5px; font:10.5px/1 var(--mono); color:var(--inkSoft); }\n.read { font:12px/1.55 var(--mono); color:var(--inkSoft); margin:12px 0 0; }\n.read b { color:var(--ink); }\nsection { margin-top:28px; border-top:1px solid var(--line); padding-top:16px; }\nsection h2 { font-size:19px; font-weight:400; margin:0 0 8px; }\nsection ul { margin:0; padding-left:20px; font-size:15px; max-width:62ch; }\nsection li { margin-bottom:4px; }\ntable { border-collapse:collapse; font:12px/1.4 var(--mono); margin:8px 0; }\nth, td { text-align:left; padding:4px 8px 4px 0; border-bottom:1px solid var(--line); vertical-align:top; }\nth { font-weight:700; }\ncode { font:12px/1.4 var(--mono); }\n[hidden] { display:none !important; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cdiv class=\"banner\" role=\"note\">Sample. No order, seller, date or dollar figure on this page is real: the card is the test fixture's Lightning Bolt, six copies at $1.00 from six made-up sellers. The px figures are measured.\u003c/div>\n\u003ch1 id=\"title\">Accept the move\u003c/h1>\n\u003cp class=\"sub\" id=\"sub\">\u003c/p>\n\n\u003cnav aria-label=\"Check-in\">\n  \u003cspan class=\"lab\">Tap\u003c/span>\n  \u003ca href=\"#s=1\" data-k=\"s\" data-v=\"1\">Check-in 1\u003c/a>\n  \u003ca href=\"#s=6\" data-k=\"s\" data-v=\"6\">Check-in 6\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Width\">\n  \u003cspan class=\"lab\">Width\u003c/span>\n  \u003ca href=\"#w=320\" data-k=\"w\" data-v=\"320\">320 px\u003c/a>\n  \u003ca href=\"#w=375\" data-k=\"w\" data-v=\"375\">375 px\u003c/a>\n\u003c/nav>\n\u003cnav aria-label=\"Theme and marks\">\n  \u003cspan class=\"lab\">Show\u003c/span>\n  \u003ca href=\"#t=light\" data-k=\"t\" data-v=\"light\">Light, the only theme\u003c/a>\n  \u003ca href=\"#g=on\" data-k=\"g\" data-v=\"on\">Marks on\u003c/a>\n  \u003ca href=\"#g=off\" data-k=\"g\" data-v=\"off\">Marks off\u003c/a>\n  \u003cbutton type=\"button\" id=\"hide\" aria-pressed=\"false\">Hide this option\u003c/button>\n\u003c/nav>\n\n\u003cdiv id=\"option\">\n  \u003cdiv class=\"tags\" id=\"tags\">\u003c/div>\n  \u003cp class=\"verdict\" id=\"verdict\">\u003c/p>\n  \u003cdiv id=\"choice\">\n  \u003cp class=\"cap\" id=\"cap-before\">\u003c/p>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"frame\" id=\"before\">\u003c/div>\u003c/div>\n  \u003cp class=\"cap\" id=\"cap-after\">\u003c/p>\n  \u003cdiv class=\"scroll\">\u003cdiv class=\"frame\" id=\"after\">\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"read\" id=\"read\">\u003c/p>\n\u003c/div>\n\n\u003csection aria-label=\"Measured on the real card\">\n  \u003ch2>Measured on the real card\u003c/h2>\n  \u003cp class=\"read\" style=\"margin-top:0\">Built page \u003ccode>index.html\u003c/code> at main \u003ccode>b825fd27\u003c/code>, headless Chromium (Playwright 1.63.0), Tally view, Everything, card open, six copies. Script: \u003ccode>docs/design/shots/item-62-tally-320/measure.mjs\u003c/code>. \"Keep both buttons\" is measured on the same page with a hidden copy of the missing button put in its slot. It is not built.\u003c/p>\n  \u003ctable>\n    \u003cthead>\u003ctr>\u003cth>Width, option\u003c/th>\u003cth>Card height: rest, 1 to 5, 6\u003c/th>\u003cth>Rows move: tap 1, tap 6\u003c/th>\u003cth>Button row\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>\n      \u003ctr>\u003ctd>320, accept the move\u003c/td>\u003ctd>674.34, 688.34, 674.34\u003c/td>\u003ctd>\u003cb>+14, −14\u003c/b>\u003c/td>\u003ctd>40, 54, 40\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>320, keep both buttons\u003c/td>\u003ctd>688.34 at every step\u003c/td>\u003ctd>\u003cb>0, 0\u003c/b>\u003c/td>\u003ctd>54 at every step\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>375, accept the move\u003c/td>\u003ctd>674.34 at every step\u003c/td>\u003ctd>0, 0\u003c/td>\u003ctd>40 at every step\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>375, keep both buttons\u003c/td>\u003ctd>674.34 at every step\u003c/td>\u003ctd>0, 0\u003c/td>\u003ctd>40 at every step\u003c/td>\u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cul>\n    \u003cli>The move is 14 px here, as the record \u003ccode>card-reserved-geometry\u003c/code> says (taken at \u003ccode>1607933\u003c/code>). Its card heights are 1 px lower (673.34 and 687.34). The serif face differs: this machine has no Cochin or Menlo, so the mono stack falls to DejaVu Sans Mono, which has Menlo's widths.\u003c/li>\n    \u003cli>The cards on this page are drawn from \u003ccode>ItemTotalRow\u003c/code> and \u003ccode>ItemRow\u003c/code> in \u003ccode>src/app.jsx\u003c/code>, with their inline styles. The line under the cards reads the drawn page live.\u003c/li>\n    \u003cli>The Tally card has two bulk buttons, Mark all received and Clear check-ins. It has no Stamp button.\u003c/li>\n    \u003cli>Not measured: a real phone, WebKit, and widths other than 320 and 375.\u003c/li>\n  \u003c/ul>\n\u003c/section>\n\u003c/main>\n\u003cscript>\nconst OPTION = document.documentElement.dataset.option; // \"keep\" or \"accept\"\nconst C = { card:\"#FCF6EA\", ink:\"#332E3F\", inkSoft:\"#6E6379\", line:\"#DCCDB6\", accent:\"#6F5CA6\", green:\"#2E7A5E\", greenSoft:\"#E6E7D7\", red:\"#A8443C\", silver:\"#C4C3C0\", manilaInk:\"#695832\", shadow:\"rgba(28,43,36,0.06)\" };\nconst mono = \"ui-monospace, SFMono-Regular, Menlo, Consolas, monospace\";\nconst cochin = \"Cochin, 'Hoefler Text', Palatino, Georgia, serif\";\n/* The six source rows in the order the real card lists them; warn is the lost-mail age. */\nconst ROWS = [\n  { o:\"G1\", seller:\"Eta Cards\", date:\"2026-07-05\" },\n  { o:\"B1\", seller:\"Beta Games\", date:\"2026-07-02\", warn:\"140d\" },\n  { o:\"A1\", seller:\"Alpha Cards\", date:\"2026-07-01\", warn:\"141d\" },\n  { o:\"F1\", seller:\"Zeta Games\", date:\"2026-06-20\", warn:\"152d\" },\n  { o:\"E1\", seller:\"Epsilon Cards\", date:\"2026-06-15\" },\n  { o:\"C1\", seller:\"Gamma Cards\", date:\"2026-06-01\" },\n];\nconst TOTAL = ROWS.length;\nconst css = (o) => Object.entries(o).map(([k, v]) => `${k}:${v}`).join(\";\");\nconst esc = (s) => s.replace(/[&\u003c>\"]/g, (c) => ({ \"&\":\"&amp;\", \"\u003c\":\"&lt;\", \">\":\"&gt;\", '\"':\"&quot;\" }[c]));\n\n/* miniBtn in src/app.jsx */\nconst miniBtn = css({ \"font-family\":mono, \"font-size\":\"11.5px\", padding:\"8px 12px\", \"border-radius\":\"5px\", border:`1px solid ${C.line}`, background:C.card, color:C.ink, cursor:\"pointer\" });\n\nfunction bulkButton(label, shown, isNew) {\n  if (shown) return `\u003cbutton type=\"button\" style=\"${miniBtn}\">${label}\u003c/button>`;\n  /* only \"keep both buttons\" keeps the inapplicable one, mounted and hidden */\n  return isNew ? `\u003cbutton type=\"button\" class=\"slot\" aria-hidden=\"true\" tabindex=\"-1\" style=\"${miniBtn};visibility:hidden\">${label}\u003c/button>` : \"\";\n}\n\nfunction itemRow(r, got, idx) {\n  const done = idx \u003c got;\n  const box = done\n    ? `\u003cbutton type=\"button\" aria-label=\"Mark as not received\" data-box style=\"${css({ width:\"30px\", height:\"30px\", \"flex-shrink\":0, \"border-radius\":\"8px\", border:`2px solid ${C.green}`, background:C.green, color:C.card, display:\"flex\", \"align-items\":\"center\", \"justify-content\":\"center\", \"font-size\":\"16px\", \"line-height\":1, padding:0 })}\">\u003csvg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M4 12.5 L9.5 18 L20 6\" fill=\"none\" stroke=\"#FCF6EA\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003c/path>\u003c/svg>\u003c/button>`\n    : `\u003cbutton type=\"button\" aria-label=\"Mark as received\" data-box style=\"${css({ width:\"30px\", height:\"30px\", \"flex-shrink\":0, \"border-radius\":\"8px\", border:`2px solid ${C.inkSoft}`, background:C.card, color:C.manilaInk, padding:0 })}\">\u003c/button>`;\n  const warn = !done && r.warn ? `\u003cspan style=\"color:${C.red};font-weight:700\">⚠ ${r.warn} · \u003c/span>` : \"\";\n  return `\u003cdiv data-row=\"${idx}\" style=\"${css({ display:\"flex\", \"align-items\":\"flex-start\", gap:\"12px\", padding:\"12px\", \"border-top\":`1px solid ${C.line}`, background: done ? C.greenSoft : \"transparent\" })}\">\n    ${box}\n    \u003cdiv style=\"flex:1 1 0%;min-width:0\">\n      \u003cdiv style=\"display:flex;gap:8px;align-items:baseline\">\n        \u003cdiv style=\"${css({ flex:\"1 1 0%\", \"min-width\":0, \"font-weight\":600, \"font-size\":\"14px\", \"line-height\":1.35, color: done ? C.inkSoft : C.ink })}\">${esc(r.seller)}\u003c/div>\n        \u003cspan style=\"font-family:${mono};font-size:12px;color:${C.inkSoft};flex-shrink:0\">$1.00\u003c/span>\n      \u003c/div>\n      \u003cdiv style=\"${css({ \"margin-top\":\"4px\", \"font-size\":\"11.5px\", \"line-height\":\"13px\", color:C.inkSoft, overflow:\"hidden\", \"text-overflow\":\"ellipsis\", \"white-space\":\"nowrap\" })}\">${warn}${r.date} · Test Set · Near Mint\u003c/div>\n      \u003cbutton type=\"button\" aria-label=\"Show the whole order ${r.o}\" style=\"${css({ \"min-height\":\"30px\", width:\"100%\", display:\"flex\", \"align-items\":\"center\", gap:\"4px\", padding:\"4px 0\", border:0, background:\"transparent\", \"font-family\":mono, \"font-size\":\"10.5px\", color:C.inkSoft, \"text-align\":\"left\" })}\">\u003cspan style=\"text-decoration:underline;text-underline-offset:2px\">${r.o}\u003c/span>\u003cspan>›\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/div>`;\n}\n\n/* ItemTotalRow in src/app.jsx, open */\nfunction tallyCard(got, rowId) {\n  const done = got >= TOTAL;\n  const keep = OPTION === \"keep\";\n  const bar = got > 0 && !done\n    ? `\u003cdiv style=\"position:absolute;top:0;left:0;right:0;pointer-events:none\">\u003cdiv style=\"height:3px;background:${C.silver};overflow:hidden;position:relative\">\u003cdiv style=\"width:${(got / TOTAL) * 100}%;height:100%;background:${C.accent}\">\u003c/div>\u003c/div>\u003c/div>`\n    : \"\";\n  return `\u003cdiv data-card style=\"${css({ position:\"relative\", background:C.card, border:`1px solid ${done ? C.green : C.line}`, \"border-radius\":\"8px\", overflow:\"clip\", \"box-shadow\":`0 1px 2px ${C.shadow}` })}\">\n    \u003cbutton type=\"button\" style=\"${css({ width:\"100%\", \"text-align\":\"left\", background:\"transparent\", border:\"none\", padding:\"12px\", display:\"flex\", \"align-items\":\"center\", gap:\"8px\", color:C.ink })}\">\n      \u003cspan style=\"font-family:${mono};font-size:10px;color:${C.inkSoft};transform:rotate(90deg);display:inline-block;flex-shrink:0\">▶\u003c/span>\n      \u003cdiv style=\"flex:1 1 0%;min-width:0\">\n        \u003cdiv style=\"font-weight:700;font-size:15px;line-height:1.3;color:${C.ink}\">Lightning Bolt\u003c/div>\n        \u003cdiv style=\"font-family:${mono};font-size:11px;color:${C.inkSoft};overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">6 sellers · 6 orders · Test Set\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"flex-shrink:0;text-align:right\">\n        \u003cdiv style=\"font-family:${mono};font-size:15px;font-weight:700;color:${done ? C.green : C.ink};white-space:nowrap\">${got}/${TOTAL}${done ? \" ✓\" : \"\"}\u003c/div>\n        \u003cdiv style=\"font-family:${mono};font-size:11.5px;color:${C.inkSoft};white-space:nowrap\">$1.00 / copy\u003c/div>\n        \u003cdiv style=\"font-family:${cochin};font-size:12px;font-weight:700;color:${C.red};white-space:nowrap;${done ? \"visibility:hidden\" : \"\"}\">${TOTAL - got} left · $${(TOTAL - got).toFixed(2)}\u003c/div>\n      \u003c/div>\n    \u003c/button>\n    ${bar}\n    \u003cdiv style=\"padding:0 12px 4px;font-family:${mono};font-size:10.5px;color:${C.inkSoft}\">$6.00 across 6 copies · $1.00 avg\u003c/div>\n    \u003cdiv ${rowId ? `id=\"${rowId}\"` : \"\"} data-actions style=\"display:flex;gap:8px;padding:0 12px 8px;justify-content:flex-end\">\n      ${bulkButton(\"Mark all received\", !done, keep)}\n      ${bulkButton(\"Clear check-ins\", got > 0, keep)}\n    \u003c/div>\n    ${ROWS.map((r, i) => itemRow(r, got, i)).join(\"\")}\n  \u003c/div>`;\n}\n\nconst TEXT = {\n  keep: {\n    title: \"Keep both buttons\",\n    sub: \"Waiting item 62, tally-320-move. The Tally card always holds the room of both bulk buttons, and hides the one that does not apply. On a 320 px phone nothing moves when you check in. The cost is a blank slot beside the visible button, and at 320 px a button row 14 px taller at rest.\",\n    tags: {\n      1: [[\"today\", \"Today: Mark all received\"], [\"today\", \"Today: Clear check-ins appears on check-in 1\"], [\"new\", \"New: Clear check-ins kept in its slot, hidden, from the start\"]],\n      6: [[\"today\", \"Today: Clear check-ins\"], [\"today\", \"Today: Mark all received leaves on check-in 6\"], [\"new\", \"New: Mark all received kept in its slot, hidden, after check-in 6\"]],\n    },\n  },\n  accept: {\n    title: \"Accept the move\",\n    sub: \"Waiting item 62, tally-320-move. No change: the card stays as built. On a 320 px phone the bulk buttons wrap to two lines when both show, so the card grows 14 px on check-in 1 and shrinks 14 px on check-in 6. Every row below moves under the thumb.\",\n    tags: {\n      1: [[\"today\", \"Today: Mark all received, alone, one line\"], [\"today\", \"Today: Clear check-ins appears on check-in 1, both labels wrap\"]],\n      6: [[\"today\", \"Today: both buttons, labels wrapped\"], [\"today\", \"Today: Mark all received leaves on check-in 6, Clear check-ins goes back to one line\"]],\n    },\n  },\n}[OPTION];\n\nlet hidden = false;\nfunction state() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  return { s: h.get(\"s\") === \"6\" ? \"6\" : \"1\", w: h.get(\"w\") === \"375\" ? \"375\" : \"320\", t: \"light\", g: h.get(\"g\") === \"off\" ? \"off\" : \"on\" };\n}\n\nfunction render() {\n  const s = state();\n  document.documentElement.dataset.guides = s.g;\n  for (const a of document.querySelectorAll(\"nav a[data-k]\")) {\n    a.setAttribute(\"aria-current\", String(s[a.dataset.k] === a.dataset.v));\n    a.href = \"#\" + new URLSearchParams({ ...s, [a.dataset.k]: a.dataset.v }).toString();\n  }\n  document.getElementById(\"title\").textContent = TEXT.title;\n  document.getElementById(\"sub\").textContent = TEXT.sub;\n  document.getElementById(\"option\").hidden = hidden;\n  document.getElementById(\"tags\").innerHTML = TEXT.tags[s.s].map(([k, t]) => `\u003cspan class=\"tag ${k}\">${esc(t)}\u003c/span>`).join(\"\");\n  const step = Number(s.s), from = step - 1, tapped = step - 1;\n  const width = Number(s.w) - 32; // the card's box: the viewport less the 16 px page padding each side\n  const before = document.getElementById(\"before\"), after = document.getElementById(\"after\");\n  for (const f of [before, after]) f.style.width = width + \"px\";\n  before.innerHTML = tallyCard(from);\n  after.innerHTML = tallyCard(step);\n  document.getElementById(\"cap-before\").innerHTML = `Before check-in ${step} \u003csmall>${from} of 6 received. The ring marks the tap, on ${esc(ROWS[tapped].seller)}'s box.\u003c/small>`;\n  document.getElementById(\"cap-after\").innerHTML = `After check-in ${step} \u003csmall>${step} of 6 received. The ring stays where the finger was. The dashed line is where the tapped row's top edge was before the tap.\u003c/small>`;\n\n  /* read the drawn boxes, then lay the marks over the after frame */\n  const rel = (frame, el) => { const a = frame.getBoundingClientRect(), b = el.getBoundingClientRect(); return { top: b.top - a.top, left: b.left - a.left, w: b.width, h: b.height }; };\n  const bRow = rel(before, before.querySelector(`[data-row=\"${tapped}\"]`));\n  const bBox = rel(before, before.querySelector(`[data-row=\"${tapped}\"] [data-box]`));\n  const aRow = rel(after, after.querySelector(`[data-row=\"${tapped}\"]`));\n  const aBox = rel(after, after.querySelector(`[data-row=\"${tapped}\"] [data-box]`));\n  const move = +(aRow.top - bRow.top).toFixed(2);\n  const ring = (f) => `\u003cdiv class=\"thumb\" style=\"top:${bBox.top + bBox.h / 2}px;left:${bBox.left + bBox.w / 2}px\">\u003c/div>`;\n  before.insertAdjacentHTML(\"beforeend\", ring(before));\n  const sign = move > 0 ? \"+\" : move \u003c 0 ? \"−\" : \"\";\n  after.insertAdjacentHTML(\"beforeend\",\n    ring(after) +\n    `\u003cdiv class=\"ghost${move === 0 ? \" zero\" : \"\"}\" style=\"top:${bRow.top}px\">\u003c/div>` +\n    (move !== 0 ? `\u003cdiv class=\"bracket\" style=\"top:${Math.min(bRow.top, aRow.top)}px;height:${Math.abs(move)}px\">\u003c/div>` : \"\"));\n  const off = +((bBox.top + bBox.h / 2) - (aBox.top + aBox.h / 2)).toFixed(2);\n  const v = document.getElementById(\"verdict\");\n  v.className = \"verdict \" + (move === 0 ? \"good\" : \"bad\");\n  v.innerHTML = move === 0\n    ? `\u003cb>Nothing moves.\u003c/b> The rows stay put on check-in ${step}. The finger is still in the middle of the box.`\n    : `\u003cb>The rows move ${sign}${Math.abs(move)} px\u003c/b> on check-in ${step}, ${move > 0 ? \"down\" : \"up\"}. The finger is now ${Math.abs(off)} px off the middle of a 30 px box. A quick next tap can miss the box or land on the row beside it.`;\n  const ch = (f) => +f.querySelector(\"[data-card]\").getBoundingClientRect().height.toFixed(2);\n  const rh = (f) => +f.querySelector(\"[data-actions]\").getBoundingClientRect().height.toFixed(2);\n  document.getElementById(\"read\").innerHTML = `Drawn here, read live at ${s.w} px: card ${ch(before)} then ${ch(after)} px; button row ${rh(before)} then ${rh(after)} px; tapped row moves \u003cb>${move} px\u003c/b>.`;\n  document.body.dataset.read = JSON.stringify({ w: Number(s.w), s: step, cardBefore: ch(before), cardAfter: ch(after), rowBefore: rh(before), rowAfter: rh(after), move });\n}\n\ndocument.getElementById(\"hide\").addEventListener(\"click\", (e) => {\n  hidden = !hidden;\n  e.currentTarget.setAttribute(\"aria-pressed\", String(hidden));\n  render();\n});\naddEventListener(\"hashchange\", render);\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "orphaned-composer-dismiss": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Drag Hides Keys\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (Parchment). Paints: OrphanedPaint (ManifestKit) and ControlPaint. The native app is held to\n   light (UIUserInterfaceStyle), so this page has one theme: light. 1 CSS px = 1 pt on an iPhone 18 Pro, 402 x 874 pt. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832; --wax:#A8443C;\n  --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Liberation Serif\", Georgia, serif;\n  --mono: Menlo, \"DejaVu Sans Mono\", ui-monospace, monospace;\n  --sys: -apple-system, system-ui, \"Helvetica Neue\", sans-serif;\n  --new:#2E7A5E; --today:#A8443C;\n  /* Drawn, not measured: no record measures the 18 Pro's safe insets, tab bar or keys. */\n  --top: max(env(safe-area-inset-top), 62px);\n  --bottom: max(env(safe-area-inset-bottom), 34px);\n}\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sys); }\n.page { width:402px; max-width:100%; padding:12px 0; }\n.page p, .page h1, .page nav { margin:0 12px 8px; }\n.pbanner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-weight:600; font-size:14px; margin:0 12px 8px; }\n.page h1 { font-family:var(--cochin); font-size:20px; line-height:1.25; }\n.page p { font-size:13px; line-height:1.45; color:var(--inkSoft); }\n.page code { font-family:var(--mono); font-size:12px; overflow-wrap:anywhere; }\n\n/* ---- the phone: exactly 402 x 874; the bezel is a shadow, so the content stays 402 wide ---- */\n#phone { position:relative; width:402px; height:874px; overflow:hidden; background:var(--paper); border-radius:48px;\n  box-shadow:0 0 0 2px var(--ink); }\n.sample { position:absolute; inset:0 0 auto 0; height:var(--top); background:var(--manila); color:var(--manilaInk);\n  display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font:700 18px/1 var(--sys); z-index:9; }\n\n/* The running head: MastheadScreen.swift RunningHead, 46 pt, pinned once the masthead has scrolled up. */\n.rhead { position:absolute; top:var(--top); left:0; right:0; height:46px; background:var(--paper); border-bottom:1px solid var(--line);\n  display:flex; align-items:center; gap:8px; padding:0 16px; z-index:5; }\n.seal { width:22px; height:22px; border-radius:50%; background:var(--wax); box-shadow:inset 0 0 0 3px #C86A5F; }\n.rhead b { font:700 16px var(--cochin); letter-spacing:0.02em; }\n\n/* The scroll content, drawn at one scroll offset. 16 pt gutters: OrphanedView.list. */\n.scroll { position:absolute; left:16px; right:16px; top:0; }\n.mast { position:absolute; left:16px; right:16px; top:calc(var(--top) + 58px); height:104px; border:1px dashed var(--line); border-radius:8px;\n  display:flex; align-items:center; justify-content:center; color:var(--inkSoft); font:13px var(--sys); }\n\n/* ComposerView: card fill, 1 pt ink border, radius 8, 12 pt padding, 8 pt spacing. */\n.composer { position:absolute; left:16px; right:16px; background:var(--card); border:1px solid var(--ink); border-radius:8px;\n  box-shadow:0 1px 2px var(--shadow); padding:12px; display:flex; flex-direction:column; gap:8px; }\n.micro { font:11px var(--mono); text-transform:uppercase; letter-spacing:0.14em; color:var(--inkSoft); }\n.field { min-height:52px; border:1px solid var(--line); border-radius:8px; background:var(--card); padding:8px 12px;\n  font:16px/18px var(--cochin); color:var(--ink); display:flex; align-items:flex-start; }\n.field.focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }\n.field .ph { color:var(--inkSoft); }\n.caret { display:inline-block; width:2px; height:18px; background:var(--accent); margin-left:1px; vertical-align:top; }\n.found { border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.found .row { min-height:44px; display:flex; align-items:center; gap:8px; padding:8px 12px; }\n.found .row + .row { border-top:1px solid var(--line); }\n.found .name { flex:1; font:14px var(--cochin); }\n.found .meta { font:10.5px var(--mono); color:var(--inkSoft); }\n.found .typed { background:var(--manila); color:var(--manilaInk); font:13px var(--cochin); }\n.foot { display:flex; align-items:center; gap:8px; padding-top:4px; }\n.foot .count { flex:1; font:11px var(--mono); color:var(--inkSoft); }\n.mini { font:11.5px var(--mono); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:5px; padding:6px 10px; }\n.mini.empty { color:var(--inkSoft); }\n.mini.discard { color:var(--red); border-color:var(--redSoft); font-size:11px; padding:4px 8px; }\n.mini.small { font-size:11px; padding:4px 8px; }\n\n/* EnvelopeCard, .full page. */\n.env { position:absolute; left:16px; right:16px; background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 2px var(--shadow); }\n.ehead { display:flex; align-items:center; gap:8px; padding:12px 12px 8px; }\n.ehead .micro { flex:1; letter-spacing:0.12em; }\n.entries { padding:0 12px 8px; font:13.5px var(--cochin); display:flex; flex-direction:column; gap:4px; }\n.rule { height:1px; background:var(--line); }\n.cands { padding:8px 12px 12px; display:flex; flex-direction:column; gap:8px; }\n.cands .micro { font-size:10.5px; letter-spacing:0.12em; }\n.cand { display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--line); border-radius:8px; }\n.cand .col { flex:1; display:flex; flex-direction:column; gap:2px; }\n.cand .seller { font:700 14px var(--cochin); }\n.cand .cm { font:10.5px var(--mono); color:var(--inkSoft); }\n\n/* The tab bar: floats above the content (Apple HIG, Tab bars). Size and glass are drawn, not measured.\n   Tab order and symbols: RootView.swift, TabView. Tint: Parchment.accent. */\n.tabbar { position:absolute; left:16px; right:16px; bottom:calc(var(--bottom) + 4px); height:62px; border-radius:31px; z-index:6;\n  background:rgba(252,246,234,0.72); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);\n  box-shadow:0 0 0 1px rgba(51,46,63,0.10), 0 6px 18px rgba(28,43,36,0.12); display:flex; align-items:center; padding:0 6px; }\n.tab { flex:1; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:var(--ink); font:600 10px var(--sys); position:relative; }\n.tab svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }\n.tab.on { color:var(--accent); }\n.tab.on::before { content:\"\"; position:absolute; inset:2px 4px; border-radius:22px; background:rgba(111,92,166,0.12); z-index:-1; }\n.badge { position:absolute; top:3px; left:calc(50% + 6px); min-width:18px; height:18px; border-radius:9px; background:var(--red); color:var(--card);\n  font:700 11px/18px var(--sys); text-align:center; padding:0 5px; }\n.home { position:absolute; bottom:8px; left:50%; width:140px; height:5px; margin-left:-70px; border-radius:3px; background:var(--ink); z-index:7; }\n\n/* The drag cue: a finger mark at the end of a downward drag on the list. */\n.drag { position:absolute; z-index:8; pointer-events:none; }\n.drag .track { position:absolute; left:21px; top:0; width:0; height:400px; border-left:3px dashed var(--new); }\n.drag .head { position:absolute; left:11px; top:392px; width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:16px solid var(--new); }\n.drag .finger { position:absolute; left:0; top:-22px; width:44px; height:44px; border-radius:50%; background:rgba(46,122,94,0.18); border:2px solid var(--new); }\n\n/* Labels: dashed outline on what exists today (red) and on what the option adds (green). Sized to read on a 0.55 card. */\n.tag { position:absolute; z-index:10; font:700 18px/1.25 var(--sys); padding:6px 10px; border-radius:6px; background:var(--card); border:2px dashed currentColor; }\n.tag.new { color:var(--new); } .tag.today { color:var(--today); }\n.ring { position:absolute; z-index:6; border-radius:34px; pointer-events:none; }\n.ring.today { border:3px dashed var(--today); }\n.ring.new { border:3px dashed var(--new); }\n@media (prefers-reduced-motion: no-preference) { .drag .finger { animation:press 1.6s ease-in-out infinite; } }\n@keyframes press { 0%,100% { transform:translateY(0); } 50% { transform:translateY(10px); } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cdiv class=\"pbanner\">Sample. No name, date, count or order number on this page is real.\u003c/div>\n  \u003ch1>Add a drag that hides the keys\u003c/h1>\n  \u003cp>Owner page item 86, \u003ccode>orphaned-composer-dismiss\u003c/code>. The Orphaned note form after a drag down on the list: the keys are gone, the draft stays, and the tabs are in reach. iPhone 18 Pro, 402 x 874 pt, light theme (the app ships light only).\u003c/p>\n\u003c/div>\n\n\u003cdiv id=\"phone\" data-state=\"keys-hidden\" role=\"img\" aria-label=\"Orphaned tab with the note form open, keys hidden after a drag, tab bar showing\">\n  \u003cdiv class=\"sample\">Sample: no figure here is real\u003c/div>\n\n  \u003cdiv class=\"rhead\">\
