u003cspan class=\"seal\" aria-hidden=\"true\">\u003c/span>\u003cb>Manifest\u003c/b>\u003c/div>\n  \u003cdiv class=\"mast\">Masthead, scrolled up (not drawn)\u003c/div>\n\n  \u003c!-- Same scroll offset as when the keys were up: the Save row sat on the keys' top edge. -->\n  \u003cdiv class=\"composer\" style=\"top:254px\">\n    \u003cdiv class=\"micro\">New envelope\u003c/div>\n    \u003cdiv class=\"field\">Light\u003c/div>\n    \u003cdiv class=\"found\">\n      \u003cdiv class=\"row\">\u003cspan class=\"name\">Lightning Bolt\u003c/span>\u003cspan class=\"meta\">3 out · 2 sellers\u003c/span>\u003c/div>\n      \u003cdiv class=\"row typed\">Add “Light” as typed\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\u003cspan class=\"ph\">Note (optional) — tracking #, sender, mailer…\u003c/span>\u003c/div>\n    \u003cdiv class=\"foot\">\u003cspan class=\"count\">0 cards\u003c/span>\u003cspan class=\"mini\">Cancel\u003c/span>\u003cspan class=\"mini empty\">Save envelope\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"env\" style=\"top:563px\">\n    \u003cdiv class=\"ehead\">\u003cspan class=\"micro\">Envelope · 2026-11-14 · 2 cards\u003c/span>\u003cspan class=\"mini small\">Edit\u003c/span>\u003cspan class=\"mini discard\">Discard\u003c/span>\u003c/div>\n    \u003cdiv class=\"entries\">\u003cspan>×2 Counterspell\u003c/span>\u003c/div>\n    \u003cdiv class=\"rule\">\u003c/div>\n    \u003cdiv class=\"cands\">\n      \u003cspan class=\"micro\">Could have come from\u003c/span>\n      \u003cdiv class=\"cand\">\u003cdiv class=\"col\">\u003cspan class=\"seller\">Sample Seller Co.\u003c/span>\u003cspan class=\"cm\">2026-11-03 · 000000-0000\u003c/span>\u003c/div>\u003cspan class=\"mini\">This one\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"drag\" style=\"left:343px;top:200px\" aria-hidden=\"true\">\u003cspan class=\"track\">\u003c/span>\u003cspan class=\"head\">\u003c/span>\u003cspan class=\"finger\">\u003c/span>\u003c/div>\n  \u003c!-- Where the keys' top edge sat before the drag (the other option's picture): the drag passes it, so the keys follow. -->\n  \u003cdiv style=\"position:absolute;left:0;right:0;top:538px;border-top:2px dashed var(--new);z-index:4\" aria-hidden=\"true\">\u003c/div>\n  \u003cdiv class=\"tag new\" style=\"left:16px;top:118px;width:296px\">New: drag down on the list to hide the keys, as Card in Hand does\u003c/div>\n\n  \u003cdiv class=\"ring today\" style=\"left:12px;right:12px;bottom:calc(var(--bottom));height:70px\">\u003c/div>\n  \u003cdiv class=\"tag today\" style=\"right:16px;bottom:calc(var(--bottom) + 80px)\">Today: the tabs, now in reach\u003c/div>\n\n  \u003cnav class=\"tabbar\" aria-label=\"Tabs\">\n    \u003cspan class=\"tab\">\u003csvg viewBox=\"0 0 24 24\">\u003ccircle cx=\"12\" cy=\"12\" r=\"3.2\"/>\u003cpath d=\"M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8\"/>\u003c/svg>Ledger\u003c/span>\n    \u003cspan class=\"tab on\">\u003csvg viewBox=\"0 0 24 24\">\u003crect x=\"3\" y=\"6\" width=\"18\" height=\"13\" rx=\"2\"/>\u003cpath d=\"M3.5 7l8.5 6.5L20.5 7\"/>\u003c/svg>Orphaned\u003cspan class=\"badge\">1\u003c/span>\u003c/span>\n    \u003cspan class=\"tab\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M9 4L7.5 20M16.5 4L15 20M4.5 9h16M3.5 15h16\"/>\u003c/svg>Tally\u003c/span>\n    \u003cspan class=\"tab\">\u003csvg viewBox=\"0 0 24 24\">\u003cpath d=\"M12 3l8 4v10l-8 4-8-4V7z\"/>\u003cpath d=\"M4 7l8 4 8-4M12 11v10\"/>\u003c/svg>Packages\u003c/span>\n  \u003c/nav>\n  \u003cspan class=\"home\" aria-hidden=\"true\">\u003c/span>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n  \u003cp>\u003cb>Measured versus drawn.\u003c/b> Nothing on this phone is measured on the 18 Pro. Drawn: the safe insets (62 pt top, 34 pt bottom), the tab bar's size and glass, the masthead's height and the scroll offset. Read from code: the 46 pt running head (\u003ccode>RunningHead.height\u003c/code>), the 16 pt gutters (\u003ccode>OrphanedView.list\u003c/code>), the form's parts and paints (\u003ccode>ComposerView\u003c/code>, \u003ccode>OrphanedPaint\u003c/code>), the tab order and badge (\u003ccode>RootView\u003c/code>).\u003c/p>\n  \u003cp>\u003cb>The drag.\u003c/b> \u003ccode>HandScreen.swift\u003c/code> puts \u003ccode>.scrollDismissesKeyboard(.interactively)\u003c/code> on its scroll. The same line on the Orphaned scroll lets the keys follow a downward drag and close. The green dashed line across the phone marks where the keys' top edge sat; the keys follow the finger once the drag passes it. The draft stays in the form, because \u003ccode>model.draft(for:)\u003c/code> holds it, not the field.\u003c/p>\n  \u003cp>State link: \u003ccode>#s=keys-hidden\u003c/code>. Cochin and Menlo fall back to a serif and DejaVu Sans Mono off a Mac.\u003c/p>\n\u003c/div>\n\u003cscript>\n// One state per option file. #s=\u003cstate> picks it; an unknown state falls back to the one drawn.\n(function () {\n  function read() {\n    var m = /(?:^|[#&])s=([\\w-]+)/.exec(location.hash);\n    var want = m ? m[1] : \"keys-hidden\";\n    var el = document.querySelector('[data-state=\"' + want + '\"]') || document.querySelector(\"[data-state]\");\n    document.querySelectorAll(\"[data-state]\").forEach(function (n) { n.hidden = n !== el; });\n  }\n  window.addEventListener(\"hashchange\", read);\n  read();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "orphaned-composer-dismiss-b": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Keys Stay Up\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (Parchment). Paints: OrphanedPaint (ManifestKit) and ControlPaint. The native app is held to\n   light (UIUserInterfaceStyle), so this page has one theme: light. 1 CSS px = 1 pt on an iPhone 18 Pro, 402 x 874 pt. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --red:#A8443C; --redSoft:#F4E4D9; --manila:#EADBBA; --manilaInk:#695832; --wax:#A8443C;\n  --shadow:rgba(28,43,36,0.06);\n  --cochin: Cochin, \"Liberation Serif\", Georgia, serif;\n  --mono: Menlo, \"DejaVu Sans Mono\", ui-monospace, monospace;\n  --sys: -apple-system, system-ui, \"Helvetica Neue\", sans-serif;\n  --new:#2E7A5E; --today:#A8443C;\n  /* Drawn, not measured: no record measures the 18 Pro's safe insets or keys. */\n  --top: max(env(safe-area-inset-top), 62px);\n  --bottom: max(env(safe-area-inset-bottom), 34px);\n  --keys: 336px;\n  /* The system keyboard's own grey, drawn: it is iOS chrome, not a Parchment token. */\n  --kbd:#D3D5DB; --key:#FFFFFF; --keyDark:#ABB0BA;\n}\n* { box-sizing:border-box; }\nhtml, body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sys); }\n.page { width:402px; max-width:100%; padding:12px 0; }\n.page p, .page h1 { margin:0 12px 8px; }\n.pbanner { background:var(--manila); color:var(--manilaInk); border-radius:8px; padding:8px 12px; font-weight:600; font-size:14px; margin:0 12px 8px; }\n.page h1 { font-family:var(--cochin); font-size:20px; line-height:1.25; }\n.page p { font-size:13px; line-height:1.45; color:var(--inkSoft); }\n.page code { font-family:var(--mono); font-size:12px; overflow-wrap:anywhere; }\n\n/* ---- the phone: exactly 402 x 874; the bezel is a shadow, so the content stays 402 wide ---- */\n#phone { position:relative; width:402px; height:874px; overflow:hidden; background:var(--paper); border-radius:48px;\n  box-shadow:0 0 0 2px var(--ink); }\n.sample { position:absolute; inset:0 0 auto 0; height:var(--top); background:var(--manila); color:var(--manilaInk);\n  display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px; font:700 18px/1 var(--sys); z-index:9; }\n\n/* The running head: MastheadScreen.swift RunningHead, 46 pt, pinned once the masthead has scrolled up. */\n.rhead { position:absolute; top:var(--top); left:0; right:0; height:46px; background:var(--paper); border-bottom:1px solid var(--line);\n  display:flex; align-items:center; gap:8px; padding:0 16px; z-index:5; }\n.seal { width:22px; height:22px; border-radius:50%; background:var(--wax); box-shadow:inset 0 0 0 3px #C86A5F; }\n.rhead b { font:700 16px var(--cochin); letter-spacing:0.02em; }\n.mast { position:absolute; left:16px; right:16px; top:calc(var(--top) + 58px); height:104px; border:1px dashed var(--line); border-radius:8px;\n  display:flex; align-items:center; justify-content:center; color:var(--inkSoft); font:13px var(--sys); }\n\n/* ComposerView: card fill, 1 pt ink border, radius 8, 12 pt padding, 8 pt spacing. */\n.composer { position:absolute; left:16px; right:16px; background:var(--card); border:1px solid var(--ink); border-radius:8px;\n  box-shadow:0 1px 2px var(--shadow); padding:12px; display:flex; flex-direction:column; gap:8px; }\n.micro { font:11px var(--mono); text-transform:uppercase; letter-spacing:0.14em; color:var(--inkSoft); }\n.field { min-height:52px; border:1px solid var(--line); border-radius:8px; background:var(--card); padding:8px 12px;\n  font:16px/18px var(--cochin); color:var(--ink); display:flex; align-items:flex-start; }\n.field.focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }\n.field .ph { color:var(--inkSoft); }\n.caret { display:inline-block; width:2px; height:18px; background:var(--accent); margin-left:1px; vertical-align:top; }\n.found { border:1px solid var(--line); border-radius:8px; overflow:hidden; }\n.found .row { min-height:44px; display:flex; align-items:center; gap:8px; padding:8px 12px; }\n.found .row + .row { border-top:1px solid var(--line); }\n.found .name { flex:1; font:14px var(--cochin); }\n.found .meta { font:10.5px var(--mono); color:var(--inkSoft); }\n.found .typed { background:var(--manila); color:var(--manilaInk); font:13px var(--cochin); }\n.foot { display:flex; align-items:center; gap:8px; padding-top:4px; }\n.foot .count { flex:1; font:11px var(--mono); color:var(--inkSoft); }\n.mini { font:11.5px var(--mono); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:5px; padding:6px 10px; }\n.mini.empty { color:var(--inkSoft); }\n\n/* The system keyboard, drawn: height, rows and keys are not measured on the 18 Pro. Return reads \"done\" (submitLabel(.done)). */\n.keys { position:absolute; left:0; right:0; bottom:0; height:var(--keys); background:var(--kbd); z-index:7; padding:0 3px var(--bottom);\n  display:flex; flex-direction:column; font-family:var(--sys); color:#000; }\n.sugg { height:44px; display:flex; align-items:center; font:16px var(--sys); }\n.sugg span { flex:1; text-align:center; }\n.sugg span + span { border-left:1px solid var(--keyDark); }\n.krow { display:flex; justify-content:center; gap:6px; padding:5px 0; }\n.k { width:34px; height:44px; border-radius:6px; background:var(--key); box-shadow:0 1px 0 rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font:22px var(--sys); }\n.k.mod { background:var(--keyDark); width:44px; font-size:16px; }\n.k.space { flex:1; max-width:190px; font-size:16px; }\n.k.done { width:92px; background:var(--accent); color:#fff; font-size:16px; }\n\n/* Labels: dashed outline on what exists today (red). Sized to read on a 0.55 card. */\n.tag { position:absolute; z-index:10; font:700 18px/1.25 var(--sys); padding:6px 10px; border-radius:6px; background:var(--card); border:2px dashed currentColor; }\n.tag.today { color:var(--today); }\n.ring { position:absolute; z-index:8; pointer-events:none; border:3px dashed var(--today); }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"page\">\n  \u003cdiv class=\"pbanner\">Sample. No name, date, count or order number on this page is real.\u003c/div>\n  \u003ch1>Leave it as it is\u003c/h1>\n  \u003cp>Owner page item 86, \u003ccode>orphaned-composer-dismiss\u003c/code>. The Orphaned note form as main draws it, with the keys up. The keys cover the tab bar, and nothing on the screen takes them down. iPhone 18 Pro, 402 x 874 pt, light theme (the app ships light only).\u003c/p>\n\u003c/div>\n\n\u003cdiv id=\"phone\" data-state=\"keys-up\" role=\"img\" aria-label=\"Orphaned tab with the note form open and the keys up over the tab bar\">\n  \u003cdiv class=\"sample\">Sample: no figure here is real\u003c/div>\n\n  \u003cdiv class=\"rhead\">\u003cspan class=\"seal\" aria-hidden=\"true\">\u003c/span>\u003cb>Manifest\u003c/b>\u003c/div>\n  \u003cdiv class=\"mast\">Masthead, scrolled up (not drawn)\u003c/div>\n\n  \u003c!-- ComposerView scrolls its Save row to the bottom of the space above the keys (scrollTo, anchor .bottom). -->\n  \u003cdiv class=\"composer\" style=\"top:254px\">\n    \u003cdiv class=\"micro\">New envelope\u003c/div>\n    \u003cdiv class=\"field focus\">Light\u003cspan class=\"caret\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"found\">\n      \u003cdiv class=\"row\">\u003cspan class=\"name\">Lightning Bolt\u003c/span>\u003cspan class=\"meta\">3 out · 2 sellers\u003c/span>\u003c/div>\n      \u003cdiv class=\"row typed\">Add “Light” as typed\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"field\">\u003cspan class=\"ph\">Note (optional) — tracking #, sender, mailer…\u003c/span>\u003c/div>\n    \u003cdiv class=\"foot\">\u003cspan class=\"count\">0 cards\u003c/span>\u003cspan class=\"mini\">Cancel\u003c/span>\u003cspan class=\"mini empty\">Save envelope\u003c/span>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"tag today\" style=\"left:16px;top:118px;width:330px\">Today: nothing here hides the keys. Only Cancel or Save close the form.\u003c/div>\n  \u003cdiv class=\"keys\" aria-hidden=\"true\">\n    \u003cdiv class=\"sugg\">\u003cspan>“Light”\u003c/span>\u003cspan>Lights\u003c/span>\u003cspan>Lighting\u003c/span>\u003c/div>\n    \u003cdiv class=\"krow\">\u003cspan class=\"k\">Q\u003c/span>\u003cspan class=\"k\">W\u003c/span>\u003cspan class=\"k\">E\u003c/span>\u003cspan class=\"k\">R\u003c/span>\u003cspan class=\"k\">T\u003c/span>\u003cspan class=\"k\">Y\u003c/span>\u003cspan class=\"k\">U\u003c/span>\u003cspan class=\"k\">I\u003c/span>\u003cspan class=\"k\">O\u003c/span>\u003cspan class=\"k\">P\u003c/span>\u003c/div>\n    \u003cdiv class=\"krow\">\u003cspan class=\"k\">A\u003c/span>\u003cspan class=\"k\">S\u003c/span>\u003cspan class=\"k\">D\u003c/span>\u003cspan class=\"k\">F\u003c/span>\u003cspan class=\"k\">G\u003c/span>\u003cspan class=\"k\">H\u003c/span>\u003cspan class=\"k\">J\u003c/span>\u003cspan class=\"k\">K\u003c/span>\u003cspan class=\"k\">L\u003c/span>\u003c/div>\n    \u003cdiv class=\"krow\">\u003cspan class=\"k mod\">⇧\u003c/span>\u003cspan class=\"k\">Z\u003c/span>\u003cspan class=\"k\">X\u003c/span>\u003cspan class=\"k\">C\u003c/span>\u003cspan class=\"k\">V\u003c/span>\u003cspan class=\"k\">B\u003c/span>\u003cspan class=\"k\">N\u003c/span>\u003cspan class=\"k\">M\u003c/span>\u003cspan class=\"k mod\">⌫\u003c/span>\u003c/div>\n    \u003cdiv class=\"krow\">\u003cspan class=\"k mod\">123\u003c/span>\u003cspan class=\"k mod\">☺\u003c/span>\u003cspan class=\"k space\">space\u003c/span>\u003cspan class=\"k done\">done\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003c!-- Where the tab bar sits when the keys are down (same box as the other option's tab bar). -->\n  \u003cdiv class=\"ring\" style=\"left:12px;right:12px;bottom:var(--bottom);height:44px;border-top:0;border-radius:0 0 34px 34px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px\">\n    \u003cspan class=\"tag today\" style=\"position:static\">Today: the tab bar, under the keys\u003c/span>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"page\">\n  \u003cp>\u003cb>Measured versus drawn.\u003c/b> Nothing on this phone is measured on the 18 Pro. Drawn: the safe insets (62 pt top, 34 pt bottom), the keys' height (336 pt) and rows, the masthead's height and the scroll offset. Read from code: the 46 pt running head (\u003ccode>RunningHead.height\u003c/code>), the 16 pt gutters (\u003ccode>OrphanedView.list\u003c/code>), the form's parts and paints (\u003ccode>ComposerView\u003c/code>, \u003ccode>OrphanedPaint\u003c/code>), the Save row scrolled above the keys (\u003ccode>ComposerView\u003c/code>, \u003ccode>scrollTo\u003c/code>).\u003c/p>\n  \u003cp>\u003cb>Why nothing hides the keys.\u003c/b> \u003ccode>ComposerView\u003c/code> sets \u003ccode>focused = .name\u003c/code> on appear and never clears it. The Orphaned scroll has no \u003ccode>scrollDismissesKeyboard\u003c/code>, no tap to hide and no keyboard toolbar. The \"done\" key adds the typed name (\u003ccode>onSubmit\u003c/code>); whether it also takes the keys down is unread. The tab bar sits under the keys, so the test \u003ccode>testComposerDraftSurvivesAViewChange\u003c/code> stays red.\u003c/p>\n  \u003cp>State link: \u003ccode>#s=keys-up\u003c/code>. Cochin and Menlo fall back to a serif and DejaVu Sans Mono off a Mac.\u003c/p>\n\u003c/div>\n\u003cscript>\n// One state per option file. #s=\u003cstate> picks it; an unknown state falls back to the one drawn.\n(function () {\n  function read() {\n    var m = /(?:^|[#&])s=([\\w-]+)/.exec(location.hash);\n    var want = m ? m[1] : \"keys-up\";\n    var el = document.querySelector('[data-state=\"' + want + '\"]') || document.querySelector(\"[data-state]\");\n    document.querySelectorAll(\"[data-state]\").forEach(function (n) { n.hidden = n !== el; });\n  }\n  window.addEventListener(\"hashchange\", read);\n  read();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "pr238-find-pill-band": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Paper Band Under List\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json, light keys (paper, card, ink, inkSoft, line, gold, silver, accent, green, red, manila, manilaInk), read\n   through Parchment (native/Manifest/Theme.swift). The native app is held to light, so the phone frame keeps light tokens in every\n   theme; the dark keys below repaint the page around it only. --new and --today are page chrome (green and red). */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --silver:#C4C3C0;\n  --accent:#6F5CA6; --manila:#EADBBA; --manilaInk:#695832; --shadow:rgba(28,43,36,0.06);\n  --new:#2E7A5E; --today:#A8443C;\n  --cochin: Cochin, Georgia, serif; --mono: Menlo, monospace;\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n    --manila:#3A3122; --manilaInk:#E2CB96; --new:#6DBB98; --today:#E3857B; color-scheme: dark; }\n}\n:root[data-theme=\"dark\"] { --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n  --manila:#3A3122; --manilaInk:#E2CB96; --new:#6DBB98; --today:#E3857B; color-scheme: dark; }\n* { box-sizing: border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.45; }\nmain { max-width:760px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font-size:22px; line-height:1.25; margin:0; }\n.intro { display:flex; flex-direction:column; gap:8px; }\n.intro p { margin:0; max-width:68ch; color:var(--inkSoft); }\n.intro p b { color:var(--ink); }\nnav { display:flex; flex-wrap:wrap; gap:8px; }\nnav a, nav button { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nfigure { margin:0; display:flex; flex-direction:column; gap:12px; }\nfigure[hidden] { display:none; }\nfigcaption { font-size:14px; color:var(--inkSoft); max-width:68ch; }\nfigcaption ul { margin:4px 0 0; padding-left:18px; }\nfigcaption b { color:var(--ink); }\n.fit { width:100%; max-width:402px; }\n/* At the drawn width (402) the phone sits at x 0 to 402, so the page's focus box is the phone alone. */\n@media (max-width:440px) {\n  main { padding:0 0 16px; }\n  .banner { border-radius:0; border-left:0; border-right:0; }\n  .intro, figcaption { padding:0 16px; }\n}\n\n/* ---- the phone: iPhone 18 Pro, 402 x 874 pt, 1 CSS px = 1 pt. Light tokens always (the app is held to light). ---- */\n.dev { --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --silver:#C4C3C0; --accent:#6F5CA6;\n  --redSoft:#F4E4D9; --red:#A8443C; --new:#2E7A5E; --today:#A8443C;\n  --sat: max(env(safe-area-inset-top), 54px);  /* top safe area: unmeasured on the 18 Pro, drawn at 54 pt */\n  position:relative; width:402px; height:874px; background:var(--paper); color:var(--ink); border-radius:44px; overflow:hidden;\n  box-shadow:0 0 0 1px var(--ink); font-family:var(--cochin); transform-origin:0 0; }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 32px; font:600 15px -apple-system, system-ui, sans-serif; z-index:4; }\n.status .isl { width:124px; height:36px; border-radius:18px; background:#000; }\n\n/* the scroll view (MastheadScreen). --vp is where it ends: 723 pt with the band (measured), the screen foot when the pill floats. */\n.vp { position:absolute; left:0; right:0; top:0; height:var(--vp); overflow:hidden; }\n/* masthead, running-head slot and ruled row: drawn to fill 54 to 321 pt; their inner layout is unmeasured */\n.mast { position:absolute; left:16px; right:16px; top:var(--sat); height:158px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:6px 0 4px; }\n.mast .seal { display:flex; align-items:center; gap:10px; align-self:stretch; }\n.mast .seal i { flex:1; height:1px; background:var(--gold); }\n.mast .seal s { width:24px; height:24px; border-radius:50%; background:#A8443C; box-shadow:inset 0 -3px 0 #66231D; }\n.mast .ttl { font-size:31px; line-height:34px; letter-spacing:5px; font-weight:700; }\n.mast .house { font:10px/12px var(--cochin); letter-spacing:2px; color:var(--inkSoft); }\n.mast .tallies { display:grid; grid-template-columns:1fr 1fr 1.7fr; align-self:stretch; text-align:center; }\n.mast .tallies span { display:flex; flex-direction:column; font:10px/13px var(--cochin); color:var(--inkSoft); }\n.mast .tallies b { font:700 13px/17px var(--mono); color:var(--accent); }\n.mast .tallies b em { font-style:normal; font-weight:400; color:var(--inkSoft); }\n.mast .bar { align-self:stretch; height:8px; border-radius:4px; background:var(--silver); overflow:hidden; }\n.mast .bar i { display:block; width:38%; height:100%; background:var(--accent); }\n.mast .foot { align-self:stretch; display:flex; justify-content:space-between; font:10.5px/14px var(--mono); color:var(--inkSoft); }\n.ruled { position:absolute; left:16px; right:16px; top:259px; height:46px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);\n  display:flex; justify-content:flex-end; }\n.ruled span { min-width:44px; padding:0 12px; display:flex; align-items:center; gap:6px; border-left:1px solid var(--line); font:11px var(--mono); color:var(--inkSoft); }\n\n/* the list (PackagesView): starts at 321 pt (723 less the measured 401.7 pt of visible list). Heights are fixed so the\n   \"Test Set · Near Mint\" line of the second card lands on the measured frame 73, 723, 102 x 14. */\n.list { position:absolute; left:16px; right:16px; top:321px; display:flex; flex-direction:column; gap:8px; }\n.pcard { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px var(--shadow); display:flex; flex-direction:column; overflow:hidden; }\n.phead { height:70px; padding:10px 12px 0; display:flex; flex-direction:column; }\n.phead .top { display:flex; align-items:center; gap:8px; }\n.phead .who { flex:1; display:flex; flex-direction:column; }\n.phead .who b { font-size:15px; line-height:20px; }\n.phead .who span { font:11px/14px var(--mono); color:var(--inkSoft); }\n.spill { font:700 12.5px var(--cochin); padding:4px 8px; border-radius:999px; background:var(--redSoft); color:var(--red); }\n.phead .oid { font:11px/22px var(--mono); color:var(--inkSoft); text-decoration:underline; }\n.srow, .brow { height:48px; display:flex; align-items:center; padding:0 12px; gap:8px; }\n.brow { justify-content:flex-end; }\n.mini { font:11.5px var(--mono); background:var(--card); border:1px solid var(--line); border-radius:5px; padding:8px 12px; white-space:nowrap; }\n.ln { height:60px; display:flex; gap:8px; padding:0 12px 0 3px; border-top:1px solid var(--line); }\n.ln .box { flex:0 0 45px; height:59px; display:grid; place-items:center; }\n.ln .box i { width:30px; height:30px; border:2px solid var(--inkSoft); border-radius:8px; }\n.ln .t { flex:1; min-width:0; padding-top:12px; display:flex; flex-direction:column; gap:4px; }\n.ln .t b { font-size:14px; line-height:18px; font-weight:600; display:flex; justify-content:space-between; }\n.ln .t b span { font:12px/18px var(--mono); font-weight:400; color:var(--inkSoft); }\n.ln .t small { display:block; width:102px; height:14px; font-size:12px; line-height:14px; color:var(--inkSoft); white-space:nowrap; }\n\n/* the Find pill (FindPill.body): opaque paper capsule, magnifier, Cochin 16 prompt, 44 x 44 clear slot. Top 731 pt (measured). */\n.find { position:absolute; z-index:3; left:16px; right:16px; top:731px; height:51px; display:flex; align-items:center; gap:8px;\n  padding:4px 6px 4px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper); }\n.find svg { flex:none; width:20px; height:20px; fill:none; stroke:var(--inkSoft); stroke-width:1.8; stroke-linecap:round; }\n.find .q { flex:1; font-size:16px; color:var(--inkSoft); white-space:nowrap; overflow:hidden; }\n.find .clr { flex:none; width:44px; height:44px; }\n\n/* the band (findPill): paper from the list's edge to the screen foot, a 1 pt Parchment.line rule on its top */\n.band { position:absolute; z-index:2; left:0; right:0; top:723px; bottom:0; background:var(--paper); border-top:1px solid var(--line); }\n\n/* system tab bar: top 791 pt (PR 238's screen check); its capsule is drawn, not measured */\n.sysbar { position:absolute; z-index:5; left:0; right:0; top:791px; height:83px; display:flex; justify-content:center; padding-top:8px; }\n.sysbar .cap { width:calc(100% - 32px); height:56px; border-radius:28px; border:1px solid var(--line);\n  background:color-mix(in srgb, var(--paper) 62%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);\n  display:grid; grid-template-columns:repeat(4,1fr); align-items:center; }\n.sysbar span { display:flex; flex-direction:column; align-items:center; gap:2px; font:11px -apple-system, system-ui, sans-serif; color:var(--inkSoft); }\n.sysbar span i { width:22px; height:22px; border:1.5px solid currentColor; border-radius:6px; }\n.sysbar span.on { color:var(--accent); }\n.home { position:absolute; z-index:6; left:50%; bottom:8px; width:140px; height:5px; margin-left:-70px; border-radius:3px; background:var(--ink); }\n\n/* labels: dashed outline on what exists today (red) and on what this option adds (green) */\n.mark { position:absolute; z-index:7; pointer-events:none; border:2px dashed; border-radius:6px; }\n.tag { position:absolute; z-index:8; font:600 11px/14px -apple-system, system-ui, sans-serif; padding:1px 5px; border:1.5px dashed; border-radius:4px;\n  background:var(--card); white-space:nowrap; }\n.mark.new, .tag.new { color:var(--new); border-color:var(--new); }\n.mark.today, .tag.today { color:var(--today); border-color:var(--today); }\nbody.hide-labels .mark, body.hide-labels .tag { display:none; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cdiv class=\"banner\" role=\"note\">Sample: no seller, card, order, date, price or count on this page is real.\u003c/div>\n  \u003cdiv class=\"intro\">\n    \u003ch1>End the list above the pill with a paper band\u003c/h1>\n    \u003cp>Waiting-page item 95, PR 238 (restyle step 8). \u003cb>How:\u003c/b> on the phone the list ends 8 pt above the Find pill. A paper band with a 1 pt rule sits under the last row, so no row text sits under the pill at rest. \u003cb>Gain:\u003c/b> every contrast audit passes with no skip. \u003cb>Loss:\u003c/b> 8 pt of list at rest, and the phone's bottom-bar ruling changes.\u003c/p>\n    \u003cp>Designer kind: informed. iPhone 18 Pro, 402 x 874 pt, light theme, normal text size, Packages at rest.\u003c/p>\n    \u003cnav aria-label=\"States\">\n      \u003ca href=\"#s=band\">Band at rest\u003c/a>\n      \u003cbutton type=\"button\" id=\"hide-labels\" aria-pressed=\"false\">Hide labels\u003c/button>\n    \u003c/nav>\n  \u003c/div>\n\n  \u003cfigure id=\"s-band\" data-state=\"band\">\n    \u003cdiv class=\"fit\">\n      \u003cdiv class=\"dev\" id=\"phone\" data-device=\"iphone-18-pro\" role=\"img\" aria-label=\"iPhone 18 Pro, Packages: the list ends at a ruled paper band above the Find pill\">\n        \u003cdiv class=\"status\">\u003cspan>9:41\u003c/span>\u003cspan class=\"isl\">\u003c/span>\u003cspan>100%\u003c/span>\u003c/div>\n        \u003cdiv class=\"vp\" style=\"--vp:723px\">\n          \u003cdiv class=\"mast\">\n            \u003cspan class=\"seal\">\u003ci>\u003c/i>\u003cs>\u003c/s>\u003ci>\u003c/i>\u003c/span>\n            \u003cspan class=\"ttl\">MANIFEST\u003c/span>\n            \u003cspan class=\"house\">C.H POSTAL COMPANY\u003c/span>\n            \u003cspan class=\"tallies\">\u003cspan>cards\u003cb>4\u003cem>/11\u003c/em>\u003c/b>\u003c/span>\u003cspan>packages\u003cb>1\u003cem>/4\u003c/em>\u003c/b>\u003c/span>\u003cspan>value\u003cb>$3.10\u003cem>/$8.20\u003c/em>\u003c/b>\u003c/span>\u003c/span>\n            \u003cspan class=\"bar\">\u003ci>\u003c/i>\u003c/span>\n            \u003cspan class=\"foot\">\u003cspan>4 packages · 11 cards\u003c/span>\u003cspan>7 out\u003c/span>\u003c/span>\n          \u003c/div>\n          \u003cdiv class=\"ruled\">\u003cspan>1 stamped ○\u003c/span>\u003c/div>\n          \u003cdiv class=\"list\">\n            \u003cdiv class=\"pcard\">\n              \u003cdiv class=\"phead\">\u003cdiv class=\"top\">\u003cspan class=\"who\">\u003cb>Gamma Cards\u003c/b>\u003cspan>2026-07-01\u003c/span>\u003c/span>\u003cspan class=\"spill\">2 left · $0.73\u003c/span>\u003c/div>\u003cspan class=\"oid\">SAMPLE-0003-C\u003c/span>\u003c/div>\n              \u003cdiv class=\"srow\">\u003cspan class=\"mini\">Stamp\u003c/span>\u003c/div>\n              \u003cdiv class=\"brow\">\u003cspan class=\"mini\">Mark All Received\u003c/span>\u003cspan class=\"mini\">Clear Check-ins\u003c/span>\u003c/div>\n              \u003cdiv class=\"ln\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Lightning Bolt\u003cspan>$0.42\u003c/span>\u003c/b>\u003csmall>Test Set · Near Mint\u003c/small>\u003c/span>\u003c/div>\n              \u003cdiv class=\"ln\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Path to Exile\u003cspan>$0.31\u003c/span>\u003c/b>\u003csmall>Test Set · Near Mint\u003c/small>\u003c/span>\u003c/div>\n            \u003c/div>\n            \u003cdiv class=\"pcard\">\n              \u003cdiv class=\"phead\">\u003cdiv class=\"top\">\u003cspan class=\"who\">\u003cb>Beta Games\u003c/b>\u003cspan>2026-07-29\u003c/span>\u003c/span>\u003cspan class=\"spill\">3 left · $3.50\u003c/span>\u003c/div>\u003cspan class=\"oid\">SAMPLE-0002-B\u003c/span>\u003c/div>\n              \u003cdiv class=\"ln\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Brainstorm\u003cspan>$0.50\u003c/span>\u003c/b>\u003csmall>Test Set · Near Mint\u003c/small>\u003c/span>\u003c/div>\n              \u003cdiv class=\"ln\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Counterspell\u003cspan>$2.00\u003c/span>\u003c/b>\u003csmall>Test Set · Near Mint\u003c/small>\u003c/span>\u003c/div>\n              \u003cdiv class=\"ln\">\u003cspan class=\"box\">\u003ci>\u003c/i>\u003c/span>\u003cspan class=\"t\">\u003cb>Swords to Plowshares\u003cspan>$1.00\u003c/span>\u003c/b>\u003csmall>Test Set · Near Mint\u003c/small>\u003c/span>\u003c/div>\n            \u003c/div>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"band\" id=\"band\">\u003c/div>\n        \u003cdiv class=\"find\" id=\"find-pill\">\n          \u003csvg viewBox=\"0 0 20 20\" aria-hidden=\"true\">\u003ccircle cx=\"8.5\" cy=\"8.5\" r=\"6\"/>\u003cpath d=\"M13 13l5 5\"/>\u003c/svg>\n          \u003cspan class=\"q\">Find card, set, seller, order\u003c/span>\u003cspan class=\"clr\">\u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"sysbar\">\u003cdiv class=\"cap\">\u003cspan>\u003ci>\u003c/i>Ledger\u003c/span>\u003cspan>\u003ci>\u003c/i>Orphaned\u003c/span>\u003cspan>\u003ci>\u003c/i>Tally\u003c/span>\u003cspan class=\"on\">\u003ci>\u003c/i>Packages\u003c/span>\u003c/div>\u003c/div>\n        \u003cdiv class=\"home\">\u003c/div>\n\n        \u003c!-- labels -->\n        \u003cdiv class=\"mark today\" style=\"left:10px; right:10px; top:56px; height:252px\">\u003c/div>\n        \u003cspan class=\"tag today\" style=\"right:16px; top:216px\">Today: masthead (layout drawn)\u003c/span>\n        \u003cspan class=\"tag today\" style=\"right:26px; top:748px\">Today: Find pill, top 731\u003c/span>\n        \u003cdiv class=\"mark new\" style=\"left:3px; right:3px; top:726px; bottom:3px; border-radius:4px 4px 40px 40px\">\u003c/div>\n        \u003cspan class=\"tag new\" style=\"left:28px; top:851px\">New: paper band from the rule at 723\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cfigcaption>\n      \u003cb>Measured\u003c/b> (lane restyle-step8's screen check of PR 238; coordinator, 2026-11-18 15:31 CST): the band's rule and the list's end at 723 pt, the pill top at 731 pt, 8 pt between them.\n      \u003cul>\n        \u003cli>From PR 238's body (screen-check run 43952443921), not the brief: pill bottom 782 pt, tab bar top 791 pt, 401.7 pt of visible list (so the list starts near 321 pt).\u003c/li>\n        \u003cli>Drawn, unmeasured: the status bar and top safe area (54 pt), the masthead's inner layout, the card and row heights, the tab bar capsule, every name and figure.\u003c/li>\n        \u003cli>At rest the line under \"Brainstorm\" (frame 73, 723, 102 x 14 in the item) sits just under the rule, so it scrolls in rather than showing. Whether 8 pt would show a whole card line is unmeasured.\u003c/li>\n      \u003c/ul>\n    \u003c/figcaption>\n  \u003c/figure>\n\u003c/main>\n\u003cscript>\n// Deep links: #s=band (the one state), t=light|dark (page chrome only; the phone stays light). Join with &.\nfunction route() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  const s = h.get('s'), t = h.get('t');\n  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;\n  const states = [...document.querySelectorAll('[data-state]')];\n  const hit = states.some(e => e.dataset.state === s);\n  states.forEach(e => { e.hidden = hit && e.dataset.state !== s; });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#s=' + s)));\n  fit();\n}\n// Below 360 px of room the phone scales down whole; from 360 up it is drawn 1 px to 1 pt, so a host that scales the page\n// itself (a 402 frame less a scrollbar) never meets a phone that has already shrunk.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; const k = w.clientWidth \u003c 360 ? w.clientWidth / 402 : 1;\n    d.style.transform = k \u003c 1 ? `scale(${k})` : ''; w.style.height = k \u003c 1 ? (874 * k) + 'px' : ''; });\n}\nconst hide = document.getElementById('hide-labels');\nhide.addEventListener('click', () => { const on = document.body.classList.toggle('hide-labels');\n  hide.setAttribute('aria-pressed', String(on)); hide.textContent = on ? 'Show labels' : 'Hide labels'; });\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "pr238-find-pill-band-b": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Pill Floats Over List\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json, light keys (paper, card, ink, inkSoft, line, gold, silver, accent, green, red, manila, manilaInk), read\n   through Parchment (native/Manifest/Theme.swift). The native app is held to light, so the phone frame keeps light tokens in every\n   theme; the dark keys below repaint the page around it only. --new and --today are page chrome (green and red). */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --silver:#C4C3C0;\n  --accent:#6F5CA6; --manila:#EADBBA; --manilaInk:#695832; --shadow:rgba(28,43,36,0.06);\n  --new:#2E7A5E; --today:#A8443C;\n  --cochin: Cochin, Georgia, serif; --mono: Menlo, monospace;\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n    --manila:#3A3122; --manilaInk:#E2CB96; --new:#6DBB98; --today:#E3857B; color-scheme: dark; }\n}\n:root[data-theme=\"dark\"] { --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n  --manila:#3A3122; --manilaInk:#E2CB96; --new:#6DBB98; --today:#E3857B; color-scheme: dark; }\n* { box-sizing: border-box; }\nbody { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system, system-ui, sans-serif; font-size:15px; line-height:1.45; }\nmain { max-width:760px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; }\n.banner { background:var(--manila); color:var(--manilaInk); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-weight:600; }\nh1 { font-size:22px; line-height:1.25; margin:0; }\n.intro { display:flex; flex-direction:column; gap:8px; }\n.intro p { margin:0; max-width:68ch; color:var(--inkSoft); }\n.intro p b { color:var(--ink); }\nnav { display:flex; flex-wrap:wrap; gap:8px; }\nnav a, nav button { font:inherit; font-size:14px; min-height:44px; padding:0 12px; display:inline-flex; align-items:center; border:1px solid var(--line);\n  border-radius:8px; background:var(--card); color:var(--ink); text-decoration:none; cursor:pointer; }\nnav a[aria-current=\"true\"] { border-color:var(--accent); color:var(--accent); font-weight:600; }\nnav a:focus-visible, nav button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }\nfigure { margin:0; display:flex; flex-direction:column; gap:12px; }\nfigure[hidden] { display:none; }\nfigcaption { font-size:14px; color:var(--inkSoft); max-width:68ch; }\nfigcaption ul { margin:4px 0 0; padding-left:18px; }\nfigcaption b { color:var(--ink); }\n.fit { width:100%; max-width:402px; }\n/* At the drawn width (402) the phone sits at x 0 to 402, so the page's focus box is the phone alone. */\n@media (max-width:440px) {\n  main { padding:0 0 16px; }\n  .banner { border-radius:0; border-left:0; border-right:0; }\n  .intro, figcaption { padding:0 16px; }\n}\n\n/* ---- the phone: iPhone 18 Pro, 402 x 874 pt, 1 CSS px = 1 pt. Light tokens always (the app is held to light). ---- */\n.dev { --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --gold:#C9A961; --silver:#C4C3C0; --accent:#6F5CA6;\n  --redSoft:#F4E4D9; --red:#A8443C; --new:#2E7A5E; --today:#A8443C;\n  --sat: max(env(safe-area-inset-top), 54px);  /* top safe area: unmeasured on the 18 Pro, drawn at 54 pt */\n  position:relative; width:402px; height:874px; background:var(--paper); color:var(--ink); border-radius:44px; overflow:hidden;\n  box-shadow:0 0 0 1px var(--ink); font-family:var(--cochin); transform-origin:0 0; }\n.status { position:absolute; left:0; right:0; top:0; height:var(--sat); display:flex; justify-content:space-between; align-items:center;\n  padding:0 32px; font:600 15px -apple-system, system-ui, sans-serif; z-index:4; }\n.status .isl { width:124px; height:36px; border-radius:18px; background:#000; }\n\n/* the scroll view (MastheadScreen). --vp is where it ends: 723 pt with the band (measured), the screen foot when the pill floats. */\n.vp { position:absolute; left:0; right:0; top:0; height:var(--vp); overflow:hidden; }\n/* masthead, running-head slot and ruled row: drawn to fill 54 to 321 pt; their inner layout is unmeasured */\n.mast { position:absolute; left:16px; right:16px; top:var(--sat); height:158px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:6px 0 4px; }\n.mast .seal { display:flex; align-items:center; gap:10px; align-self:stretch; }\n.mast .seal i { flex:1; height:1px; background:var(--gold); }\n.mast .seal s { width:24px; height:24px; border-radius:50%; background:#A8443C; box-shadow:inset 0 -3px 0 #66231D; }\n.mast .ttl { font-size:31px; line-height:34px; letter-spacing:5px; font-weight:700; }\n.mast .house { font:10px/12px var(--cochin); letter-spacing:2px; color:var(--inkSoft); }\n.mast .tallies { display:grid; grid-template-columns:1fr 1fr 1.7fr; align-self:stretch; text-align:center; }\n.mast .tallies span { display:flex; flex-direction:column; font:10px/13px var(--cochin); color:var(--inkSoft); }\n.mast .tallies b { font:700 13px/17px var(--mono); color:var(--accent); }\n.mast .tallies b em { font-style:normal; font-weight:400; color:var(--inkSoft); }\n.mast .bar { align-self:stretch; height:8px; border-radius:4px; background:var(--silver); overflow:hidden; }\n.mast .bar i { display:block; width:38%; height:100%; background:var(--accent); }\n.mast .foot { align-self:stretch; display:flex; justify-content:space-between; font:10.5px/14px var(--mono); color:var(--inkSoft); }\n.ruled { position:absolute; left:16px; right:16px; top:259px; height:46px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);\n  display:flex; justify-content:flex-end; }\n.ruled span { min-width:44px; padding:0 12px; display:flex; align-items:center; gap:6px; border-left:1px solid var(--line); font:11px var(--mono); color:var(--inkSoft); }\n\n/* the list (PackagesView): starts at 321 pt (723 less the measured 401.7 pt of visible list). Heights are fixed so the\n   \"Test Set · Near Mint\" line of the second card lands on the measured frame 73, 723, 102 x 14. */\n.list { position:absolute; left:16px; right:16px; top:321px; display:flex; flex-direction:column; gap:8px; }\n.pcard { background:var(--card); border:1px solid var(--line); border-radius:8px; box-shadow:0 1px 1px var(--shadow); display:flex; flex-direction:column; overflow:hidden; }\n.phead { height:70px; padding:10px 12px 0; display:flex; flex-direction:column; }\n.phead .top { display:flex; align-items:center; gap:8px; }\n.phead .who { flex:1; display:flex; flex-direction:column; }\n.phead .who b { font-size:15px; line-height:20px; }\n.phead .who span { font:11px/14px var(--mono); color:var(--inkSoft); }\n.spill { font:700 12.5px var(--cochin); padding:4px 8px; border-radius:999px; background:var(--redSoft); color:var(--red); }\n.phead .oid { font:11px/22px var(--mono); color:var(--inkSoft); text-decoration:underline; }\n.srow, .brow { height:48px; display:flex; align-items:center; padding:0 12px; gap:8px; }\n.brow { justify-content:flex-end; }\n.mini { font:11.5px var(--mono); background:var(--card); border:1px solid var(--line); border-radius:5px; padding:8px 12px; white-space:nowrap; }\n.ln { height:60px; display:flex; gap:8px; padding:0 12px 0 3px; border-top:1px solid var(--line); }\n.ln .box { flex:0 0 45px; height:59px; display:grid; place-items:center; }\n.ln .box i { width:30px; height:30px; border:2px solid var(--inkSoft); border-radius:8px; }\n.ln .t { flex:1; min-width:0; padding-top:12px; display:flex; flex-direction:column; gap:4px; }\n.ln .t b { font-size:14px; line-height:18px; font-weight:600; display:flex; justify-content:space-between; }\n.ln .t b span { font:12px/18px var(--mono); font-weight:400; color:var(--inkSoft); }\n.ln .t small { display:block; width:102px; height:14px; font-size:12px; line-height:14px; color:var(--inkSoft); white-space:nowrap; }\n\n/* the Find pill (FindPill.body): opaque paper capsule, magnifier, Cochin 16 prompt, 44 x 44 clear slot. Top 731 pt (measured). */\n.find { position:absolute; z-index:3; left:16px; right:16px; top:731px; height:51px; display:flex; align-items:center; gap:8px;\n  padding:4px 6px 4px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper); }\n.find svg { flex:none; width:20px; height:20px; fill:none; stroke:var(--inkSoft); stroke-width:1.8; stroke-linecap:round; }\n.find .q { flex:1; font-size:16px; color:var(--inkSoft); white-space:nowrap; overflow:hidden; }\n.find .clr { flex:none; width:44px; height:44px; }\n\n/* the band (findPill): paper from the list's edge to the screen foot, a 1 pt Parchment.line rule on its top */\n.band { position:absolute; z-index:2; left:0; right:0; top:723px; bottom:0; background:var(--paper); border-top:1px solid var(--line); }\n\n/* system tab bar: top 791 pt (PR 238's screen check); its capsule is drawn, not measured */\n.sysbar { position:absolute; z-index:5; left:0; right:0; top:791px; height:83px; display:flex; justify-content:center; padding-top:8px; }\n.sysbar .cap { width:calc(100% - 32px); height:56px; border-radius:28px; border:1px solid var(--line);\n  background:color-mix(in srgb, var(--paper) 62%, transparent); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);\n  display:grid; grid-template-columns:repeat(4,1fr); align-items:center; }\n.sysbar span { display:flex; flex-direction:column; align-items:center; gap:2px; font:11px -apple-system, system-ui, sans-serif; color:var(--inkSoft); }\n.sysbar span i { width:22px; height:22px; border:1.5px solid currentColor; border-radius:6px; }\n.sysbar span.on { color:var(--accent); }\n.home { position:absolute; z-index:6; left:50%; bottom:8px; width:140px; height:5px; margin-left:-70px; border-radius:3px; background:var(--ink); }\n\n/* labels: dashed outline on what exists today (red) and on what this option adds (green) */\n.mark { position:absolute; z-index:7; pointer-events:none; border:2px dashed; border-radius:6px; }\n.tag { position:absolute; z-index:8; font:600 11px/14px -apple-system, system-ui, sans-serif; padding:1px 5px; border:1.5px dashed; border-radius:4px;\n  background:var(--card); white-space:nowrap; }\n.mark.new, .tag.new { color:var(--new); border-color:var(--new); }\n.mark.today, .tag.today { color:var(--today); border-color:var(--today); }\nbody.hide-labels .mark, body.hide-labels .tag { display:none; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n  \u003cdiv class=\"banner\" role=\"note\">Sample: no seller, card, order, date, price or count on this page is real.\u003c/div>\n  \u003cdiv class=\"intro\">\n    \u003ch1>Skip the contrast item names the failing text frame: \"Test Set · Near Mint\" at 73, 723, 102 x 14, so its lower 6 pt sit under the pill.\n      \u003cul>\n        \u003cli>From PR 238's body (screen-check run 43952443921), not the brief: pill bottom 782 pt, tab bar top 791 pt, 401.7 pt of visible list (so the list starts near 321 pt).\u003c/li>\n        \u003cli>Drawn, unmeasured: the status bar and top safe area (54 pt), the masthead's inner layout, the card and row heights, the tab bar capsule, every name and figure.\u003c/li>\n        \u003cli>The pill is drawn at 731 pt, its place on the band build. Its place once it floats again is unmeasured. The list runs to the screen foot, under the pill and the tab bar.\u003c/li>\n      \u003c/ul>\n    \u003c/figcaption>\n  \u003c/figure>\n\u003c/main>\n\u003cscript>\n// Deep links: #s=float (the one state), t=light|dark (page chrome only; the phone stays light). Join with &.\nfunction route() {\n  const h = new URLSearchParams(location.hash.slice(1));\n  const s = h.get('s'), t = h.get('t');\n  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;\n  const states = [...document.querySelectorAll('[data-state]')];\n  const hit = states.some(e => e.dataset.state === s);\n  states.forEach(e => { e.hidden = hit && e.dataset.state !== s; });\n  document.querySelectorAll('nav a').forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#s=' + s)));\n  fit();\n}\n// Below 360 px of room the phone scales down whole; from 360 up it is drawn 1 px to 1 pt, so a host that scales the page\n// itself (a 402 frame less a scrollbar) never meets a phone that has already shrunk.\nfunction fit() {\n  document.querySelectorAll('.fit').forEach(w => { const d = w.firstElementChild; const k = w.clientWidth \u003c 360 ? w.clientWidth / 402 : 1;\n    d.style.transform = k \u003c 1 ? `scale(${k})` : ''; w.style.height = k \u003c 1 ? (874 * k) + 'px' : ''; });\n}\nconst hide = document.getElementById('hide-labels');\nhide.addEventListener('click', () => { const on = document.body.classList.toggle('hide-labels');\n  hide.setAttribute('aria-pressed', String(on)); hide.textContent = on ? 'Show labels' : 'Hide labels'; });\naddEventListener('hashchange', route); addEventListener('resize', fit); route();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "duo-hand-post-pin": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Hand Post Pin\u003c/title>\n\u003cstyle>\n/* Tokens: shared/tokens.json (design-parchment-ledger). The dark set is the twelve dark* keys; the native app is held to\n   light (native/project.yml, UIUserInterfaceStyle Light), so dark is a preview, not a shipped theme. */\n:root {\n  --paper:#F2E9DA; --card:#FCF6EA; --ink:#332E3F; --inkSoft:#6E6379; --line:#DCCDB6; --accent:#6F5CA6;\n  --green:#2E7A5E; --greenSoft:#E6E7D7; --red:#A8443C; --manila:#EADBBA; --manilaInk:#695832;\n  /* iOS keyboard chrome, not app colours, so these sit outside the tokens. */\n  --kbBg:#D2D0D6; --kbKey:#FFFFFF; --kbInk:#111111;\n  --cochin: Cochin, \"Cochin\", Georgia, serif;\n  --mono: Menlo, ui-monospace, monospace;\n  /* Status bar foot on the Duo inner screen: unmeasured. Drawn at the UI test's 20 pt floor (DuoHandUITests.statusBarFloor). */\n  --sat: max(env(safe-area-inset-top), 20px);\n  --keys-top: 405px; /* the keyboard panel draws from about y 405 pt (debt duo-keyboard-gap-unmeasured); its frame starts at 449 */\n  --new:#2E7A5E; --today:#A8443C;\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --paper:#1E1B24; --card:#27232E; --ink:#EFE6D6; --inkSoft:#B1A6BB; --line:#443D4D; --accent:#A796DA;\n    --green:#6DBB98; --red:#E3857B; --manila:#3A3122; --manilaInk:#E2CB96;\n    --greenSoft: color-mix(in srgb, var(--green) 18%,
